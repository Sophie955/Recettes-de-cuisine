<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Livre de Cuisine</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6ef;
    --warm-white: #fffdf8;
    --dark: #1a1208;
    --brown: #6b4226;
    --accent: #c84b31;
    --gold: #c9924a;
    --muted: #8a7560;
    --border: #e2d9cc;
    --tag-veg: #4a7c59;
    --tag-rapide: #c84b31;
    --tag-poisson: #2c6e8a;
    --tag-viande: #7a3030;
    --tag-famille: #6a4a8a;
    --tag-sg: #8a6a2c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--cream); color: var(--dark); font-family: 'Lato', sans-serif; font-weight: 300; min-height: 100vh; }

  header {
    background: #faf6ef;
    border-bottom: 1px solid var(--border);
    position: relative;
    padding: 0.9rem 1.5rem 0.9rem 2rem;
  }
  header::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--dark);
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--dark);
  }
  header h1 em { font-style: italic; color: var(--gold); }
  .header-count { display: none; }

  .search-section {
    background: var(--warm-white); border-bottom: 1px solid var(--border);
    padding: 1.2rem 1.5rem; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(26,18,8,0.07);
  }
  .search-wrapper { max-width: 900px; margin: 0 auto; display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .search-box {
    display: flex; flex: 1; min-width: 240px; align-items: center;
    background: var(--cream); border: 1.5px solid var(--border);
    border-radius: 3px; padding: 0.6rem 1rem; gap: 0.6rem; transition: border-color 0.2s;
  }
  .search-box:focus-within { border-color: var(--gold); }
  .search-icon { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
  #search-input {
    border: none; background: transparent; font-family: 'Lato', sans-serif;
    font-size: 0.9rem; font-weight: 300; color: var(--dark); width: 100%; outline: none;
  }
  #search-input::placeholder { color: var(--muted); }
  #clear-btn { display: none; background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1rem; padding: 0; line-height: 1; }
  #clear-btn:hover { color: var(--accent); }

  .filter-pills { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .pill {
    font-family: 'Lato', sans-serif; font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 0.35rem 0.8rem;
    border-radius: 2px; border: 1.5px solid var(--border); background: var(--warm-white);
    color: var(--muted); cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .pill:hover { border-color: var(--gold); color: var(--brown); }
  .pill.active { background: var(--dark); border-color: var(--dark); color: var(--cream); }
  .pill.active.veg { background: var(--tag-veg); border-color: var(--tag-veg); }
  .pill.active.rapide { background: var(--accent); border-color: var(--accent); }
  .pill.active.poisson { background: var(--tag-poisson); border-color: var(--tag-poisson); }
  .pill.active.viande { background: var(--tag-viande); border-color: var(--tag-viande); }


  .main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .result-meta { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .result-count { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--muted); }
  .result-count strong { color: var(--dark); font-weight: 600; }
  .reset-link { font-size: 0.75rem; color: var(--accent); cursor: pointer; text-decoration: underline; letter-spacing: 0.05em; display: none; }
  .reset-link.show { display: block; }

  .chapter-group { margin-bottom: 2.5rem; }
  .chapter-title {
    font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 600;
    color: var(--brown); padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
    margin-bottom: 1.2rem; display: flex; align-items: baseline; gap: 0.75rem;
  }
  .chapter-num { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); font-family: 'Lato', sans-serif; font-weight: 700; }

  .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px; background: var(--border); }
  .recipe-card { background: var(--warm-white); padding: 1.4rem 1.5rem; cursor: pointer; transition: background 0.15s; position: relative; }
  .recipe-card:hover { background: #fff8f0; }
  .recipe-card:hover .card-title { color: var(--accent); }
  .recipe-card.no-content { opacity: 0.55; }
  .recipe-card.no-content::after { content: 'contenu manquant'; position: absolute; top: 0.7rem; right: 0.7rem; font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); padding: 0.15rem 0.4rem; border-radius: 2px; }

  .card-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
  .tag { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.2rem 0.45rem; border-radius: 1px; color: #fff; }
  .tag.végétarien { background: var(--tag-veg); }
  .tag.rapide { background: var(--accent); }
  .tag.poisson { background: var(--tag-poisson); }
  .tag.viande { background: var(--tag-viande); }

  .tag.sans-gluten { background: var(--tag-sg); }

  .card-title { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 600; line-height: 1.3; color: var(--dark); margin-bottom: 0.35rem; transition: color 0.15s; }
  .card-subtitle { font-size: 0.78rem; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-ing-count { margin-top: 0.7rem; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.05em; }
  .card-arrow { position: absolute; bottom: 1.2rem; right: 1.2rem; color: var(--border); font-size: 0.9rem; transition: color 0.15s, transform 0.15s; }
  .recipe-card:hover .card-arrow { color: var(--gold); transform: translateX(3px); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,18,8,0.65); z-index: 1000; backdrop-filter: blur(3px); overflow-y: auto; padding: 1.5rem; }
  .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
  .modal { background: var(--warm-white); max-width: 700px; width: 100%; margin: auto; border-radius: 2px; overflow: hidden; box-shadow: 0 20px 60px rgba(26,18,8,0.3); animation: slideUp 0.25s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .modal-header { background: var(--dark); color: var(--cream); padding: 2rem 2rem 1.8rem; position: relative; }
  .modal-chapter-label { font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 0.6rem; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 700; line-height: 1.2; margin-bottom: 0.5rem; }
  .modal-subtitle { font-size: 0.85rem; color: rgba(250,246,239,0.65); font-style: italic; line-height: 1.5; }
  .modal-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 1rem; }

  .modal-source-badge { display: none; margin-top: 0.5rem; font-size: 0.72rem; color: rgba(250,246,239,0.55); font-family: 'Lato', sans-serif; letter-spacing: 0.04em; font-style: italic; }
  .modal-close { position: absolute; top: 1.2rem; right: 1.2rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: var(--cream); width: 2rem; height: 2rem; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .modal-close:hover { background: rgba(255,255,255,0.2); }

  .modal-body { padding: 2rem; }
  .modal-section-title { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; }
  .modal-missing { background: #fdf8f0; border: 1px dashed var(--border); border-radius: 3px; padding: 1.5rem; text-align: center; color: var(--muted); font-size: 0.88rem; line-height: 1.6; margin-bottom: 1rem; }

  .ingredients-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 1.5rem; margin-bottom: 2rem; }
  .ingredients-list li { font-size: 0.88rem; color: var(--dark); padding: 0.3rem 0; border-bottom: 1px solid var(--border); line-height: 1.4; }
  .ingredients-list li.ing-section {
    grid-column: 1 / -1;
    font-family: 'Lato', sans-serif;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    background: var(--cream);
    border: none;
    border-top: 1px solid var(--border);
    padding: 0.6rem 0.5rem 0.3rem;
    margin-top: 0.4rem;
  }
  .ingredients-list li.ing-section:first-child { border-top: none; margin-top: 0; }

  .steps-list { list-style: none; }
  .steps-list li { display: flex; gap: 1rem; margin-bottom: 1.2rem; font-size: 0.9rem; line-height: 1.65; color: #2a1f10; }
  .step-num { flex-shrink: 0; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--dark); color: var(--cream); font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 0.1rem; font-family: 'Playfair Display', serif; }

  .no-results { text-align: center; padding: 4rem 2rem; display: none; }
  .no-results.show { display: block; }
  .no-results-emoji { font-size: 3rem; margin-bottom: 1rem; }
  .no-results h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--brown); margin-bottom: 0.5rem; }
  .no-results p { color: var(--muted); font-size: 0.9rem; }

  .sous-section-group { margin-bottom: 1.8rem; }
  .sous-section-title {
    font-family: 'Lato', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    padding: 0.5rem 0 0.6rem;
    border-bottom: 1px dashed var(--border);
    margin-bottom: 1px;
  }

  .pill.ch.active { background: var(--brown); border-color: var(--brown); color: var(--cream); }

  /* ── Dropdown chapitre ── */
  .chapter-dropdown { position: relative; }

  .ch-btn {
    display: flex; align-items: center; gap: 0.4rem;
    white-space: nowrap;
  }
  .ch-btn.active { background: var(--dark); border-color: var(--dark); color: var(--cream); }
  .ch-btn.active .ch-arrow { transform: rotate(180deg); }
  .ch-arrow { display: inline-block; transition: transform 0.2s; font-size: 0.65rem; }

  .ch-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--warm-white);
    border: 1.5px solid var(--border);
    border-radius: 3px;
    box-shadow: 0 8px 24px rgba(26,18,8,0.12);
    min-width: 280px;
    z-index: 200;
    overflow: hidden;
  }
  .ch-menu.open { display: block; }

  .ch-option {
    display: block; width: 100%; text-align: left;
    padding: 0.65rem 1rem;
    font-family: 'Lato', sans-serif; font-size: 0.82rem; font-weight: 400;
    color: var(--dark); background: none; border: none; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  .ch-option:last-child { border-bottom: none; }
  .ch-option:hover { background: #fff8f0; color: var(--accent); }
  .ch-option.selected { background: var(--dark); color: var(--cream); font-weight: 700; }
  .ch-option:first-child { color: var(--muted); font-style: italic; }

  .step-conseils {
    background: var(--cream);
    border-left: 3px solid var(--gold);
    border-radius: 2px;
    padding: 0.8rem 1rem;
    margin-bottom: 1.4rem;
    font-size: 0.85rem;
    line-height: 1.7;
    color: var(--dark);
  }
  .step-conseils-label {
    font-family: 'Lato', sans-serif;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  .share-bar {
    display: flex;
    gap: 0.6rem;
    padding: 1.2rem 2rem;
    border-top: 1px solid var(--border);
    background: var(--cream);
  }
  .share-btn {
    display: flex; align-items: center; gap: 0.4rem;
    font-family: 'Lato', sans-serif; font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.4rem 0.9rem; border-radius: 2px; border: 1.5px solid var(--border);
    background: var(--warm-white); color: var(--muted);
    cursor: pointer; text-decoration: none; transition: all 0.15s;
  }
  .share-btn:hover { border-color: var(--gold); color: var(--dark); }
  .share-btn.whatsapp:hover { border-color: #25D366; color: #25D366; }
  .share-btn.email:hover { border-color: var(--brown); color: var(--brown); }

  mark { background: rgba(201,146,74,0.3); color: inherit; padding: 0.05em 0.1em; border-radius: 1px; }

  @media (max-width: 600px) {
    .ingredients-list { grid-template-columns: 1fr; }
    .modal-body { padding: 1.5rem; }
    .recipe-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Mon Livre de <em>Cuisine</em></h1>
</header>

<div class="search-section">
  <div class="search-wrapper">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Rechercher par ingrédient, recette…" autocomplete="off" spellcheck="false">
      <button id="clear-btn" title="Effacer">✕</button>
    </div>
    <div class="filter-pills">
      <div class="chapter-dropdown" id="chapter-dropdown">
        <button class="pill ch-btn" id="chapter-btn" onclick="toggleDropdown()">
          Chapitre <span class="ch-arrow">▾</span>
        </button>
        <div class="ch-menu" id="ch-menu">
          <button class="ch-option" data-chapter="">Tous les chapitres</button>
          <button class="ch-option" data-chapter="Quiches, tartes &amp; petites bouchées">I — Quiches, tartes &amp; petites bouchées</button>
          <button class="ch-option" data-chapter="Salades, ceviche &amp; légumes rôtis">II — Salades, ceviche &amp; légumes rôtis</button>
          <button class="ch-option" data-chapter="Soupes &amp; veloutés">III — Soupes &amp; veloutés</button>
          <button class="ch-option" data-chapter="Plats principaux">IV — Plats principaux</button>
          <button class="ch-option" data-chapter="Desserts &amp; douceurs">V — Desserts &amp; douceurs</button>
          <button class="ch-option" data-chapter="Boissons">VI — Boissons</button>
          <button class="ch-option" data-chapter="Sauces &amp; bases">VII — Sauces &amp; bases</button>
        </div>
      </div>
      <div class="chapter-dropdown" id="regime-dropdown">
        <button class="pill ch-btn" id="regime-btn" onclick="toggleRegimeDropdown()">
          Régime <span class="ch-arrow" id="regime-arrow">▾</span>
        </button>
        <div class="ch-menu" id="regime-menu">
          <button class="ch-option" data-filter="all-regime">Tous</button>
          <button class="ch-option" data-filter="végétarien">🌿 Végétarien</button>
          <button class="ch-option" data-filter="poisson">🐟 Poisson</button>
          <button class="ch-option" data-filter="viande">🥩 Viande</button>
          <button class="ch-option" data-filter="sans gluten">🌾 Sans gluten</button>
        </div>
      </div>
      <button class="pill rapide" data-filter="rapide">⚡ Rapide</button>
      <div class="chapter-dropdown" id="source-dropdown">
        <button class="pill ch-btn" id="source-btn" onclick="toggleSourceDropdown()">
          Source <span class="ch-arrow" id="source-arrow">▾</span>
        </button>
        <div class="ch-menu" id="source-menu">
          <button class="ch-option" data-source="" onclick="selectSource('', 'Source')">Toutes les sources</button>
          <button class="ch-option" data-source="Chia, lin et psyllium - Clémence Catz" onclick="selectSource('Chia, lin et psyllium - Clémence Catz', this.textContent.trim())">Chia, lin et psyllium - Clémence Catz</button>
          <button class="ch-option" data-source="Comfort - Ottolenghi" onclick="selectSource('Comfort - Ottolenghi', this.textContent.trim())">Comfort - Ottolenghi</button>
          <button class="ch-option" data-source="Le grand livre de la cuisine végétarienne des cinq continents" onclick="selectSource('Le grand livre de la cuisine végétarienne des cinq continents', this.textContent.trim())">Le grand livre de la cuisine végétarienne des cinq continents</button>
          <button class="ch-option" data-source="Les festins partagés de God save the cream" onclick="selectSource('Les festins partagés de God save the cream', this.textContent.trim())">Les festins partagés de God save the cream</button>
          <button class="ch-option" data-source="Ma cuisine méditerranéenne - Mohamed Cheikh" onclick="selectSource('Ma cuisine méditerranéenne - Mohamed Cheikh', this.textContent.trim())">Ma cuisine méditerranéenne - Mohamed Cheikh</button>
          <button class="ch-option" data-source="Megalow Food" onclick="selectSource('Megalow Food', this.textContent.trim())">Megalow Food</button>
          <button class="ch-option" data-source="Minute Papillote" onclick="selectSource('Minute Papillote', this.textContent.trim())">Minute Papillote</button>
          <button class="ch-option" data-source="Petit Marabouts - Ceviche & Carpaccio" onclick="selectSource('Petit Marabouts - Ceviche & Carpaccio', this.textContent.trim())">Petit Marabouts - Ceviche & Carpaccio</button>
          <button class="ch-option" data-source="Recettes et Récits - François-Régis Gaudry" onclick="selectSource('Recettes et Récits - François-Régis Gaudry', this.textContent.trim())">Recettes et Récits - François-Régis Gaudry</button>
          <button class="ch-option" data-source="Simple - Ottolenghi" onclick="selectSource('Simple - Ottolenghi', this.textContent.trim())">Simple - Ottolenghi</button>
          <button class="ch-option" data-source="https://leculdepoule.co" onclick="selectSource('https://leculdepoule.co', this.textContent.trim())">https://leculdepoule.co</button>
          <button class="ch-option" data-source="lacerisesurlemaillot.fr" onclick="selectSource('lacerisesurlemaillot.fr', this.textContent.trim())">lacerisesurlemaillot.fr</button>
        </div>
      </div>
    </div>
  </div>
</div>
  </div>
</div>

<div class="main">
  <div class="result-meta">
    <div class="result-count" id="result-count"></div>
    <span class="reset-link" id="reset-link" onclick="resetAll()">Réinitialiser</span>
  </div>
  <div id="recipes-container"></div>
  <div class="no-results" id="no-results">
    <div class="no-results-emoji">🍽️</div>
    <h3>Aucune recette trouvée</h3>
    <p>Essayez un autre ingrédient ou terme de recherche.</p>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-chapter-label" id="modal-chapter"></div>
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-subtitle" id="modal-subtitle"></div>
      <div class="modal-source-badge" id="modal-source"></div>
      <div class="modal-tags" id="modal-tags"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="share-bar">
      <span style="font-family:'Lato',sans-serif;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);align-self:center;">Partager :</span>
      <a id="share-whatsapp" class="share-btn whatsapp" target="_blank" href="#">💬 WhatsApp</a>
      <a id="share-email" class="share-btn email" href="#">✉️ Email</a>
    </div>
  </div>
</div>

<script>
const RECIPES = [{"title":"Overnight oats & chia au lait végétal","subtitle":"Flocons d'avoine et chia gonflés toute la nuit, à garnir de fruits","chapter":"V","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien","rapide"],"ingredients":["5 c.à.s. lait de coco","5 c.à.s. eau de coco","ou 10 c.à.s. lait d'amande","4 c.à.s. flocons d'avoine bio","1 c.à.s. graines de chia","1 c.à.c. miel d'acacia","fruits frais ou coulis"],"steps":["Dans un bocal, mélanger le lait et/ou l'eau de coco avec le miel.","Ajouter les flocons d'avoine et les graines de chia. Bien mélanger. Parsemer de fruits.","Fermer le bocal et réserver au réfrigérateur. Le chia et l'avoine absorbent le liquide pendant la nuit.","Le lendemain, ajouter du lait végétal si besoin pour ajuster la consistance. Déguster !"],"sous_section":"","source":"Megalow Food"},{"title":"Chia pudding et ses déclinaisons","subtitle":"Le petit-déjeuner star déclinable en quatre saisons","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["sans gluten","végétarien","rapide"],"ingredients":["250 ml de lait végétal au choix","25 g de graines de chia","1 c.à.c. d'édulcorant (agave, sirop d'érable…)","1 pincée d'épices (vanille, cannelle…)","🌸 Printemps : lait d'amande, gingembre, pollen","☀️ Été : voir déclinaisons ci-dessous","🍂 Automne : lait amande + riz, figues fraîches, noix","❄️ Hiver : lait d'avoine, cacao, poire"],"steps":["La veille : mélanger le lait végétal, l'édulcorant, les épices et les graines de chia dans un bol.","Laisser prendre 20 min en mélangeant toutes les 5 min pour une texture crémeuse. Couvrir et réfrigérer toute la nuit.","Le matin, garnir de fruits frais selon la saison et déguster.","— Déclinaisons d'été —","🍑 Pêche & lavande : lait d'amande, pêches jaunes en dés, quelques fleurs de lavande séchées, miel.","🟠 Abricot & pistache : lait de coco, compotée ou purée d'abricots frais, pistaches concassées, eau de fleur d'oranger.","🍓 Fraise & basilic : lait d'avoine, fraises fraîches écrasées, feuilles de basilic ciselées, zeste de citron.","🍈 Melon & gingembre : lait de coco, dés de melon cantaloup, gingembre râpé, jus de citron vert.","🫐 Figue & miel : lait d'amande, figues fraîches en quartiers, miel d'acacia, cannelle.","🍉 Pastèque & menthe : lait de coco, jus de pastèque en remplacement d'une partie du lait, feuilles de menthe, graines de sésame noir.","🥭 Mangue & citron vert : lait de coco, mangue mixée en coulis, zeste et jus de citron vert, noix de coco râpée."],"source":"Chia, lin et psyllium - Clémence Catz"},{"title":"Tarte fine aux poireaux et champignons","subtitle":"Une tarte légère aux poireaux fondants, parfaite avec une salade verte","chapter":"I","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["1 pâte feuilletée","150 g champignons de Paris","2–3 poireaux selon taille","10 cl crème liquide","1 c.à.c. muscade moulue","1 c.à.s. huile d'olive","1 c.à.s. persil ciselé"],"steps":["Débarrasser les poireaux de leurs extrémités, couper en deux dans la longueur, tailler en morceaux et rincer.","Faire revenir dans une poêle avec l'huile, la muscade, sel et poivre. Cuire 10 min à feu moyen et à couvert.","Ajouter la crème et poursuivre 5 min à feu moyen en remuant.","Préchauffer le four à 180°C chaleur tournante. Étaler la pâte, piquer à la fourchette et précuire pendant le préchauffage.","Émincer les champignons. Étaler les poireaux sur la pâte. Enfourner à mi-hauteur 20 min.","Parsemer champignons et persil, enfourner encore 5 min. Servir aussitôt."],"sous_section":"","source":"lacerisesurlemaillot.fr"},{"title":"Muffins salés feta, poivrons rouges et pesto","subtitle":"Muffins moelleux à emporter — parfaits pour un pique-nique ou un apéro original · Pour 4 · Préparation 15 min · Cuisson 30 min","chapter":"I","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["3 œufs","180 g farine","100 g lait","50 g huile d'olive","100 g emmenthal râpé","½ sachet levure","sel, poivre","1 poivron","100 g feta","50 g pesto","graines : tournesol, pavot…","optionnel : 100 g allumettes de bacon, feuilles de basilic"],"steps":["Battre ensemble les œufs, la farine, la levure, le pesto, l'huile d'olive, le sel et le lait.","Ajouter l'emmenthal et mélanger.","Couper le poivron en petits dés, ajouter et mélanger.","Couper la feta en dés, ajouter et mélanger. Ajouter bacon et/ou basilic si souhaité.","Verser dans des empreintes à muffins aux 2/3. Saupoudrer de graines.","Enfourner à 180 °C pendant environ 30 min, jusqu'à dorure. La pointe d'un couteau doit ressortir sèche."],"sous_section":"","source":"Minute Papillote"},{"title":"Samossas au potiron","subtitle":"Beignets triangulaires indiens garnis de courge butternut, paneer émietté et épices","chapter":"I","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["6 galettes de blé (spring roll pastry)","1 c.à.s. farine + 2 c.à.s. eau (colle)","huile de friture","500 g courge butternut","150 g paneer émietté","3 cm gingembre frais râpé (ou 1 c.à.c. pâte)","4–5 tiges coriandre fraîche","1 c.à.c. graines de cumin","1 c.à.c. graines de moutarde noire","huile végétale"],"steps":["Cuire la courge en gros morceaux (avec peau) 10 min dans l'eau bouillante. Égoutter, refroidir, éplucher. Écraser à la fourchette en purée grossière.","Faire revenir le gingembre râpé dans 1 c.à.s. d'huile. Ajouter graines de moutarde et cumin, faire dorer. Ajouter la courge, cuire quelques minutes. Hors du feu, ajouter le paneer et la coriandre ciselée.","Couper les 6 galettes en deux (12 rectangles). Plier en deux pour obtenir 12 bandes. Préparer la colle farine/eau.","Placer une bande horizontalement, déposer 1 grosse c.à.s. de garniture à gauche. Plier en triangle en formant des angles bien fermés. Coller l'extrémité avec la colle.","Faire frire dans 2 cm d'huile chaude (pas fumante) 3 min de chaque côté à feu moyen jusqu'à belle dorure. Égoutter sur papier absorbant. Servir aussitôt avec chutney à la tomate et chutney à la noix de coco."],"sous_section":"","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Beignets de lentilles épicés (Masala vadai)","subtitle":"Masala vadai — street food indien croustillant dehors, moelleux dedans","chapter":"I","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["150 g lentilles corail","1 oignon rouge","1 gousse ail","1 dizaine brins de coriandre fraîche","1 belle pincée piment rouge en poudre","1 c.à.c. graines de cumin","1 pincée curcuma","2 c.à.s. farine de pois chiches","huile végétale, sel"],"steps":["Rincer les lentilles et les laisser tremper 2 heures dans un grand volume d'eau froide. Égoutter.","Mixer les lentilles avec le curcuma, le piment, la gousse d'ail dégermée, l'oignon en 8 quartiers, la coriandre (avec tiges) et 1 belle pincée de sel. La pâte doit être homogène mais pas lisse. Incorporer les graines de cumin et la farine de pois chiches.","Laisser reposer la pâte 30 min à température ambiante.","Chauffer 2 cm d'huile dans une sauteuse (chaude, pas fumante). Former de petites boules avec 1 c.à.s. de pâte. Faire dorer 5 min sur chaque face. Servir avec un raïta."],"sous_section":"","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Falafels","subtitle":"Boulettes de pois chiches croustillantes du Moyen-Orient, servies avec sauce rose à la betterave","chapter":"I","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["250 g pois chiches secs","1 petit oignon","2 gousses ail","½ bouquet persil plat","½ bouquet coriandre","1 pincée cumin","1 pincée curcuma","1 pincée cardamome","huile de friture, sel, poivre","Sauce rose : 120 g yaourt de brebis, ¼ betterave cuite, ½ c.à.s. jus de citron, 1½ c.à.s. huile d'olive"],"steps":["La veille : mettre les pois chiches à tremper dans un saladier d'eau froide pour toute la nuit.","Le jour même : égoutter les pois chiches. Émincer l'oignon.","Dans le bol d'un robot, mixer tous les ingrédients sauf l'huile. Saler et poivrer. Ajouter un peu d'eau si trop épais. Laisser reposer 1 heure au réfrigérateur.","Sauce rose : mixer la betterave en morceaux avec le jus de citron, l'huile et 2 c.à.s. de yaourt. Transvaser dans un bol, ajouter le reste du yaourt, saler, poivrer. Réserver au réfrigérateur.","Mouiller les mains et former environ 20 boulettes.","Faire frire dans l'huile chaude jusqu'à belle dorure, environ 8 min en retournant à mi-cuisson. Égoutter sur papier absorbant. Servir avec la sauce rose."],"sous_section":"","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Briouates marocains aux épinards","subtitle":"Triangles feuilletés de brick farcis aux épinards et œufs brouillés","chapter":"I","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["10 feuilles de brick","300 g feuilles d'épinards","50 g beurre","3 œufs","huile de friture, sel, poivre"],"steps":["Hacher finement les épinards. Faire fondre le beurre dans une poêle, ajouter les épinards hachés et faire revenir 10 min. Saler et poivrer.","Ajouter les œufs dans la poêle et mélanger à feu doux pour obtenir des œufs brouillés aux épinards. Laisser refroidir. Rectifier l'assaisonnement.","Couper chaque feuille de brick en deux. Plier chaque demi-feuille en bande rectangulaire en rabattant les côtés vers le centre. Déposer 1 c.à.s. de farce à l'extrémité droite. Plier en triangle en veillant à bien enfermer la farce. Coller l'extrémité avec un peu d'œuf battu si nécessaire.","Chauffer l'huile de friture. Cuire les briouates des deux côtés jusqu'à ce qu'elles soient bien dorées. Déguster aussitôt."],"sous_section":"","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Tempura d'épinards","subtitle":"Feuilles d'épinards en pâte à tempura légère, servies avec un yaourt citronné","chapter":"I","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["300 g feuilles d'épinards","200 g farine de pois chiches","50 g + 100 g farine de riz (séparés)","75 cl eau froide","½ sachet levure chimique","½ c.à.c. curcuma","1 pincée piment en poudre","huile de friture, sel","1 yaourt + 1 citron jaune bio (sauce)"],"steps":["Dans un saladier, mélanger la farine de pois chiches, les 50 g de farine de riz, le curcuma, ½ c.à.c. de sel, le piment et la levure. Ajouter 75 cl d'eau froide et mélanger jusqu'à obtenir une pâte onctueuse. Réserver.","Laver et sécher soigneusement les épinards. Dans un sac congélation, mettre les 100 g de farine de riz restants et les épinards. Fermer et mélanger pour bien enrober les feuilles. Sortir et débarrasser de l'excédent de farine.","Tremper les feuilles dans la pâte à tempura et faire frire quelques minutes dans de l'huile très chaude. Égoutter sur du papier absorbant.","Prélever le zeste du citron et hacher finement. Presser le citron. Fouetter le yaourt avec 1 pincée de sel, le jus de citron et le zeste. Servir avec la tempura d'épinards."],"sous_section":"","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Ceviche de base","subtitle":"La recette fondatrice du ceviche péruvien, fraîche et acidulée","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten"],"ingredients":["750 g filets de bar","2 citrons jaunes","4 citrons verts + zestes","6 oignons verts émincés","4 petits piments aji hachés","1 c.à.s. sel fin"],"steps":["Envelopper les filets dans du film alimentaire. Placer 20 min au congélateur.","Presser les citrons dans un saladier, dissoudre sel et poivre. Ajouter oignons et piments. Mariner 20 min.","Couper le bar ferme en cubes de 2–3 cm. Ajouter à la marinade, mélanger délicatement. Servir aussitôt."],"sous_section":"Ceviche, carpaccio & tartare","source":"Petit Marabouts - Ceviche & Carpaccio"},{"title":"Ceviche de Saint-Jacques à la passion","subtitle":"Noix en fines tranches, marinade d'agrumes et pulpe de fruit de la passion","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten"],"ingredients":["12 saint-jacques fraîches","2 fruits de la passion","¼ botte coriandre","4 c.à.s. huile d'olive","½ pamplemousse","2 oranges + 1 citron vert","1 clémentine + 1 gousse d'ail"],"steps":["Presser tous les agrumes, hacher l'ail finement. Laisser infuser 30 min au réfrigérateur.","Nettoyer les saint-jacques, enlever le corail. Couper en fines tranches d'environ 2 mm.","Disposer 3 noix par assiette. Filtrer la marinade et la verser dessus. Ajouter la pulpe de passion.","Ciseler la coriandre, ajouter l'huile, fleur de sel et tour de moulin à poivre."],"sous_section":"Ceviche, carpaccio & tartare","source":"Petit Marabouts - Ceviche & Carpaccio"},{"title":"Ceviche de sébaste à la péruvienne","subtitle":"Poisson blanc mariné, maïs cancha grillé et patate douce","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten"],"ingredients":["~600 g sébaste (filets)","1 patate douce","100 g maïs cancha (ou pop-corn salé)","2 branches de céleri","1 oignon rouge","2 cm gingembre","15 citrons verts (jus)","¼ botte coriandre"],"steps":["Préparer la marinade : jus de citron, sel et poivre dans un saladier.","Couper céleri, ail et gingembre en petits dés. Émincer l'oignon. Couper le sébaste en dés d'1 cm. Mélanger et mariner 20 min au frais.","Griller le maïs dans une poêle sèche 8–10 min jusqu'à dorure. Cuire les dés de patate douce 15 min dans l'eau bouillante.","Dresser le ceviche dans les assiettes avec les patates douces, le maïs et la coriandre ciselée."],"sous_section":"Ceviche, carpaccio & tartare","source":"Petit Marabouts - Ceviche & Carpaccio"},{"title":"Ceviche de cabillaud à la patate douce","subtitle":"Cabillaud mariné aux agrumes, accompagné de patates douces","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten"],"ingredients":["750 g filets de cabillaud","300 g patates douces","4 citrons verts (jus)","2 oranges (jus)","1 oignon rouge émincé","3 petits piments frais hachés","1 c.à.c. graines de coriandre"],"steps":["Congeler les filets 20 min dans du film alimentaire pour les raffermir.","Cuire les patates douces en cubes 10 min dans l'eau salée.","Préparer la marinade : jus d'agrumes, sel, poivre, coriandre, oignon, piments. Laisser 20 min.","Couper le cabillaud ferme en cubes. Mélanger délicatement avec patates et marinade. Servir aussitôt."],"sous_section":"Ceviche, carpaccio & tartare","source":"Petit Marabouts - Ceviche & Carpaccio"},{"title":"Carpaccio de bar au fenouil","subtitle":"Fines tranches de bar marinées à l'aneth et au vin blanc","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten"],"ingredients":["600 g filets de bar (sans peau)","1 petit bulbe de fenouil","1 citron (jus)","5 c.à.s. huile d'olive","¼ c.à.c. graines d'aneth","1 c.à.s. vin blanc"],"steps":["Envelopper les filets de film alimentaire, placer 30 min au congélateur.","Mélanger citron, aneth, vin blanc, ail, sucre, sel, poivre et huile d'olive.","Couper le poisson en très fines lamelles. Disposer dans les assiettes. Ajouter le fenouil et ses brins. Verser l'assaisonnement au service."],"sous_section":"Ceviche, carpaccio & tartare","source":"Petit Marabouts - Ceviche & Carpaccio"},{"title":"Carpaccio de saumon au gingembre","subtitle":"Fines lamelles de saumon au jus de citron vert et gingembre râpé","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten"],"ingredients":["400 g saumon (pavé ou filet)","2–4 cm gingembre frais râpé","4 c.à.s. huile d'olive","2 citrons verts (jus)","5 c.à.s. sauce soja douce (à part)","sel"],"steps":["Placer le saumon 30 min au congélateur. Couper en très fines lamelles. Disposer dans les assiettes.","Saupoudrer de gingembre râpé, arroser de citron vert et d'huile d'olive. Saler.","Servir avec la sauce soja en accompagnement, que chacun dose à sa guise."],"sous_section":"Ceviche, carpaccio & tartare","source":"Petit Marabouts - Ceviche & Carpaccio"},{"title":"Saumon mariné au curry","subtitle":"Saumon gravlax au curry, poivrons rôtis et avocat","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten"],"ingredients":["600 g filet de saumon","2 c.à.s. sucre + 4 c.à.s. gros sel","2 poivrons rouges","1 tomate, 1 avocat","1 c.à.s. curry","1 citron non traité","aneth, piment de Cayenne, ciboulette"],"steps":["La veille : recouvrir le saumon de gros sel, sucre et poivre. Réfrigérer 1 nuit.","Griller les poivrons 20 min côté peau, enfermer 30 min dans un sac, peler. Couper en lamelles, réfrigérer.","Mélanger jus et zeste de citron, curry, ciboulette, Cayenne, aneth, sel et poivre. Verser sur poivrons et tomate.","Rincer le saumon, couper en dés, mariner 2 h au frais. Ajouter l'avocat coupé au service."],"sous_section":"Ceviche, carpaccio & tartare","source":"Petit Marabouts - Ceviche & Carpaccio"},{"title":"Ceviche de betterave crue","subtitle":"Betteraves marinées au citron vert, pomme granny et feta émiettée","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten","végétarien","rapide"],"ingredients":["1 betterave rouge crue","1 betterave chiogga crue","1 pomme granny-smith","50 g feta","5 citrons verts (jus)","½ botte coriandre ciselée","3 c.à.s. huile d'olive"],"steps":["Trancher les betteraves à la mandoline. Mariner dans le jus des citrons verts et l'huile d'olive pendant 2 h.","Couper la pomme en fines tranches à la mandoline (avec la peau), épépiner.","Répartir en alternant les couleurs. Émietter la feta, ajouter zeste, huile, fleur de sel et poivre."],"sous_section":"Ceviche, carpaccio & tartare","source":"Petit Marabouts - Ceviche & Carpaccio"},{"title":"Carpaccio de courgettes aux pignons grillés","subtitle":"Très fines rondelles de courgettes, pignons croustillants et copeaux de parmesan","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["sans gluten","végétarien"],"ingredients":["2 courgettes","200 g pignons de pin","100 g parmesan","1 citron (jus)","3 c.à.s. huile d'olive"],"steps":["Trancher les courgettes à la mandoline au plus fin. Disposer dans les assiettes.","Faire griller les pignons à sec en remuant. Répartir sur les courgettes. Arroser de citron. Réfrigérer 30 min.","Au service, ajouter des copeaux de parmesan, sel, poivre et huile d'olive."],"sous_section":"Ceviche, carpaccio & tartare","source":"Petit Marabouts - Ceviche & Carpaccio"},{"title":"Saumon gravlax – la recette essentielle","subtitle":"Saumon mariné 48h au sel, sucre et herbes — élégant, sans cuisson · Pour 6 · Préparation 10 min · Marinade 48h","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten"],"ingredients":["300 g filet de saumon extra frais","100 g gros sel","100 g sucre","½ bouquet herbes : aneth, coriandre…","1 c.à.c. poivre en grain (ou baies roses)"],"steps":["Mélanger sel, sucre, herbes et poivre concassé.","Dans un container hermétique, déposer la moitié du mélange sel/sucre. Poser le filet de saumon. Recouvrir du reste.","Fermer et réfrigérer 48h en éliminant régulièrement la saumure. On peut aussi retourner la boîte.","Avant de servir, rincer le saumon à l'eau froide pour ôter l'excès de sel. Bien éponger.","Trancher en lamelles ou dés. Servir avec des dés de mangue et un filet de citron vert."],"sous_section":"Ceviche, carpaccio & tartare","source":"Minute Papillote"},{"title":"Poivrons confits et tomates aux épices","subtitle":"Poivrons grillés au four et tomates mijotées avec ail, paprika et cumin","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["4 tomates","3 poivrons verts","4 gousses ail","1 c.à.s. persil plat haché","1 c.à.c. paprika","1 c.à.c. cumin en poudre","3 c.à.s. huile d'olive","sel, poivre du moulin"],"steps":["Préchauffer le four à 200°C. Déposer les poivrons sur une plaque et griller 20–30 min en les retournant régulièrement jusqu'à ce que la peau noircisse. Laisser refroidir dans un sac alimentaire 5–10 min.","Peler et épépiner les tomates, couper en petits dés (ou utiliser des tomates pelées en boîte).","Peler et hacher l'ail. Peler les poivrons, ôter le pédoncule et les graines. Couper en lanières.","Chauffer l'huile dans une sauteuse. Faire revenir les dés de tomates avec l'ail et les épices 5 min à feu moyen. Ajouter les lanières de poivrons et mélanger. Laisser mijoter à feu doux 15 min en remuant.","Déguster chaud ou tiède, parsemé de persil haché."],"sous_section":"Légumes rôtis","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Chou-fleur rôti au curcuma","subtitle":"Bouquets de chou-fleur rôtis aux épices et citron vert, croustillants et parfumés","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["1 chou-fleur","1 citron vert jus et zeste","1 poignée graines de courge concassées","1 c.à.c. curcuma","½ c.à.c. ail en poudre","½ c.à.c. paprika","1 c.à.s. zaatar","½ c.à.s. sucre semoule","1 c.à.c. sel","5 c.à.s. huile d'olive"],"steps":["Préchauffer le four à 200°C. Détacher les bouquets du chou-fleur et les mettre dans un saladier.","Dans un bol, mélanger toutes les épices, le sucre, le sel et l'huile d'olive. Verser sur les bouquets et bien enrober.","Étaler sur une plaque recouverte de papier cuisson. Enfourner 30 min. Ajouter les graines de courge concassées 5 min avant la fin.","Parsemer de zestes de citron vert et arroser de jus avant de déguster."],"sous_section":"Légumes rôtis","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Fattouch (salade libanaise)","subtitle":"Salade libanaise de légumes frais et pain grillé au sumac","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["25 g persil plat","2 branches menthe","65 g concombre","3 feuilles laitue","235 g tomates","25 g radis","25 g oignon","6 branches pourpier","1 branche basilic","3 c.à.s. jus de citron","4 c.à.s. huile d'olive","7 g sumac","1 pain libanais","½ c.à.c. sel"],"steps":["Laver et couper en gros morceaux le persil, la menthe, le concombre, la laitue et les tomates. Couper les radis en rondelles. Hacher l'oignon. Effeuiller le pourpier et le basilic.","Mettre tous les légumes dans un grand saladier. Ajouter le jus de citron, l'huile d'olive, le sumac et le sel. Mélanger.","Séparer le pain en deux et faire griller au four. Casser en gros morceaux.","Au moment de servir uniquement, ajouter le pain dans le saladier et mélanger."],"sous_section":"Salades","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Salade grecque","subtitle":"Tomates cerises, concombre, feta poêlée, olives noires et origan","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien","rapide"],"ingredients":["400 g tomates cerises","1 petit concombre","1 petit oignon rouge","½ poivron vert","quelques olives noires","4 brins origan (ou basilic)","200 g feta","½ citron jus","3 c.à.s. huile d'olive","poivre du moulin"],"steps":["Laver les tomates cerises et les couper en deux. Peler le concombre, le couper en deux dans la longueur, retirer les pépins et détailler en dés. Émincer l'oignon. Épépiner et couper le poivron en dés. Ciseler l'origan.","Déposer tomates, concombre, oignon et poivron dans un saladier. Ajouter olives et origan. Poivrer. Assaisonner de jus de citron et 2 c.à.s. d'huile d'olive. Mélanger et répartir dans 4 assiettes.","Couper la feta en quatre. Poêler les morceaux 1 min de chaque côté avec le reste d'huile. Déposer sur les assiettes. Poivrer avant de servir."],"sous_section":"Salades","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Salade de carottes à l'orange","subtitle":"Carottes râpées au jus d'orange frais, eau de fleur d'oranger et cannelle","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien","rapide"],"ingredients":["500 g carottes","2 oranges spécial jus","1 c.à.s. eau de fleur d'oranger","¼ c.à.c. cannelle en poudre","1 c.à.c. sucre semoule"],"steps":["Éplucher, laver et sécher les carottes. Râper finement.","Presser les oranges et filtrer le jus pour enlever la pulpe.","Dans un saladier, mélanger le jus d'orange, l'eau de fleur d'oranger, la cannelle et le sucre.","Ajouter les carottes râpées et mélanger pour bien les imprégner. Réfrigérer au moins 30 min avant de servir."],"sous_section":"Salades","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Taboulé oriental","subtitle":"Taboulé libanais à la semoule, abondant en persil frais, menthe et citron","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["3 tomates juteuses","160 g concombre","2 oignons nouveaux","1 botte persil plat","4 brins menthe","160 g semoule de blé","2 citrons jus","10 cl huile d'olive","sel, poivre du moulin"],"steps":["Tailler les tomates en petits dés en gardant leur jus. Éplucher le concombre et couper en dés. Émincer finement les oignons nouveaux. Ciseler le persil plat et la menthe.","Mettre la semoule dans un saladier. Ajouter les dés de tomates et de concombre, les oignons, le persil et la menthe. Arroser de jus de citron et d'huile d'olive. Saler et poivrer. Mélanger.","Laisser reposer au réfrigérateur pendant 2 heures avant de déguster."],"sous_section":"Salades","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Salade italienne de fenouil et orange","subtitle":"Fenouil tranché à la mandoline et oranges de Sicile — un accord parfait en hiver","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien","rapide"],"ingredients":["4 oranges (de préférence Sicile ou Calabre)","2 bulbes fenouil","huile d'olive généreuse","sel, poivre noir du moulin"],"steps":["Éplucher les oranges à vif. Couper en tranches fines puis recouper chaque tranche en quatre.","Trancher la base du fenouil et retirer le haut des tiges les plus épaisses (réserver les jeunes pousses). À la mandoline, couper les deux bulbes en tranches très fines.","Dans un saladier, mêler le fenouil et l'orange. Ajouter les petites pousses de fenouil. Arroser généreusement d'huile d'olive, saler et poivrer. Mélanger et laisser reposer 15 min au réfrigérateur avant de servir."],"sous_section":"Salades","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Salade thaï de pomelo","subtitle":"L'équilibre parfait salé-sucré-acide-piquant de la cuisine thaïe — fraîche et colorée · Pour 4 · Préparation 15 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten","rapide"],"ingredients":["1 c.à.s. sucre de palme (ou sucre de coco ou roux)","1,5 c.à.s. jus de citron vert","1,5 c.à.s. sauce poisson / nuoc mam","½ piment oiseau (optionnel)","500 ml chair de pomelo (env. 2 verres)","2 c.à.s. cacahuètes grillées non salées, en gros morceaux","1 c.à.s. coriandre fraîche","1 c.à.s. noix de coco râpée non sucrée (optionnel)","3 c.à.s. échalotes ou oignon rouge, émincés finement","2 feuilles de kaffir en très fines lanières","1 tige citronnelle émincée finement","1 c.à.s. menthe (optionnel)"],"steps":["Préparer la sauce : mélanger sucre, jus de citron vert et sauce poisson. Goûter et rectifier l'équilibre salé/sucré/acide.","Peler le pomelo à l'aide d'un grand couteau. Prélever la chair, jeter les membranes, et la couper en petits morceaux avec les doigts. Déposer dans un grand bol.","Ajouter les échalotes, le kaffir, la citronnelle, les cacahuètes, la coriandre et la noix de coco.","Verser la sauce sur la salade, mélanger et servir aussitôt."],"sous_section":"Salades","source":"Minute Papillote"},{"title":"Tomates cerises confites à la ricotta","subtitle":"Tomates fondantes et caramélisées sur un lit de ricotta crémeuse — parfait en entrée ou à l'apéritif","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["500 g tomates cerises","250 g ricotta","30 g parmesan râpé","4 c.à.s. huile d'olive","3 gousses ail en chemise","1 c.à.c. sucre","4 brins thym frais","10 feuilles basilic frais","½ citron (zeste)","sel, poivre noir","piment d'Espelette (facultatif)"],"steps":["Préchauffer le four à 160°C chaleur tournante. Cette température douce est la clé pour confire les tomates sans les brûler.","Laver et sécher les tomates cerises. Les couper en deux et disposer côté coupé vers le haut sur une plaque recouverte de papier cuisson. Parsemer de sucre, arroser d'huile d'olive, ajouter les brins de thym et les gousses d'ail en chemise légèrement écrasées. Saler et poivrer.","Enfourner et laisser confire 1 h à 1 h 15, jusqu'à ce que les tomates soient légèrement caramélisées, ridées et très fondantes.","Pendant ce temps, travailler la ricotta dans un bol avec le parmesan, le zeste de citron, une pincée de sel et un filet d'huile d'olive. Mélanger jusqu'à texture crémeuse et homogène. Réserver au frais.","Étaler généreusement la ricotta sur un plat de service ou des assiettes individuelles. Disposer les tomates confites encore tièdes par-dessus. Décorer de feuilles de basilic, d'un filet d'huile d'olive et, si souhaité, d'une pincée de piment d'Espelette."],"sous_section":"Salades","source":"Les festins partagés de God save the cream"},{"title":"Oignons au miso façon Ottolenghi","subtitle":"Oignons rôtis à 240°, laqués au beurre de miso — fondants, caramélisés, irrésistibles · Pour 6 · Préparation 15 min · Cuisson 1h30","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["1,2 kg oignons","100 g beurre fondu","100 g miso blanc","1 litre eau chaude"],"steps":["Peler les oignons. Les couper en deux dans le sens de la longueur.","Les placer dans un plat à bords hauts, face bombée vers le haut, bien serrés.","Mélanger le beurre fondu, le miso et l'eau chaude.","Couvrir hermétiquement de papier aluminium. Enfourner à 240 °C pendant 35 min.","Retirer le papier alu et retourner les oignons (face plane vers le haut). Arroser généreusement de beurre de miso.","Remettre au four 45 min (ou plus), en arrosant de beurre de miso toutes les 10 min environ, jusqu'à ce que les oignons soient tendres et bien dorés."],"sous_section":"Légumes rôtis","source":"Minute Papillote"},{"title":"Chou-fleur grillé sauce tahini et grenade","subtitle":"Sommités rôties au zaatar, sauce tahini crémeuse et grains de grenade · Pour 4 · Préparation 5 min · Cuisson 25 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["— Pour le chou-fleur —","1 gros chou-fleur (ou 2 petits)","Filet d'huile d'olive","3 c.à.s. zaatar (ou 1 c.à.s. cumin)","Sel, poivre ou piment","Grains de grenade pour le service","— Pour la sauce tahini —","3 c.à.s. tahini (pâte de sésame)","½ jus de citron","½ gousse d'ail (ou plus selon les goûts)","Environ ½ verre d'eau (ou plus, pour une consistance fluide)","½ c.à.c. cumin","Sel","Optionnel : quelques branches de coriandre"],"steps":["Enlever les feuilles du chou-fleur et le découper en grosses sommités (plus elles sont grosses, plus le chou-fleur sera grillé en conservant une chair ferme).","Déposer les sommités sur une feuille de papier cuisson sur la lèchefrite. Disperser les aromates, le sel et le poivre, puis arroser d'un généreux filet d'huile d'olive.","Cuire au four à 200°C entre 25 et 40 minutes selon la taille des sommités. Le chou-fleur doit être bien grillé mais la chair encore légèrement ferme.","Sauce tahini : mixer la pâte de sésame, le jus de citron, l'ail dégermé haché, le cumin et éventuellement la coriandre. Détendre progressivement avec de l'eau jusqu'à la consistance d'un yaourt liquide. Saler et goûter.","Déposer le chou-fleur dans un plat de service. Verser une partie de la sauce, parsemer de grains de grenade. Proposer le reste de sauce à part."],"sous_section":"Légumes rôtis","source":"Minute Papillote"},{"title":"Carottes rôties façon Ottolenghi","subtitle":"Carottes rôties au sirop d'érable, sauce aux abricots secs, sumac et piment d'Alep · Pour 4 · Préparation 30 min · Cuisson 30 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["— Pour les carottes —","1 kg carottes","3 c.à.s. huile d'olive + 1,5 c.à.s. pour servir","1½ c.à.s. sirop d'érable","30 g amandes grillées salées hachées grossièrement","½ bouquet d'herbes variées : coriandre, aneth, menthe…","Sel, poivre","— Pour la sauce —","40 g abricots secs","1 c.à.c. sirop d'érable","2 c.à.c. sumac","4,5 cl jus de citron vert + 2 c.à.c. pour servir","¾ c.à.c. piment (ou 1½ c.à.c. piment d'Alep)","1 petite gousse d'ail (ou 1 c.à.s. huile à l'ail)"],"steps":["Découper les carottes en gros tronçons. Les enrober d'huile d'olive, de sirop d'érable, sel et poivre — mélanger de préférence à la main.","Étaler sur une plaque de cuisson sans les faire se chevaucher. Enfourner à 240°C environ 20 minutes : les carottes doivent avoir pris couleur mais rester légèrement croquantes.","Pendant la cuisson, préparer la sauce en mixant tous les ingrédients de la sauce (sauf les 2 c.à.c. citron vert pour servir). La sauce peut rester légèrement grumeleuse. Saler.","Verser les carottes cuites dans un saladier, ajouter la sauce et bien mélanger. Couvrir et laisser reposer 20 minutes pour que la sauce soit bien absorbée.","Au moment de servir, ajouter les amandes, les herbes fraîches, un filet d'huile d'olive et un splash de citron vert."],"sous_section":"Légumes rôtis","source":"Minute Papillote"},{"title":"Gaspacho pastèque","subtitle":"Soupe froide tomates-pastèque au basilic — fraîcheur maximale en 10 minutes · Pour 6 · Préparation 10 min · Cuisson 0 min","chapter":"III","chapter_name":"Soupes & veloutés","tags":["sans gluten","végétarien","rapide"],"ingredients":["500 g tomates, pédoncule retiré","200 g pastèque sans pépins","10 feuilles basilic","1 gousse ail","½ oignon","10 g vinaigre de cidre","35 g huile d'olive","quelques tranches de pain rassis (optionnel)"],"steps":["Mettre dans le mixeur tous les ingrédients sauf l'huile d'olive et le pain. Saler. Mixer finement.","Ajouter l'huile d'olive et mixer à nouveau — la texture devient plus dense et la couleur s'adoucit.","Goûter et rectifier (sel, basilic, vinaigre). Placer au frais.","Optionnel — croûtons : couper le pain en dés, arroser d'huile d'olive, vinaigre et sel. Cuire 10 min à 180 °C jusqu'à dorure.","Servir en verrines avec les croûtons, un peu de basilic, fleur de sel et un filet d'huile."],"sous_section":"","source":"Minute Papillote"},{"title":"Soupe de courgettes et basilic","subtitle":"Veloutée, chaude ou froide — servie avec des dés de feta et graines pour le croquant · Pour 6 · Préparation 10 min · Cuisson 20 min","chapter":"III","chapter_name":"Soupes & veloutés","tags":["sans gluten","végétarien","rapide"],"ingredients":["2 courgettes taille moyenne","1 oignon","quelques feuilles de basilic","1 cube bouillon de volaille ou légumes (optionnel)","pour décorer : feta, poivron rouge, basilic, pignons, graines"],"steps":["Peler et émincer l'oignon, le faire revenir dans un peu d'huile d'olive.","Couper les courgettes en dés et les ajouter aux oignons. Faire revenir jusqu'à légère coloration.","Recouvrir d'eau, ajouter éventuellement le bouillon et peu de sel. Cuire 20 min jusqu'à ce que les courgettes soient tendres.","Mixer finement avec quelques feuilles de basilic (commencer par 3–4, ajuster au goût).","Rectifier l'assaisonnement. Servir chaud en bol, ou froid en verrine avec dés de feta, basilic et graines."],"sous_section":"","source":"Minute Papillote"},{"title":"Soupe Tom Yum thaï aux crevettes","subtitle":"La savoureuse soupe thaï citronnelle-galanga, crevettes et champignons · Pour 4 · Préparation 15 min · Cuisson 15 min","chapter":"III","chapter_name":"Soupes & veloutés","tags":["rapide","poisson"],"ingredients":["— Pour le bouillon de crevettes —","12 crevettes entières (avec la carapace)","0,75 l eau","Optionnel : ½ oignon","— Pour la soupe Tom Yum —","2 tiges de citronnelle, en gros tronçons","6 feuilles de kefir lime (combava), chiffonnées","3–4 cm de galanga en tranches (à défaut, gingembre frais)","2 piments oiseau en fines tranches (ou 1 si peu épicé)","250 g pleurotes (ou champignons de Paris), en tranches","1 grosse c.à.s. pâte de chili (à défaut, sucre de palme ou sucre roux)","2 c.à.s. sauce poisson (nuoc mam)","Jus de 1 à 2 citrons verts","6 c.à.s. lait de coco (ou plus pour une soupe plus douce)","Quelques feuilles de coriandre pour la décoration","Optionnel : 1 tomate en quartiers, ½ carotte en rondelles, 2 oignons de printemps"],"steps":["Bouillon : rincer les crevettes et ôter la tête, la queue et la carapace. Réserver le corps au frais. Faire revenir les carapaces, queues et la moitié des têtes dans un peu d'huile jusqu'à coloration. Ajouter éventuellement l'oignon émincé. Verser l'eau et cuire à petits bouillons 20 minutes. Passer au chinois en écrasant bien. Ne conserver que le bouillon.","Faire réchauffer le bouillon (ou utiliser un bouillon tout prêt) avec la citronnelle, les feuilles de kefir, le galanga, les piments oiseau et éventuellement carotte et tomate. Faire bouillir à petits bouillons 5–10 minutes. (Cette étape peut se faire à l'avance.)","Ajouter les champignons et le lait de coco. Cuire quelques minutes à petits bouillons.","Ajouter les crevettes réservées. Au premier bouillon, retirer du feu — elles cuisent dans le bouillon encore chaud.","Une fois les crevettes roses, assaisonner avec la sauce poisson, le jus de citron (commencer par 1 citron) et la pâte de chili. Goûter et rectifier. Verser dans des bols, décorer de coriandre et d'oignons de printemps."],"sous_section":"","source":"Minute Papillote"},{"title":"Soupe carottes gingembre","subtitle":"Veloutée, douce et légèrement épicée — belle couleur dorée et pleine de vitamines · Pour 4 · Préparation 10 min · Cuisson 45 min","chapter":"III","chapter_name":"Soupes & veloutés","tags":["sans gluten","végétarien","rapide"],"ingredients":["500 g carottes","1 oignon","3 cm gingembre frais (ou 1 c.à.s. gingembre surgelé)","½ cube bouillon de poulet ou légumes","sel, poivre","un peu de lait ou lait de coco","optionnel : coriandre fraîche ou huile de coriandre"],"steps":["Peler et couper les carottes en petits dés. Peler et émincer l'oignon.","Faire chauffer de l'huile dans une casserole. Ajouter l'oignon et les carottes, faire légèrement colorer en remuant.","Peler et râper le gingembre (astuce : utiliser une cuiller à café pour éplucher). Ajouter et faire revenir 1–2 min.","Recouvrir d'eau à hauteur, ajouter le bouillon et saler. Réduire le feu, couvrir et cuire 45 min jusqu'à ce que les carottes soient tendres.","Transférer avec le bouillon dans le mixeur. Mixer jusqu'à consistance souhaitée en ajoutant un peu de lait ou lait de coco.","Goûter et rectifier. Servir éventuellement avec de la coriandre fraîche."],"sous_section":"","source":"Minute Papillote"},{"title":"Velouté de panais, châtaignes et truffe","subtitle":"Élégant et réconfortant — une entrée de fête à préparer jusqu'à 2 jours à l'avance · Pour 6 · Préparation 15 min · Cuisson 30 min","chapter":"III","chapter_name":"Soupes & veloutés","tags":[],"ingredients":["2 panais","1 dizaine châtaignes cuites et pelées + 2–3 pour décorer","2 échalotes","¼ tablette bouillon de poule","½ à 1 l lait (selon consistance souhaitée)","1 c.à.s. miel","huile de truffe","sel, poivre"],"steps":["Peler et émincer les échalotes et les panais en petits dés (pour une cuisson plus rapide).","Faire chauffer du beurre dans une casserole. Faire revenir échalotes et panais jusqu'à légère coloration.","Ajouter les châtaignes et le miel. Mélanger.","Recouvrir de lait à hauteur et saler. Cuire à petit feu à couvert environ 30 min jusqu'à ce que les panais soient tendres.","Mixer finement en ajoutant du lait progressivement pour obtenir la consistance d'un velouté. Rectifier.","Verser dans des assiettes individuelles. Garnir d'éclats de châtaignes et de quelques gouttes d'huile de truffe."],"sous_section":"","source":"Minute Papillote"},{"title":"Gaspacho tomate pastèque – verrines santé","subtitle":"Gaspacho onctueux tomate-pastèque au basilic, servi en petites verrines fraîches · Pour 6 · Préparation 10 min","chapter":"III","chapter_name":"Soupes & veloutés","tags":["sans gluten","végétarien","rapide"],"ingredients":["500 g tomates (rouge ou ananas)","200 g pastèque sans pépins","10–15 g vinaigre de cidre (ou de vin)","35 g huile d'olive","4 oignons nouveaux (ou 1 petit oignon)","1 petite gousse ail","10–15 feuilles basilic","½ galette de riz soufflé (ou 1 tranche de pain)","sel"],"steps":["Mettre tous les ingrédients dans le mixeur sauf l'huile d'olive. Mixer jusqu'à consistance lisse (ou légèrement rustique selon goût).","Ajouter l'huile d'olive et mixer à nouveau.","Goûter et rectifier l'assaisonnement. Réserver au frais.","Servir en verrines. Optionnel : ajouter des croûtons (dés de pain à l'huile et vinaigre, cuits 10 min à 180 °C)."],"sous_section":"","source":"Minute Papillote"},{"title":"Soupe froide petits pois, menthe et noisettes","subtitle":"Velouté express vert vif — prêt en 10 min, servi en petites verrines élégantes · Pour 6 · Préparation 1 min · Cuisson 10 min","chapter":"III","chapter_name":"Soupes & veloutés","tags":["sans gluten","végétarien","rapide"],"ingredients":["300 g petits pois surgelés","300 g eau","½ cube bouillon de légumes","30 feuilles menthe","huile de noisettes","1 poignée noisettes"],"steps":["Faire cuire les petits pois avec les feuilles de menthe, l'eau et le bouillon au micro-ondes (5 min à 800W).","Couper les noisettes en éclats au couteau. Les faire griller à sec dans une poêle très chaude jusqu'à torréfaction. Réserver.","Mixer les petits pois cuits jusqu'à consistance désirée.","Ajouter un peu d'huile de noisettes et mixer à nouveau. Goûter et rectifier (sel, huile de noisettes).","Verser dans des petites verrines. Placer au réfrigérateur.","Juste avant de servir, garnir de feuilles de menthe fraîches et d'éclats de noisettes grillées."],"sous_section":"","source":"Minute Papillote"},{"title":"Soupe de potimarron à la marocaine","subtitle":"Potimarron rôti au ras el-hanout, feta émiettée et pistaches concassées","chapter":"III","chapter_name":"Soupes & veloutés","tags":["végétarien"],"ingredients":["600 g potimarron","1 échalote","1 c.à.c. ras el-hanout","40 g feta","2 c.à.s. pistaches décortiquées (ou graines de courge)","1 litre bouillon de légumes","huile d'olive, sel, poivre","quelques graines de grenade (facultatif)"],"steps":["Retirer les graines du potimarron et couper la chair en dés. Éplucher et hacher l'échalote.","Dans une casserole, faire revenir les dés de potimarron, l'échalote et le ras el-hanout avec un filet d'huile 2 min. Saler, verser le bouillon. Porter à ébullition puis laisser cuire 15 min à feu doux.","Faire griller les pistaches à sec 5 min sans cesser de remuer. Concasser. Émietter la feta.","Réserver 1 louche de bouillon. Mixer la soupe en ajoutant du bouillon réservé si trop épaisse.","Répartir dans 4 bols. Parsemer de feta, pistaches concassées et graines de grenade."],"sous_section":"","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Gratin de patate douce, poulet et coriandre","subtitle":"Purée soyeuse de patate douce à la crème de coco, sur lit de poulet effiloché","chapter":"IV","chapter_name":"Plats principaux","tags":["viande","sans gluten"],"ingredients":["2–3 patates douces (bio)","1 poulet rôti (restes) ou 3 escalopes","10 cl crème de coco","1 oignon rouge","1 gousse d'ail","coriandre fraîche","2 c.à.s. sauce Tamari (ou soja)","fromage râpé (Manchego)"],"steps":["Faire revenir l'oignon émincé et l'ail haché dans l'huile jusqu'à ce que les oignons soient fondants. Réserver dans le plat à gratin.","Cuire les cubes de patates douces 15–20 min dans l'eau bouillante salée jusqu'à tendreté.","Effilocher le poulet. Dans le plat, mélanger oignon, coriandre, poulet et Tamari. Étaler uniformément.","Mixer les patates égouttées avec huile et crème de coco jusqu'à texture ultra soyeuse. Saler.","Étaler la purée sur le mélange poulet, parsemer de fromage râpé. Griller à 200°C environ 10 min."],"sous_section":"Viande","source":"Megalow Food"},{"title":"Boulettes de poulet à la sauge, feta & tomates séchées","subtitle":"Boulettes moelleuses aux parfums méditerranéens, servies avec sauce au yaourt","chapter":"IV","chapter_name":"Plats principaux","tags":["viande","sans gluten"],"ingredients":["250 g poulet fermier","60 g feta","6 tomates séchées émincées","10 feuilles de sauge (ou menthe)","25 g poudre de noisettes","1 échalote finement émincée","1 jaune d'œuf","1 c.à.s. huile d'olive"],"steps":["Dans un robot (lame en S), mixer finement le poulet avec l'huile, le sel et le jaune d'œuf.","Ajouter les autres ingrédients et mixer par à-coups de façon homogène.","Huiler les mains, former des boulettes avec 1 c.à.c. de chair. Disposer sur plaque.","Badigeonner d'huile d'olive. Enfourner 15 min à 200°C. Servir avec yaourt grec, citron, sel & poivre."],"sous_section":"Viande","source":"Megalow Food"},{"title":"Porc haché à la thaï","subtitle":"Saveurs de gingembre et citronnelle express — parfait sur un riz blanc · Pour 6 · Préparation 15 min · Cuisson 15 min","chapter":"IV","chapter_name":"Plats principaux","tags":["viande","poisson","rapide","sans gluten"],"ingredients":["500 g porc haché","1 oignon","2–3 cm racine de gingembre","1 bâtonnet citronnelle","4–5 feuilles de keffir (combawa)","2 petits piments oiseau","1 gousse ail","2 poivrons (mix de couleurs)","1 c.à.s. sauce poisson","½ jus de citron vert","feuilles de coriandre ou basilic thaï"],"steps":["Émincer l'oignon, éplucher le gingembre et le découper en fines rondelles. Taper la citronnelle avec le dos du couteau et la couper en 4 tronçons. Hacher l'ail finement.","Faire chauffer de l'huile neutre et ajouter l'oignon et l'ail.","Quand les oignons ont fondu, ajouter le porc et faire dorer en séparant les morceaux.","Ajouter un fond d'eau et gratter les sucs. Ajouter les feuilles de keffir, le gingembre, la citronnelle, les piments et les poivrons.","Couvrir et laisser cuire à feu doux 10 minutes (ne pas trop cuire).","Ajouter la sauce poisson petit à petit en goûtant. Ajouter le jus de citron, rectifier l'assaisonnement.","Servir avec coriandre ou basilic thaï et riz blanc."],"sous_section":"Viande","source":"Minute Papillote"},{"title":"Curry vert de poulet thaï","subtitle":"Curry thaï au lait de coco, basilic et légumes — facile et parfumé · Pour 6 · Préparation 20 min · Cuisson 20 min","chapter":"IV","chapter_name":"Plats principaux","tags":["viande","poisson","sans gluten"],"ingredients":["2 c.à.s. pâte de curry vert (maison ou du commerce)","20 feuilles env. basilic thaï (ou coriandre)","5 feuilles citron kaffir (ou zeste de combava)","300 g blancs de poulet, coupés en dés","légumes au choix : épinards, champignons, poivron, pousses de bambou","½ cube bouillon de volaille","0,5 l lait de coco","2 c.à.s. sauce poisson (nuoc mam)","2 c.à.s. pâte de tamarin","2 c.à.c. sucre de palme (ou sucre roux)","½ jus de citron vert"],"steps":["Faire revenir la pâte de curry dans un wok avec un peu d'huile 1 minute. Verser le lait de coco, 200 ml d'eau, le bouillon, 1 c.à.s. de sauce poisson, la pâte de tamarin, le sucre et les feuilles de kaffir.","Porter à ébullition, ajouter le poulet et les légumes coupés en dés. Cuire 10 à 15 min jusqu'à ce que le poulet soit cuit (ne pas surcuire).","Ajouter une partie du jus de citron vert. Goûter et rectifier l'assaisonnement (sauce poisson, sucre, citron).","Ajouter les feuilles de basilic thaï et servir avec un riz blanc."],"sous_section":"Viande","source":"Minute Papillote"},{"title":"Bœuf carottes de Jamie Oliver","subtitle":"Mijoté familial à la moutarde et sauce Worcestershire — encore meilleur réchauffé · Pour 8 · Préparation 20 min · Cuisson 4h","chapter":"IV","chapter_name":"Plats principaux","tags":["viande","sans gluten"],"ingredients":["1 kg viande de bœuf (bourguignon, tendron — pas maigre)","500 g carottes","2 oignons","1 c.à.s. moutarde forte","120 ml sauce Worcestershire","persil pour décorer"],"steps":["Peler et couper les carottes en larges tronçons. Peler et émincer les oignons.","Faire chauffer un peu de matière grasse dans une cocotte allant au four. Faire revenir carottes et oignons jusqu'à légère coloration, puis les réserver.","Dans la même cocotte chaude, faire dorer les morceaux de viande (4×4 cm) en mélangeant régulièrement.","Remettre les carottes et oignons. Recouvrir d'eau à hauteur. Saler, ajouter la moutarde et la sauce Worcestershire.","Poser le couvercle et enfourner à 160 °C pendant 4 heures. Vérifier régulièrement le niveau de liquide.","Servir immédiatement ou réchauffer — c'est encore meilleur ! Accompagner de pommes de terre et carottes vapeur."],"sous_section":"Viande","source":"Minute Papillote"},{"title":"Chili con carne du festival","subtitle":"Poivrons confits mixés en pâte épicée, bœuf mijoté longuement et haricots rouges","chapter":"IV","chapter_name":"Plats principaux","tags":["viande"],"ingredients":["800 g bœuf à braiser (ou haché)","2 poivrons rouges, coupés en lanières","2 oignons rouges émincés (séparés en deux)","4 gousses d'ail hachées (séparées en deux)","2 c.à.s. pâte de piment (ou harissa)","1 c.à.s. sucre","50 cl bouillon de bœuf","1 c.à.c. cumin en poudre","1 c.à.c. paprika","huile d'olive","huile végétale neutre","400 g tomates concassées","2 c.à.s. concentré de tomate","400 g haricots rouges cuits (en conserve)","½ botte coriandre fraîche","sel, poivre"],"steps":["Faire revenir les lanières de poivron rouge à feu fort dans un filet d'huile d'olive.","Quand les poivrons sont ramollis, ajouter la moitié de l'oignon rouge émincé et de l'ail haché. Poursuivre la cuisson quelques minutes.","Ajouter un filet d'huile d'olive, la pâte de piment et un peu d'eau. Laisser réduire à feu doux jusqu'à ce que le mélange soit presque sec (il doit rester plus de matière grasse que de liquide).","Pendant ce temps, préparer un roux : faire fondre le sucre avec un peu de bouillon de bœuf jusqu'à obtenir une texture sirupeuse.","Mixer les poivrons confits avec le roux jusqu'à obtenir une pâte bien homogène. Ajouter le cumin et un filet d'huile d'olive. Réserver.","Dans une cocotte, faire chauffer une bonne quantité d'huile neutre et colorer la viande de bœuf sur toutes les faces.","Ajouter le reste de l'oignon rouge émincé et de l'ail haché, poursuivre la cuisson quelques minutes.","Ajouter les tomates concassées, le concentré de tomate, le paprika, le bouillon et un peu d'eau. Incorporer la pâte de poivrons réservée. Saler, poivrer et mélanger.","Couvrir et laisser mijoter à feu doux environ 1h30 à 2h, jusqu'à ce que la viande soit fondante, en remuant de temps en temps et en ajoutant un peu d'eau si nécessaire.","Ajouter les haricots rouges égouttés 5 minutes avant la fin de la cuisson.","Hors du feu, parsemer de coriandre fraîche ciselée. Servir bien chaud, avec du riz par exemple."],"sous_section":"Viande","source":"Darcy"},{"title":"Saumon grillé, sauce aux pignons de Bridget Jones","subtitle":"Pavés de saumon croustillants, sauce céleri-pignons-raisins-câpres-safran d'Ottolenghi · Pour 4 · Préparation 15 min · Repos 20 min · Cuisson 7 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Poisson","tags":["poisson","sans gluten"],"ingredients":["100 g raisins de Corinthe","4 pavés de saumon avec la peau, désarêtés (500 g)","100 ml huile d'olive","4 branches de céleri (180 g), feuilles réservées pour le dressage, taillées en mirepoix","30 g pignons de pin grossièrement hachés","40 g câpres + 2 c.à.s. de leur jus de conservation","40 g olives vertes dénoyautées (8), taillées en mirepoix","¼ c.à.c. stigmates de safran délayés dans 1 c.à.s. d'eau chaude","20 g persil haché","1 citron : 1 c.à.c. zeste + 1 c.à.c. jus","Sel, poivre noir"],"steps":["Réhydrater les raisins de Corinthe en les couvrant d'eau bouillante. Laisser gonfler 20 min.","Enrober les pavés de saumon de 2 c.à.c. d'huile d'olive, ⅓ c.à.c. de sel et quelques tours de moulin à poivre. Réserver.","Chauffer 75 ml d'huile d'olive dans une grande sauteuse à feu vif. Faire revenir les dés de céleri et les pignons 4–5 min en remuant. Stopper dès que les pignons commencent à colorer.","Hors du feu, incorporer les câpres et leur jus, les dés d'olive, le safran et son eau, et une pincée de sel. Égoutter les raisins et les ajouter avec le persil, le zeste et le jus de citron. Réserver.","Chauffer 1 c.à.s. d'huile dans une grande poêle à feu moyen-vif. Saisir les pavés côté peau 3 min jusqu'à peau bien croustillante. Baisser à feu moyen et poursuivre côté chair 2–4 min selon cuisson souhaitée (nacré ou bien cuit).","Dresser un pavé par assiette, arroser généreusement de sauce aux pignons. Parsemer de feuilles de céleri et servir."],"source":"Simple - Ottolenghi"},{"title":"Nouilles sautées aux noix de cajou","subtitle":"Tofu mariné, légumes croquants et sauce cajou citronnée au sriracha, sauté au wok","chapter":"IV","chapter_name":"Plats principaux","tags":["sans gluten","végétarien"],"ingredients":["300 g nouilles de riz séchées","160 g tofu ferme","½ tête brocoli","1 carotte","½ poivron rouge","2 oignons nouveaux","1 gousse ail râpée","1 c.à.c. gingembre frais râpé","1 poignée noix de cajou","2 c.à.s. huile de tournesol","2 c.à.s. sauce soja sucrée (marinade)","coriandre fraîche","2 citrons verts (jus)","1 c.à.c. gingembre frais râpé","1 c.à.s. purée de noix de cajou (ou sésame)","1 c.à.c. sriracha","5 c.à.s. sauce soja","2 c.à.s. huile de sésame toasté"],"steps":["Cuire les nouilles de riz selon le paquet. Rincer à l'eau froide et égoutter.","Égoutter le tofu, couper en bâtonnets. Mélanger avec le gingembre, l'ail et la sauce soja sucrée. Laisser mariner 10 min.","Préparer les légumes : brocoli en bouquets, carotte en fins bâtonnets, poivron en lanières, oignons émincés, coriandre ciselée.","Préparer la sauce cajou en mélangeant tous ses ingrédients dans un bol.","Dans un wok, faire brunir les noix de cajou à feu vif avec l'huile. Réserver sur une assiette, laisser l'huile dans le wok.","Faire revenir le tofu 2 min à feu vif en remuant. Ajouter le poivron, la carotte et le brocoli. Poursuivre 6 min.","Arroser de la moitié de la sauce cajou. Ajouter les nouilles et les oignons. Sauter 1 min. Verser le reste de sauce, mélanger.","Parsemer de coriandre ciselée et de noix de cajou grillées. Servir aussitôt."],"sous_section":"Végétarien","source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Terrine végétale aux shiitakés","subtitle":"Lentilles, shiitakés, noisettes et cajou, liée au gel de chia","chapter":"IV","chapter_name":"Plats principaux","tags":["sans gluten","végétarien"],"ingredients":["200 g lentilles vertes","400 g champignons shiitakés","2 c.à.s. graines de chia","3 échalotes","80 g noisettes + 80 g cajou","50 g farine de pois chiche","1 c.à.s. tamari","4-épices, muscade, sel, poivre"],"steps":["Cuire les lentilles 40 min à petits bouillons. Écraser grossièrement à la fourchette.","Hydrater le chia dans 80 ml d'eau pendant 20 min. Faire revenir les shiitakés 15–20 min, hacher finement.","Mixer grossièrement échalotes, noisettes et cajous. Mélanger tout avec lentilles, champignons, épices, tamari et gel de chia.","Incorporer la farine de pois chiche. Tasser dans moule chemisé. Cuire à 180°C pendant 40 min."],"sous_section":"Végétarien","source":"Chia, lin et psyllium - Clémence Catz"},{"title":"Tofu soyeux Hiyayakko","subtitle":"Tofu fondant au vert de poireau frit, gingembre râpé et sauce soja-mirin","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien","rapide"],"ingredients":["200 g tofu soyeux","10 cm vert de poireau (ou 1 oignon blanc avec tige)","1 c.à.s. graines de sésame","1 c.à.s. huile de sésame toastée","1 c.à.s. sauce soja","1 c.à.s. mirin (ou 1 c.à.s. vinaigre de riz + 1 c.à.c. sucre)","1 à 2 cm gingembre frais"],"steps":["Émincer très finement le vert de poireau.","Chauffer l'huile de sésame dans une petite casserole. Ajouter les poireaux et les graines de sésame. Faire frire 1 minute à feu moyen en mélangeant. Déglacer avec le mirin et la sauce soja. Éteindre.","Déposer le tofu dans un bol et râper le gingembre par-dessus. Verser la sauce chaude. Déguster aussitôt."],"source":"https://leculdepoule.co"},{"title":"Tofu soyeux aux algues et poireaux","subtitle":"Tofu fondant aux saveurs marines — poireaux, algues wakamé et sauce sésame","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien","rapide"],"ingredients":["200 g tofu soyeux","1 c.à.c. algues séchées en paillettes (wakamé ou autre)","100 g blanc de poireaux","1 c.à.s. huile de sésame toastée","1 c.à.s. sauce soja","1 c.à.s. mirin","1 c.à.s. graines de sésame"],"steps":["Laver et émincer finement le poireau.","Chauffer l'huile de sésame dans une petite casserole. Ajouter le poireau, les graines de sésame et les algues. Si la casserole n'a pas un fond épais, ajouter 1 à 2 c.à.s. d'eau. Cuire à feu moyen en remuant 3 à 4 minutes. Déglacer avec le mirin et la sauce soja. Éteindre.","Déposer le tofu dans un bol et verser la sauce par-dessus. Déguster aussitôt."],"source":"https://leculdepoule.co"},{"title":"Tofu soyeux au piment et cacahuètes","subtitle":"Fusion Japon-Corée — tofu fondant, sauce gochugaru et cacahuètes grillées","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien","rapide"],"ingredients":["200 g tofu soyeux","10 cm vert de poireau (ou 1 oignon blanc)","½ c.à.c. rase piment gochu
