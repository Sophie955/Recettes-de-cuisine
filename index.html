le légèrement huilée, étaler une louche de pâte. Cuire jusqu'à ce que des bulles apparaissent. Couvrir et cuire 2 min à feu doux. Retirer le couvercle et poursuivre 1 min. Répéter avec le reste de pâte.","Lentilles berbères : émincer l'oignon. Hacher le piment séché. Faire revenir l'oignon dans l'huile de coco 5 min. Ajouter le piment, l'ail, le gingembre, les épices et les lentilles. Cuire 2 min. Verser le bouillon et laisser mijoter 30 min à feu doux. Saler et poivrer.","Garniture : tailler le concombre en dés, couper les tomates cerises, déchirer les feuilles de salade, ciseler la coriandre.","Servir les galettes injera garnies de lentilles berbères, tomates cerises, dés de concombre, salade et coriandre."]},{"title":"Rösti aux légumes + sauce aux herbes","subtitle":"Galettes suisses de pommes de terre et légumes râpés, sauce aux herbes au fromage blanc","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["2 pommes de terre","1 carotte","1 panais","1 petite courgette","1 oignon rouge","2 œufs","2 c.à.s. farine","huile de cuisson, sel, poivre","120 g fromage blanc (sauce)","½ citron jus (sauce)","½ botte persil + quelques brins de cerfeuil (sauce)"],"steps":["Peler et râper pommes de terre, carotte et panais. Laver et râper la courgette. Émincer finement l'oignon. Battre les œufs dans un bol.","Déposer tous les légumes dans un saladier, ajouter la farine et les œufs battus. Saler, poivrer et mélanger délicatement.","Sauce aux herbes : mixer le persil et le cerfeuil. Mélanger dans un bol avec le fromage blanc et le jus de citron. Saler et poivrer.","Chauffer un fond d'huile dans une poêle. Déposer 2 c.à.s. de préparation et aplatir pour former une galette. Cuire 3–4 min de chaque côté.","Égoutter sur papier absorbant. Servir avec la sauce aux herbes."]},{"title":"Tortilla de patata","subtitle":"L'omelette espagnole classique aux pommes de terre — tapas, sandwich ou repas complet","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["6 œufs","3 pommes de terre","4 brins persil plat","huile d'olive, sel, poivre du moulin"],"steps":["Éplucher les pommes de terre et les couper en fines lamelles. Ciseler le persil.","Verser un fond d'huile dans une poêle. Ajouter les lamelles de pommes de terre, saler et faire frire en les écrasant légèrement 8 à 10 min jusqu'à ce qu'elles soient cuites. Égoutter et garder le reste d'huile dans la poêle.","Battre les œufs dans un saladier, ajouter les pommes de terre et le persil ciselé. Saler, poivrer et mélanger.","Réchauffer l'huile dans la poêle, verser la préparation. Cuire à feu doux 5 min. Retourner l'omelette à l'aide d'une assiette. Cuire encore 3 min. Servir en parts."]},{"title":"Tacos aux légumes rôtis","subtitle":"Tortillas de maïs garnies de légumes rôtis et de mimolette, sauce péruvienne en option","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["½ potimarron (ou 1 grosse patate douce)","160 g tomates cerise","1 poivron rouge","1 gros oignon","8 brins coriandre","4 brins origan","1 c.à.c. graines de cumin","2 c.à.c. graines de coriandre","1 c.à.c. piment en poudre","1 c.à.c. paprika","1 c.à.c. gingembre en poudre","200 g haricots rouges cuits (en conserve)","40 g mimolette râpée","4 tortillas au maïs","2 c.à.s. huile d'olive","sauce péruvienne (facultatif), sel, poivre"],"steps":["Préchauffer le four à 180 °C. Retirer les graines du potimarron et du poivron. Couper leur chair en dés. Éplucher l'oignon et le tailler en dés. Râper la mimolette. Dans un mortier, concasser les épices.","Dans un saladier, mélanger les légumes avec les épices concassées, les feuilles d'origan et l'huile d'olive. Saler et poivrer. Étaler sur une plaque recouverte de papier cuisson. Enfourner 15 minutes.","Couper les tomates cerise en quatre. Rincer et égoutter les haricots rouges. Ajouter aux légumes rôtis et mélanger.","Garnir chaque tortilla du mélange de légumes, couvrir de mimolette râpée. Disposer dans un plat à gratin et passer sous le gril du four pendant 3 minutes.","Garnir de coriandre et servir, éventuellement accompagné de sauce péruvienne."]},{"title":"Gnocchis maison","subtitle":"Jamais meilleurs que faits maison — à servir avec une sauce tomate ou simplement du beurre fondu","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien","famille"],"ingredients":["900 g pommes de terre type bintje","300 g farine","1 œuf","semoule de blé dur","1 feuille de laurier","1 gousse ail","1 c.à.c. sel"],"steps":["Faire cuire les pommes de terre à la vapeur avec l'ail pelé et le laurier pendant 30 minutes. Les éplucher et les passer au presse-purée au-dessus de la farine disposée en puits sur le plan de travail.","Mélanger la farine avec la purée en ajoutant l'œuf et le sel. Amalgamer jusqu'à ce que la pâte soit homogène (ne pas trop travailler).","Prélever des morceaux de la taille d'une pêche et former des boudins de 2 cm de diamètre. Couper régulièrement tous les 3 cm environ.","À l'aide d'une fourchette retournée et avec le pouce, former les gnocchi un par un en faisant rouler le tronçon sur lui-même.","Fariner légèrement à la semoule et réserver sur torchon propre en évitant de les coller.","Plonger dans une casserole d'eau bouillante — ils sont cuits dès qu'ils remontent à la surface. Égoutter aussitôt et servir avec une sauce maison ou du beurre fondu, parmesan et poivre."]},{"title":"Courgettes tikka masala","subtitle":"Curry crémeux aux courgettes et épices entières — aussi délicieux avec carottes ou chou-fleur","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["500 g courgettes vertes et jaunes","1 piment vert","1 petit oignon rouge","1 oignon blanc","1 citron vert","1 boîte tomates concassées (40 cl)","10 cl crème liquide entière","2 gousses ail (ou 1 c.à.s. pâte d'ail)","1 petit morceau gingembre (ou 1 c.à.s. pâte de gingembre)","1 c.à.c. coriandre en poudre","1 c.à.s. garam masala","4 gousses cardamome","2 clous de girofle","2 feuilles de laurier","2 petits piments rouges séchés (facultatif)","3 c.à.s. ghee ou huile végétale","4–5 brins coriandre fraîche","sel"],"steps":["Éplucher l'oignon blanc et l'émincer.","Dans une sauteuse, faire chauffer le ghee ou l'huile et ajouter les épices entières (piments, clous de girofle, cardamome, laurier), la pâte d'ail et de gingembre, l'oignon blanc émincé, le piment vert haché, le garam masala, la coriandre en poudre, 1 c.à.c. rase de sel et 1 petit verre d'eau. Laisser cuire quelques minutes en remuant.","Ajouter la tomate, mélanger et retirer les épices entières. Mixer la sauce. Ajouter les courgettes coupées en morceaux et l'oignon rouge en gros cubes. Couvrir et laisser cuire 15 minutes à feu moyen.","Ajouter la crème liquide et mélanger. Parsemer de coriandre fraîche, arroser de jus de citron vert et servir aussitôt."]},{"title":"Burrito végétarien","subtitle":"Tortillas généreusement garnies de légumes croquants, haricots rouges et guacamole","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["1 poignée haricots verts","1 carotte","80 g chou rouge","1 tomate","1 oignon","1 gousse ail","8 brins coriandre","4 feuilles salade","80 g haricots rouges cuits (en conserve)","4 tortillas","8 cl guacamole","1 filet huile d'olive","sel, poivre du moulin"],"steps":["Équêter les haricots verts et les cuire 8 minutes à la vapeur.","Peler et râper la carotte. Émincer finement le chou rouge. Couper la tomate en lamelles. Peler et émincer finement l'oignon. Dégermer et hacher l'ail. Rincer et égoutter les haricots rouges.","Dans une poêle, faire revenir l'oignon 5 min avec l'huile. Ajouter l'ail et les haricots rouges. Saler, poivrer et poursuivre la cuisson 3 minutes.","Badigeonner les tortillas d'un peu d'eau, les déposer dans une poêle. Couvrir et faire chauffer 2 minutes à feu doux.","Au centre de chaque tortilla, déposer une feuille de salade, les haricots, les légumes, 2 brins de coriandre et du guacamole. Rouler en cylindre, envelopper dans du papier kraft ou film alimentaire et couper en deux avant de déguster."]},{"title":"Curry thaï au tofu","subtitle":"Curry rouge crémeux au lait de coco, légumes croquants et riz gluant à la vapeur","chapter":"V","chapter_name":"Plats principaux","tags":["sans gluten","végétarien"],"ingredients":["200 g riz thaï gluant (trempé 1 nuit)","160 g tofu ferme","1 oignon rouge","1 courgette","5 mini-maïs (ou 4 c.à.s. de maïs cuits)","1 poignée pois mange-tout","1 tige citronnelle","4 feuilles citronnier (ou zeste de citron vert)","quelques brins de basilic thaï","1 c.à.s. pâte de curry rouge","1 c.à.s. sucre semoule","60 cl lait de coco","1 c.à.s. sauce soja","1 c.à.c. huile de coco (ou tournesol)","1½ c.à.c. sel","jus de 1 citron vert"],"steps":["La veille, mettre le riz gluant à tremper dans un grand volume d'eau froide pour la nuit.","Le jour même, rincer et égoutter le riz. Le placer dans une gaze dans le panier d'un cuit-vapeur. Fermer complètement, couvrir et cuire 30 minutes à la vapeur. Laisser reposer 5 minutes.","Égoutter le tofu et le couper en cubes. Éplucher et émincer l'oignon. Couper la courgette en rondelles. Couper les mini-maïs en quatre et les pois mange-tout en deux. Écraser la tige de citronnelle.","Faire chauffer l'huile de coco dans un wok et faire revenir la pâte de curry 1 min à feu vif. Ajouter le tofu, l'oignon, les feuilles de citronnier, la citronnelle, le sucre et le sel. Faire sauter 2–3 minutes.","Verser le lait de coco et la sauce soja. Incorporer la courgette, les mini-maïs et les pois mange-tout. Porter à ébullition puis laisser mijoter 10 minutes à feu doux.","Retirer du feu, ajouter le basilic thaï. Assaisonner de jus de citron vert et servir accompagné du riz gluant."]},{"title":"Chakchouka à la feta","subtitle":"La ratatouille du Maghreb — tomates, poivrons, œufs pochés et feta émiettée","chapter":"V","chapter_name":"Plats principaux","tags":["sans gluten","végétarien"],"ingredients":["4 œufs","700 g tomates","1 oignon","1 poivron rouge","2 gousses ail","4 brins coriandre","120 g feta","1 c.à.c. cumin en poudre","1 c.à.c. paprika","1 pincée piment en poudre","2 c.à.s. huile d'olive","sel, poivre du moulin"],"steps":["Peler et couper les tomates en dés en gardant leur jus. Éplucher et émincer l'oignon. Épépiner le poivron et le couper en lamelles. Hacher l'ail. Émietter la feta.","Faire chauffer l'huile dans une poêle allant au four. Faire revenir l'oignon et le poivron 10 min à feu doux. Ajouter l'ail, le cumin, le paprika et le piment. Cuire encore 5 minutes.","Préchauffer le four à 160 °C.","Ajouter les tomates dans la poêle. Saler, poivrer et cuire 10 minutes.","Répartir la feta et casser les œufs sur la préparation. Enfourner 6 minutes (le blanc doit être cuit). Ciseler la coriandre et parsemer. Servir sans attendre."]},{"title":"Patates douces rôties, sauce chimichurri","subtitle":"Patates douces rôties au four, nappées de yaourt de brebis et sauce chimichurri aux herbes","chapter":"V","chapter_name":"Plats principaux","tags":["sans gluten","végétarien"],"ingredients":["4 patates douces","¼ grenade","4 brins origan","120 g yaourt de brebis","15 cl sauce chimichurri","huile d'olive, sel, poivre du moulin"],"steps":["Préchauffer le four à 180 °C. Couper les patates douces en deux dans la longueur et les déposer sur une plaque recouverte de papier cuisson. Former des croisillons sur la chair avec la pointe d'un couteau, puis badigeonner d'huile d'olive. Effeuillez les brins d'origan et les parsemer sur les patates douces. Saler, poivrer et enfourner pour 1 heure.","Prélever les graines de la grenade.","À la sortie du four, garnir les patates douces de yaourt de brebis et de sauce chimichurri. Décorer de graines de grenade et servir sans attendre."]},{"title":"Omelette chinoise aux champignons noirs","subtitle":"Omelette moelleuse à la fécule, garnie d'une sauce umami aux champignons noirs et gingembre","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["6 œufs","3 g champignons noirs séchés","2 ciboules ou oignons nouveaux","1 gousse ail","3 lamelles gingembre","2 c.à.c. fécule de pomme de terre","4 c.à.s. eau froide","4 c.à.s. huile végétale","2 c.à.s. sauce soja claire","1 c.à.s. pâte de soja fermenté au piment (ou miso + piment)","1 c.à.c. fécule de pomme de terre","4 c.à.s. eau","2 c.à.s. vinaigre de riz foncé","2 c.à.c. sucre semoule"],"steps":["Faire tremper les champignons séchés dans un bol d'eau tiède pendant 30 minutes. Égoutter et couper en petits morceaux.","Peler et hacher l'ail. Hacher le gingembre et les ciboules. Dans un bol, mélanger tous les ingrédients de la sauce.","Réaliser l'omelette : diluer la fécule avec l'eau dans un bol. Dans un saladier, battre les œufs puis verser la fécule délayée. Mélanger vivement.","Faire chauffer 3 c.à.s. d'huile dans un wok à feu vif et cuire les œufs battus en omelette. Débarrasser sur une assiette et réserver au chaud.","Faire chauffer le reste d'huile, faire revenir l'ail, le gingembre et les ciboules. Ajouter les champignons et cuire 1 minute. Verser la sauce bien mélangée et laisser épaissir en remuant doucement.","Garnir l'omelette avec la sauce aux champignons et servir."]},{"title":"Soba aux algues wakamé","subtitle":"Nouilles au sarrasin fraîches et iodées, sauce sésame-soja — prêtes en 30 minutes","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien","rapide"],"ingredients":["350 g nouilles soba séchées (sarrasin)","1 oignon nouveau","½ concombre","6 radis roses","quelques brins de cerfeuil","2 c.à.s. algue wakamé séchée","1 c.à.s. graines de sésame","4 c.à.s. sauce soja","4 c.à.s. jus de citron","4 c.à.s. huile de sésame toasté"],"steps":["Faire cuire les nouilles soba dans un grand volume d'eau bouillante salée environ 5 minutes. Rincer à l'eau froide et égoutter. Déposer dans un saladier.","Réhydrater le wakamé séché dans un bol d'eau froide 10 minutes. Égoutter en pressant bien avec les mains.","Émincer finement l'oignon nouveau. Peler le concombre et le couper en fins bâtonnets. Couper les radis en fins bâtonnets. Ciseler le cerfeuil.","Préparer l'assaisonnement en émulsionnant l'huile de sésame avec la sauce soja et le jus de citron.","Dans le saladier, mélanger les soba, le wakamé, l'oignon nouveau, le concombre et le radis. Arroser de sauce, parsemer de graines de sésame et de cerfeuil."]},{"title":"Confiture de poires (presque) sans sucre","subtitle":"Prête en 5 min, épaissie au chia, légère et parfumée au gingembre","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien","rapide"],"ingredients":["600 g poires bien mûres","2 c.à.s. graines de chia","1–2 c.à.s. sirop d'agave","1 c.à.c. jus de citron","½ c.à.c. pulpe de gingembre frais","2 pincées extrait de vanille en poudre"],"steps":["Éplucher les poires, couper en morceaux. Cuire avec agave, citron, gingembre et vanille 5 min à feu moyen.","Mixer selon le résultat souhaité. Ajouter le chia, mélanger, verser dans un pot.","Laisser refroidir en mélangeant de temps en temps. Réfrigérer et consommer sous 5 jours."]},{"title":"Clémentine curd sans œufs","subtitle":"Curd 100% végétal à la clémentine entière et à la purée d'amande","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien","rapide"],"ingredients":["30 g graines de chia","2 grosses clémentines (ou 3 petites)","30 g purée d'amande blanche","1,5 c.à.s. sirop d'agave"],"steps":["Mélanger le chia avec 90 ml d'eau. Laisser prendre 15 min.","Peler les clémentines en retirant la pellicule blanche. Ouvrir les quartiers, ôter pépins et filaments.","Mixer longuement avec le gel de chia, la purée d'amande et le sirop d'agave. Réfrigérer."]},{"title":"Cookies américains noisette et chocolat","subtitle":"Fondants dedans, croustillants dehors — sans œufs ni beurre, liés au chia","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien"],"ingredients":["1 c.à.s. graines de chia (bombée)","100 g farine de riz complet","50 g farine de teff (ou sarrasin)","70 g sucre intégral","60 g purée de noisette","40 ml huile d'olive + lait d'amande","60 g chocolat noir (pépites)"],"steps":["Préchauffer à 200°C. Moudre le chia, mélanger avec 40 ml d'eau, laisser reposer 10 min.","Mélanger farines, sucre et sel. Ajouter purée de noisette, huile, lait d'amande et gel de chia. Incorporer le chocolat.","Former des galettes, disposer sur plaque sulfurisée. Cuire 12 min. Laisser tiédir avant de déguster."]},{"title":"Framboises à la verveine","subtitle":"Framboises marinées dans un sirop léger à la vanille et à la verveine","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien"],"ingredients":["500 g framboises","50 cl eau","100 g sucre roux","2 gousses de vanille fendues","1 bâton de cannelle","1 poignée feuilles de verveine","½ citron (jus)"],"steps":["Porter à ébullition l'eau, le sucre, la vanille et la cannelle. Arrêter après 5 min, jeter la verveine. Infuser 5 min. Laisser refroidir.","Réfrigérer 1 h. Retirer la vanille, la cannelle et la verveine. Filtrer le sirop.","Ajouter les framboises au sirop, remettre 1 h au réfrigérateur. Ajouter le jus de citron au service. Répartir dans des coupelles."]},{"title":"Carpaccio de pommes au chèvre","subtitle":"Lamelles de pomme rouge, chèvre frais, pignons grillés et miel tiède","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien"],"ingredients":["5 pommes rouges","2 fromages de chèvre frais","100 g pignons de pin","10 c.à.s. miel liquide","2 citrons (jus)"],"steps":["Couper les pommes en fines lamelles (avec la peau). Arroser de jus de citron pour éviter le noircissement.","Faire griller les pignons dans une poêle antiadhésive sans cesser de remuer. Couper le chèvre en tranches fines.","Dresser pommes et chèvre dans les assiettes. Chauffer le miel à feu doux et verser. Parsemer de pignons. Servir aussitôt."]},{"title":"Variations autour du tapioca (mangue-coco, matcha, azuki)","subtitle":"Trois recettes : crème mangue-coco, boisson matcha-soja et dessert azuki","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien"],"ingredients":["4 c.à.s. tapioca","60 cl lait de coco","1 sachet sucre vanillé","2 c.à.s. sucre semoule","½ mangue","noix de coco en poudre","3 c.à.s. tapioca","80 cl lait de soja","3 c.à.c. thé matcha dilué dans 1 c.à.s. lait de soja","4 c.à.s. sucre semoule","3 c.à.s. tapioca","60 cl lait de coco","4 c.à.s. anko (purée haricots azuki ou confiture châtaigne)","2 c.à.s. sucre semoule"],"steps":["Porter le lait de coco à ébullition avec le sucre semoule et le sucre vanillé. Ajouter le tapioca et cuire 10 minutes en remuant régulièrement. Répartir dans 4 verrines. Réfrigérer 1 heure.","Avant de servir, peler la mangue, la couper en dés. Garnir les crèmes de mangue et de noix de coco en poudre.","Portez à ébullition le lait de soja et le sucre. Ajouter le tapioca et cuire 10 min en remuant. Hors du feu, incorporer le matcha dilué.","Répartir dans 4 verres. Déguster chaud ou froid.","Procéder comme pour la boisson au matcha, en remplaçant le lait de soja par le lait de coco et le matcha dilué par l'anko."]},{"title":"Tartelettes citron-matcha","subtitle":"Pâte sablée au matcha, crème au citron et meringue — à préparer en partie la veille","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["végétarien","famille"],"ingredients":["1 c.à.s. thé matcha","1 jaune d'œuf","125 g farine demi-complète T80","60 g beurre mou","50 g sucre semoule","1 pincée sel","3 œufs","jus de 2 citrons","1 c.à.s. fécule de maïs","80 g sucre semoule","1 c.à.c. thé matcha","2 blancs d'œufs","1 pincée levure chimique","60 g sucre glace"],"steps":["Préparer la pâte sablée : couper le beurre en petits dés. Dans un robot, mélanger farine, sucre, matcha et sel. Ajouter le beurre et mélanger à vitesse moyenne jusqu'à obtenir un mélange sableux. Incorporer le jaune d'œuf. Former une boule (ni collante ni trop sèche).","Préchauffer le four à 180 °C. Abaisser la pâte entre deux feuilles de papier cuisson. Foncer des moules à tartelettes. Retirer le papier, piquer la pâte. Enfourner 8–10 minutes.","Préparer la crème au citron : dans une casserole, mettre jus de citron, sucre, œufs et fécule. Fouetter pour obtenir un mélange mousseux. Chauffer à feu doux en remuant jusqu'à ce que le mélange épaississe. Étaler sur les fonds refroidis.","Meringue : mélanger sucre glace, matcha et levure. Fouetter les blancs d'œufs à vitesse lente. Quand ils blanchissent, ajouter la moitié du mélange sucre. Augmenter la vitesse et incorporer le reste. Arrêter quand les blancs sont en neige ferme.","À l'aide d'une poche à douille, garnir les tartelettes de meringue. Faire dorer au chalumeau ou sous le gril. Réserver au réfrigérateur au moins 1 heure avant de déguster."]},{"title":"Smoothie de mangue au pomélo","subtitle":"Crème de mangue onctueuse, perles de sagou translucides et suprêmes de pomélo","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien"],"ingredients":["1 grosse mangue","½ pomélo rose","35 g perles de sagou (tapioca)","5 cl lait de coco","zeste râpé de 1 citron vert","25 cl eau de source","50 g sucre semoule ou 60 g miel liquide"],"steps":["Peler la mangue et la couper en morceaux. Réserver 8 petits morceaux pour la déco. Dans un robot, mixer la mangue avec le sucre, le lait de coco et l'eau jusqu'à consistance lisse. Réserver.","Porter 1 litre d'eau à ébullition et cuire les perles de sagou 15 minutes. Laisser reposer 5 min dans l'eau bouillante — elles doivent être translucides. Rincer à l'eau froide.","Peler le pomélo à vif et prélever les suprêmes.","Ajouter les perles de sagou et la moitié des suprêmes dans la crème de mangue. Mélanger et répartir dans 4 coupelles.","Tailler les petits morceaux de mangue réservés en brunoise. Déposer le reste des suprêmes de pomélo, la brunoise de mangue et le zeste de citron vert. Réfrigérer 1 heure avant de déguster."]},{"title":"Panna cotta à la vanille","subtitle":"Crème cuite légère sans œufs, à l'agar-agar — à accompagner d'un coulis de fruits de saison","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien","famille"],"ingredients":["50 cl crème fleurette (sans additifs, non allégée)","1 gousse de vanille (ou ½ c.à.c. vanille en poudre)","1 c.à.c. rase agar-agar","50 g sucre blanc ou de canne"],"steps":["Verser la crème dans une casserole. Incorporer la gousse de vanille fendue et grattée (avec ses graines) et porter à ébullition à feu moyen en remuant régulièrement au fouet. Quand elle commence à chauffer, ajouter le sucre et remuer. À frémissement, verser l'agar-agar et fouetter jusqu'à ébullition. Éteindre et laisser refroidir quelques minutes en remuant.","Retirer la gousse de vanille et répartir la crème dans des verres ou des petits ramequins.","Laisser prendre à température ambiante puis placer au réfrigérateur au minimum 1 heure.","Pour le coulis : mixer des fruits bien mûrs avec du jus de citron et 1 c.à.s. de sucre. Passer au chinois pour enlever les graines."]},{"title":"Sorbet à la mangue","subtitle":"Sorbet 2 ingrédients — mangue mixée et sirop de sucre — intense et rafraîchissant","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien","famille"],"ingredients":["500 g mangue coupée en morceaux","1 citron vert (jus)","130 g sucre blond ou cassonade","130 ml eau minérale"],"steps":["Mixer la chair de mangue avec le jus de citron vert. Passer au chinois ou dans une passoire.","Dans une casserole, verser le sucre et l'eau. Porter à ébullition jusqu'à dissolution du sucre. Retirer du feu et verser le sirop sur la mangue.","Placer le mélange au frais pour qu'il refroidisse.","Verser dans la sorbetière et turbiner environ 50 minutes. Sans sorbetière, verser dans un bac ou un moule à cake chemisé et entreposer une nuit au congélateur."]},{"title":"Dessert à la banane – Chè chuối","subtitle":"Bananes plantain pochées dans le lait de coco à la vanille, perles de tapioca et cacahuètes grillées","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien"],"ingredients":["4 bananes plantain bien mûres","4 c.à.s. perles de tapioca","40 cl lait de coco","4 c.à.s. cacahuètes grillées salées","1 gousse de vanille","2 c.à.s. graines de sésame blanc","5 c.à.s. sucre de canne"],"steps":["La veille, faire tremper les perles de tapioca dans un bol d'eau froide.","Le jour même, égoutter les perles de tapioca et les plonger dans une grande casserole d'eau froide. Porter à ébullition en remuant, baisser le feu et cuire 10 minutes. Égoutter et les déposer dans un bol d'eau froide.","Peler les bananes et les couper en rondelles. Dans une casserole, faire bouillir le lait de coco avec 20 cl d'eau. Ajouter les bananes, le sucre et la gousse de vanille fendue et grattée. Cuire 10 minutes. Éteindre et laisser refroidir.","Égoutter les perles de tapioca et les mélanger aux bananes. Servir parsemé de graines de sésame et de cacahuètes grillées concassées."]},{"title":"Glace tiramisu sans sorbetière","subtitle":"Crème mascarpone-chantilly à l'amaretto, biscuits spéculoos au café — sans sorbetière","chapter":"VI","chapter_name":"Desserts & douceurs","tags":[],"ingredients":["250 g mascarpone","600 g crème fraîche liquide 30–35% MG, très froide","400 g lait concentré sucré","6–8 c.à.s. amaretto","125 g spéculoos","1–2 expressos très serrés et chauds"],"steps":["Battre le mascarpone au fouet électrique pour le détendre. Ajouter la crème très froide et battre jusqu'à obtenir une chantilly aérienne (pas trop ferme).","Ajouter le lait concentré et battre jusqu'à incorporation. Ajouter 5 c.à.s. d'amaretto, goûter : le goût de lait concentré doit disparaître. Continuer jusqu'à 6–8 c.à.s. selon l'amaretto.","Verser dans un moule (silicone idéalement) jusqu'aux 2/3 de hauteur.","Tremper très rapidement (pas les imbiber !) les spéculoos dans le café et les disposer uniformément sur la crème. Les biscuits ne doivent pas toucher les bords.","Recouvrir du reste de l'appareil, poser une 2e couche de biscuits trempés, puis niveler avec une spatule.","Protéger d'un film alimentaire et placer au congélateur.","1 heure avant de déguster, sortir du congélateur, démouler et placer au réfrigérateur. Décorer de chocolat en poudre ou de spéculoos écrasés."]},{"title":"Tarte rhubarbe et fraises très simple","subtitle":"Galette rustique à la pâte sablée aux amandes, rhubarbe marinée et fraises fraîches","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["végétarien","famille"],"ingredients":["200 g farine","150 g beurre (température ambiante)","70 g sucre","1 pincée sel","1 œuf entier","30 g poudre d'amandes","3–5 tiges rhubarbe","1–2 poignées fraises","30 g poudre d'amandes (pour la garniture)","5–7 c.à.s. sucre blanc (pour mariner)","3–5 c.à.s. sucre de canne"],"steps":["La veille si possible : couper la rhubarbe en tronçons de 2–3 cm, mélanger avec 5–7 c.à.s. de sucre blanc et laisser reposer au frais. Égoutter avant utilisation (conserver le jus).","Pâte : battre le beurre, ajouter sucre et poudre d'amandes, puis l'œuf. Incorporer la farine jusqu'à consistance sableuse sans trop travailler. Envelopper et réfrigérer 20 min.","Étaler la pâte entre deux feuilles de papier sulfurisé. Retirer la feuille du dessus.","Verser 30 g de poudre d'amandes sur la pâte. Déposer les tronçons de rhubarbe. Rabattre les bords de la pâte sur la garniture à l'aide du papier sulfurisé. Saupoudrer de sucre de canne.","Enfourner à 180 °C (fonction pizza ou chaleur tournante) pendant 30 min.","Ajouter les ¾ des fraises coupées sur la tarte. Remettre au four 10 min jusqu'à ce que les bords soient bien dorés.","Avant de servir, décorer avec les fraises fraîches restantes. Optionnel : réduire le jus de rhubarbe en sirop et lustrer la tarte au pinceau."]},{"title":"Mousse à la crème de marrons sans œuf","subtitle":"Mousse légère mascarpone-chantilly à la crème de marrons — en 10 minutes","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["végétarien","rapide"],"ingredients":["100 g crème fleurette (ou crème liquide 30% MG) très froide","100 g mascarpone","150 g crème de marrons","quelques meringues pour décorer"],"steps":["Verser le mascarpone dans un grand bol et le fouetter pour le détendre.","Ajouter la crème fraîche froide et monter en chantilly jusqu'à la consistance souhaitée (texture \"mousse à raser\").","Ajouter la crème de marrons. Mélanger délicatement à la spatule — 2 ou 3 coups de fouet suffisent, ne pas trop insister pour garder la texture.","Verser dans des verrines ou un plat de service (la poche à douille est très pratique). Décorer de meringues et/ou de cacao. Servir immédiatement ou réserver au frais."]},{"title":"Salade de pamplemousse et verveine infusée","subtitle":"Quartiers de pamplemousse nappés d'une gelée légère à la verveine citronnée","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["végétarien"],"ingredients":["4 pamplemousses (1 par personne)","300 g eau","100 g sucre","1 feuille gélatine (2 g)","5–8 feuilles verveine citronnée (sèche ou fraîche)"],"steps":["Faire tremper la gélatine dans de l'eau froide. Porter l'eau et le sucre à ébullition dans une casserole.","Hors du feu, ajouter la verveine et infuser 5 minutes. Ne pas dépasser pour éviter l'amertume. Goûter et ajuster si nécessaire (ajouter de nouvelles feuilles et refaire bouillir).","Essorer la gélatine et l'incorporer à l'infusion chaude jusqu'à dissolution complète.","Peler les pamplemousses à vif (retirer la peau et la partie blanche amère). Prélever les quartiers et les disposer dans des verrines ou des assiettes creuses.","Verser la gelée de verveine sur les quartiers. Réfrigérer au moins 6 heures avant de déguster."]},{"title":"Salade d'oranges au caramel léger épicé","subtitle":"Tranches d'oranges pelées à vif, nappées d'un caramel épicé à la cannelle ou cardamome","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien","rapide"],"ingredients":["5–6 oranges","50 g sucre","1 c.à.s. épices au choix (pain d'épices, spéculoos, cannelle, cardamome…)","un peu d'eau chaude"],"steps":["Peler les oranges à vif en enlevant bien la peau et la partie blanche amère. Tailler en tranches et disposer dans un plat ou des coupes individuelles.","Faire un caramel à sec : verser ⅓ du sucre dans une grande casserole et chauffer. Quand il commence à blondir, ajouter le 2e tiers, puis le dernier.","Quand le caramel est blond-ambré (pas trop foncé pour éviter l'amertume), ajouter les épices puis de l'eau bouillante très lentement (attention aux projections). Mélanger.","Laisser refroidir la sauce (elle peut être tiède mais pas bouillante). La verser sur les oranges. Ajouter le jus récupéré lors de la découpe.","Réfrigérer quelques heures pour que les arômes se diffusent. Déguster bien frais."]},{"title":"Les CCC – Cookies Coco Chocolat(s)","subtitle":"Biscuits moelleux à l'huile de coco, flocons d'avoine, pépites de chocolat blanc et noix de coco","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["végétarien","famille"],"ingredients":["80 g beurre demi-sel pommade","30 g huile de coco","80 g cassonade","50 g sucre en poudre","1 œuf","130 g farine","1 c.à.c. levure chimique","60 g flocons d'avoine","25 g noix de coco en copeaux non sucrés (ou râpée)","50 g pépites de chocolat blanc","100 g chocolat noir (optionnel)"],"steps":["Mélanger le beurre pommade, l'huile de coco, la cassonade et le sucre.","Ajouter l'œuf et mélanger jusqu'à homogénéité.","Incorporer la farine, la levure, la noix de coco et les flocons d'avoine en mélangeant à peine (juste assez pour homogénéiser). Ajouter les pépites de chocolat blanc.","Former des petits tas sur papier sulfurisé et les aplatir en disques avec le dos d'une cuiller.","Enfourner à 160 °C pendant 15 min environ. Les biscuits doivent être à peine dorés à la sortie du four.","Optionnel : une fois froids, faire fondre le chocolat noir et tremper la moitié de chaque cookie. Réserver sur grille jusqu'à refroidissement complet."]},{"title":"Caramel au beurre salé de ma maman","subtitle":"La recette familiale infaillible — sucre cuit, crème chaude et beurre demi-sel","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["végétarien"],"ingredients":["160 g sucre en poudre","80 g beurre demi-sel","20 cl crème fraîche liquide","fleur de sel"],"steps":["Verser ⅓ du sucre dans une grande casserole. Chauffer à feu assez vif (induction) ou moyen-fort (gaz).","Quand le sucre commence à blondir sur les côtés, ajouter le 2e tiers. Même chose avec le dernier tiers.","Pendant la cuisson du caramel, faire chauffer la crème (micro-ondes ou casserole) jusqu'au bord de l'ébullition.","Quand le caramel est ambré (couleur au choix), ajouter la crème chaude LENTEMENT et avec précaution (risque de projection). Mélanger à la cuiller en bois.","Si le caramel cristallise, continuer à chauffer jusqu'à ce qu'il redevienne liquide.","Ajouter le beurre coupé en dés et mélanger. Ajuster la fleur de sel selon le goût.","Verser dans un bocal en verre propre et conserver au frais."]},{"title":"Pavlova individuelle aux fraises","subtitle":"Meringues craquantes pochées à la douille, chantilly légère et fraises fraîches — 6 pavlova individuelles","chapter":"VI","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien","famille"],"ingredients":["100 g blancs d'œufs précisément (≈ 4 œufs)","55 g sucre en poudre","55 g sucre glace","150 g crème fraîche liquide 30% MG min., très froide","optionnel : vanille en poudre, zestes de citron vert ou basilic","fraises, autant que vous voulez !"],"steps":["Battre les blancs à PETITE vitesse. Quand ils moussent et blanchissent, ajouter ½ du sucre en poudre et continuer à petite vitesse.","Quand le sucre est absorbé, ajouter l'autre moitié. Battre à vitesse moyenne 2–3 min.","Ajouter le sucre glace et battre à vitesse moyenne environ 10 min, puis à grande vitesse 1–2 min.","Sur une feuille de papier sulfurisé, tracer 6 cercles de 8 cm (emporte-pièce ou bouteille). Retourner le papier. Pocher la meringue en 2 tours au pourtour, 1 seul au centre.","Cuire à 110 °C pendant 1h30 à 2h. Éteindre le four et laisser les meringues à l'intérieur sans ouvrir, idéalement toute une nuit.","Optionnel : infuser la crème avec vanille, citron vert ou basilic, puis refroidir. Battre la crème froide en chantilly moelleuse (pas trop ferme).","Au moment de servir : pocher la chantilly sur les meringues. Déposer les fraises coupées en quartiers. Servir aussitôt."]},{"title":"Ginger Beer – version allégée en sucre","subtitle":"Boisson pétillante maison au gingembre fermenté, légèrement citronnée","chapter":"VII","chapter_name":"Boissons & sauces","tags":["famille","rapide"],"ingredients":["75 g gingembre frais","50 g sucre","½ jus de citron jaune (ou 1 jus de citron vert)","½ c.à.c. levure de boulanger sèche (2 g env.)","1 litre eau","1 bouteille en plastique"],"steps":["Éplucher le gingembre (ou bien laver s'il est bio) et l'émincer finement ou le râper.","Mettre dans la bouteille. Ajouter la levure, le sucre, le jus de citron puis 1 litre d'eau (utiliser un entonnoir). Fermer et secouer.","Faire fermenter à température ambiante en ouvrant de temps en temps pour dégazer. Environ 10 h à 30 °C, 24 h s'il fait plus frais. La ginger beer est prête quand elle est légèrement pétillante.","Filtrer dans une carafe à l'aide d'une petite passoire. Placer au réfrigérateur et consommer bien frais."]},{"title":"Jus de pastèque, menthe et basilic","subtitle":"Boisson ultra fraîche et colorée, parfaite pour l'été","chapter":"VII","chapter_name":"Boissons & sauces","tags":["végétarien","famille","rapide"],"ingredients":["750 g chair de pastèque sans peau ni pépins","1 litre eau","5 c.à.c. sucre en poudre (à ajuster)","15 feuilles basilic","15 feuilles menthe","glaçons à volonté"],"steps":["Mixer la chair de pastèque avec le sucre et environ ½ litre d'eau.","Verser dans une carafe en filtrant à travers une passoire pour éviter le dépôt. Compléter avec le reste de l'eau. Placer au frais.","Juste avant de servir, piler ou froisser les feuilles de basilic et de menthe pour libérer leurs arômes. Déposer dans les verres.","Verser le jus de pastèque et ajouter généreusement des glaçons."]},{"title":"Cocktail gingembre et épices sans alcool","subtitle":"Infusion citronnelle-kaffir-cannelle fraîche, servie avec beaucoup de glaçons","chapter":"VII","chapter_name":"Boissons & sauces","tags":["végétarien","rapide"],"ingredients":["2 cm gingembre frais","1 tige citronnelle","1 feuille de kaffir lime","½ c.à.c. cannelle","2 petits citrons verts (ou 1 gros)","2 c.à.s. sucre roux","½ litre eau"],"steps":["Faire bouillir l'eau. Écraser la citronnelle avec un couteau (pour libérer les arômes), retirer la couche extérieure et couper en gros tronçons. Éplucher et émincer finement le gingembre. Froisser la feuille de kaffir.","Hors du feu, faire infuser la citronnelle, le gingembre et le kaffir dans l'eau chaude. Ajouter la cannelle et le sucre, mélanger.","Laisser infuser au moins 10 minutes (ou quelques heures pour plus d'arômes). Passer à la passoire.","Presser les citrons verts dans une carafe. Ajouter l'infusion, goûter et rectifier (sucre ou citron). Servir avec beaucoup de glaçons !"]},{"title":"Chia fresca","subtitle":"La limonade traditionnelle mexicaine aux graines de chia","chapter":"VII","chapter_name":"Boissons & sauces","tags":["sans gluten","végétarien","rapide"],"ingredients":["10 g graines de chia","30 ml jus de citron (½ citron)","1 c.à.c. sirop d'agave","250 ml eau fraîche","2 glaçons"],"steps":["Faire tremper le chia dans 250 ml d'eau fraîche pendant 5 min en remuant régulièrement.","Ajouter le citron et l'agave. Agiter vivement. Attendre encore 10 min en remuant. Ajouter les glaçons et déguster."]},{"title":"Supergreen smoothie","subtitle":"Kiwi, épinards et eau de coco liés par le chia — onctueux et revitalisant","chapter":"VII","chapter_name":"Boissons & sauces","tags":["sans gluten","végétarien","rapide"],"ingredients":["1 c.à.s. graines de chia (rase)","200 ml eau de coco","2 kiwis bien mûrs","1 poignée pousses d'épinards","1–2 c.à.c. spiruline (facultatif)"],"steps":["Mélanger le chia avec 40 ml d'eau de coco, attendre 5 min.","Mixer longuement avec le reste de l'eau de coco, les kiwis, les épinards et la spiruline. Servir frais."]},{"title":"Pisco sour","subtitle":"Le cocktail national péruvien — pisco, citron vert et blanc d'œuf","chapter":"VII","chapter_name":"Boissons & sauces","tags":["sans gluten","rapide"],"ingredients":["7 cl pisco","5 cl jus de citron vert","3 cl sirop de sucre de canne","1 blanc d'œuf","4 glaçons","quelques gouttes angostura bitter"],"steps":["Verser tous les ingrédients dans un shaker. Shaker très fort pendant 1 minute.","Servir dans un verre préalablement refroidi. Ajouter 3–4 gouttes d'angostura bitter en finition."]},{"title":"Huile d'ail confit","subtitle":"Ail confit au four à 120°, infusé dans l'huile d'olive — indispensable en cuisine","chapter":"VII","chapter_name":"Boissons & sauces","tags":["sans gluten","végétarien"],"ingredients":["1 tête ail","huile d'olive","grains de poivre de Séchuan ou baies roses","sel"],"steps":["Laver l'ail entier. Couper le dessus de la tête (environ 1/5ème).","Déposer sur une feuille d'aluminium d'environ 20 cm. Saler et poivrer légèrement. Fermer hermétiquement.","Cuire à 120 °C pendant 40 min, ou jusqu'à ce que les gousses soient tendres et légèrement caramélisées. Laisser refroidir.","Déposer la tête d'ail froide dans un bocal propre. Ajouter les grains de poivre si souhaité.","Recouvrir d'huile d'olive. Fermer le bocal. Faire infuser dans un endroit sombre à température ambiante.","Déguster deux semaines plus tard — et bien plus encore !"]},{"title":"Sauce crudités pour l'apéro","subtitle":"Chantilly de crème à la moutarde à l'estragon — prête en 5 minutes, irrésistible","chapter":"VII","chapter_name":"Boissons & sauces","tags":["sans gluten","végétarien","famille","rapide"],"ingredients":["150 g crème liquide min. 30% MG, très froide","15 g moutarde aromatisée (estragon ou piment d'Espelette)","sel"],"steps":["Verser la crème dans un grand bol. Ajouter la moutarde et un peu de sel.","Monter en chantilly jusqu'à la consistance souhaitée (moelleuse, pas trop ferme).","C'est prêt ! Servir avec des crudités : carottes, concombre, chou-fleur, radis…"]},{"title":"Lèche de tigre","subtitle":"La marinade fondatrice de tous les ceviches péruviens","chapter":"VII","chapter_name":"Boissons & sauces","tags":["poisson","sans gluten"],"ingredients":["10 citrons verts (jus)","1 gousse d'ail","2 cm gingembre","purée de piments rocoto ou aji limo","½ c.à.c. sel fin","1 pincée poivre noir"],"steps":["Presser les citrons verts. Ajouter l'ail et le gingembre finement coupés.","Ajouter sel, poivre et purée de piments. Filtrer avec un chinois si désiré.","Ajouter le poisson ou du fumet de poisson. Laisser mariner environ 30 min."]},{"title":"Vinaigrette sans huile aux agrumes","subtitle":"Le gel de chia remplace l'huile comme émulsifiant — légère et acidulée","chapter":"VII","chapter_name":"Boissons & sauces","tags":["sans gluten","végétarien","rapide"],"ingredients":["1 petite c.à.c. gel de chia","½ orange jus d'orange","1 c.à.c. jus de citron","½ c.à.c. sirop d'agave","½ c.à.c. vinaigre de cidre","1 pincée sel"],"steps":["Mixer longuement tous les ingrédients jusqu'à obtenir une sauce bien homogène.","Conserver au réfrigérateur et consommer dans les 48 heures. Préférer les graines blanches pour l'esthétique."]},{"title":"Tapenades & pesto","subtitle":"Trois sauces fraîches : caviar d'aubergine au zaatar, pesto de basilic et salsa mexicaine","chapter":"VII","chapter_name":"Boissons & sauces","tags":["sans gluten","végétarien","rapide"],"ingredients":["1 aubergine coupée en deux","1 gousse ail râpée","½ citron zeste et jus","1 c.à.c. zaatar","2 c.à.s. huile d'olive","graines de grenade (facultatif)","1 bouquet basilic frais","5 cl huile d'olive","1 gousse ail","15 g pignons de pin","50 g parmesan râpé","sel, poivre du moulin","2 tomates","½ oignon rouge","½ piment vert jalapeño","1 gousse ail râpée","8 brins coriandre","1 citron vert (jus)","2 c.à.s. huile d'olive"],"steps":["Préchauffer le four à 180°C. Mélanger le zaatar avec ½ c.à.s. d'huile. Badigeonner les demi-aubergines (côté peau sur le dessus). Enfourner 20 min.","Récupérer la pulpe. La déposer dans un bol avec tous les autres ingrédients. Écraser à la fourchette et mélanger.","Laisser reposer au réfrigérateur au moins 1 heure. Décorer de graines de grenade avant de servir.","Effeuiller le basilic. Passer l'ensemble des ingrédients au mixeur jusqu'à obtenir une texture lisse.","Se conserve environ 3 jours au réfrigérateur (filmer au contact pour éviter l'oxydation).","Couper les tomates en petits dés. Émincer finement l'oignon rouge. Retirer les graines du piment, hacher la chair. Ciseler la coriandre.","Mélanger tous les ingrédients dans un bol. Laisser reposer au réfrigérateur au moins 1 heure avant de déguster."]},{"title":"Sauces italiennes (tomate fraîche, citron)","subtitle":"Deux classiques : sauce tomate fraîche et sauce au citron pour pâtes","chapter":"VII","chapter_name":"Boissons & sauces","tags":["végétarien","rapide"],"ingredients":["4 tomates mûres (variétés anciennes ou roma)","1 gousse ail","fleurs de fenouil, basilic (facultatif)","2 c.à.s. huile d'olive","1 c.à.c. gros sel","poivre noir de Sarawak","2 citrons (idéalement côte amalfitaine ou Sicile)","3 petits oignons nouveaux","quelques brins de persil plat","1 c.à.s. huile d'olive","gros sel, poivre noir"],"steps":["Retirer le cœur des tomates, tracer une croix sur le dessous. Plonger dans l'eau de cuisson des pâtes bouillante, égoutter et peler.","Dans une casserole, chauffer l'huile à feu moyen. Ajouter l'ail entier ou haché, surveiller qu'il ne brûle pas.","Ajouter les tomates coupées ou écrasées, le gros sel. Couvrir et laisser mijoter à feu doux le temps des pâtes.","Au service, ajouter un filet d'huile d'olive et le basilic si souhaité.","Prélever le zeste d'1 citron. Couper en tranches fines puis en quartiers. Presser l'autre citron.","Émincer finement les oignons. Hacher le persil.","Faire revenir les oignons 2–3 min dans l'huile. Ajouter sel, poivre et la pulpe de citron. Incorporer le persil.","Quand les pâtes sont cuites al dente, ajouter le jus et le zeste de citron dans la sauce. Servir sans attendre."]},{"title":"Sauces japonaises (goma daré, miso, ponzu, yakitori…)","subtitle":"Huit sauces fondamentales : goma daré, miso, ponzu, yakitori, tonkatsu, teriyaki, tsuyu et ume","chapter":"VII","chapter_name":"Boissons & sauces","tags":["végétarien"],"ingredients":["120 g purée de sésame (tahin)","12 cl bouillon de légumes ou lait de soja","2 c.à.s. vinaigre de riz","4 c.à.s. sauce soja","30 g miso","2 c.à.s. bouillon de légumes ou eau","1 c.à.s. mirin","1 c.à.s. purée de sésame (tahin)","1 shiitaké séché","5 cm kombu séché","4 c.à.s. jus de citron","4 c.à.s. jus de mandarine","4 c.à.s. mirin","12 cl sauce soja","12 cl saké","5 c.à.s. mirin","15 cl sauce soja","3 c.à.s. sucre semoule","4 c.à.s. compote de pommes","1 c.à.s. gingembre frais râpé","1 gousse ail râpée","4 c.à.s. mirin","4 c.à.s. concentré de tomates","1 c.à.s. vinaigre de riz","2 c.à.s. sauce soja","4 c.à.s. sucre semoule","20 cl sauce soja","15 cl mirin","4 c.à.s. sucre semoule","1 shiitaké séché","5 cm kombu séché","6 c.à.s. mirin","6 c.à.s. sauce soja","20 cl eau","2 c.à.s. purée de umeboshi","2 c.à.s. saké","2 c.à.s. mirin"],"steps":["Délayer la purée de sésame dans ¼ du bouillon. Verser le reste petit à petit en remuant comme pour une mayonnaise.","Ajouter sauce soja et vinaigre. Mélanger jusqu'à consistance onctueuse. Se conserve 2 semaines.","Mélanger tous les ingrédients dans un bol. Filtrer. Se conserve 2 semaines.","La veille : déposer le shiitaké et le kombu dans un bocal, recouvrir de sauce soja. Infuser une nuit au réfrigérateur.","Filtrer la sauce, ajouter le reste des ingrédients. Se conserve 2 semaines.","Déposer tous les ingrédients dans une casserole. Porter à ébullition en remuant.","Laisser mijoter 15 min à feu doux jusqu'à consistance sirupeuse. Se conserve 1 semaine.","Porter tous les ingrédients à ébullition en remuant. Laisser mijoter 5 min à feu doux. Se conserve 2 semaines.","Porter à ébullition. Baisser le feu et réduire 5 min en remuant. Se conserve 2 semaines.","Chauffer tous les ingrédients jusqu'à ébullition. Arrêter le feu, laisser refroidir.","Filtrer. Se conserve 1 semaine.","Mélanger tous les ingrédients. Se conserve 3 semaines."]},{"title":"Condiments du monde (kimchi, dukkah, tfaya, zaatar)","subtitle":"Kimchi coréen, dukkah égyptien, tfaya marocain et zaatar du Levant","chapter":"VII","chapter_name":"Boissons & sauces","tags":["végétarien"],"ingredients":["½ chou chinois","3 gousses ail râpées","1 c.à.s. gingembre frais râpé","1 c.à.c. sucre semoule","3 c.à.s. purée de piment","2 c.à.s. sel","3 c.à.s. amandes","3 c.à.s. noisettes","2 c.à.s. graines de sésame","1 c.à.c. graines de coriandre","½ c.à.c. graines de cumin","½ c.à.c. sel","1 pincée poivre","5 oignons","1 bâton cannelle","½ c.à.c. curcuma","½ c.à.c. gingembre en poudre","3 c.à.s. raisins secs","2 c.à.s. sucre semoule","huile d'olive, sel, poivre","4 c.à.s. thym séché","1 c.à.s. sumac (ou ½ c.à.s. zeste de citron)","1 c.à.s. graines de sésame","1 pincée sel"],"steps":["Émincer le chou, mélanger avec le sel. Couvrir d'eau et macérer 12 h.","Égoutter, rincer et presser pour enlever l'eau.","Mélanger avec le reste des ingrédients. Transvasez dans un bocal, laisser 24 h puis réfrigérer une nuit. Se conserve 3 semaines.","Torréfier amandes et noisettes à sec jusqu'à belle couleur dorée.","Concasser les graines de coriandre et cumin au mortier.","Mixer l'ensemble. Se conserve 3 semaines.","Émincer les oignons. Faire revenir dans l'huile avec cannelle, curcuma, gingembre, sel et poivre jusqu'à fondants.","Ajouter les raisins secs, poursuivre quelques minutes.","Saupoudrer de sucre et cuire 3 min sans cesser de remuer jusqu'à caramélisation. Se conserve 2 semaines.","Mélanger l'ensemble des ingrédients. Se conserve environ 3 mois."]},{"title":"Chutneys (mangue, menthe, coco, coriandre, cajou, tomate)","subtitle":"Six chutneys : mangue, menthe, noix de coco, coriandre, cajou et tomate","chapter":"VII","chapter_name":"Boissons & sauces","tags":["végétarien"],"ingredients":["1 grosse mangue","1 gousse ail râpée","1 c.à.c. gingembre frais râpé","1 petit piment rouge","2 graines de cardamome","½ c.à.c. graines de coriandre","1 bâton cannelle","100 g sucre semoule","10 cl vinaigre de vin","1 belle botte menthe fraîche","1 citron vert (jus)","1 yaourt à la grecque","2 cm gingembre frais","1 c.à.c. graines de cumin","⅓ c.à.c. sel","100 g noix de coco râpée fraîche ou déshydratée","1 piment frais rouge ou vert","1 citron vert (jus)","1 c.à.c. graines de moutarde","1 c.à.c. graines de cumin","huile végétale neutre, sel","1 botte coriandre fraîche","1 citron vert (jus)","1 piment vert","2 gousses ail + 3 cm gingembre","1 c.à.s. graines de sésame blanc","3 c.à.s. huile végétale","1 c.à.c. sucre de canne, sel","150 g noix de cajou non salées, non grillées","1 yaourt à la grecque","½ c.à.c. sel","6 tomates bien mûres","2 cm gingembre + 1 gousse d'ail","1 piment vert frais","100 g sucre non raffiné (jaggery ou muscovado)","10 cl vinaigre balsamique","sel"],"steps":["Torréfier cardamome, coriandre et cumin à sec. Concasser au mortier.","Couper la mangue en dés. Fondre le sucre dans le vinaigre. Ajouter tous les ingrédients.","Cuire à feu doux 20 min. Transvaser dans un bocal. Se conserve 2 semaines.","Mixer la moitié du yaourt avec les feuilles de menthe, le jus de citron vert, le gingembre et le sel.","Incorporer le demi-yaourt restant. Réserver au frais 1 heure.","Faire griller les graines de cumin à sec. Ajouter au moment de servir.","S const CHAPTER_ORDER = [
  'Petit-déjeuner & brunch',
  'Quiches, tartes & petites bouchées',
  'Salades, ceviche & légumes rôtis',
  'Soupes & veloutés',
  'Plats principaux',
  'Desserts & douceurs',
  'Boissons & sauces'
];

const CHAPTER_NUMS = {
  'Petit-déjeuner & brunch': 'I',
  'Quiches, tartes & petites bouchées': 'II',
  'Salades, ceviche & légumes rôtis': 'III',
  'Soupes & veloutés': 'IV',
  'Plats principaux': 'V',
  'Desserts & douceurs': 'VI',
  'Boissons & sauces': 'VII'
};

let searchQuery = '';
let activeFilter = 'all';

const searchInput = document.getElementById('search-input');
const clearBtn = document.getElementById('clear-btn');

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim().toLowerCase();
  clearBtn.style.display = searchQuery ? 'block' : 'none';
  render();
});
clearBtn.addEventListener('click', () => {
  searchInput.value = ''; searchQuery = ''; clearBtn.style.display = 'none';
  searchInput.focus(); render();
});

document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    activeFilter = pill.dataset.filter;
    render();
  });
});
document.querySelector('[data-filter="all"]').classList.add('active');

function resetAll() {
  searchInput.value = ''; searchQuery = ''; clearBtn.style.display = 'none';
  activeFilter = 'all';
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-filter="all"]').classList.add('active');
  render();
}

function filterRecipes() {
  return RECIPES.filter(r => {
    if (activeFilter !== 'all' && !r.tags.includes(activeFilter)) return false;
    if (searchQuery) {
      const haystack = [r.title, r.subtitle, ...r.ingredients, ...r.steps].join(' ').toLowerCase();
      return searchQuery.split(/\s+/).filter(Boolean).every(w => haystack.includes(w));
    }
    return true;
  });
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlight(text) {
  if (!searchQuery) return esc(text);
  let r = esc(text);
  searchQuery.split(/\s+/).filter(Boolean).forEach(w => {
    r = r.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi'), '<mark>$1</mark>');
  });
  return r;
}

function render() {
  const filtered = filterRecipes();
  const container = document.getElementById('recipes-container');
  const noResults = document.getElementById('no-results');
  const countEl = document.getElementById('result-count');
  const resetLink = document.getElementById('reset-link');

  const isFiltered = searchQuery || activeFilter !== 'all';
  resetLink.classList.toggle('show', isFiltered);
  countEl.innerHTML = `<strong>${filtered.length}</strong> recette${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) { container.innerHTML = ''; noResults.classList.add('show'); return; }
  noResults.classList.remove('show');

  const groups = {};
  filtered.forEach(r => { if (!groups[r.chapter_name]) groups[r.chapter_name] = []; groups[r.chapter_name].push(r); });
  const sortedChapters = CHAPTER_ORDER.filter(ch => groups[ch]);

  container.innerHTML = sortedChapters.map(chapter => {
    const chRecipes = groups[chapter];
    const num = CHAPTER_NUMS[chapter] || '';
    const cards = chRecipes.map(r => {
      const idx = RECIPES.indexOf(r);
      const hasContent = r.ingredients && r.ingredients.length > 0;
      const tags = r.tags.map(t => `<span class="tag ${t.replace(/\s/g,'-')}">${t}</span>`).join('');
      return `
        <div class="recipe-card${hasContent ? '' : ' no-content'}" onclick="openModal(${idx})">
          <div class="card-tags">${tags}</div>
          <div class="card-title">${highlight(r.title)}</div>
          ${r.subtitle ? `<div class="card-subtitle">${highlight(r.subtitle)}</div>` : ''}
          ${hasContent ? `<div class="card-ing-count">${r.ingredients.length} ingrédient${r.ingredients.length > 1 ? 's' : ''}</div>` : ''}
          <span class="card-arrow">→</span>
        </div>`;
    }).join('');
    return `<div class="chapter-group">
      <div class="chapter-title"><span class="chapter-num">Ch. ${num}</span>${chapter}</div>
      <div class="recipe-grid">${cards}</div>
    </div>`;
  }).join('');
}

function openModal(idx) {
  const r = RECIPES[idx];
  const num = CHAPTER_NUMS[r.chapter_name] || '';
  const hasContent = r.ingredients && r.ingredients.length > 0;

  document.getElementById('modal-chapter').textContent = `Chapitre ${num} · ${r.chapter_name}`;
  document.getElementById('modal-title').textContent = r.title;
  document.getElementById('modal-subtitle').textContent = r.subtitle || '';
  document.getElementById('modal-tags').innerHTML = r.tags.map(t => `<span class="tag ${t.replace(/\s/g,'-')}">${t}</span>`).join('');

  const body = document.getElementById('modal-body');
  if (!hasContent) {
    body.innerHTML = `<div class="modal-missing">📄 Le contenu de cette recette n'a pas encore été importé.<br>Tu peux l'ajouter en partageant le PDF correspondant !</div>`;
  } else {
    const ingHtml = r.ingredients.filter(i => i && i.length > 1).map(i => `<li>${esc(i.trim())}</li>`).join('');
    const stepsHtml = r.steps.filter(s => s && s.length > 5).map((s,i) => `<li><span class="step-num">${i+1}</span><span>${esc(s.trim())}</span></li>`).join('');
    body.innerHTML = `
      <div class="modal-section-title">Ingrédients</div>
      <ul class="ingredients-list">${ingHtml}</ul>
      <div class="modal-section-title">Préparation</div>
      <ol class="steps-list">${stepsHtml}</ol>`;
  }

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function closeModalOnOverlay(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

document.getElementById('header-count').textContent = RECIPES.length + ' recettes';
render();
</script>
