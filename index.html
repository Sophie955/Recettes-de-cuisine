<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Livre de Cuisine</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6ef;
    --warm-white: #fffdf8;
    --dark: #1a1208;
    --brown: #6b4226;
    --accent: #c84b31;
    --gold: #c9924a;
    --muted: #8a7560;
    --border: #e2d9cc;
    --tag-veg: #4a7c59;
    --tag-rapide: #c84b31;
    --tag-poisson: #2c6e8a;
    --tag-viande: #7a3030;
    --tag-famille: #6a4a8a;
    --tag-sg: #8a6a2c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--cream); color: var(--dark); font-family: 'Lato', sans-serif; font-weight: 300; min-height: 100vh; }

  header {
    background: var(--dark); color: var(--cream);
    padding: 2.5rem 2rem 2rem; text-align: center; position: relative; overflow: hidden;
  }
  header::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(-45deg, transparent, transparent 20px, rgba(201,146,74,0.04) 20px, rgba(201,146,74,0.04) 21px);
  }
  .header-label { font-family: 'Lato', sans-serif; font-weight: 700; font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.75rem; }
  header h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; letter-spacing: 0.02em; line-height: 1; margin-bottom: 0.5rem; }
  header h1 em { font-style: italic; color: var(--gold); }
  .header-sub { font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-top: 0.5rem; }
  .header-count { display: inline-block; margin-top: 1.2rem; font-size: 0.75rem; color: rgba(250,246,239,0.5); letter-spacing: 0.1em; }

  .search-section {
    background: var(--warm-white); border-bottom: 1px solid var(--border);
    padding: 1.2rem 1.5rem; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(26,18,8,0.07);
  }
  .search-wrapper { max-width: 900px; margin: 0 auto; display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .search-box {
    display: flex; flex: 1; min-width: 240px; align-items: center;
    background: var(--cream); border: 1.5px solid var(--border);
    border-radius: 3px; padding: 0.6rem 1rem; gap: 0.6rem; transition: border-color 0.2s;
  }
  .search-box:focus-within { border-color: var(--gold); }
  .search-icon { color: var(--muted); font-size: 1rem; flex-shrink: 0; }
  #search-input {
    border: none; background: transparent; font-family: 'Lato', sans-serif;
    font-size: 0.9rem; font-weight: 300; color: var(--dark); width: 100%; outline: none;
  }
  #search-input::placeholder { color: var(--muted); }
  #clear-btn { display: none; background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1rem; padding: 0; line-height: 1; }
  #clear-btn:hover { color: var(--accent); }

  .filter-pills { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .pill {
    font-family: 'Lato', sans-serif; font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 0.35rem 0.8rem;
    border-radius: 2px; border: 1.5px solid var(--border); background: var(--warm-white);
    color: var(--muted); cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .pill:hover { border-color: var(--gold); color: var(--brown); }
  .pill.active { background: var(--dark); border-color: var(--dark); color: var(--cream); }
  .pill.active.veg { background: var(--tag-veg); border-color: var(--tag-veg); }
  .pill.active.rapide { background: var(--accent); border-color: var(--accent); }
  .pill.active.poisson { background: var(--tag-poisson); border-color: var(--tag-poisson); }
  .pill.active.viande { background: var(--tag-viande); border-color: var(--tag-viande); }
  .pill.active.famille { background: var(--tag-famille); border-color: var(--tag-famille); }

  .main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .result-meta { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .result-count { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--muted); }
  .result-count strong { color: var(--dark); font-weight: 600; }
  .reset-link { font-size: 0.75rem; color: var(--accent); cursor: pointer; text-decoration: underline; letter-spacing: 0.05em; display: none; }
  .reset-link.show { display: block; }

  .chapter-group { margin-bottom: 2.5rem; }
  .chapter-title {
    font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 600;
    color: var(--brown); padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
    margin-bottom: 1.2rem; display: flex; align-items: baseline; gap: 0.75rem;
  }
  .chapter-num { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); font-family: 'Lato', sans-serif; font-weight: 700; }

  .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px; background: var(--border); }
  .recipe-card { background: var(--warm-white); padding: 1.4rem 1.5rem; cursor: pointer; transition: background 0.15s; position: relative; }
  .recipe-card:hover { background: #fff8f0; }
  .recipe-card:hover .card-title { color: var(--accent); }
  .recipe-card.no-content { opacity: 0.55; }
  .recipe-card.no-content::after { content: 'contenu manquant'; position: absolute; top: 0.7rem; right: 0.7rem; font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); padding: 0.15rem 0.4rem; border-radius: 2px; }

  .card-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
  .tag { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.2rem 0.45rem; border-radius: 1px; color: #fff; }
  .tag.végétarien { background: var(--tag-veg); }
  .tag.rapide { background: var(--accent); }
  .tag.poisson { background: var(--tag-poisson); }
  .tag.viande { background: var(--tag-viande); }
  .tag.famille { background: var(--tag-famille); }
  .tag.sans-gluten { background: var(--tag-sg); }

  .card-title { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 600; line-height: 1.3; color: var(--dark); margin-bottom: 0.35rem; transition: color 0.15s; }
  .card-subtitle { font-size: 0.78rem; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-ing-count { margin-top: 0.7rem; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.05em; }
  .card-arrow { position: absolute; bottom: 1.2rem; right: 1.2rem; color: var(--border); font-size: 0.9rem; transition: color 0.15s, transform 0.15s; }
  .recipe-card:hover .card-arrow { color: var(--gold); transform: translateX(3px); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,18,8,0.65); z-index: 1000; backdrop-filter: blur(3px); overflow-y: auto; padding: 1.5rem; }
  .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
  .modal { background: var(--warm-white); max-width: 700px; width: 100%; margin: auto; border-radius: 2px; overflow: hidden; box-shadow: 0 20px 60px rgba(26,18,8,0.3); animation: slideUp 0.25s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .modal-header { background: var(--dark); color: var(--cream); padding: 2rem 2rem 1.8rem; position: relative; }
  .modal-chapter-label { font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 0.6rem; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 700; line-height: 1.2; margin-bottom: 0.5rem; }
  .modal-subtitle { font-size: 0.85rem; color: rgba(250,246,239,0.65); font-style: italic; line-height: 1.5; }
  .modal-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 1rem; }
  .modal-close { position: absolute; top: 1.2rem; right: 1.2rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: var(--cream); width: 2rem; height: 2rem; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .modal-close:hover { background: rgba(255,255,255,0.2); }

  .modal-body { padding: 2rem; }
  .modal-section-title { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; }
  .modal-missing { background: #fdf8f0; border: 1px dashed var(--border); border-radius: 3px; padding: 1.5rem; text-align: center; color: var(--muted); font-size: 0.88rem; line-height: 1.6; margin-bottom: 1rem; }

  .ingredients-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 1.5rem; margin-bottom: 2rem; }
  .ingredients-list li { font-size: 0.88rem; color: var(--dark); padding: 0.3rem 0; border-bottom: 1px solid var(--border); line-height: 1.4; }

  .steps-list { list-style: none; }
  .steps-list li { display: flex; gap: 1rem; margin-bottom: 1.2rem; font-size: 0.9rem; line-height: 1.65; color: #2a1f10; }
  .step-num { flex-shrink: 0; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--dark); color: var(--cream); font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 0.1rem; font-family: 'Playfair Display', serif; }

  .no-results { text-align: center; padding: 4rem 2rem; display: none; }
  .no-results.show { display: block; }
  .no-results-emoji { font-size: 3rem; margin-bottom: 1rem; }
  .no-results h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--brown); margin-bottom: 0.5rem; }
  .no-results p { color: var(--muted); font-size: 0.9rem; }

  mark { background: rgba(201,146,74,0.3); color: inherit; padding: 0.05em 0.1em; border-radius: 1px; }

  @media (max-width: 600px) {
    .ingredients-list { grid-template-columns: 1fr; }
    .modal-body { padding: 1.5rem; }
    .recipe-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-label">Collection personnelle · 2026</div>
  <h1>Mon Livre de <em>Cuisine</em></h1>
  <div class="header-sub">Recettes végétales · Poissons · Volaille · Douceurs</div>
  <div class="header-count" id="header-count"></div>
</header>

<div class="search-section">
  <div class="search-wrapper">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Rechercher par ingrédient, recette…" autocomplete="off" spellcheck="false">
      <button id="clear-btn" title="Effacer">✕</button>
    </div>
    <div class="filter-pills">
      <button class="pill" data-filter="all">Tout</button>
      <button class="pill veg" data-filter="végétarien">🌿 Végétarien</button>
      <button class="pill rapide" data-filter="rapide">⚡ Rapide</button>
      <button class="pill poisson" data-filter="poisson">🐟 Poisson</button>
      <button class="pill viande" data-filter="viande">🥩 Viande</button>
      <button class="pill famille" data-filter="famille">👨‍👩‍👧‍👦 Famille</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="result-meta">
    <div class="result-count" id="result-count"></div>
    <span class="reset-link" id="reset-link" onclick="resetAll()">Réinitialiser</span>
  </div>
  <div id="recipes-container"></div>
  <div class="no-results" id="no-results">
    <div class="no-results-emoji">🍽️</div>
    <h3>Aucune recette trouvée</h3>
    <p>Essayez un autre ingrédient ou terme de recherche.</p>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-chapter-label" id="modal-chapter"></div>
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-subtitle" id="modal-subtitle"></div>
      <div class="modal-tags" id="modal-tags"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const RECIPES = [{"title":"Overnight oats & chia au lait végétal","subtitle":"Flocons d'avoine et chia gonflés toute la nuit, à garnir de fruits","chapter":"I","chapter_name":"Petit-déjeuner & brunch","tags":["sans gluten","végétarien","rapide"],"ingredients":["5 c.à.s. lait de coco","5 c.à.s. eau de coco","— ou — 10 c.à.s. lait d'amande","4 c.à.s. flocons d'avoine bio","1 c.à.s. graines de chia","1 c.à.c. miel d'acacia","fruits frais ou coulis"],"steps":["Dans un bocal, mélanger le lait et/ou l'eau de coco avec le miel.","Ajouter les flocons d'avoine et les graines de chia. Bien mélanger. Parsemer de fruits.","Fermer le bocal et réserver au réfrigérateur. Le chia et l'avoine absorbent le liquide pendant la nuit.","Le lendemain, ajouter du lait végétal si besoin pour ajuster la consistance. Déguster !"]},{"title":"Chia pudding et ses déclinaisons","subtitle":"Le petit-déjeuner star déclinable en quatre saisons","chapter":"I","chapter_name":"Petit-déjeuner & brunch","tags":["sans gluten","végétarien","rapide"],"ingredients":["250 ml lait végétal au choix","25 g graines de chia","1 c.à.c. édulcorant (agave, sirop d'érable…)","1 pincée épices (vanille, cannelle…)","🌸 Printemps : amande, gingembre, pollen","☀️ Été : coco + riz, matcha, fruits rouges","🍂 Automne : amande + riz, figues, noix","❄️ Hiver : avoine, cacao, poire"],"steps":["La veille : mélanger lait, édulcorant, épices et chia dans un bol.","Laisser prendre 20 min en mélangeant toutes les 5 min pour une texture crémeuse. Couvrir et réfrigérer toute la nuit.","Le matin, garnir de fruits frais selon la saison et déguster."]},{"title":"Tarte fine aux poireaux et champignons","subtitle":"Une tarte légère aux poireaux fondants, parfaite avec une salade verte","chapter":"II","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["1 pâte feuilletée","150 g champignons de Paris","2–3 poireaux selon taille","10 cl crème liquide","1 c.à.c. muscade moulue","1 c.à.s. huile d'olive","1 c.à.s. persil ciselé"],"steps":["Débarrasser les poireaux de leurs extrémités, couper en deux dans la longueur, tailler en morceaux et rincer.","Faire revenir dans une poêle avec l'huile, la muscade, sel et poivre. Cuire 10 min à feu moyen et à couvert.","Ajouter la crème et poursuivre 5 min à feu moyen en remuant.","Préchauffer le four à 180°C chaleur tournante. Étaler la pâte, piquer à la fourchette et précuire pendant le préchauffage.","Émincer les champignons. Étaler les poireaux sur la pâte. Enfourner à mi-hauteur 20 min.","Parsemer champignons et persil, enfourner encore 5 min. Servir aussitôt."]},{"title":"Muffins salés feta, poivrons rouges et pesto","subtitle":"Muffins moelleux à emporter — parfaits pour un pique-nique ou un apéro original","chapter":"II","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["3 œufs","180 g farine","100 g lait","50 g huile d'olive","100 g emmenthal râpé","½ sachet levure","sel, poivre","1 poivron","100 g feta","50 g pesto","graines : tournesol, pavot…","optionnel : 100 g allumettes de bacon, feuilles de basilic"],"steps":["Battre ensemble les œufs, la farine, la levure, le pesto, l'huile d'olive, le sel et le lait.","Ajouter l'emmenthal et mélanger.","Couper le poivron en petits dés, ajouter et mélanger.","Couper la feta en dés, ajouter et mélanger. Ajouter bacon et/ou basilic si souhaité.","Verser dans des empreintes à muffins aux 2/3. Saupoudrer de graines.","Enfourner à 180 °C pendant environ 30 min, jusqu'à dorure. La pointe d'un couteau doit ressortir sèche."]},{"title":"Samossas au potiron","subtitle":"Beignets triangulaires indiens garnis de courge butternut, paneer émietté et épices","chapter":"II","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["6 galettes de blé (spring roll pastry)","1 c.à.s. farine + 2 c.à.s. eau (colle)","huile de friture","500 g courge butternut","150 g paneer émietté","3 cm gingembre frais râpé (ou 1 c.à.c. pâte)","4–5 tiges coriandre fraîche","1 c.à.c. graines de cumin","1 c.à.c. graines de moutarde noire","huile végétale"],"steps":["Cuire la courge en gros morceaux (avec peau) 10 min dans l'eau bouillante. Égoutter, refroidir, éplucher. Écraser à la fourchette en purée grossière.","Faire revenir le gingembre râpé dans 1 c.à.s. d'huile. Ajouter graines de moutarde et cumin, faire dorer. Ajouter la courge, cuire quelques minutes. Hors du feu, ajouter le paneer et la coriandre ciselée.","Couper les 6 galettes en deux (12 rectangles). Plier en deux pour obtenir 12 bandes. Préparer la colle farine/eau.","Placer une bande horizontalement, déposer 1 grosse c.à.s. de garniture à gauche. Plier en triangle en formant des angles bien fermés. Coller l'extrémité avec la colle.","Faire frire dans 2 cm d'huile chaude (pas fumante) 3 min de chaque côté à feu moyen jusqu'à belle dorure. Égoutter sur papier absorbant. Servir aussitôt avec chutney à la tomate et chutney à la noix de coco."]},{"title":"Bruschette","subtitle":"Tartines de pain au levain grillé, tomates assaisonnées et huile d'olive — un classique italien","chapter":"II","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien","rapide"],"ingredients":["8 tranches pain au levain","32 tomates cerises (ou 4 tomates anciennes en petits cubes)","8 feuilles basilic","1 gousse ail","1 c.à.c. origan selon les goûts","8 c.à.s. huile d'olive","fleur de sel ou cristaux de sel Maldon"],"steps":["Griller les tranches de pain au barbecue sur la braise, au grille-pain, au four ou dans une poêle en fonte.","Verser sur les tranches encore chaudes un filet généreux d'huile d'olive et saupoudrer de fleur de sel.","Pour les bruschette à la tomate : assaisonner les tomates au préalable avec sel, basilic ou origan et huile d'olive. Veiller à conserver quelques morceaux croquants pour que la tartine soit facile à manger à la main."]},{"title":"Beignets de lentilles épicés (Masala vadai)","subtitle":"Masala vadai — street food indien croustillant dehors, moelleux dedans","chapter":"II","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["150 g lentilles corail","1 oignon rouge","1 gousse ail","1 dizaine brins de coriandre fraîche","1 belle pincée piment rouge en poudre","1 c.à.c. graines de cumin","1 pincée curcuma","2 c.à.s. farine de pois chiches","huile végétale, sel"],"steps":["Rincer les lentilles et les laisser tremper 2 heures dans un grand volume d'eau froide. Égoutter.","Mixer les lentilles avec le curcuma, le piment, la gousse d'ail dégermée, l'oignon en 8 quartiers, la coriandre (avec tiges) et 1 belle pincée de sel. La pâte doit être homogène mais pas lisse. Incorporer les graines de cumin et la farine de pois chiches.","Laisser reposer la pâte 30 min à température ambiante.","Chauffer 2 cm d'huile dans une sauteuse (chaude, pas fumante). Former de petites boules avec 1 c.à.s. de pâte. Faire dorer 5 min sur chaque face. Servir avec un raïta."]},{"title":"Falafels","subtitle":"Boulettes de pois chiches croustillantes du Moyen-Orient, servies avec sauce rose à la betterave","chapter":"II","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["250 g pois chiches secs","1 petit oignon","2 gousses ail","½ bouquet persil plat","½ bouquet coriandre","1 pincée cumin","1 pincée curcuma","1 pincée cardamome","huile de friture, sel, poivre","Sauce rose : 120 g yaourt de brebis, ¼ betterave cuite, ½ c.à.s. jus de citron, 1½ c.à.s. huile d'olive"],"steps":["La veille : mettre les pois chiches à tremper dans un saladier d'eau froide pour toute la nuit.","Le jour même : égoutter les pois chiches. Émincer l'oignon.","Dans le bol d'un robot, mixer tous les ingrédients sauf l'huile. Saler et poivrer. Ajouter un peu d'eau si trop épais. Laisser reposer 1 heure au réfrigérateur.","Sauce rose : mixer la betterave en morceaux avec le jus de citron, l'huile et 2 c.à.s. de yaourt. Transvaser dans un bol, ajouter le reste du yaourt, saler, poivrer. Réserver au réfrigérateur.","Mouiller les mains et former environ 20 boulettes.","Faire frire dans l'huile chaude jusqu'à belle dorure, environ 8 min en retournant à mi-cuisson. Égoutter sur papier absorbant. Servir avec la sauce rose."]},{"title":"Paratha garni à la coriandre","subtitle":"Pain indien feuilleté garni d'une pâte coriandre-ail-ghee — à cuire à sec dans une poêle","chapter":"II","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["300 g farine semi-complète T110 (ou farine atta)","15 cl eau tiède","3 c.à.s. huile d'olive + pour façonnage","sel","1 botte coriandre fraîche","4 gousses ail","ghee ou beurre"],"steps":["Mixer la coriandre fraîche avec les gousses d'ail dégermées, le sel et 5 c.à.c. de ghee fondu tiède pour obtenir une pâte lisse. Réserver.","Dans un bol, mélanger le sel avec l'eau tiède. Tamiser la farine dans un saladier, incorporer l'huile d'olive. Mouiller petit à petit avec l'eau salée. Travailler la pâte 10 min jusqu'à ce qu'elle soit souple et non collante. Couvrir d'un linge mouillé et laisser reposer 1 heure.","Former 8 boules de pâte. Étaler chaque pâton en bande de 5 cm de large et 30 cm de long. Badigeonner du mélange coriandre et replier la bande en deux dans la longueur. Badigeonner de beurre et replier en escargot en reformant une boule.","Étaler la nouvelle boule en galette de 20 cm de diamètre.","Chauffer une poêle à crêpes à sec. Cuire chaque galette 5 min à feu moyen, retourner et dorer 5 min de l'autre côté. Servir aussitôt."]},{"title":"Rouleaux de printemps chinois","subtitle":"Rouleaux croustillants farcis de pousses de soja et ciboulette chinoise sautées","chapter":"II","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["½ paquet galettes de blé surgelées pour spring rolls","250 g pousses de soja","120 g ciboulette chinoise émincée","2 œufs entiers + 1 jaune (pour farce + coller)","1 c.à.s. sauce soja claire","2 c.à.s. huile végétale","1 c.à.s. huile de sésame","sel, huile neutre pour cuisson"],"steps":["Décongeler les galettes de blé 2 heures à température ambiante.","Battre les œufs entiers en omelette. Les cuire dans un wok avec 1 c.à.s. d'huile en cassant en petits morceaux. Réserver.","Faire revenir les pousses de soja dans le reste d'huile jusqu'à tendreté. Réserver. Faire sauter la ciboulette 1 min dans le wok. Remettre les pousses de soja. Ajouter sauce soja, huile de sésame et sel. Laisser refroidir 10 min.","Placer 1 galette avec un angle vers soi. Déposer 1 c.à.s. bombée de farce au centre. Rabattre l'angle inférieur vers le centre, puis les angles gauche et droit. Enrouler. Coller l'angle final avec du jaune d'œuf battu.","Chauffer l'huile dans une poêle à feu vif. Faire dorer les rouleaux 2–3 minutes. Servir chaud."]},{"title":"Briouates marocains aux épinards","subtitle":"Triangles feuilletés de brick farcis aux épinards et œufs brouillés","chapter":"II","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["10 feuilles de brick","300 g feuilles d'épinards","50 g beurre","3 œufs","huile de friture, sel, poivre"],"steps":["Hacher finement les épinards. Faire fondre le beurre dans une poêle, ajouter les épinards hachés et faire revenir 10 min. Saler et poivrer.","Ajouter les œufs dans la poêle et mélanger à feu doux pour obtenir des œufs brouillés aux épinards. Laisser refroidir. Rectifier l'assaisonnement.","Couper chaque feuille de brick en deux. Plier chaque demi-feuille en bande rectangulaire en rabattant les côtés vers le centre. Déposer 1 c.à.s. de farce à l'extrémité droite. Plier en triangle en veillant à bien enfermer la farce. Coller l'extrémité avec un peu d'œuf battu si nécessaire.","Chauffer l'huile de friture. Cuire les briouates des deux côtés jusqu'à ce qu'elles soient bien dorées. Déguster aussitôt."]},{"title":"Tempura d'épinards","subtitle":"Feuilles d'épinards en pâte à tempura légère, servies avec un yaourt citronné","chapter":"II","chapter_name":"Quiches, tartes & petites bouchées","tags":["végétarien"],"ingredients":["300 g feuilles d'épinards","200 g farine de pois chiches","50 g + 100 g farine de riz (séparés)","75 cl eau froide","½ sachet levure chimique","½ c.à.c. curcuma","1 pincée piment en poudre","huile de friture, sel","1 yaourt + 1 citron jaune bio (sauce)"],"steps":["Dans un saladier, mélanger la farine de pois chiches, les 50 g de farine de riz, le curcuma, ½ c.à.c. de sel, le piment et la levure. Ajouter 75 cl d'eau froide et mélanger jusqu'à obtenir une pâte onctueuse. Réserver.","Laver et sécher soigneusement les épinards. Dans un sac congélation, mettre les 100 g de farine de riz restants et les épinards. Fermer et mélanger pour bien enrober les feuilles. Sortir et débarrasser de l'excédent de farine.","Tremper les feuilles dans la pâte à tempura et faire frire quelques minutes dans de l'huile très chaude. Égoutter sur du papier absorbant.","Prélever le zeste du citron et hacher finement. Presser le citron. Fouetter le yaourt avec 1 pincée de sel, le jus de citron et le zeste. Servir avec la tempura d'épinards."]},{"title":"Ceviche de base","subtitle":"La recette fondatrice du ceviche péruvien, fraîche et acidulée","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten","famille"],"ingredients":["750 g filets de bar","2 citrons jaunes","4 citrons verts + zestes","6 oignons verts émincés","4 petits piments aji hachés","1 c.à.s. sel fin"],"steps":["Envelopper les filets dans du film alimentaire. Placer 20 min au congélateur.","Presser les citrons dans un saladier, dissoudre sel et poivre. Ajouter oignons et piments. Mariner 20 min.","Couper le bar ferme en cubes de 2–3 cm. Ajouter à la marinade, mélanger délicatement. Servir aussitôt."]},{"title":"Ceviche de Saint-Jacques à la passion","subtitle":"Noix en fines tranches, marinade d'agrumes et pulpe de fruit de la passion","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten"],"ingredients":["12 saint-jacques fraîches","2 fruits de la passion","¼ botte coriandre","4 c.à.s. huile d'olive","½ pamplemousse","2 oranges + 1 citron vert","1 clémentine + 1 gousse d'ail"],"steps":["Presser tous les agrumes, hacher l'ail finement. Laisser infuser 30 min au réfrigérateur.","Nettoyer les saint-jacques, enlever le corail. Couper en fines tranches d'environ 2 mm.","Disposer 3 noix par assiette. Filtrer la marinade et la verser dessus. Ajouter la pulpe de passion.","Ciseler la coriandre, ajouter l'huile, fleur de sel et tour de moulin à poivre."]},{"title":"Ceviche de sébaste à la péruvienne","subtitle":"Poisson blanc mariné, maïs cancha grillé et patate douce","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten"],"ingredients":["~600 g sébaste (filets)","1 patate douce","100 g maïs cancha (ou pop-corn salé)","2 branches de céleri","1 oignon rouge","2 cm gingembre","15 citrons verts (jus)","¼ botte coriandre"],"steps":["Préparer la marinade : jus de citron, sel et poivre dans un saladier.","Couper céleri, ail et gingembre en petits dés. Émincer l'oignon. Couper le sébaste en dés d'1 cm. Mélanger et mariner 20 min au frais.","Griller le maïs dans une poêle sèche 8–10 min jusqu'à dorure. Cuire les dés de patate douce 15 min dans l'eau bouillante.","Dresser le ceviche dans les assiettes avec les patates douces, le maïs et la coriandre ciselée."]},{"title":"Ceviche de cabillaud à la patate douce","subtitle":"Cabillaud mariné aux agrumes, accompagné de patates douces","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten","famille"],"ingredients":["750 g filets de cabillaud","300 g patates douces","4 citrons verts (jus)","2 oranges (jus)","1 oignon rouge émincé","3 petits piments frais hachés","1 c.à.c. graines de coriandre"],"steps":["Congeler les filets 20 min dans du film alimentaire pour les raffermir.","Cuire les patates douces en cubes 10 min dans l'eau salée.","Préparer la marinade : jus d'agrumes, sel, poivre, coriandre, oignon, piments. Laisser 20 min.","Couper le cabillaud ferme en cubes. Mélanger délicatement avec patates et marinade. Servir aussitôt."]},{"title":"Carpaccio de bar au fenouil","subtitle":"Fines tranches de bar marinées à l'aneth et au vin blanc","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten"],"ingredients":["600 g filets de bar (sans peau)","1 petit bulbe de fenouil","1 citron (jus)","5 c.à.s. huile d'olive","¼ c.à.c. graines d'aneth","1 c.à.s. vin blanc"],"steps":["Envelopper les filets de film alimentaire, placer 30 min au congélateur.","Mélanger citron, aneth, vin blanc, ail, sucre, sel, poivre et huile d'olive.","Couper le poisson en très fines lamelles. Disposer dans les assiettes. Ajouter le fenouil et ses brins. Verser l'assaisonnement au service."]},{"title":"Carpaccio de saumon au gingembre","subtitle":"Fines lamelles de saumon au jus de citron vert et gingembre râpé","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten"],"ingredients":["400 g saumon (pavé ou filet)","2–4 cm gingembre frais râpé","4 c.à.s. huile d'olive","2 citrons verts (jus)","5 c.à.s. sauce soja douce (à part)","sel"],"steps":["Placer le saumon 30 min au congélateur. Couper en très fines lamelles. Disposer dans les assiettes.","Saupoudrer de gingembre râpé, arroser de citron vert et d'huile d'olive. Saler.","Servir avec la sauce soja en accompagnement, que chacun dose à sa guise."]},{"title":"Saumon mariné au curry","subtitle":"Saumon gravlax au curry, poivrons rôtis et avocat","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten"],"ingredients":["600 g filet de saumon","2 c.à.s. sucre + 4 c.à.s. gros sel","2 poivrons rouges","1 tomate, 1 avocat","1 c.à.s. curry","1 citron non traité","aneth, piment de Cayenne, ciboulette"],"steps":["La veille : recouvrir le saumon de gros sel, sucre et poivre. Réfrigérer 1 nuit.","Griller les poivrons 20 min côté peau, enfermer 30 min dans un sac, peler. Couper en lamelles, réfrigérer.","Mélanger jus et zeste de citron, curry, ciboulette, Cayenne, aneth, sel et poivre. Verser sur poivrons et tomate.","Rincer le saumon, couper en dés, mariner 2 h au frais. Ajouter l'avocat coupé au service."]},{"title":"Ceviche de betterave crue","subtitle":"Betteraves marinées au citron vert, pomme granny et feta émiettée","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten","végétarien","rapide"],"ingredients":["1 betterave rouge crue","1 betterave chiogga crue","1 pomme granny-smith","50 g feta","5 citrons verts (jus)","½ botte coriandre ciselée","3 c.à.s. huile d'olive"],"steps":["Trancher les betteraves à la mandoline. Mariner dans le jus des citrons verts et l'huile d'olive pendant 2 h.","Couper la pomme en fines tranches à la mandoline (avec la peau), épépiner.","Répartir en alternant les couleurs. Émietter la feta, ajouter zeste, huile, fleur de sel et poivre."]},{"title":"Carpaccio de courgettes aux pignons grillés","subtitle":"Très fines rondelles de courgettes, pignons croustillants et copeaux de parmesan","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["sans gluten","végétarien"],"ingredients":["2 courgettes","200 g pignons de pin","100 g parmesan","1 citron (jus)","3 c.à.s. huile d'olive"],"steps":["Trancher les courgettes à la mandoline au plus fin. Disposer dans les assiettes.","Faire griller les pignons à sec en remuant. Répartir sur les courgettes. Arroser de citron. Réfrigérer 30 min.","Au service, ajouter des copeaux de parmesan, sel, poivre et huile d'olive."]},{"title":"Salade tahitienne","subtitle":"Noix de coco fraîche, ananas, concombre et coriandre, sauce au lait de coco et citron vert — servie dans les coques","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson"],"ingredients":["2 noix de coco","¼ ananas","½ concombre","2 oignons nouveaux","½ bouquet coriandre","¼ grenade","1 citron vert jus et zeste","1 c.à.c. gingembre frais râpé","10 cl lait de coco","4 c.à.s. huile d'olive","sel, poivre du moulin"],"steps":["Retirer l'écorce et le cœur dur de l'ananas, couper la chair en dés. Épépiner et couper le concombre en dés. Émincer les oignons. Ciseler la coriandre. Prélever les graines de grenade.","Mélanger les ingrédients dans un saladier. Laisser reposer 15 min.","Sauce tahitienne : râper le zeste du citron vert et presser le jus. Émulsionner le lait de coco, l'huile d'olive, le gingembre, le jus et les zestes de citron vert. Saler et poivrer.","Couper les noix de coco en deux à l'aide d'un couteau-scie. Récupérer le jus, en verser 2 c.à.s. dans le saladier et mélanger. Répartir la salade dans les 4 demi-noix de coco et servir."]},{"title":"Saumon gravlax – la recette essentielle","subtitle":"Saumon mariné 48h au sel, sucre et herbes — élégant, sans cuisson","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten","famille"],"ingredients":["300 g filet de saumon extra frais","100 g gros sel","100 g sucre","½ bouquet herbes : aneth, coriandre…","1 c.à.c. poivre en grain (ou baies roses)"],"steps":["Mélanger sel, sucre, herbes et poivre concassé.","Dans un container hermétique, déposer la moitié du mélange sel/sucre. Poser le filet de saumon. Recouvrir du reste.","Fermer et réfrigérer 48h en éliminant régulièrement la saumure. On peut aussi retourner la boîte.","Avant de servir, rincer le saumon à l'eau froide pour ôter l'excès de sel. Bien éponger.","Trancher en lamelles ou dés. Servir avec des dés de mangue et un filet de citron vert."]},{"title":"Poivrons confits et tomates aux épices","subtitle":"Poivrons grillés au four et tomates mijotées avec ail, paprika et cumin","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["4 tomates","3 poivrons verts","4 gousses ail","1 c.à.s. persil plat haché","1 c.à.c. paprika","1 c.à.c. cumin en poudre","3 c.à.s. huile d'olive","sel, poivre du moulin"],"steps":["Préchauffer le four à 200°C. Déposer les poivrons sur une plaque et griller 20–30 min en les retournant régulièrement jusqu'à ce que la peau noircisse. Laisser refroidir dans un sac alimentaire 5–10 min.","Peler et épépiner les tomates, couper en petits dés (ou utiliser des tomates pelées en boîte).","Peler et hacher l'ail. Peler les poivrons, ôter le pédoncule et les graines. Couper en lanières.","Chauffer l'huile dans une sauteuse. Faire revenir les dés de tomates avec l'ail et les épices 5 min à feu moyen. Ajouter les lanières de poivrons et mélanger. Laisser mijoter à feu doux 15 min en remuant.","Déguster chaud ou tiède, parsemé de persil haché."]},{"title":"Zaalouk de courgettes","subtitle":"Caviar de courgettes marocain au curcuma, ail et coriandre fraîche","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien","rapide"],"ingredients":["4 courgettes","1 c.à.s. curcuma","3 gousses ail hachées","2 c.à.s. coriandre fraîche ciselée","huile d'olive, sel, poivre du moulin"],"steps":["Laver et couper les courgettes en dés. Dans une grande casserole, cuire avec un peu d'eau salée pendant 15 min.","Égoutter les courgettes et les faire revenir dans une poêle avec 2 c.à.s. d'huile d'olive bien chaude pendant 1 min.","Ajouter le curcuma et les gousses d'ail. Mélanger en écrasant les courgettes avec le dos d'une fourchette. Saler et poivrer.","Couper le feu et incorporer la coriandre fraîche. Laisser tiédir et déguster."]},{"title":"Chou-fleur rôti au curcuma","subtitle":"Bouquets de chou-fleur rôtis aux épices et citron vert, croustillants et parfumés","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["1 chou-fleur","1 citron vert jus et zeste","1 poignée graines de courge concassées","1 c.à.c. curcuma","½ c.à.c. ail en poudre","½ c.à.c. paprika","1 c.à.s. zaatar","½ c.à.s. sucre semoule","1 c.à.c. sel","5 c.à.s. huile d'olive"],"steps":["Préchauffer le four à 200°C. Détacher les bouquets du chou-fleur et les mettre dans un saladier.","Dans un bol, mélanger toutes les épices, le sucre, le sel et l'huile d'olive. Verser sur les bouquets et bien enrober.","Étaler sur une plaque recouverte de papier cuisson. Enfourner 30 min. Ajouter les graines de courge concassées 5 min avant la fin.","Parsemer de zestes de citron vert et arroser de jus avant de déguster."]},{"title":"Fattouch (salade libanaise)","subtitle":"Salade libanaise de légumes frais et pain grillé au sumac","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["25 g persil plat","2 branches menthe","65 g concombre","3 feuilles laitue","235 g tomates","25 g radis","25 g oignon","6 branches pourpier","1 branche basilic","3 c.à.s. jus de citron","4 c.à.s. huile d'olive","7 g sumac","1 pain libanais","½ c.à.c. sel"],"steps":["Laver et couper en gros morceaux le persil, la menthe, le concombre, la laitue et les tomates. Couper les radis en rondelles. Hacher l'oignon. Effeuiller le pourpier et le basilic.","Mettre tous les légumes dans un grand saladier. Ajouter le jus de citron, l'huile d'olive, le sumac et le sel. Mélanger.","Séparer le pain en deux et faire griller au four. Casser en gros morceaux.","Au moment de servir uniquement, ajouter le pain dans le saladier et mélanger."]},{"title":"Salade grecque","subtitle":"Tomates cerises, concombre, feta poêlée, olives noires et origan","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien","rapide"],"ingredients":["400 g tomates cerises","1 petit concombre","1 petit oignon rouge","½ poivron vert","quelques olives noires","4 brins origan (ou basilic)","200 g feta","½ citron jus","3 c.à.s. huile d'olive","poivre du moulin"],"steps":["Laver les tomates cerises et les couper en deux. Peler le concombre, le couper en deux dans la longueur, retirer les pépins et détailler en dés. Émincer l'oignon. Épépiner et couper le poivron en dés. Ciseler l'origan.","Déposer tomates, concombre, oignon et poivron dans un saladier. Ajouter olives et origan. Poivrer. Assaisonner de jus de citron et 2 c.à.s. d'huile d'olive. Mélanger et répartir dans 4 assiettes.","Couper la feta en quatre. Poêler les morceaux 1 min de chaque côté avec le reste d'huile. Déposer sur les assiettes. Poivrer avant de servir."]},{"title":"Salades marocaines (carottes, poivrons grillés)","subtitle":"Carottes au cumin et poivrons grillés à l'huile d'argan","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["8 carottes","3 gousses ail","2 c.à.s. coriandre ciselée","1 c.à.s. cumin en poudre","1 citron jus","2 c.à.s. huile d'olive","sel","2 poivrons verts","4 tomates","1 c.à.s. persil plat haché","1 c.à.c. cumin en poudre","2 c.à.s. huile d'argan","2 c.à.s. vinaigre blanc","sel, poivre du moulin"],"steps":["Éplucher et laver les carottes. Couper en rondelles de 4 mm d'épaisseur. Peler et hacher l'ail.","Cuire les carottes dans une grande casserole avec de l'eau salée pendant 15 min. Égoutter.","Faire revenir les carottes dans l'huile d'olive bien chaude 1 min. Ajouter le cumin et le jus de citron. Mélanger. Hors du feu, incorporer la coriandre et l'ail. Laisser tiédir. Déposer dans un saladier et servir.","Préchauffer le four à 200°C. Griller les poivrons sur une plaque 20–30 min en les retournant régulièrement jusqu'à ce que la peau noircisse. Laisser refroidir dans un sac alimentaire 5–10 min. Peler, ôter pédoncule et graines. Couper en petits dés.","Peler et épépiner les tomates. Couper en petits dés.","Mélanger tomates et poivrons dans un saladier. Ajouter cumin, huile d'argan, vinaigre et persil. Saler et poivrer. Réserver au réfrigérateur jusqu'au moment de servir."]},{"title":"Salade de carottes à l'orange","subtitle":"Carottes râpées au jus d'orange frais, eau de fleur d'oranger et cannelle","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien","rapide"],"ingredients":["500 g carottes","2 oranges spécial jus","1 c.à.s. eau de fleur d'oranger","¼ c.à.c. cannelle en poudre","1 c.à.c. sucre semoule"],"steps":["Éplucher, laver et sécher les carottes. Râper finement.","Presser les oranges et filtrer le jus pour enlever la pulpe.","Dans un saladier, mélanger le jus d'orange, l'eau de fleur d'oranger, la cannelle et le sucre.","Ajouter les carottes râpées et mélanger pour bien les imprégner. Réfrigérer au moins 30 min avant de servir."]},{"title":"Taboulé oriental","subtitle":"Taboulé libanais à la semoule, abondant en persil frais, menthe et citron","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["3 tomates juteuses","160 g concombre","2 oignons nouveaux","1 botte persil plat","4 brins menthe","160 g semoule de blé","2 citrons jus","10 cl huile d'olive","sel, poivre du moulin"],"steps":["Tailler les tomates en petits dés en gardant leur jus. Éplucher le concombre et couper en dés. Émincer finement les oignons nouveaux. Ciseler le persil plat et la menthe.","Mettre la semoule dans un saladier. Ajouter les dés de tomates et de concombre, les oignons, le persil et la menthe. Arroser de jus de citron et d'huile d'olive. Saler et poivrer. Mélanger.","Laisser reposer au réfrigérateur pendant 2 heures avant de déguster."]},{"title":"Salade italienne de fenouil et orange","subtitle":"Fenouil tranché à la mandoline et oranges de Sicile — un accord parfait en hiver","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien","rapide"],"ingredients":["4 oranges (de préférence Sicile ou Calabre)","2 bulbes fenouil","huile d'olive généreuse","sel, poivre noir du moulin"],"steps":["Éplucher les oranges à vif. Couper en tranches fines puis recouper chaque tranche en quatre.","Trancher la base du fenouil et retirer le haut des tiges les plus épaisses (réserver les jeunes pousses). À la mandoline, couper les deux bulbes en tranches très fines.","Dans un saladier, mêler le fenouil et l'orange. Ajouter les petites pousses de fenouil. Arroser généreusement d'huile d'olive, saler et poivrer. Mélanger et laisser reposer 15 min au réfrigérateur avant de servir."]},{"title":"Salade thaï de pomelo","subtitle":"L'équilibre parfait salé-sucré-acide-piquant de la cuisine thaïe — fraîche et colorée","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["poisson","sans gluten","rapide"],"ingredients":["1 c.à.s. sucre de palme (ou sucre de coco ou roux)","1,5 c.à.s. jus de citron vert","1,5 c.à.s. sauce poisson / nuoc mam","½ piment oiseau (optionnel)","500 ml chair de pomelo (env. 2 verres)","2 c.à.s. cacahuètes grillées non salées, en gros morceaux","1 c.à.s. coriandre fraîche","1 c.à.s. noix de coco râpée non sucrée (optionnel)","3 c.à.s. échalotes ou oignon rouge, émincés finement","2 feuilles de kaffir en très fines lanières","1 tige citronnelle émincée finement","1 c.à.s. menthe (optionnel)"],"steps":["Préparer la sauce : mélanger sucre, jus de citron vert et sauce poisson. Goûter et rectifier l'équilibre salé/sucré/acide.","Peler le pomelo à l'aide d'un grand couteau. Prélever la chair, jeter les membranes, et la couper en petits morceaux avec les doigts. Déposer dans un grand bol.","Ajouter les échalotes, le kaffir, la citronnelle, les cacahuètes, la coriandre et la noix de coco.","Verser la sauce sur la salade, mélanger et servir aussitôt."]},{"title":"Tomates cerises confites à la ricotta","subtitle":"Tomates fondantes et caramélisées sur un lit de ricotta crémeuse — parfait en entrée ou à l'apéritif","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["500 g tomates cerises","250 g ricotta","30 g parmesan râpé","4 c.à.s. huile d'olive","3 gousses ail en chemise","1 c.à.c. sucre","4 brins thym frais","10 feuilles basilic frais","½ citron (zeste)","sel, poivre noir","piment d'Espelette (facultatif)"],"steps":["Préchauffer le four à 160°C chaleur tournante. Cette température douce est la clé pour confire les tomates sans les brûler.","Laver et sécher les tomates cerises. Les couper en deux et disposer côté coupé vers le haut sur une plaque recouverte de papier cuisson. Parsemer de sucre, arroser d'huile d'olive, ajouter les brins de thym et les gousses d'ail en chemise légèrement écrasées. Saler et poivrer.","Enfourner et laisser confire 1 h à 1 h 15, jusqu'à ce que les tomates soient légèrement caramélisées, ridées et très fondantes.","Pendant ce temps, travailler la ricotta dans un bol avec le parmesan, le zeste de citron, une pincée de sel et un filet d'huile d'olive. Mélanger jusqu'à texture crémeuse et homogène. Réserver au frais.","Étaler généreusement la ricotta sur un plat de service ou des assiettes individuelles. Disposer les tomates confites encore tièdes par-dessus. Décorer de feuilles de basilic, d'un filet d'huile d'olive et, si souhaité, d'une pincée de piment d'Espelette."]},{"title":"Oignons au miso façon Ottolenghi","subtitle":"Oignons rôtis à 240°, laqués au beurre de miso — fondants, caramélisés, irrésistibles","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien","famille"],"ingredients":["1,2 kg oignons","100 g beurre fondu","100 g miso blanc","1 litre eau chaude"],"steps":["Peler les oignons. Les couper en deux dans le sens de la longueur.","Les placer dans un plat à bords hauts, face bombée vers le haut, bien serrés.","Mélanger le beurre fondu, le miso et l'eau chaude.","Couvrir hermétiquement de papier aluminium. Enfourner à 240 °C pendant 35 min.","Retirer le papier alu et retourner les oignons (face plane vers le haut). Arroser généreusement de beurre de miso.","Remettre au four 45 min (ou plus), en arrosant de beurre de miso toutes les 10 min environ, jusqu'à ce que les oignons soient tendres et bien dorés."]},{"title":"Chou-fleur grillé sauce tahini et grenade","subtitle":"Sommités de chou-fleur rôties au zaatar, sauce sésame-citron et grains de grenade","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien","rapide"],"ingredients":["1 gros chou-fleur (ou 2 petits)","huile d'olive","3 c.à.s. zaatar (ou 1 c.à.s. cumin)","sel, poivre ou piment","3 c.à.s. tahini (pâte de sésame)","½ jus de citron","½ gousse ail","½ verre eau (environ)","½ c.à.c. cumin","sel","grains de grenade","optionnel : coriandre, pois chiches ou boulgour"],"steps":["Retirer les feuilles du chou-fleur. Couper en grosses sommités.","Les déposer sur du papier cuisson. Parsemer d'aromates (zaatar ou cumin), sel, poivre. Arroser d'huile d'olive.","Cuire au four à 200 °C pendant 25 à 40 min selon la taille — bien grillé mais encore un peu ferme.","Sauce tahini : mixer tahini, jus de citron, ail dégermé et haché, cumin et éventuellement coriandre. Détendre à l'eau par petites quantités jusqu'à consistance yaourt liquide. Saler et rectifier.","Servir le chou-fleur avec des pois chiches (optionnel), napper d'une partie de la sauce tahini et parsemer de grains de grenade. Proposer le reste de sauce à part."]},{"title":"Carottes rôties façon Ottolenghi","subtitle":"Carottes rôties au sirop d'érable, sauce chamoy aux abricots et sumac","chapter":"III","chapter_name":"Salades, ceviche & légumes rôtis","tags":["végétarien"],"ingredients":["1 kg carottes","3 c.à.s. huile d'olive + 1,5 c.à.s. pour servir","1,5 c.à.s. sirop d'érable","30 g amandes grillées salées hachées","1/2 bouquet herbes variées (coriandre, aneth, menthe…)","Sel, poivre","— Pour la sauce —","40 g abricots secs","1 c.à.c. sirop d'érable","2 c.à.c. sumac","4,5 cl jus de citron vert","3/4 c.à.c. piment (ou piment d'Alep)","1 petite gousse d'ail"],"steps":["Découper les carottes en gros tronçons. Les enrober d'huile d'olive, sirop d'érable, sel et poivre.","Étaler sur une plaque sans chevauchement. Enfourner à 240°C environ 20 minutes — colorées mais encore légèrement croquantes.","Pendant la cuisson, mixer tous les ingrédients de la sauce jusqu'à consistance désirée (peut rester grumeleuse). Saler.","Verser les carottes cuites dans un saladier, ajouter la sauce, bien mélanger. Couvrir et laisser reposer 20 min.","Au moment de servir, ajouter les amandes, les herbes fraîches, un filet d'huile et un trait de citron vert."]},{"title":"Gaspacho pastèque","subtitle":"Soupe froide tomates-pastèque au basilic — fraîcheur maximale en 10 minutes","chapter":"IV","chapter_name":"Soupes & veloutés","tags":["sans gluten","végétarien","famille","rapide"],"ingredients":["500 g tomates, pédoncule retiré","200 g pastèque sans pépins","10 feuilles basilic","1 gousse ail","½ oignon","10 g vinaigre de cidre","35 g huile d'olive","quelques tranches de pain rassis (optionnel)"],"steps":["Mettre dans le mixeur tous les ingrédients sauf l'huile d'olive et le pain. Saler. Mixer finement.","Ajouter l'huile d'olive et mixer à nouveau — la texture devient plus dense et la couleur s'adoucit.","Goûter et rectifier (sel, basilic, vinaigre). Placer au frais.","Optionnel — croûtons : couper le pain en dés, arroser d'huile d'olive, vinaigre et sel. Cuire 10 min à 180 °C jusqu'à dorure.","Servir en verrines avec les croûtons, un peu de basilic, fleur de sel et un filet d'huile."]},{"title":"Soupe de courgettes et basilic","subtitle":"Veloutée, chaude ou froide — servie avec des dés de feta et graines pour le croquant","chapter":"IV","chapter_name":"Soupes & veloutés","tags":["sans gluten","végétarien","famille","rapide"],"ingredients":["2 courgettes taille moyenne","1 oignon","quelques feuilles de basilic","1 cube bouillon de volaille ou légumes (optionnel)","pour décorer : feta, poivron rouge, basilic, pignons, graines"],"steps":["Peler et émincer l'oignon, le faire revenir dans un peu d'huile d'olive.","Couper les courgettes en dés et les ajouter aux oignons. Faire revenir jusqu'à légère coloration.","Recouvrir d'eau, ajouter éventuellement le bouillon et peu de sel. Cuire 20 min jusqu'à ce que les courgettes soient tendres.","Mixer finement avec quelques feuilles de basilic (commencer par 3–4, ajuster au goût).","Rectifier l'assaisonnement. Servir chaud en bol, ou froid en verrine avec dés de feta, basilic et graines."]},{"title":"Soupe Tom Yum thaï aux crevettes","subtitle":"Bouillon parfumé citronnelle-kaffir-galanga avec crevettes et pleurotes au lait de coco","chapter":"IV","chapter_name":"Soupes & veloutés","tags":["poisson","rapide"],"ingredients":["12 crevettes entières avec carapace","0,75 l eau","2 tiges citronnelle en gros tronçons","6 feuilles keffir lime (combava), froissées","3–4 cm galanga en tranches (ou gingembre)","2 piments oiseau","250 g pleurotes (ou champignons de Paris)","1 c.à.s. pâte de chili (ou sucre de palme)","2 c.à.s. sauce poisson (nuoc mam)","jus de 1–2 citrons verts","6 c.à.s. lait de coco","coriandre pour décorer","optionnel : 1 tomate, ½ carotte, 2 oignons de printemps"],"steps":["Bouillon : retirer têtes, queues et carapaces des crevettes. Réserver les corps au frais. Faire revenir les carapaces dans un peu d'huile, ajouter ½ oignon si souhaité, puis l'eau. Cuire 20 min à petits bouillons. Passer au chinois.","Porter le bouillon à frémissement avec citronnelle, keffir, galanga, piments et optionnellement carottes et tomates. Cuire 5–10 min.","Ajouter les champignons et le lait de coco, cuire quelques minutes.","Ajouter les crevettes : au premier bouillon, retirer du feu. Elles cuisent dans le bouillon chaud.","Quand les crevettes sont roses, assaisonner : sauce poisson, jus de citron, pâte de chili. Goûter et rectifier.","Verser dans des bols, décorer de coriandre et oignons de printemps."]},{"title":"Soupe carottes gingembre","subtitle":"Veloutée, douce et légèrement épicée — belle couleur dorée et pleine de vitamines","chapter":"IV","chapter_name":"Soupes & veloutés","tags":["sans gluten","végétarien","rapide"],"ingredients":["500 g carottes","1 oignon","3 cm gingembre frais (ou 1 c.à.s. gingembre surgelé)","½ cube bouillon de poulet ou légumes","sel, poivre","un peu de lait ou lait de coco","optionnel : coriandre fraîche ou huile de coriandre"],"steps":["Peler et couper les carottes en petits dés. Peler et émincer l'oignon.","Faire chauffer de l'huile dans une casserole. Ajouter l'oignon et les carottes, faire légèrement colorer en remuant.","Peler et râper le gingembre (astuce : utiliser une cuiller à café pour éplucher). Ajouter et faire revenir 1–2 min.","Recouvrir d'eau à hauteur, ajouter le bouillon et saler. Réduire le feu, couvrir et cuire 45 min jusqu'à ce que les carottes soient tendres.","Transférer avec le bouillon dans le mixeur. Mixer jusqu'à consistance souhaitée en ajoutant un peu de lait ou lait de coco.","Goûter et rectifier. Servir éventuellement avec de la coriandre fraîche."]},{"title":"Velouté de panais, châtaignes et truffe","subtitle":"Élégant et réconfortant — une entrée de fête à préparer jusqu'à 2 jours à l'avance","chapter":"IV","chapter_name":"Soupes & veloutés","tags":["famille"],"ingredients":["2 panais","1 dizaine châtaignes cuites et pelées + 2–3 pour décorer","2 échalotes","¼ tablette bouillon de poule","½ à 1 l lait (selon consistance souhaitée)","1 c.à.s. miel","huile de truffe","sel, poivre"],"steps":["Peler et émincer les échalotes et les panais en petits dés (pour une cuisson plus rapide).","Faire chauffer du beurre dans une casserole. Faire revenir échalotes et panais jusqu'à légère coloration.","Ajouter les châtaignes et le miel. Mélanger.","Recouvrir de lait à hauteur et saler. Cuire à petit feu à couvert environ 30 min jusqu'à ce que les panais soient tendres.","Mixer finement en ajoutant du lait progressivement pour obtenir la consistance d'un velouté. Rectifier.","Verser dans des assiettes individuelles. Garnir d'éclats de châtaignes et de quelques gouttes d'huile de truffe."]},{"title":"Gaspacho tomate pastèque – verrines santé","subtitle":"Gaspacho onctueux tomate-pastèque au basilic, servi en petites verrines fraîches","chapter":"IV","chapter_name":"Soupes & veloutés","tags":["sans gluten","végétarien","famille","rapide"],"ingredients":["500 g tomates (rouge ou ananas)","200 g pastèque sans pépins","10–15 g vinaigre de cidre (ou de vin)","35 g huile d'olive","4 oignons nouveaux (ou 1 petit oignon)","1 petite gousse ail","10–15 feuilles basilic","½ galette de riz soufflé (ou 1 tranche de pain)","sel"],"steps":["Mettre tous les ingrédients dans le mixeur sauf l'huile d'olive. Mixer jusqu'à consistance lisse (ou légèrement rustique selon goût).","Ajouter l'huile d'olive et mixer à nouveau.","Goûter et rectifier l'assaisonnement. Réserver au frais.","Servir en verrines. Optionnel : ajouter des croûtons (dés de pain à l'huile et vinaigre, cuits 10 min à 180 °C)."]},{"title":"Soupe froide petits pois, menthe et noisettes","subtitle":"Velouté express vert vif — prêt en 10 min, servi en petites verrines élégantes","chapter":"IV","chapter_name":"Soupes & veloutés","tags":["sans gluten","végétarien","famille","rapide"],"ingredients":["300 g petits pois surgelés","300 g eau","½ cube bouillon de légumes","30 feuilles menthe","huile de noisettes","1 poignée noisettes"],"steps":["Faire cuire les petits pois avec les feuilles de menthe, l'eau et le bouillon au micro-ondes (5 min à 800W).","Couper les noisettes en éclats au couteau. Les faire griller à sec dans une poêle très chaude jusqu'à torréfaction. Réserver.","Mixer les petits pois cuits jusqu'à consistance désirée.","Ajouter un peu d'huile de noisettes et mixer à nouveau. Goûter et rectifier (sel, huile de noisettes).","Verser dans des petites verrines. Placer au réfrigérateur.","Juste avant de servir, garnir de feuilles de menthe fraîches et d'éclats de noisettes grillées."]},{"title":"Velouté de chou blanc au gingembre et curcuma","subtitle":"Soupe veloutée, douce et épicée, économique et pleine de saveurs","chapter":"IV","chapter_name":"Soupes & veloutés","tags":["sans gluten","végétarien","rapide"],"ingredients":["300 g chou blanc","1 pomme de terre","½ oignon","10 g gingembre frais râpé","½ c.à.c. curcuma en poudre","450 ml bouillon de légumes chaud","50 ml crème liquide (ou lait de coco)","jus de citron, graines de courge"],"steps":["Faire revenir l'oignon 3 min dans l'huile. Ajouter gingembre et curcuma, mélanger 1 min.","Ajouter le chou et la pomme de terre en dés. Verser le bouillon. Cuire 25 min à feu moyen.","Mixer jusqu'à texture lisse. Incorporer la crème et le jus de citron. Rectifier l'assaisonnement.","Servir dans des bols chauds avec graines de courge et filet d'huile d'olive."]},{"title":"Soupe de potimarron à la marocaine","subtitle":"Potimarron rôti au ras el-hanout, feta émiettée et pistaches concassées","chapter":"IV","chapter_name":"Soupes & veloutés","tags":["végétarien"],"ingredients":["600 g potimarron","1 échalote","1 c.à.c. ras el-hanout","40 g feta","2 c.à.s. pistaches décortiquées (ou graines de courge)","1 litre bouillon de légumes","huile d'olive, sel, poivre","quelques graines de grenade (facultatif)"],"steps":["Retirer les graines du potimarron et couper la chair en dés. Éplucher et hacher l'échalote.","Dans une casserole, faire revenir les dés de potimarron, l'échalote et le ras el-hanout avec un filet d'huile 2 min. Saler, verser le bouillon. Porter à ébullition puis laisser cuire 15 min à feu doux.","Faire griller les pistaches à sec 5 min sans cesser de remuer. Concasser. Émietter la feta.","Réserver 1 louche de bouillon. Mixer la soupe en ajoutant du bouillon réservé si trop épaisse.","Répartir dans 4 bols. Parsemer de feta, pistaches concassées et graines de grenade."]},{"title":"Gratin de patate douce, poulet et coriandre","subtitle":"Purée soyeuse de patate douce à la crème de coco, sur lit de poulet effiloché","chapter":"V","chapter_name":"Plats principaux","tags":["viande","sans gluten"],"ingredients":["2–3 patates douces (bio)","1 poulet rôti (restes) ou 3 escalopes","10 cl crème de coco","1 oignon rouge","1 gousse d'ail","coriandre fraîche","2 c.à.s. sauce Tamari (ou soja)","fromage râpé (Manchego)"],"steps":["Faire revenir l'oignon émincé et l'ail haché dans l'huile jusqu'à ce que les oignons soient fondants. Réserver dans le plat à gratin.","Cuire les cubes de patates douces 15–20 min dans l'eau bouillante salée jusqu'à tendreté.","Effilocher le poulet. Dans le plat, mélanger oignon, coriandre, poulet et Tamari. Étaler uniformément.","Mixer les patates égouttées avec huile et crème de coco jusqu'à texture ultra soyeuse. Saler.","Étaler la purée sur le mélange poulet, parsemer de fromage râpé. Griller à 200°C environ 10 min."]},{"title":"Boulettes de poulet à la sauge, feta & tomates séchées","subtitle":"Boulettes moelleuses aux parfums méditerranéens, servies avec sauce au yaourt","chapter":"V","chapter_name":"Plats principaux","tags":["viande","sans gluten"],"ingredients":["250 g poulet fermier","60 g feta","6 tomates séchées émincées","10 feuilles de sauge (ou menthe)","25 g poudre de noisettes","1 échalote finement émincée","1 jaune d'œuf","1 c.à.s. huile d'olive"],"steps":["Dans un robot (lame en S), mixer finement le poulet avec l'huile, le sel et le jaune d'œuf.","Ajouter les autres ingrédients et mixer par à-coups de façon homogène.","Huiler les mains, former des boulettes avec 1 c.à.c. de chair. Disposer sur plaque.","Badigeonner d'huile d'olive. Enfourner 15 min à 200°C. Servir avec yaourt grec, citron, sel & poivre."]},{"title":"Porc haché à la thaï","subtitle":"Saveurs de gingembre et citronnelle express — parfait sur un riz blanc","chapter":"V","chapter_name":"Plats principaux","tags":["viande","poisson","rapide","famille","sans gluten"],"ingredients":["500 g porc haché","1 oignon","2–3 cm racine de gingembre","1 bâtonnet citronnelle","4–5 feuilles de keffir (combawa)","2 petits piments oiseau","1 gousse ail","2 poivrons (mix de couleurs)","1 c.à.s. sauce poisson","½ jus de citron vert","feuilles de coriandre ou basilic thaï"],"steps":["Émincer l'oignon, éplucher le gingembre et le découper en fines rondelles. Taper la citronnelle avec le dos du couteau et la couper en 4 tronçons. Hacher l'ail finement.","Faire chauffer de l'huile neutre et ajouter l'oignon et l'ail.","Quand les oignons ont fondu, ajouter le porc et faire dorer en séparant les morceaux.","Ajouter un fond d'eau et gratter les sucs. Ajouter les feuilles de keffir, le gingembre, la citronnelle, les piments et les poivrons.","Couvrir et laisser cuire à feu doux 10 minutes (ne pas trop cuire).","Ajouter la sauce poisson petit à petit en goûtant. Ajouter le jus de citron, rectifier l'assaisonnement.","Servir avec coriandre ou basilic thaï et riz blanc."]},{"title":"Curry vert de poulet thaï","subtitle":"Curry thaï au lait de coco, basilic et légumes — facile et parfumé","chapter":"V","chapter_name":"Plats principaux","tags":["viande","poisson","sans gluten","famille"],"ingredients":["2 c.à.s. pâte de curry vert (maison ou du commerce)","20 feuilles env. basilic thaï (ou coriandre)","5 feuilles citron kaffir (ou zeste de combava)","300 g blancs de poulet, coupés en dés","légumes au choix : épinards, champignons, poivron, pousses de bambou","½ cube bouillon de volaille","0,5 l lait de coco","2 c.à.s. sauce poisson (nuoc mam)","2 c.à.s. pâte de tamarin","2 c.à.c. sucre de palme (ou sucre roux)","½ jus de citron vert"],"steps":["Faire revenir la pâte de curry dans un wok avec un peu d'huile 1 minute. Verser le lait de coco, 200 ml d'eau, le bouillon, 1 c.à.s. de sauce poisson, la pâte de tamarin, le sucre et les feuilles de kaffir.","Porter à ébullition, ajouter le poulet et les légumes coupés en dés. Cuire 10 à 15 min jusqu'à ce que le poulet soit cuit (ne pas surcuire).","Ajouter une partie du jus de citron vert. Goûter et rectifier l'assaisonnement (sauce poisson, sucre, citron).","Ajouter les feuilles de basilic thaï et servir avec un riz blanc."]},{"title":"Bœuf carottes de Jamie Oliver","subtitle":"Mijoté familial à la moutarde et sauce Worcestershire — encore meilleur réchauffé","chapter":"V","chapter_name":"Plats principaux","tags":["viande","sans gluten","famille"],"ingredients":["1 kg viande de bœuf (bourguignon, tendron — pas maigre)","500 g carottes","2 oignons","1 c.à.s. moutarde forte","120 ml sauce Worcestershire","persil pour décorer"],"steps":["Peler et couper les carottes en larges tronçons. Peler et émincer les oignons.","Faire chauffer un peu de matière grasse dans une cocotte allant au four. Faire revenir carottes et oignons jusqu'à légère coloration, puis les réserver.","Dans la même cocotte chaude, faire dorer les morceaux de viande (4×4 cm) en mélangeant régulièrement.","Remettre les carottes et oignons. Recouvrir d'eau à hauteur. Saler, ajouter la moutarde et la sauce Worcestershire.","Poser le couvercle et enfourner à 160 °C pendant 4 heures. Vérifier régulièrement le niveau de liquide.","Servir immédiatement ou réchauffer — c'est encore meilleur ! Accompagner de pommes de terre et carottes vapeur."]},{"title":"Nouilles sautées aux noix de cajou","subtitle":"Tofu mariné, légumes croquants et sauce cajou citronnée au sriracha, sauté au wok","chapter":"V","chapter_name":"Plats principaux","tags":["sans gluten","végétarien"],"ingredients":["300 g nouilles de riz séchées","160 g tofu ferme","½ tête brocoli","1 carotte","½ poivron rouge","2 oignons nouveaux","1 gousse ail râpée","1 c.à.c. gingembre frais râpé","1 poignée noix de cajou","2 c.à.s. huile de tournesol","2 c.à.s. sauce soja sucrée (marinade)","coriandre fraîche","2 citrons verts (jus)","1 c.à.c. gingembre frais râpé","1 c.à.s. purée de noix de cajou (ou sésame)","1 c.à.c. sriracha","5 c.à.s. sauce soja","2 c.à.s. huile de sésame toasté"],"steps":["Cuire les nouilles de riz selon le paquet. Rincer à l'eau froide et égoutter.","Égoutter le tofu, couper en bâtonnets. Mélanger avec le gingembre, l'ail et la sauce soja sucrée. Laisser mariner 10 min.","Préparer les légumes : brocoli en bouquets, carotte en fins bâtonnets, poivron en lanières, oignons émincés, coriandre ciselée.","Préparer la sauce cajou en mélangeant tous ses ingrédients dans un bol.","Dans un wok, faire brunir les noix de cajou à feu vif avec l'huile. Réserver sur une assiette, laisser l'huile dans le wok.","Faire revenir le tofu 2 min à feu vif en remuant. Ajouter le poivron, la carotte et le brocoli. Poursuivre 6 min.","Arroser de la moitié de la sauce cajou. Ajouter les nouilles et les oignons. Sauter 1 min. Verser le reste de sauce, mélanger.","Parsemer de coriandre ciselée et de noix de cajou grillées. Servir aussitôt."]},{"title":"Terrine végétale aux shiitakés","subtitle":"Lentilles, shiitakés, noisettes et cajou, liée au gel de chia","chapter":"V","chapter_name":"Plats principaux","tags":["sans gluten","végétarien","famille"],"ingredients":["200 g lentilles vertes","400 g champignons shiitakés","2 c.à.s. graines de chia","3 échalotes","80 g noisettes + 80 g cajou","50 g farine de pois chiche","1 c.à.s. tamari","4-épices, muscade, sel, poivre"],"steps":["Cuire les lentilles 40 min à petits bouillons. Écraser grossièrement à la fourchette.","Hydrater le chia dans 80 ml d'eau pendant 20 min. Faire revenir les shiitakés 15–20 min, hacher finement.","Mixer grossièrement échalotes, noisettes et cajous. Mélanger tout avec lentilles, champignons, épices, tamari et gel de chia.","Incorporer la farine de pois chiche. Tasser dans moule chemisé. Cuire à 180°C pendant 40 min."]},{"title":"Tofu soyeux au sésame","subtitle":"Rectangles de tofu dorés à la poêle, sauce soja-sésame et coriandre fraîche","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien","rapide"],"ingredients":["450 g tofu soyeux","4 brins coriandre ciselée","1 c.à.s. graines de sésame","3 c.à.s. sauce soja","3 c.à.s. huile de sésame","huile de tournesol pour cuisson"],"steps":["Égoutter le tofu et le déposer sur une assiette. Couper en deux dans la longueur puis en 4 ou 5 dans la largeur pour obtenir de petits rectangles.","Préparer la sauce : mélanger dans un bol la sauce soja, l'huile de sésame et les graines de sésame.","Égoutter une dernière fois le tofu en inclinant l'assiette. Chauffer l'huile de tournesol dans une poêle et faire dorer les morceaux 5 min à feu moyen sans toucher (risque de casser).","Retourner délicatement à la spatule et dorer encore 5 min.","Verser un tiers de la sauce sur le tofu et retirer du feu. Enrober les morceaux de sauce, disposer sur un plat. Parsemer de coriandre. Servir avec le reste de sauce."]},{"title":"Dahl","subtitle":"Le plat emblématique de la cuisine végétarienne indienne — lentilles au curry et lait de coco","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["350 g riz basmati complet","80 cl eau","160 g lentilles corail","2 échalotes","½ bouquet coriandre","1 c.à.s. curry","1 c.à.c. curcuma","300 g concassée de tomates","40 cl lait de coco","huile d'olive, sel, poivre"],"steps":["Cuire le riz basmati avec l'eau selon les instructions du paquet.","Rincer les lentilles. Peler et émincer les échalotes.","Dans une casserole, faire revenir les échalotes dans l'huile d'olive avec le curry et le curcuma pendant 2 minutes.","Ajouter les lentilles corail, le lait de coco et la concassée de tomates. Saler, porter à ébullition et laisser mijoter à feu doux 25 minutes.","Ciseler la coriandre et parsemer le dahl. Poivrer. Servir avec le riz basmati."]},{"title":"Bibimbap","subtitle":"Bol coréen de riz garni de légumes sautés à la sauce sésame, kimchi et œuf au plat","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["700 g riz rond cuit","4 champignons shiitaké séchés","2 carottes râpées","1 poignée pousses de soja","300 g épinards frais","4 œufs","80 g kimchi","huile de tournesol","pâte de piment Gochujang (facultatif)","Sauce à l'ail : 2 gousses ail, 4 c.à.c. sésame, 5 c.à.s. sauce soja, 1 c.à.s. vinaigre riz, 6 c.à.s. huile sésame toasté, 2 c.à.s. sucre"],"steps":["Réhydrater les shiitaké 20 min dans de l'eau froide. Égoutter, retirer les pieds et tailler les chapeaux en fines lanières.","Préparer la sauce à l'ail : râper l'ail et mélanger avec tous les autres ingrédients dans un bol.","Faire revenir les shiitaké dans un filet d'huile 2 min. Arroser avec ¼ de la sauce à l'ail. Réserver. Procéder de même avec les carottes, les pousses de soja et les épinards séparément.","Dans une poêle huilée, casser les œufs et cuire au plat à feu doux. Retirer du feu.","Répartir le riz bien chaud dans 4 grands bols. Garnir de légumes, de kimchi, d'un œuf et éventuellement de pâte Gochujang."]},{"title":"Ramen au miso et lait de soja","subtitle":"Bouillon umami au kombu et shiitaké, miso et lait de soja, garni de nouilles et légumes","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["400 g nouilles ramen séchées","2 œufs","2 oignons nouveaux","1 gousse ail râpée","3 cm gingembre frais râpé","¼ feuille algue nori en lamelles (facultatif)","60 g pousses de bambou cuites (conserve)","1 c.à.s. graines de sésame","1 c.à.s. sucre semoule","1 c.à.s. mirin","2 c.à.s. sauce soja","huile de tournesol, huile pimentée rayu (facultatif)","Bouillon : 1 morceau algue kombu, 6 shiitakés séchés, 1,2 l bouillon légumes, 60 cl lait de soja, 4 c.à.s. pâte miso, 1 poignée épinards"],"steps":["Préparer le bouillon : déposer le kombu et les shiitakés dans une grande casserole. Verser le bouillon de légumes et le lait de soja. Porter à frémissement. Retirer du feu et laisser infuser 1 heure.","Filtrer. Réserver les shiitakés. Remettre à frémissement, ajouter le miso et les épinards. Maintenir au chaud.","Retirer les pieds des shiitakés, tailler les chapeaux en lanières. Émincer les oignons nouveaux. Mélanger dans un bol l'ail, le gingembre, le sucre, le mirin et la sauce soja.","Faire revenir les champignons dans l'huile 3 min. Arroser de la sauce à l'ail. Poursuivre 1 min. Parsemer de sésame. Réserver au chaud.","Cuire les œufs 5 min dans l'eau bouillante. Égoutter, écaler et couper en deux.","Cuire les nouilles 2–4 min selon le paquet. Égoutter et répartir dans 4 grands bols. Disposer les shiitakés, les pousses de bambou, les épinards et les œufs. Verser le bouillon chaud. Garnir d'oignon nouveau et de nori. Arroser d'huile pimentée si désiré."]},{"title":"Polenta crémeuse aux légumes rôtis","subtitle":"Polenta au parmesan et lait, garnie de légumes rôtis au four, pesto de persil et noisettes","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["8 mini-carottes (ou 2 carottes)","½ fenouil","1 oignon rouge","1 tête ail","1 poignée noisettes","4 c.à.s. pesto de persil","huile d'olive, sel, poivre","180 g polenta","1 litre lait","50 g parmesan fraîchement râpé"],"steps":["Préchauffer le four à 180°C. Gratter les carottes et les couper en deux dans la longueur. Ôter les premières feuilles du fenouil et couper en lamelles. Émincer l'oignon. Détacher les gousses d'ail en gardant la peau.","Disposer les légumes et l'ail dans un saladier. Arroser d'huile d'olive, saler, poivrer et mélanger. Étaler sur une plaque de cuisson et enfourner 40 min.","Environ 10 min avant la fin, ajouter les noisettes sur la plaque pour les faire dorer. Concasser après cuisson.","Préparer la polenta : porter le lait à ébullition avec 1 pincée de sel. Verser la polenta en pluie en remuant au fouet. Cuire à feu doux jusqu'à épaississement. Hors du feu, incorporer un filet d'huile d'olive et le parmesan. Poivrer.","Répartir la polenta crémeuse dans 4 assiettes creuses. Disposer les légumes rôtis. Assaisonner de pesto de persil et décorer de noisettes concassées."]},{"title":"Tagliatelles au citron caramélisé","subtitle":"Tagliatelles aux blettes, citron confit caramélisé, parmesan et noisettes concassées","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["320 g tagliatelles","4 feuilles blette (sans les côtes)","½ oignon","1 gousse ail","2 citrons jaunes + jus ½ citron","1 poignée noisettes","50 g parmesan râpé","1 c.à.s. sucre semoule","1 piment séché","1 pincée curcuma","huile d'olive, sel, poivre"],"steps":["Torréfier les noisettes à sec 5 min sans cesser de remuer. Concasser.","Couper les citrons en fines rondelles, tailler chaque rondelle en quatre. Retirer les pépins. Blanchir les triangles 1 min dans de l'eau bouillante salée. Égoutter sur papier absorbant.","Chauffer un filet d'huile dans une poêle. Ajouter les morceaux de citron, une pincée de sel et le sucre. Faire revenir 4–5 min jusqu'à ce que le citron soit bien doré. Réserver.","Cuire les tagliatelles selon le paquet. Égoutter en réservant ½ verre d'eau de cuisson.","Émincer les blettes. Émincer l'oignon, hacher l'ail, hacher le piment. Faire revenir l'oignon, le piment et le curcuma 2 min dans l'huile. Ajouter les blettes et l'ail. Saler, poivrer et cuire 3 min.","Ajouter l'eau de cuisson des pâtes, le jus de citron et les tagliatelles égouttées. Saupoudrer de parmesan. Mélanger. Répartir dans 4 assiettes. Garnir de citron caramélisé et de noisettes concassées."]},{"title":"Trois délices de la terre","subtitle":"Aubergines, pommes de terre et poivron au wok, sauce soja épaissie à la fécule — spécialité chinoise","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["400 g aubergines chinoises","2 petites pommes de terre","1 poivron vert","2 gousses ail","1 ciboule ou oignon nouveau","½ c.à.c. fécule de pomme de terre","2½ c.à.s. sauce soja claire","8 cl eau","3 c.à.s. huile végétale","1 c.à.c. sucre semoule","sel"],"steps":["Laver les aubergines et les couper en lamelles (sans les éplucher). Faire dégorger dans une grande passoire saupoudrées de sel pendant 1 heure. Presser avec les mains pour extraire le maximum de jus.","Éplucher les pommes de terre. Couper les pommes de terre et le poivron en lamelles de même taille. Rincer les pommes de terre. Peler et hacher l'ail. Hacher la ciboule.","Chauffer 1 c.à.s. d'huile dans un wok à feu moyen. Faire dorer les pommes de terre 5 min. Ajouter le poivron et cuire 2 min. Débarrasser sur une assiette.","Faire chauffer le reste d'huile et cuire les aubergines 20 min à feu moyen jusqu'à tendreté. Ajouter 1 c.à.s. de sauce soja, les pommes de terre, le poivron, l'ail et la ciboule. Mélanger. Verser le reste de sauce soja et le sucre. Cuire encore 3 min.","Diluer la fécule dans 8 cl d'eau. Augmenter le feu au maximum. Verser la fécule délayée et remuer vivement : la sauce épaissit en quelques secondes. Arrêter la cuisson et servir."]},{"title":"Courge farcie au paneer","subtitle":"Butternut farcie d'une purée de courge, paneer maison et cumin, nappée de crème safranée","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["Paneer : 1 litre lait entier, 3 c.à.s. vinaigre blanc, 1 mousseline de coton","1 courge butternut","1 poignée graines de courge","1 petit oignon rouge","1 c.à.s. graines de cumin","1 dose safran en poudre ou filaments","20 cl crème liquide entière","sel"],"steps":["Préparer le paneer : faire bouillir le lait en surveillant. Couper le feu à l'ébullition et ajouter le vinaigre. Laisser cailler 10 min. Passer dans la mousseline en pressant pour égoutter au maximum. Donner la forme souhaitée et laisser reposer sous un poids 30 min. Placer au frais 30 min.","Préchauffer le four à 180°C. Couper la courge en deux, ôter les pépins et creuser la chair en laissant 1 cm de bords. Réserver la chair.","Cuire la chair de courge dans l'eau bouillante salée 6–7 min. Égoutter et écraser à la fourchette. Torréfier légèrement le cumin à sec. Chauffer la crème avec le safran sans faire bouillir.","Dans un saladier, mélanger la courge écrasée, l'oignon rouge haché, le paneer émietté et les graines de cumin. Saler. Garnir les 2 demi-courges.","Napper de crème safranée et saupoudrer de graines de courge. Enfourner 30 min dans la partie basse du four."]},{"title":"Yakisoba aux légumes","subtitle":"Nouilles japonaises sautées au wok avec tofu, shiitaké, poireaux et carotte en julienne","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["600 g nouilles yakisoba fraîches","150 g tofu ferme","2 poireaux","1 carotte","12 shiitaké frais","3 cm gingembre frais","2 c.à.s. graines de sésame noir","5 c.à.s. sauce soja épaisse aux champignons","3 c.à.s. sauce soja","1 c.à.s. huile de tournesol"],"steps":["Cuire les nouilles dans l'eau bouillante 1 min. Passer sous l'eau froide et égoutter.","Égoutter le tofu et couper en bâtonnets. Laver les poireaux et peler la carotte. Tailler en julienne. Nettoyer les shiitaké (ôter le pied) et couper en lamelles. Peler et hacher le gingembre.","Dans un wok, chauffer l'huile et faire revenir le tofu, les juliennes de poireaux et carotte et le gingembre à feu vif en remuant 10 min. Ajouter les champignons avec 3 c.à.s. d'eau et cuire encore 5 min.","Ajouter les nouilles dans le wok et faire sauter 2 min. Incorporer les deux sauces soja en enrobant bien. Répartir dans les assiettes et saupoudrer de sésame noir. Servir aussitôt."]},{"title":"Injera éthiopienne","subtitle":"Galettes de teff fermentées garnies de lentilles berbères aux épices","chapter":"V","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["125 g farine de teff (ou sarrasin)","2 c.à.c. levure de boulanger","½ c.à.c. sucre semoule","½ c.à.c. sel","½ c.à.c. levure chimique","15 cl eau tiède","1 c.à.c. vinaigre de vin","Lentilles : 300 g lentilles, 1 oignon rouge, 2 gousses ail, 1 c.à.s. gingembre râpé, 1 piment séché, 2 clous girofle, 2 graines cardamome, 1 c.à.c. paprika, 75 cl bouillon légumes, 2 c.à.s. huile de coco","Garniture : ½ concombre, 1 poignée tomates cerises, feuilles de salade, ½ botte coriandre"],"steps":["Préparer les galettes : mélanger la farine de teff, la levure de boulanger et le sucre dans un saladier. Verser 10 cl d'eau tiède et mélanger au fouet. Couvrir et laisser reposer 1 heure.","Ajouter 5 cl d'eau tiède de plus, le sel, la levure chimique et le vinaigre.","Dans une poê
