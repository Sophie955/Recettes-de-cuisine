iche de gambero rosso aux agrumes","subtitle":"Gambero rosso cru en assiette, vinaigrette à l'orange réduite et pulpe de pamplemousse · Pour 6 · Préparation 30 min · Cuisson 2 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"","tags":["poisson","sans gluten"],"ingredients":["36 gambero rosso","2 pamplemousses","Jus de 1 citron jaune","1 pincée graines de coriandre","Fleur de sel, poivre mignonnette","— Vinaigrette à l'orange —","250 g jus d'orange","15 g jus de citron jaune","5 g vinaigre de riz","30 g huile d'olive","35 g huile de pépins de raisin","— Dressage —","1 pincée piment d'Espelette","Quelques feuilles de basilic nain"],"steps":["Décortiquer les gambas et inciser le dos pour retirer le boyau noir. Dresser sur 6 assiettes et réserver au réfrigérateur.","Vinaigrette : faire réduire le jus d'orange dans une casserole à feu doux jusqu'à consistance sirupeuse. Verser dans un bol, ajouter le jus de citron et le vinaigre de riz. Au fouet, monter d'abord à l'huile d'olive puis à l'huile de pépins de raisin.","Torréfier les graines de coriandre à sec dans une poêle chaude jusqu'à coloration. Passer brièvement au mixeur pour concasser grossièrement.","Peler les pamplemousses et détailler en suprêmes. Dans un saladier, fouetter les suprêmes pour en extraire la pulpe. Égoutter sur papier absorbant.","Assaisonner les gambas d'une pincée de fleur de sel, d'un trait de jus de citron, d'une pincée de poivre mignonnette et de coriandre concassée.","Verser 60 g de vinaigrette à l'orange sur les gambas, déposer comme un caviar la pulpe de pamplemousse sur chacune. Saupoudrer de piment d'Espelette et disposer quelques feuilles de basilic nain."]},{"title":"Salade de pastèque à la mélasse de grenade","subtitle":"Pastèque, feta, olives de Kalamata et vinaigrette à la mélasse de grenade et sumac · Pour 6 · Préparation 20 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"","tags":["végétarien","sans gluten"],"ingredients":["960 g pastèque","42 g oignon rouge","360 g feta","12 g persil plat","150 g olives de Kalamata","Fleur de sel, poivre mignonnette","— Vinaigrette —","40 g mélasse de grenade","30 g jus de citron jaune","4 g sumac","50 g huile de pépins de raisin","25 g huile d'olive","— Dressage —","1 pincée sumac","Quelques pousses de basilic nain","Quelques grains de grenade"],"steps":["Couper la pastèque en gros cubes. Émincer l'oignon rouge en pétales. Couper la feta en cubes. Ciseler le persil.","Vinaigrette : fouetter la mélasse de grenade, le jus de citron, le sumac, sel et poivre. Monter à l'huile de pépins de raisin puis à l'huile d'olive.","Mélanger pastèque, oignon, olives et feta dans un saladier. Ajouter la vinaigrette et le persil. Goûter et rectifier.","Parsemer de sumac, grains de grenade et basilic nain au moment de servir."]},{"title":"Tartare de bar, avocat et poivrons confits","subtitle":"Bar en dés, guacamole à la coriandre, tapenade noire et vinaigrette de carotte-passion · Pour 6 · Préparation 30 min · Cuisson 10 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"","tags":["poisson","sans gluten"],"ingredients":["780 g filets de bar","½ poivron rouge + ½ poivron jaune","1 filet huile d'olive","30 g échalotes","1 botte coriandre fraîche","Sel fin, poivre mignonnette","— Pickles oignon rouge —","1 oignon rouge, 300 g eau, 100 g vinaigre blanc, 30 g sucre, 3 g sel, 1 g poivre concassé","— Guacamole —","2 avocats mûrs, ½ botte coriandre, 10 g huile de sésame, 10 g huile d'olive, jus de 1 citron vert, sel, poivre","— Vinaigrette carotte —","50 g jus de carotte bio, 125 g coulis de passion, 12 g vinaigre balsamique blanc, jus de 2 citrons jaunes, 2 c.à.c. gomme xanthane, piment d'Espelette, sel, poivre","— Tapenade —","60 g olives noires dénoyautées"],"steps":["Retirer arêtes et peau des filets de bar, tailler en dés. Réserver au frais.","Pickles : émincer l'oignon rouge en pétales. Porter à ébullition eau, vinaigre, sel, sucre et poivre. Verser sur l'oignon. Laisser refroidir.","Guacamole : ciseler la coriandre. Récupérer la chair des avocats dans un bol avec l'huile de sésame, l'huile d'olive, le jus de citron vert, la coriandre, sel et poivre. Écraser au fouet et mélanger soigneusement. Réserver au frais.","Vinaigrette carotte : mélanger jus de carotte, coulis de passion, vinaigre balsamique blanc et jus de citron. Assaisonner de sel, poivre et piment d'Espelette. Mixer en ajoutant la gomme xanthane petit à petit.","Couper les poivrons en dés. Faire cuire dans un filet d'huile d'olive 10 minutes. Mixer les olives en tapenade. Ciseler finement échalotes et coriandre.","Mélanger le bar avec échalotes ciselées, tapenade, poivrons confits, coriandre et vinaigrette carotte. Rectifier l'assaisonnement.","Répartir le guacamole dans 6 assiettes, déposer le tartare dessus. Décorer de pickles d'oignon rouge et pousses de coriandre. Ajouter un filet de vinaigrette carotte avant de servir."]},{"title":"Salade de fenouil et courgette, vinaigrette au citron confit","subtitle":"Fenouil et courgette émincés à la mandoline, herbes fraîches et citron confit · Pour 4 · Préparation 35 min · Cuisson 15 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"","tags":["végétarien","sans gluten"],"ingredients":["2 gros bulbes de fenouil, parés et émincés à la mandoline","2 courgettes, émincées en rubans à la mandoline","20 g feuilles de menthe hachées","20 g aneth haché","25 g ciboulette en tronçons de 2 cm","7,5 cl huile d'olive","1 c.à.s. jus de citron","1½ c.à.c. graines de fenouil grillées et pilées","1½ c.à.c. grains de poivre rose pilés","Sel, poivre noir","— Vinaigrette au citron confit —","40 g citron confit (chair et peau hachées)","½ petite échalote hachée","1 gousse d'ail écrasée","1½ c.à.s. jus de citron","2½ c.à.s. huile d'olive"],"steps":["Vinaigrette : mixer le citron confit, l'échalote, l'ail et le jus de citron finement. Ajouter l'huile en filet en continuant de mixer 1-2 min jusqu'à sauce lisse.","Dans le robot, mixer les herbes avec 4 c.à.s. d'huile, sel et poivre en hachis fin.","Déposer le fenouil et la courgette dans un saladier. Ajouter le jus de citron, ¾ c.à.c. de sel et du poivre. Mélanger et laisser reposer 5 min. Incorporer les herbes.","Dans un grand plat, alterner couches de salade, vinaigrette, graines de fenouil et poivre rose. Répéter. Arroser du reste d'huile et servir aussitôt."]},{"title":"Coleslaw au citron vert, graines de pavot et noix de cajou au curcuma","subtitle":"Chou blanc croquant, carottes, sauce citron vert-moutarde et cajou épicées au curcuma · Pour 6 · Préparation 25 min · Cuisson 40 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"","tags":["végétarien","sans gluten"],"ingredients":["1 chou blanc (700 g râpé, sans trognon)","1-2 carottes, en julienne","1 oignon rouge émincé","15 g feuilles de coriandre fraîche","5 g feuilles de menthe","Sel, poivre noir","— Noix de cajou au curcuma —","2 c.à.c. sucre brun, 2½ c.à.c. huile d'olive, ¼ c.à.c. curcuma, 200 g noix de cajou grillées salées, 2 c.à.c. graines de cumin","— Huile aux feuilles de curry —","1 piment rouge émincé, 3 c.à.s. huile d'olive, 20 feuilles de curry fraîches","— Sauce au citron vert —","7 cl jus de citron vert, 2 c.à.c. moutarde de Dijon, 2 gousses d'ail écrasées, 1 c.à.s. graines de pavot, ¼ c.à.c. sel, 7,5 cl huile d'olive"],"steps":["Cajou : mélanger sucre, huile, curcuma et 2 c.à.s. d'eau dans une petite casserole. Porter à ébullition. Ajouter cajou et cumin, cuire 3-4 min en remuant. Étaler sur plaque. Enfourner à 160°C 14 min. Laisser refroidir.","Huile de curry : faire chauffer piment et huile dans une petite poêle 7 min à feu moyen. Ajouter les feuilles de curry, cuire 2-3 min jusqu'à translucides. Réserver.","Sauce : fouetter jus de citron vert, moutarde, ail, graines de pavot et sel. Incorporer l'huile d'olive en filet.","Mélanger chou, carottes, oignon, ½ c.à.c. sel et poivre. Verser la sauce, mélanger, laisser reposer 15 min. Incorporer les herbes.","Dresser dans un plat, arroser d'un filet d'huile de curry et saupoudrer d'une poignée de noix de cajou. Servir le reste des noix à part."]},{"title":"Courge musquée, huile infusée à l'orange et miel brûlé","subtitle":"Demi-lunes de butternut rôties à 240°, vinaigrette au miel caramélisé, origan et pecorino · Pour 4 · Préparation 15 min · Cuisson 40 min · Infusion 20 min à 1h","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"","tags":["végétarien","sans gluten"],"ingredients":["1 courge butternut (1,1 kg), pelée, coupée en deux, épépinée puis en demi-lunes de 1 cm (900 g)","2 c.à.s. huile d'olive","¼ c.à.c. noix de muscade fraîchement râpée","1½ c.à.s. miel liquide","1½ c.à.c. vinaigre de cidre","40 g pecorino en copeaux","1½ c.à.s. feuilles d'origan","20 g graines de courge grillées","Sel, poivre noir","— Huile infusée à l'orange —","2 oranges (15 g de zeste + segments)","4,5 cl huile d'olive"],"steps":["Huile infusée : prélever le zeste des oranges (15 g) sans l'écorce blanche. Hacher grossièrement et mixer avec l'huile 1 min. Transvaser dans un bol, laisser infuser 20–60 min. Filtrer dans un tamis fin. Prélever les segments des oranges pelées à vif au-dessus d'un tamis pour récupérer le jus. Réserver les segments et 1 c.à.s. de jus.","Mélanger la courge, l'huile d'olive, la muscade, ½ c.à.c. sel et poivre dans un grand saladier. Étaler sur 2 plaques tapissées de papier sulfurisé en espaçant bien. Enfourner à 240°C 20–25 min en retournant à mi-cuisson jusqu'à bien cuites et dorées. Laisser refroidir.","Faire chauffer le miel dans une petite poêle à feu moyen-vif. Cuire 2–3 min en remuant jusqu'à caramel sombre. Hors du feu, incorporer les segments d'orange, le jus réservé et le vinaigre. Laisser refroidir légèrement.","Disposer la courge et le pecorino dans un grand plat. Arroser de vinaigrette au miel, ajouter l'origan, les graines de courge et l'huile infusée à l'orange."]},{"title":"Salade de tomates à l'huile de gingembre et ail","subtitle":"Tomates anciennes et cerises sur une vinaigrette à l'huile infusée gingembre-ail et sauce poisson · Pour 4 · Préparation 10 min · Cuisson 25 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"","tags":["poisson","sans gluten"],"ingredients":["500 g tomates anciennes, en tranches de 1,5 cm","300 g tomates cerises (rouges, jaunes, oranges) coupées en deux","½ oignon rouge en fines rondelles","5 gousses d'ail émincées","35 g gingembre frais, en julienne","13,5 cl huile d'olive","Jus de 3-4 citrons verts (1 c.à.s. zeste + 3 c.à.s. jus)","2 c.à.s. sauce poisson (ou sauce soja pour version végane)","10 g feuilles de coriandre fraîche hachées","Flocons de sel de mer, poivre noir"],"steps":["Mélanger l'ail, le gingembre, l'huile et ½ c.à.c. de flocons de sel dans une sauteuse. Cuire à feu moyen-doux 25 min en faisant tourner la poêle de temps en temps jusqu'à légère dorure. Filtrer l'huile. Égoutter les solides sur papier absorbant pour les rendre croustillants.","Fouetter dans l'huile infusée refroidie le zeste de citron, le jus de citron, la sauce poisson et la coriandre.","Assaisonner les tomates de flocons de sel et poivre. Disposer avec l'oignon rouge dans un plat. Arroser de vinaigrette et garnir du mélange ail-gingembre croustillant. Servir aussitôt."]},{"title":"Écrasé de carottes, oignons marinés et pesto coriandre-pistaches","subtitle":"Carottes rôties écrasées au sirop d'érable, yaourt citronné et pesto vert aux pistaches · Pour 4 · Préparation 25 min · Cuisson 1h15","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"","tags":["végétarien","sans gluten"],"ingredients":["1,2 kg carottes, en tronçons de 3-4 cm","13,5 cl huile d'olive","¼ c.à.c. curcuma","7 gousses d'ail (6 entières + 1 écrasée)","2 c.à.c. graines de coriandre grossièrement pilées","2 c.à.c. graines de cumin grossièrement pilées","½ c.à.c. flocons de piment","1½ c.à.s. sirop d'érable ou d'agave","½ petit oignon rouge émincé","2 c.à.s. jus de citron vert","20 g coriandre fraîche hachée","2 oignons verts émincés","40 g pistaches légèrement grillées et hachées","60 g yaourt à la grecque","Sel, poivre noir"],"steps":["Préchauffer le four à 180°C. Mariner l'oignon rouge avec 1 c.à.s. de jus de citron vert et 1 pincée de sel. Réserver.","Dans un plat de cuisson, mélanger carottes, 4 c.à.s. d'huile, curcuma, 20 cl d'eau, ½ c.à.c. sel et poivre. Enfourner 25 min. Ajouter l'ail entier et les épices. Remettre 20 min. Monter à 210°C, arroser de sirop d'érable, remettre 10 min. Écraser grossièrement à la fourchette.","Pesto : mixer coriandre, oignons verts, pistaches, 3 c.à.s. d'huile, ail écrasé, ¾ c.à.c. sel et poivre en pâte grossière. Incorporer le reste d'huile.","Mélanger le yaourt avec le reste de jus de citron vert.","Étaler la purée de carottes dans un plat. Déposer des cuillerées de yaourt puis les deux tiers du pesto. Garnir d'oignons marinés. Servir chaud ou à température ambiante avec le reste de pesto à part."]},{"title":"Salade de poivrons grillés, concombre et fines herbes","subtitle":"Légumes grillés au four façon mechouia tunisienne, avec concombre croquant et herbes fraîches · Pour 4 · Préparation 20 min · Cuisson 30 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"","tags":["végétarien","sans gluten"],"ingredients":["4 poivrons verts, en carrés de 4 cm","2 poivrons rouges, en carrés de 4 cm","4 tomates en grappe, en quartiers","2 petits oignons rouges en gros morceaux","1 piment vert entier sans queue","6 grosses gousses d'ail épluchées","9 cl huile d'olive","1½ c.à.s. jus de citron","10 g persil haché","10 g coriandre fraîche hachée","1 concombre, pelé, épépiné et en cubes de 1 cm","3½ c.à.c. piment d'Urfa ou flocons de piment","Sel, poivre noir"],"steps":["Préchauffer le four à 230°C. Mélanger poivrons, tomates, oignons, piment, ail, 4 c.à.s. d'huile, ¼ c.à.c. sel et poivre. Étaler sur deux plaques et rôtir 30 min en remuant, jusqu'à légumes tendres et bien grillés.","Hacher grossièrement les légumes refroidis et transférer dans un saladier. Assaisonner de jus de citron, herbes, ½ c.à.c. sel et beaucoup de poivre.","Mélanger le concombre avec le reste d'huile, ¼ c.à.c. sel et poivre dans un autre saladier.","Étaler les légumes grillés dans un plat. Garnir de concombre et saupoudrer de piment."]},{"title":"Panais confits grillés aux herbes et au vinaigre","subtitle":"Panais confits dans l'huile puis grillés, sauce aux herbes fraîches et piments marinés · Pour 4 à 6 · Préparation 20 min · Cuisson 1h20","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"","tags":["végétarien","sans gluten"],"ingredients":["750 g panais moyens, épluchés et coupés en deux dans la longueur","11 gousses d'ail épluchées (10 entières + 1 écrasée)","45 cl huile d'olive","2 piments rouges en fins biseaux sans pépins","3 c.à.s. vinaigre de cidre","15 g coriandre fraîche hachée","10 g persil haché","1 c.à.c. poivre de la Jamaïque moulu","Sel marin en flocons, poivre noir"],"steps":["Préchauffer le four à 160°C. Mariner les piments dans le vinaigre et une pincée de sel.","Dans un plat de cuisson (30x20 cm), mettre panais, gousses d'ail entières, huile et 1 c.à.s. de sel en flocons. Couvrir de papier aluminium. Enfourner 1h. Retirer panais et ail du plat, réserver l'huile.","Faire chauffer une plaque en fonte bien graissée à feu vif. Griller les panais 2-3 min (en plusieurs tournées) jusqu'à marquage des deux côtés. Transférer dans un plat. Griller l'ail 1 min, ajouter aux panais.","Mixer herbes, ail écrasé, 6 cl d'huile de cuisson réservée, ¼ c.à.c. sel et poivre en hachis fin.","Ajouter herbes, piments marinés et poivre de la Jamaïque sur les panais. Remuer délicatement. Arroser de 2 c.à.s. d'huile réservée. Servir chaud ou à température ambiante."]},{"title":"Carpaccio de bœuf au pesto de basilic","subtitle":"Fines tranches de filet de bœuf, pesto basilic-pignons, copeaux de parmesan et roquette · Pour 6 · Préparation 30 min · Cuisson 7 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"","tags":["viande"],"ingredients":["600 g filet de bœuf","Jus de 2 citrons jaunes","1 filet huile d'olive","120 g copeaux de parmesan","30 g pignons de pin","60 g roquette","1 pincée fleur de sel","1 pincée poivre mignonnette","— Pesto —","2 gousses d'ail","1 botte basilic","8 g pignons de pin","10 g parmesan râpé","60 g huile d'olive","Sel fin, poivre mignonnette"],"steps":["Torréfier les pignons au four à 180°C pendant 7 min.","Pesto : éplucher l'ail, effeuiller le basilic. Mixer ail, basilic, pignons et parmesan en pâte lisse. Monter en versant l'huile d'olive en filet. Assaisonner.","Rouler le filet de bœuf dans du film alimentaire en serrant bien. Réserver 1h au réfrigérateur pour pouvoir le trancher en carpaccio.","Couper la viande en tranches très fines (en conservant le film). Retirer le film, dresser sur assiette. Assaisonner de jus de citron, huile d'olive, fleur de sel et poivre mignonnette.","Ajouter environ 90g de pesto, parsemer de copeaux de parmesan, pignons et feuilles de roquette."]},{"title":"Épaule d'agneau confite aux épices","subtitle":"Agneau désossé mariné à la harissa, ras el-hanout et curcuma, confit 12h avec chorba de légumes · Pour 6 · Préparation 2h · Cuisson 13h · Réfrigération 12h","chapter":"IV","chapter_name":"Plats principaux","sous_section":"","tags":["viande","famille"],"ingredients":["2 épaules d'agneau de 1,2 kg chacune","— Marinade —","30 g concentré de tomates, 40 g harissa, 30 g curcuma, 15 g gingembre en poudre, 20 g ras el-hanout, 20 g ail en poudre, 130 g huile d'olive, jus et écorces de 2 citrons jaunes, 6 branches thym, 30 g sel fin, 5 g poivre mignonnette","— Chorba —","2 oignons jaunes, 1 carotte, 1 tête ail, 2 courgettes, 2 navets, 3 tomates rondes, 30 g gingembre frais, 3 c.à.s. huile de pépins de raisin, 60 g ras el-hanout, 60 g coriandre en poudre, 30 g cumin en poudre, 100 g concentré de tomates, 2 bottes coriandre fraîche, sel, poivre","— Pickles oignon rouge —","1 oignon rouge, 300 g eau, 100 g vinaigre blanc, 30 g sucre, 3 g sel, 1 g poivre concassé","— Dressage —","120 g pois chiches cuits, pousses de coriandre"],"steps":["Marinade : prélever de fins copeaux d'écorce de citron. Fouetter concentré de tomates, harissa, épices et ail en poudre. Incorporer huile d'olive, jus et écorces de citron et thym. Saler et poivrer.","Dégraisser et désosser les épaules. Réserver les parures pour la chorba. Badigeonner la viande de marinade et laisser mariner une nuit au frais.","Chorba : éplucher et détailler les légumes en gros morceaux. Dans une cocotte, faire colorer les parures de viande dans l'huile. Ajouter légumes, épices, concentré de tomates et coriandre. Saler, poivrer. Couvrir d'eau et cuire 1h à feu doux. Filtrer.","Ajouter la chorba dans le plat de viande, couvrir de papier aluminium. Enfourner à 120°C pour 12 heures.","Pickles : émincer l'oignon en pétales. Porter à ébullition eau, vinaigre, sel, sucre et poivre. Verser sur l'oignon. Laisser refroidir.","Effilocher la viande cuite. Dresser dans un plat creux, disposer les pois chiches. Décorer de pickles d'oignon rouge et pousses de coriandre."]},{"title":"Pâtes à la crème d'aubergines fumées, sauce tahini","subtitle":"Aubergines grillées-fumées sur gril en fonte, sauce tomate-tahini et conchiglie al dente · Pour 4 · Préparation 20 min · Cuisson 1h","chapter":"IV","chapter_name":"Plats principaux","sous_section":"","tags":["végétarien"],"ingredients":["5 aubergines (1,25 kg) : 2 en cubes, 3 entières","16,5 cl huile d'olive","1 oignon coupé en six","2 petites tomates en grappe","1 piment rouge","3 c.à.s. concentré de tomates","1 c.à.c. paprika","7 gousses d'ail écrasées","80 g tahini","1 c.à.s. jus de citron","300 g conchiglie rigate","10 g persil grossièrement haché","Sel, poivre noir"],"steps":["Assaisonner les cubes d'aubergine d'huile, sel et poivre. Enfourner à 220°C 30 min en remuant à mi-cuisson jusqu'à dorure.","Piquer les 3 aubergines entières. Griller sur un gril en fonte huilé très chaud 35 min en retournant plusieurs fois. Griller aussi oignons, tomates et piment 10 min. Peler les aubergines (environ 320 g de chair). Mélanger avec les autres légumes grillés.","Dans une casserole, cuire concentré de tomates, paprika et ¾ de l'ail dans 4 c.à.s. d'huile 5 min. Mixer avec les légumes grillés. C'est la sauce de base.","Tahini : fouetter tahini, reste de l'ail, jus de citron, 7 cl d'eau et sel.","Cuire les pâtes 8 min al dente. Réserver 27,5 cl d'eau de cuisson. Égoutter.","Ajouter l'eau de cuisson et la moitié des cubes d'aubergine dans la sauce. Réchauffer. Incorporer les pâtes et remuer 2 min.","Mélanger le reste des cubes d'aubergine avec le persil et le reste d'huile. Dresser les pâtes, arroser de sauce tahini et garnir d'aubergines. Servir avec le reste de sauce tahini."]},{"title":"Pommes de terre rôties, aïoli et pignons sautés au beurre","subtitle":"Pommes de terre dorées au four, aïoli crémeux au yaourt et pignons caramélisés au paprika fumé · Pour 4 · Préparation 20 min · Cuisson 50 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"","tags":["végétarien"],"ingredients":["750 g petites pommes de terre nouvelles, coupées en deux","2 c.à.s. huile d'olive","5 g persil haché","Sel, poivre noir","— Aïoli —","2 grosses gousses d'ail écrasées, 1 c.à.c. moutarde de Dijon, 1 gros œuf + 1 jaune, 10 cl huile d'olive, 10 cl huile de tournesol, 1 c.à.s. jus de citron, 75 g yaourt à la grecque","— Pignons sautés —","30 g beurre doux, 20 g pignons de pin, ¼ c.à.c. paprika fumé"],"steps":["Préchauffer le four à 220°C. Faire cuire les pommes de terre 6 min dans de l'eau salée froide portée à ébullition jusqu'à presque cuites. Égoutter, éponger. Assaisonner d'huile, sel et poivre. Enfourner 35 min jusqu'à bien dorées en remuant 1-2 fois. Incorporer le persil.","Aïoli : mixer ail, moutarde, œuf, jaune et sel 10 s. Incorporer les huiles en filet pour obtenir une émulsion souple. Ajouter jus de citron et yaourt. Réserver au frais.","Faire fondre le beurre à feu moyen, ajouter les pignons et dorer 3-4 min. Incorporer le paprika. Retirer du feu.","Répartir l'aïoli dans un plat peu profond. Ajouter les pommes de terre chaudes et garnir de pignons."]},{"title":"Porridge d'avoine au beurre de soja et croustillant gingembre-ail","subtitle":"Porridge onctueux, beurre de soja umami, œuf mollet et miettes croustillantes de gingembre et ail · Pour 4 · Préparation 10 min · Cuisson 40 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"","tags":["végétarien"],"ingredients":["12 oignons verts, coupés en deux dans la longueur","3 c.à.s. huile d'olive","80 g gingembre frais, finement râpé","12 gousses d'ail (~1 tête), écrasées","4 gros œufs","160 g flocons d'avoine à gros grains","2 c.à.s. sauce soja","50 g beurre doux, bien froid en cubes de 2 cm","1 c.à.c. flocons de piment","Sel, poivre noir"],"steps":["Mélanger les oignons avec 1 c.à.s. d'huile, sel et poivre. Faire sauter la moitié des oignons dans une grande poêle antiadhésive à feu vif 3 min en retournant plusieurs fois. Répéter. Laisser la poêle refroidir.","Essuyer la poêle et chauffer à feu moyen avec le reste d'huile. Faire revenir gingembre et ail 15 min en remuant jusqu'à très dorés et croustillants. Réserver les deux tiers dans un bol, laisser le reste dans la poêle.","Cuire les œufs 6 min dans l'eau bouillante. Égoutter et écaler. Réserver.","Ajouter dans la poêle l'avoine, 1 litre d'eau, 1 c.à.c. sel et poivre. Porter à légère ébullition puis cuire 4 min à feu moyen en remuant jusqu'à porridge crémeux.","Sauce soja beurré : porter sauce soja et poivre à ébullition. Baisser le feu, incorporer le beurre froid en cubes 2 à 3 par 2 à 3 en attendant la fonte avant d'en rajouter. Ne pas laisser bouillir.","Répartir le porridge dans 4 bols, arroser de sauce au beurre de soja et garnir d'oignons. Couper les œufs en deux, saler, poivrer, déposer sur le porridge. Finir avec les miettes de gingembre-ail et flocons de piment."]},{"title":"Tiramisu à l'arabica","subtitle":"Tiramisu classique au café arabica serré, mascarpone-chantilly et cacao — à préparer 24h à l'avance · Pour 6 · Préparation 30 min · Réfrigération 24h","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["famille"],"ingredients":["110 g œufs entiers","90 g sucre","220 g mascarpone","235 g crème liquide entière","36 biscuits à la cuillère","20 cl café arabica serré","75 g cacao en poudre"],"steps":["Fouetter les œufs avec le sucre jusqu'à ce que le mélange blanchisse.","Mélanger le mascarpone avec la crème liquide et monter en chantilly. Incorporer délicatement les œufs blanchis.","Imbiber les biscuits de café tiède quelques secondes. Les ranger au fond d'un moule rectangulaire. Étaler une couche de crème. Renouveler pour obtenir deux couches de biscuits et deux couches de crème.","Saupoudrer d'une généreuse couche de cacao à la passette. Faire prendre au frais pendant 24 heures."]},{"title":"Bananes collantes au miso, citron vert et riz grillé","subtitle":"Bananes caramélisées au miso-beurre-anis étoilé, crème au citron vert et topping de riz grillé-sésame · Pour 4 · Préparation 20 min · Cuisson 25 min","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien"],"ingredients":["4 bananes moyennement mûres, pelées et coupées en deux dans la longueur","40 g beurre doux","70 g sucre roux","½ c.à.c. anis étoilé moulu","3 c.à.s. crème fraîche","1½ c.à.s. miso blanc","1 citron vert : 1 c.à.c. zeste râpé + 1½ c.à.c. jus","— Topping au riz grillé —","1 c.à.s. riz thaï gluant cru (ou riz au jasmin)","2 c.à.c. graines de sésame noir","½ c.à.c. anis étoilé moulu"],"steps":["Régler le four au maximum sur mode gril.","Topping : faire griller le riz 12-15 min à feu moyen dans une petite poêle en agitant. Broyer finement au moulin. Griller les graines de sésame 1 min. Mélanger avec l'anis étoilé. Réserver.","Dans une grande poêle en fonte allant au four, mélanger beurre, sucre, anis étoilé et la moitié de la crème fraîche. Chauffer à feu moyen en remuant pour faire fondre. Hors du feu, incorporer le miso au fouet.","Disposer les bananes face coupée vers le haut dans la poêle, napper du caramel. Enfourner 8 min jusqu'à bananes fondantes et légèrement dorées.","Mélanger le reste de crème fraîche avec le jus de citron vert. Verser sur les bananes. Saupoudrer de zeste et de 1 c.à.s. de topping. Servir dans la poêle avec le reste de topping à part."]},{"title":"Mouhalabieh au sirop d'orange et miel brûlé","subtitle":"Panna cotta moyen-orientale à la fleur d'oranger, kataifi croustillant et sucre de pistache · Pour 6 · Préparation 10 min · Cuisson 45 min · Repos 3h minimum","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien","famille"],"ingredients":["50 cl lait entier","20 cl crème double (ou crème fraîche d'Isigny)","50 g sucre en poudre","¼ c.à.c. sel en flocons","50 g farine de maïs","1 c.à.c. eau de fleur d'oranger","— Kataifi —","60 g kataifi (décongelés)","25 g beurre doux fondu","1 c.à.s. huile d'olive","30 g pistaches légèrement grillées","1 c.à.s. sucre en poudre","¼ c.à.c. sel en flocons","— Sirop d'orange au miel brûlé —","120 g miel liquide","2 oranges (1 pressée pour 6 cl de jus, 1 pelée en segments)"],"steps":["Prévoir 6 bols en verre ou verres à dessert. Mélanger dans une casserole le lait, la crème, le sucre et le sel. Porter à frémissement à feu moyen.","Dans un récipient, fouetter la farine de maïs avec 13 cl d'eau jusqu'à homogénéité. Quand le lait frémit, incorporer lentement en fouettant 2 min pour obtenir une consistance lisse et épaisse. Incorporer l'eau de fleur d'oranger. Verser rapidement dans une carafe pour répartir dans les bols. Couvrir de papier sulfurisé ou film. Laisser refroidir puis faire prendre au moins 3 h au réfrigérateur (ou toute une nuit).","Préchauffer le four à 180°C chaleur tournante. Mélanger kataifi, beurre et huile. Prendre ~10 g de nouilles et les enrouler autour de l'index pour former un nid. Déposer sur plaque. Faire 6 nids. Enfourner 12–15 min jusqu'à bien dorés.","Mixer pistaches, sucre et sel en poudre fine. Mélanger les nids refroidis avec les 2/3 du sucre de pistache.","Sirop : faire chauffer le miel à feu moyen-vif 8–9 min en remuant la casserole de temps en temps jusqu'à brun foncé. Retirer du feu, ajouter le jus d'orange. Laisser refroidir. Couper les segments en 3–4 morceaux et ajouter au sirop.","Au moment de servir, napper les mouhalabieh de sirop, garnir d'un nid de kataifi et d'une pincée de sucre de pistache. Servir froid."]},{"title":"Toum pour tuer les vampires","subtitle":"Condiment libanais à l'ail cru émulsionné dans l'huile — puissant et crémeux · Pour 350 g · Préparation 20 min","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces du monde","tags":["végétarien"],"ingredients":["100 g gousses d'ail pelées (~3 têtes bien sèches)","30 cl huile de tournesol (250 g) — ou autre huile neutre","7,5 cl jus de citron","Sel"],"steps":["Couper les gousses d'ail en deux dans la longueur. Retirer les germes avec un petit couteau.","Mettre l'ail dans le bol d'un robot avec ¼ c.à.c. de sel et 2 c.à.s. d'huile. Mixer 3 min jusqu'à mélange très lisse et aéré, en faisant des pauses pour racler les parois.","Sans cesser de mixer, incorporer très lentement ~6 cl d'huile en filet (un cinquième du volume restant), puis 1 c.à.s. de jus de citron. Alterner huile et citron en terminant par l'huile. Procéder très lentement pour éviter que le toum ne «tourne». Obtenir un mélange blanc, souple et homogène.","Transvaser dans un bocal stérilisé. Se conserve 4 semaines au réfrigérateur. Le toum perd de son intensité au fur et à mesure qu'il repose — pour les âmes sensibles, préparez-le quelques jours à l'avance."]},{"title":"Houmous crémeux à souhait","subtitle":"La méthode détaillée pour un houmous parfaitement onctueux · Pour 6 · Préparation 10 min · Cuisson 40 à 90 min · Trempage une nuit (si pois chiches secs)","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Tapenades & pesto","tags":["végétarien","sans gluten"],"ingredients":["— Option pois chiches secs —","200 g pois chiches secs, trempés toute une nuit dans beaucoup d'eau","⅛ c.à.c. bicarbonate de soude (pour le trempage)","— Option pois chiches en boîte —","2 boîtes pois chiches (800 g), égouttés (480 g)","— Pour le houmous —","⅛ c.à.c. bicarbonate de soude (si pois chiches secs)","1 pincée de cumin moulu","120–150 g tahini","1 gousse d'ail écrasée (ou plus selon goût)","1½ c.à.s. jus de citron (ou plus selon goût)","Quelques glaçons (25 g)","Sel","— Garnitures au choix —","Huile d'olive","Herbes hachées au choix","Noix grillées","Harissa à la rose (ou pâte de piment)"],"steps":["Conseils — 1. Pois chiches secs : les cuire jusqu'à très fondants. En boîte : les mijoter 15–20 min après les avoir pelés. 2. Les utiliser chauds — plus tendres et plus faciles à écraser. 3. Saler l'eau 15 min avant la fin avec une pincée de cumin. 4. Peler les pois chiches : essentiel pour la texture. 5. Ajouter des glaçons au moment de mixer : le choc thermique aère la préparation. 6. Ne pas mettre d'huile d'olive dans le houmous — le tahini suffit. Arroser généreusement une fois prêt. 7. Choisir le meilleur tahini : clair, à base de graines décortiquées, de préférence libanais ou palestinien.","Pois chiches secs : égoutter après trempage. Mettre dans une casserole avec le bicarbonate et de l'eau (4 cm au-dessus). Porter à ébullition à feu moyen-vif en écumant, puis baisser à feu moyen-doux, couvrir et laisser mijoter 30–50 min (vérifier la cuisson au bout de 20 min). Saler généreusement et ajouter le cumin 15 min avant la fin. Les pois chiches doivent être très fondants.","Peler les pois chiches secs : agiter à l'écumoire dans l'eau de cuisson pour que les peaux se détachent et remontent à la surface. Jeter les peaux (inutile de toutes les attraper). Passer à l'étape 5.","Pois chiches en boîte : étaler entre deux torchons et frotter vigoureusement quelques minutes sans écraser. Soulever le torchon — la friction aura décollé les peaux. Jeter les peaux.","Mettre les pois chiches en boîte pelés dans une casserole avec de l'eau à couvrir, 1 c.à.c. sel et une pincée de cumin. Laisser mijoter 15 min jusqu'à bien tendres.","Égoutter les pois chiches au-dessus d'un saladier en récupérant l'eau de cuisson. Mettre dans un robot avec 120 g de tahini, l'ail, le jus de citron, les glaçons, 2 c.à.s. d'eau de cuisson réservée et une bonne pincée de sel. Mixer pour obtenir un mélange homogène. Goûter et ajuster (tahini, ail, citron, sel, eau de cuisson). Chaque tahini étant différent, ne pas hésiter à en ajouter davantage. Mixer jusqu'à texture très lisse — au moins quelques minutes. Ne pas s'inquiéter si le houmous est un peu souple : il s'épaissira en reposant.","Étaler dans un plat peu profond et former un puits au centre. (Se conserve 2 jours au réfrigérateur dans un récipient hermétique.) Arroser d'un généreux filet d'huile d'olive. Personnaliser avec les garnitures choisies."]}];

  'Desserts & douceurs',

];

  'Quiches, tartes & petites bouchées': 'I',
  'Salades, ceviche & légumes rôtis': 'II',
  'Soupes & veloutés': 'III',
  'Plats principaux': 'IV',
  'Desserts & douceurs': 'V',

};

let searchQuery = '';
let activeFilter = 'all';

const searchInput = document.getElementById('search-input');
const clearBtn = document.getElementById('clear-btn');

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim().toLowerCase();
  clearBtn.style.display = searchQuery ? 'block' : 'none';
  render();
});
clearBtn.addEventListener('click', () => {
  searchInput.value = ''; searchQuery = ''; clearBtn.style.display = 'none';
  searchInput.focus(); render();
});

let activeChapter = '';

// Filtres tag — toggle on/off au clic
document.querySelectorAll('.pill[data-filter]').forEach(pill => {
  pill.addEventListener('click', () => {
    const filter = pill.dataset.filter;
    if (activeFilter === filter) {
      // Décliquer : désactiver le filtre
      pill.classList.remove('active');
      activeFilter = 'all';
    } else {
      // Activer ce filtre, désactiver les autres
      document.querySelectorAll('.pill[data-filter]').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      activeFilter = filter;
    }
    render();
  });
});

// Dropdown chapitre
function toggleDropdown() {
  const menu = document.getElementById('ch-menu');
  const btn = document.getElementById('chapter-btn');
  menu.classList.toggle('open');
  btn.classList.toggle('active');
}

function selectChapter(chapter, label) {
  activeChapter = chapter;
  const btn = document.getElementById('chapter-btn');
  const menu = document.getElementById('ch-menu');
  // Mettre à jour le texte du bouton
  btn.innerHTML = (chapter ? label : 'Chapitre') + ' <span class="ch-arrow">▾</span>';
  // Marquer l'option sélectionnée
  document.querySelectorAll('.ch-option').forEach(o => o.classList.remove('selected'));
  const sel = document.querySelector(`.ch-option[data-chapter="${chapter.replace(/&/g,'&amp;')}"]`);
  if (sel) sel.classList.add('selected');
  // Style actif du bouton
  btn.classList.toggle('active', chapter !== '');
  // Fermer le menu
  menu.classList.remove('open');
  btn.querySelector('.ch-arrow').style.transform = '';
  render();
}

document.querySelectorAll('.ch-option').forEach(opt => {
  opt.addEventListener('click', () => {
    const ch = opt.dataset.chapter;
    const label = ch ? opt.textContent.trim() : 'Chapitre';
    selectChapter(ch, label);
  });
});

// Fermer le dropdown en cliquant ailleurs
document.addEventListener('click', e => {
  const dropdown = document.getElementById('chapter-dropdown');
  if (dropdown && !dropdown.contains(e.target)) {
    document.getElementById('ch-menu').classList.remove('open');
    const btn = document.getElementById('chapter-btn');
    if (btn) btn.querySelector('.ch-arrow').style.transform = '';
  }
});

function resetAll() {
  searchInput.value = ''; searchQuery = ''; clearBtn.style.display = 'none';
  activeFilter = 'all'; activeChapter = '';
  document.querySelectorAll('.pill[data-filter]').forEach(p => p.classList.remove('active'));
  // Réinitialiser le dropdown
  const btn = document.getElementById('chapter-btn');
  if (btn) btn.innerHTML = 'Chapitre <span class="ch-arrow">▾</span>';
  btn && btn.classList.remove('active');
  document.querySelectorAll('.ch-option').forEach(o => o.classList.remove('selected'));
  render();
}

// ── Normalisation ────────────────────────────────────────────


// ── Stemming français basique ──────────────────────────────────


// ── Distance de Levenshtein ────────────────────────────────────


// ── Score d'un mot dans la liste de tokens ─────────────────────


function filterRecipes() {
  return RECIPES.filter(r => {
    if (activeChapter && r.chapter_name !== activeChapter) return false;
    if (activeFilter !== 'all' && !r.tags.includes(activeFilter)) return false;
    if (searchQuery) {
      const words = searchQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
      return words.every(w => {
        const inTitle    = (r.title + ' ' + (r.subtitle||'')).toLowerCase().includes(w);
        const inIngr     = r.ingredients.filter(i => i.toLowerCase().includes(w)).length;
        const inSteps    = r.steps.filter(s => s.toLowerCase().includes(w)).length;
        // Mot trouvé dans le titre/sous-titre → match direct
        if (inTitle) return true;
        // Mot trouvé dans les ingrédients : au moins 2 occurrences, ou 1 occurrence dans un ingrédient principal (pas optionnel)
        if (inIngr >= 2) return true;
        if (inIngr === 1) {
          const mainIngr = r.ingredients.filter(i => !i.toLowerCase().includes('optionnel') && !i.toLowerCase().includes('facultatif') && !i.toLowerCase().includes('à défaut') && !i.toLowerCase().includes('ou '));
          if (mainIngr.some(i => i.toLowerCase().includes(w))) return true;
        }
        // Mot trouvé dans les étapes : au moins 2 occurrences
        if (inSteps >= 2) return true;
        return false;
      });
    }
    return true;
  });
}

// ── Distance de Levenshtein (max 2) ────────────────────────────
function levenshtein(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 99;
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}

// ── Score de pertinence d'un mot dans un texte ─────────────────
function wordMatchScore(word, haystackTokens) {
  const stemW = stem(word);
  const len = word.length;
  // 1. Correspondance exacte
  if (haystackTokens.some(t => t === word)) return 3;
  // 2. Correspondance après stemming
  if (haystackTokens.some(t => stem(t) === stemW)) return 2;
  // 3. Levenshtein — tolérance selon longueur du mot
  const maxDist = len <= 4 ? 0 : len <= 7 ? 1 : 2;
  if (maxDist > 0 && haystackTokens.some(t => levenshtein(word, t) <= maxDist)) return 1;
  // 4. Correspondance partielle (le mot contient un token ou vice versa)
  if (len >= 4 && haystackTokens.some(t => t.length >= 4 && (t.includes(word) || word.includes(t)))) return 1;
  return 0;
}

// ── Tokeniser un texte ─────────────────────────────────────────




function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlight(text) {
  if (!searchQuery) return esc(text);
  let r = esc(text);
  searchQuery.split(/\s+/).filter(Boolean).forEach(w => {
    r = r.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi'), '<mark>$1</mark>');
  });
  return r;
}

function render() {
  const filtered = filterRecipes();
  const container = document.getElementById('recipes-container');
  const noResults = document.getElementById('no-results');
  const countEl = document.getElementById('result-count');
  const resetLink = document.getElementById('reset-link');

  const isFiltered = searchQuery || activeFilter !== 'all' || activeChapter !== '';
  resetLink.classList.toggle('show', isFiltered);
  countEl.innerHTML = `<strong>${filtered.length}</strong> recette${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) { container.innerHTML = ''; noResults.classList.add('show'); return; }
  noResults.classList.remove('show');

  const groups = {};
  filtered.forEach(r => { if (!groups[r.chapter_name]) groups[r.chapter_name] = []; groups[r.chapter_name].push(r); });
  const sortedChapters = CHAPTER_ORDER.filter(ch => groups[ch]);

  container.innerHTML = sortedChapters.map(chapter => {
    const chRecipes = groups[chapter];
    const num = CHAPTER_NUMS[chapter] || '';
    // Grouper par sous-section dans Sauces & bases
    const hasSousSections = chRecipes.some(r => r.sous_section);
    
    if (hasSousSections && chapter === 'Sauces & bases') {
      const ssGroups = {};
      const ssOrder = [];
      chRecipes.forEach(r => {
        const ss = r.sous_section || 'Autres';
        if (!ssGroups[ss]) { ssGroups[ss] = []; ssOrder.push(ss); }
        ssGroups[ss].push(r);
      });
      const uniqueSS = [...new Set(ssOrder)];
      const cards = uniqueSS.map(ss => {
        const ssRecipes = ssGroups[ss];
        const ssCards = ssRecipes.map(r => {
          const idx = RECIPES.indexOf(r);
          const hasContent = r.ingredients && r.ingredients.length > 0;
          const tags = r.tags.map(t => `<span class="tag ${t.replace(/\s/g,'-')}">${t}</span>`).join('');
          return `
            <div class="recipe-card${hasContent ? '' : ' no-content'}" onclick="openModal(${idx})">
              <div class="card-tags">${tags}</div>
              <div class="card-title">${highlight(r.title)}</div>
              ${r.subtitle ? `<div class="card-subtitle">${highlight(r.subtitle)}</div>` : ''}
              ${hasContent ? `<div class="card-ing-count">${r.ingredients.length} ingrédient${r.ingredients.length > 1 ? 's' : ''}</div>` : ''}
              <span class="card-arrow">→</span>
            </div>`;
        }).join('');
        return `<div class="sous-section-group">
          <div class="sous-section-title">${ss}</div>
          <div class="recipe-grid">${ssCards}</div>
        </div>`;
      }).join('');
      return `<div class="chapter-group">
        <div class="chapter-title"><span class="chapter-num">Ch. ${num}</span>${chapter}</div>
        ${cards}
      </div>`;
    }
    
    const cards = chRecipes.map(r => {
      const idx = RECIPES.indexOf(r);
      const hasContent = r.ingredients && r.ingredients.length > 0;
      const tags = r.tags.map(t => `<span class="tag ${t.replace(/\s/g,'-')}">${t}</span>`).join('');
      return `
        <div class="recipe-card${hasContent ? '' : ' no-content'}" onclick="openModal(${idx})">
          <div class="card-tags">${tags}</div>
          <div class="card-title">${highlight(r.title)}</div>
          ${r.subtitle ? `<div class="card-subtitle">${highlight(r.subtitle)}</div>` : ''}
          ${hasContent ? `<div class="card-ing-count">${r.ingredients.length} ingrédient${r.ingredients.length > 1 ? 's' : ''}</div>` : ''}
          <span class="card-arrow">→</span>
        </div>`;
    }).join('');
    return `<div class="chapter-group">
      <div class="chapter-title"><span class="chapter-num">Ch. ${num}</span>${chapter}</div>
      <div class="recipe-grid">${cards}</div>
    </div>`;
  }).join('');
}

function openModal(idx) {
  const r = RECIPES[idx];
  const num = CHAPTER_NUMS[r.chapter_name] || '';
  const hasContent = r.ingredients && r.ingredients.length > 0;

  document.getElementById('modal-chapter').textContent = r.sous_section ? `Ch. ${num} · ${r.chapter_name} · ${r.sous_section}` : `Chapitre ${num} · ${r.chapter_name}`;
  document.getElementById('modal-title').textContent = r.title;
  document.getElementById('modal-subtitle').textContent = r.subtitle || '';
  document.getElementById('modal-tags').innerHTML = r.tags.map(t => `<span class="tag ${t.replace(/\s/g,'-')}">${t}</span>`).join('');

  const body = document.getElementById('modal-body');
  if (!hasContent) {
    body.innerHTML = `<div class="modal-missing">📄 Le contenu de cette recette n'a pas encore été importé.<br>Tu peux l'ajouter en partageant le PDF correspondant !</div>`;
  } else {
    const ingHtml = r.ingredients.filter(i => i && i.length > 1).map(i => {
      const trimmed = i.trim();
      if (trimmed.startsWith('—') || trimmed.startsWith('–')) {
        const label = trimmed.replace(/^[—–]\s*/, '').replace(/\s*[—–]$/, '');
        return `<li class="ing-section">${esc(label)}</li>`;
      }
      return `<li>${esc(trimmed)}</li>`;
    }).join('');
    let stepCounter = 0;
    const stepsHtml = r.steps.filter(s => s && s.length > 5).map(s => {
      const trimmed = s.trim();
      if (trimmed.startsWith('Conseils')) {
        const content = trimmed.replace(/^Conseils\s*[—–]\s*/, '');
        return `<div class="step-conseils"><div class="step-conseils-label">Conseils</div>${esc(content)}</div>`;
      }
      stepCounter++;
      return `<li><span class="step-num">${stepCounter}</span><span>${esc(trimmed)}</span></li>`;
    }).join('');
    body.innerHTML = `
      <div class="modal-section-title">Ingrédients</div>
      <ul class="ingredients-list">${ingHtml}</ul>
      <div class="modal-section-title">Préparation</div>
      <ol class="steps-list">${stepsHtml}</ol>`;
  }

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function closeModalOnOverlay(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// header-count removed
render();
</script>
</body>
