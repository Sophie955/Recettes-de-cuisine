oisson)","1 gousse d'ail","2 cm gingembre","Purée de piments rocoto ou aji limo (piments péruviens)","½ c.à.c. poivre noir moulu","Sel fin"],"steps":["Verser le jus des citrons verts dans un récipient. Ajouter l'ail et le gingembre épluchés et finement coupés.","Ajouter sel, poivre et une pointe de purée de piments.","Facultatif : filtrer avec un chinois pour un jus plus limpide.","Ajouter le poisson coupé en cubes (ou le fumet). Laisser mariner environ 30 min."],"source":"Petit Marabouts - Ceviche & Carpaccio"},{"title":"Achards aux graines de moutarde","subtitle":"Condiment indien de légumes croquants au curcuma et graines de moutarde","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Achards & salades indiennes","tags":["végétarien"],"ingredients":["½ chou blanc de taille moyenne","3 carottes","250 g haricots verts","2 c.à.c. graines de moutarde brune et jaune","½ c.à.c. curcuma","2 c.à.s. vinaigre de vin","2 c.à.s. huile de tournesol","Sel"],"steps":["Éplucher les carottes. Émincer finement le chou et les carottes. Blanchir 2–3 min dans l'eau bouillante salée avec les haricots verts. Bien égoutter.","Diluer le curcuma dans 5 cl d'eau chaude. Dans une grande sauteuse, chauffer 2 c.à.s. d'huile et faire sauter les graines de moutarde quelques minutes.","Ajouter les légumes croquants et le curcuma dilué. Laisser le liquide s'évaporer de moitié. Laisser refroidir et servir.","Se conserve jusqu'à 1 mois au frais dans un bocal hermétique."],"source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Kachumber salad","subtitle":"Salade indienne croquante au citron et coriandre fraîche","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Achards & salades indiennes","tags":["végétarien"],"ingredients":["1 petit oignon rouge","2 tomates fermes et bien mûres","1 petit concombre","6–7 radis","1 petit piment vert végétarien","½ botte de coriandre","Jus de 1 citron jaune","Huile d'olive","Sel, poivre"],"steps":["Éplucher le concombre et l'oignon rouge. Retirer les pédoncules des tomates, radis et piment (retirer les graines si trop fort). Hacher tous les légumes en petits cubes d'environ 1 cm.","Faire une vinaigrette : émulsionner le jus de citron, 3 c.à.s. d'huile d'olive, sel et poivre.","Mélanger les légumes avec la sauce et la coriandre ciselée. Servir bien frais."],"source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Tomates séchées marinées","subtitle":"Tomates séchées confites à l'huile d'olive avec ail et câpres","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["250 g pétales de tomates séchées nature","4 gousses d'ail","2 c.à.s. câpres","Graines de fenouil","Quelques branches de thym","Vinaigre blanc","Huile d'olive"],"steps":["Recouvrir les tomates dans une casserole d'un mélange moitié eau, moitié vinaigre blanc. Porter à ébullition 5 min, égoutter et sécher.","Remplir le bocal en couches (tomates, ail, câpres, fenouil, thym). Couvrir d'huile sans bulles d'air.","Fermer hermétiquement. Laisser reposer quelques semaines à l'abri de la lumière."],"source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Courgettes marinées","subtitle":"Rondelles de courgettes blanchies au vinaigre, marinées à l'huile","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["2 courgettes longues en rondelles de 0,5 cm","4 gousses d'ail","Feuilles de basilic ou de menthe","Graines de fenouil","Baies de poivre","Vinaigre blanc","Huile d'olive","Sel"],"steps":["Blanchir les rondelles 3–4 min dans un mélange moitié eau, moitié vinaigre blanc. Égoutter et sécher plusieurs heures sur un torchon.","Remplir le bocal par couches avec les aromates. Terminer en recouvrant d'huile d'olive.","Fermer hermétiquement. Réserver à l'abri de la lumière quelques semaines."],"source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Aubergines marinées","subtitle":"Aubergines blanchies puis marinées à l'huile et aux aromates","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["2 aubergines en rondelles","4 gousses d'ail","1 petit piment doux","Feuilles de basilic ou de menthe","Vinaigre blanc","Huile d'olive","Sel"],"steps":["Saupoudrer les aubergines de sel et laisser dégorger 12 heures dans une passoire.","Blanchir 5 min dans un mélange eau/vinaigre blanc comme pour les tomates. Égoutter et sécher.","Remplir le bocal par couches avec l'ail, le piment et les aromates, en finissant par l'huile."],"source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Oignons rouges marinés","subtitle":"Oignons rouges de Tropea cuits au vinaigre et marinés à l'huile","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["4 oignons rouges de Tropea","2 feuilles de laurier","Baies de poivre noir","Vinaigre blanc","Huile d'olive","2 c.à.c. sucre","1 c.à.c. sel"],"steps":["Peler et couper les oignons en rondelles grossières. Déposer dans une casserole, couvrir de vinaigre. Ajouter laurier, sel et sucre.","Porter à ébullition, couvrir et cuire 15 min à petits bouillons. Égoutter et sécher 2 heures sur un torchon.","Remplir le bocal par couches. Fermer hermétiquement. Laisser reposer quelques semaines."],"source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Radis et haricots verts marinés","subtitle":"Légumes croquants macérés 24h dans un vinaigre aux baies roses","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["5 radis roses","10 haricots verts","20 cl vinaigre de cidre","5 cl eau","½ c.à.c. baies roses","1 c.à.s. sucre semoule","½ c.à.c. sel"],"steps":["Éliminer le bout des radis et les couper en quatre. Équeuter les haricots et les couper en deux.","Préparer le mélange au vinaigre en portant à ébullition tous les ingrédients dans une casserole.","Mettre les légumes dans un bocal, recouvrir du mélange chaud, fermer hermétiquement.","Laisser macérer 24 h au réfrigérateur. Se conserve 3 semaines."],"source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Carotte et chou rouge marinés","subtitle":"Carotte râpée et chou rouge au vinaigre et graines de fenouil","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["1 petite carotte","100 g chou rouge","½ c.à.c. graines de fenouil","25 cl mélange au vinaigre (voir Radis et haricots verts)"],"steps":["Éplucher la carotte et la râper. Émincer le chou rouge.","Procéder comme pour les radis et haricots verts (mélange au vinaigre, bocal, macération 24 h)."],"source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Navet, oignon rouge et aneth marinés","subtitle":"Navet et oignon rouge marinés au vinaigre et poivre du Sichuan","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["100 g navet long blanc","1 petit oignon rouge","4 brins d'aneth","½ c.à.c. poivre du Sichuan","25 cl mélange au vinaigre (voir Radis et haricots verts)"],"steps":["Émincer le navet et l'oignon. Ciseler l'aneth.","Procéder comme pour les radis et haricots verts (mélange au vinaigre, bocal, macération 24 h)."],"source":"Le grand livre de la cuisine végétarienne des cinq continents"},{"title":"Pitas maison","subtitle":"Pains pita légers, aérés et bien gonflés — parfaits pour être farcis ou trempés · Pour 6 pitas · Préparation 5 min · Cuisson 40 min · Repos 1h20 minimum","chapter":"I","chapter_name":"Quiches, tartes & petites bouchées","sous_section":"","tags":["végétarien"],"ingredients":["24 cl d'eau tiède","2 c.à.c. levure sèche instantanée","2 c.à.c. sucre en poudre","300 g farine ordinaire + un peu pour saupoudrer","50 g farine complète","1 c.à.c. sel","1 c.à.s. huile d'olive + un peu pour graisser"],"steps":["Mettre l'eau dans un bol, saupoudrer la levure et le sucre. Laisser reposer 5–6 min pour former une mousse.","Verser les farines et le sel dans le bol d'un robot muni d'un crochet. Faire tourner à vitesse douce pour mélanger. Ajouter l'huile d'olive et le mélange à la levure, pétrir à vitesse moyenne-élevée pendant 7 min. La pâte doit être lisse, élastique et un peu collante.","Transférer la pâte dans un saladier huilé, couvrir d'un torchon humide et laisser lever 1–2 h dans un endroit chaud jusqu'à doubler de volume. (On peut aussi laisser lever toute une nuit au réfrigérateur.)","Sur un plan fariné, former 6 pâtons de 100 g. Rouler en boules, couvrir d'un torchon humide et laisser reposer 20 min.","Préchauffer le four à 240°C. Placer une grande plaque dans le four pour la faire chauffer.","Découper 2 morceaux de papier sulfurisé de la taille de la plaque, saupoudrer de farine. Déposer 2 boules de pâte bien espacées sur un morceau de papier. Au rouleau légèrement fariné, former des disques d'environ 12 cm. Ne pas trop travailler la pâte, sinon les pitas ne gonfleront pas.","Transférer délicatement sur la plaque chaude. Cuire 4–5 min jusqu'à légère dorure et gonflement. Couvrir d'un torchon humide pour garder au chaud (réutiliser le papier). Répéter jusqu'à 6 pitas. Garder couverts jusqu'au moment de servir."],"source":"Comfort - Ottolenghi"},{"title":"Ceviche de gambero rosso aux agrumes","subtitle":"Gambero rosso cru en assiette, vinaigrette à l'orange réduite et pulpe de pamplemousse · Pour 6 · Préparation 30 min · Cuisson 2 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Ceviche, carpaccio & tartare","tags":["poisson","sans gluten"],"ingredients":["36 gambero rosso","2 pamplemousses","Jus de 1 citron jaune","1 pincée graines de coriandre","Fleur de sel, poivre mignonnette","— Vinaigrette à l'orange —","250 g jus d'orange","15 g jus de citron jaune","5 g vinaigre de riz","30 g huile d'olive","35 g huile de pépins de raisin","— Dressage —","1 pincée piment d'Espelette","Quelques feuilles de basilic nain"],"steps":["Décortiquer les gambas et inciser le dos pour retirer le boyau noir. Dresser sur 6 assiettes et réserver au réfrigérateur.","Vinaigrette : faire réduire le jus d'orange dans une casserole à feu doux jusqu'à consistance sirupeuse. Verser dans un bol, ajouter le jus de citron et le vinaigre de riz. Au fouet, monter d'abord à l'huile d'olive puis à l'huile de pépins de raisin.","Torréfier les graines de coriandre à sec dans une poêle chaude jusqu'à coloration. Passer brièvement au mixeur pour concasser grossièrement.","Peler les pamplemousses et détailler en suprêmes. Dans un saladier, fouetter les suprêmes pour en extraire la pulpe. Égoutter sur papier absorbant.","Assaisonner les gambas d'une pincée de fleur de sel, d'un trait de jus de citron, d'une pincée de poivre mignonnette et de coriandre concassée.","Verser 60 g de vinaigrette à l'orange sur les gambas, déposer comme un caviar la pulpe de pamplemousse sur chacune. Saupoudrer de piment d'Espelette et disposer quelques feuilles de basilic nain."],"source":"Ma cuisine méditerranéenne - Mohamed Cheikh"},{"title":"Salade de pastèque à la mélasse de grenade","subtitle":"Pastèque, feta, olives de Kalamata et vinaigrette à la mélasse de grenade et sumac · Pour 6 · Préparation 20 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Salades","tags":["végétarien","sans gluten"],"ingredients":["960 g pastèque","42 g oignon rouge","360 g feta","12 g persil plat","150 g olives de Kalamata","Fleur de sel, poivre mignonnette","— Vinaigrette —","40 g mélasse de grenade","30 g jus de citron jaune","4 g sumac","50 g huile de pépins de raisin","25 g huile d'olive","— Dressage —","1 pincée sumac","Quelques pousses de basilic nain","Quelques grains de grenade"],"steps":["Couper la pastèque en gros cubes. Émincer l'oignon rouge en pétales. Couper la feta en cubes. Ciseler le persil.","Vinaigrette : fouetter la mélasse de grenade, le jus de citron, le sumac, sel et poivre. Monter à l'huile de pépins de raisin puis à l'huile d'olive.","Mélanger pastèque, oignon, olives et feta dans un saladier. Ajouter la vinaigrette et le persil. Goûter et rectifier.","Parsemer de sumac, grains de grenade et basilic nain au moment de servir."],"source":"Ma cuisine méditerranéenne - Mohamed Cheikh"},{"title":"Tartare de bar, avocat et poivrons confits","subtitle":"Bar en dés, guacamole à la coriandre, tapenade noire et vinaigrette de carotte-passion · Pour 6 · Préparation 30 min · Cuisson 10 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Ceviche, carpaccio & tartare","tags":["poisson","sans gluten"],"ingredients":["780 g filets de bar","½ poivron rouge + ½ poivron jaune","1 filet huile d'olive","30 g échalotes","1 botte coriandre fraîche","Sel fin, poivre mignonnette","— Pickles oignon rouge —","1 oignon rouge, 300 g eau, 100 g vinaigre blanc, 30 g sucre, 3 g sel, 1 g poivre concassé","— Guacamole —","2 avocats mûrs, ½ botte coriandre, 10 g huile de sésame, 10 g huile d'olive, jus de 1 citron vert, sel, poivre","— Vinaigrette carotte —","50 g jus de carotte bio, 125 g coulis de passion, 12 g vinaigre balsamique blanc, jus de 2 citrons jaunes, 2 c.à.c. gomme xanthane, piment d'Espelette, sel, poivre","— Tapenade —","60 g olives noires dénoyautées"],"steps":["Retirer arêtes et peau des filets de bar, tailler en dés. Réserver au frais.","Pickles : émincer l'oignon rouge en pétales. Porter à ébullition eau, vinaigre, sel, sucre et poivre. Verser sur l'oignon. Laisser refroidir.","Guacamole : ciseler la coriandre. Récupérer la chair des avocats dans un bol avec l'huile de sésame, l'huile d'olive, le jus de citron vert, la coriandre, sel et poivre. Écraser au fouet et mélanger soigneusement. Réserver au frais.","Vinaigrette carotte : mélanger jus de carotte, coulis de passion, vinaigre balsamique blanc et jus de citron. Assaisonner de sel, poivre et piment d'Espelette. Mixer en ajoutant la gomme xanthane petit à petit.","Couper les poivrons en dés. Faire cuire dans un filet d'huile d'olive 10 minutes. Mixer les olives en tapenade. Ciseler finement échalotes et coriandre.","Mélanger le bar avec échalotes ciselées, tapenade, poivrons confits, coriandre et vinaigrette carotte. Rectifier l'assaisonnement.","Répartir le guacamole dans 6 assiettes, déposer le tartare dessus. Décorer de pickles d'oignon rouge et pousses de coriandre. Ajouter un filet de vinaigrette carotte avant de servir."],"source":"Ma cuisine méditerranéenne - Mohamed Cheikh"},{"title":"Salade de fenouil et courgette, vinaigrette au citron confit","subtitle":"Fenouil et courgette émincés à la mandoline, herbes fraîches et citron confit · Pour 4 · Préparation 35 min · Cuisson 15 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Salades","tags":["végétarien","sans gluten"],"ingredients":["2 gros bulbes de fenouil, parés et émincés à la mandoline","2 courgettes, émincées en rubans à la mandoline","20 g feuilles de menthe hachées","20 g aneth haché","25 g ciboulette en tronçons de 2 cm","7,5 cl huile d'olive","1 c.à.s. jus de citron","1½ c.à.c. graines de fenouil grillées et pilées","1½ c.à.c. grains de poivre rose pilés","Sel, poivre noir","— Vinaigrette au citron confit —","40 g citron confit (chair et peau hachées)","½ petite échalote hachée","1 gousse d'ail écrasée","1½ c.à.s. jus de citron","2½ c.à.s. huile d'olive"],"steps":["Vinaigrette : mixer le citron confit, l'échalote, l'ail et le jus de citron finement. Ajouter l'huile en filet en continuant de mixer 1-2 min jusqu'à sauce lisse.","Dans le robot, mixer les herbes avec 4 c.à.s. d'huile, sel et poivre en hachis fin.","Déposer le fenouil et la courgette dans un saladier. Ajouter le jus de citron, ¾ c.à.c. de sel et du poivre. Mélanger et laisser reposer 5 min. Incorporer les herbes.","Dans un grand plat, alterner couches de salade, vinaigrette, graines de fenouil et poivre rose. Répéter. Arroser du reste d'huile et servir aussitôt."],"source":"Comfort - Ottolenghi"},{"title":"Coleslaw au citron vert, graines de pavot et noix de cajou au curcuma","subtitle":"Chou blanc croquant, carottes, sauce citron vert-moutarde et cajou épicées au curcuma · Pour 6 · Préparation 25 min · Cuisson 40 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Salades","tags":["végétarien","sans gluten"],"ingredients":["1 chou blanc (700 g râpé, sans trognon)","1-2 carottes, en julienne","1 oignon rouge émincé","15 g feuilles de coriandre fraîche","5 g feuilles de menthe","Sel, poivre noir","— Noix de cajou au curcuma —","2 c.à.c. sucre brun, 2½ c.à.c. huile d'olive, ¼ c.à.c. curcuma, 200 g noix de cajou grillées salées, 2 c.à.c. graines de cumin","— Huile aux feuilles de curry —","1 piment rouge émincé, 3 c.à.s. huile d'olive, 20 feuilles de curry fraîches","— Sauce au citron vert —","7 cl jus de citron vert, 2 c.à.c. moutarde de Dijon, 2 gousses d'ail écrasées, 1 c.à.s. graines de pavot, ¼ c.à.c. sel, 7,5 cl huile d'olive"],"steps":["Cajou : mélanger sucre, huile, curcuma et 2 c.à.s. d'eau dans une petite casserole. Porter à ébullition. Ajouter cajou et cumin, cuire 3-4 min en remuant. Étaler sur plaque. Enfourner à 160°C 14 min. Laisser refroidir.","Huile de curry : faire chauffer piment et huile dans une petite poêle 7 min à feu moyen. Ajouter les feuilles de curry, cuire 2-3 min jusqu'à translucides. Réserver.","Sauce : fouetter jus de citron vert, moutarde, ail, graines de pavot et sel. Incorporer l'huile d'olive en filet.","Mélanger chou, carottes, oignon, ½ c.à.c. sel et poivre. Verser la sauce, mélanger, laisser reposer 15 min. Incorporer les herbes.","Dresser dans un plat, arroser d'un filet d'huile de curry et saupoudrer d'une poignée de noix de cajou. Servir le reste des noix à part."],"source":"Comfort - Ottolenghi"},{"title":"Courge musquée, huile infusée à l'orange et miel brûlé","subtitle":"Demi-lunes de butternut rôties à 240°, vinaigrette au miel caramélisé, origan et pecorino · Pour 4 · Préparation 15 min · Cuisson 40 min · Infusion 20 min à 1h","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Légumes rôtis","tags":["végétarien","sans gluten"],"ingredients":["1 courge butternut (1,1 kg), pelée, coupée en deux, épépinée puis en demi-lunes de 1 cm (900 g)","2 c.à.s. huile d'olive","¼ c.à.c. noix de muscade fraîchement râpée","1½ c.à.s. miel liquide","1½ c.à.c. vinaigre de cidre","40 g pecorino en copeaux","1½ c.à.s. feuilles d'origan","20 g graines de courge grillées","Sel, poivre noir","— Huile infusée à l'orange —","2 oranges (15 g de zeste + segments)","4,5 cl huile d'olive"],"steps":["Huile infusée : prélever le zeste des oranges (15 g) sans l'écorce blanche. Hacher grossièrement et mixer avec l'huile 1 min. Transvaser dans un bol, laisser infuser 20–60 min. Filtrer dans un tamis fin. Prélever les segments des oranges pelées à vif au-dessus d'un tamis pour récupérer le jus. Réserver les segments et 1 c.à.s. de jus.","Mélanger la courge, l'huile d'olive, la muscade, ½ c.à.c. sel et poivre dans un grand saladier. Étaler sur 2 plaques tapissées de papier sulfurisé en espaçant bien. Enfourner à 240°C 20–25 min en retournant à mi-cuisson jusqu'à bien cuites et dorées. Laisser refroidir.","Faire chauffer le miel dans une petite poêle à feu moyen-vif. Cuire 2–3 min en remuant jusqu'à caramel sombre. Hors du feu, incorporer les segments d'orange, le jus réservé et le vinaigre. Laisser refroidir légèrement.","Disposer la courge et le pecorino dans un grand plat. Arroser de vinaigrette au miel, ajouter l'origan, les graines de courge et l'huile infusée à l'orange."],"source":"Comfort - Ottolenghi"},{"title":"Salade de tomates à l'huile de gingembre et ail","subtitle":"Tomates anciennes et cerises sur une vinaigrette à l'huile infusée gingembre-ail et sauce poisson · Pour 4 · Préparation 10 min · Cuisson 25 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Salades","tags":["poisson","sans gluten"],"ingredients":["500 g tomates anciennes, en tranches de 1,5 cm","300 g tomates cerises (rouges, jaunes, oranges) coupées en deux","½ oignon rouge en fines rondelles","5 gousses d'ail émincées","35 g gingembre frais, en julienne","13,5 cl huile d'olive","Jus de 3-4 citrons verts (1 c.à.s. zeste + 3 c.à.s. jus)","2 c.à.s. sauce poisson (ou sauce soja pour version végane)","10 g feuilles de coriandre fraîche hachées","Flocons de sel de mer, poivre noir"],"steps":["Mélanger l'ail, le gingembre, l'huile et ½ c.à.c. de flocons de sel dans une sauteuse. Cuire à feu moyen-doux 25 min en faisant tourner la poêle de temps en temps jusqu'à légère dorure. Filtrer l'huile. Égoutter les solides sur papier absorbant pour les rendre croustillants.","Fouetter dans l'huile infusée refroidie le zeste de citron, le jus de citron, la sauce poisson et la coriandre.","Assaisonner les tomates de flocons de sel et poivre. Disposer avec l'oignon rouge dans un plat. Arroser de vinaigrette et garnir du mélange ail-gingembre croustillant. Servir aussitôt."],"source":"Comfort - Ottolenghi"},{"title":"Écrasé de carottes, oignons marinés et pesto coriandre-pistaches","subtitle":"Carottes rôties écrasées au sirop d'érable, yaourt citronné et pesto vert aux pistaches · Pour 4 · Préparation 25 min · Cuisson 1h15","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Légumes rôtis","tags":["végétarien","sans gluten"],"ingredients":["1,2 kg carottes, en tronçons de 3-4 cm","13,5 cl huile d'olive","¼ c.à.c. curcuma","7 gousses d'ail (6 entières + 1 écrasée)","2 c.à.c. graines de coriandre grossièrement pilées","2 c.à.c. graines de cumin grossièrement pilées","½ c.à.c. flocons de piment","1½ c.à.s. sirop d'érable ou d'agave","½ petit oignon rouge émincé","2 c.à.s. jus de citron vert","20 g coriandre fraîche hachée","2 oignons verts émincés","40 g pistaches légèrement grillées et hachées","60 g yaourt à la grecque","Sel, poivre noir"],"steps":["Préchauffer le four à 180°C. Mariner l'oignon rouge avec 1 c.à.s. de jus de citron vert et 1 pincée de sel. Réserver.","Dans un plat de cuisson, mélanger carottes, 4 c.à.s. d'huile, curcuma, 20 cl d'eau, ½ c.à.c. sel et poivre. Enfourner 25 min. Ajouter l'ail entier et les épices. Remettre 20 min. Monter à 210°C, arroser de sirop d'érable, remettre 10 min. Écraser grossièrement à la fourchette.","Pesto : mixer coriandre, oignons verts, pistaches, 3 c.à.s. d'huile, ail écrasé, ¾ c.à.c. sel et poivre en pâte grossière. Incorporer le reste d'huile.","Mélanger le yaourt avec le reste de jus de citron vert.","Étaler la purée de carottes dans un plat. Déposer des cuillerées de yaourt puis les deux tiers du pesto. Garnir d'oignons marinés. Servir chaud ou à température ambiante avec le reste de pesto à part."],"source":"Comfort - Ottolenghi"},{"title":"Salade de poivrons grillés, concombre et fines herbes","subtitle":"Légumes grillés au four façon mechouia tunisienne, avec concombre croquant et herbes fraîches · Pour 4 · Préparation 20 min · Cuisson 30 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Salades","tags":["végétarien","sans gluten"],"ingredients":["4 poivrons verts, en carrés de 4 cm","2 poivrons rouges, en carrés de 4 cm","4 tomates en grappe, en quartiers","2 petits oignons rouges en gros morceaux","1 piment vert entier sans queue","6 grosses gousses d'ail épluchées","9 cl huile d'olive","1½ c.à.s. jus de citron","10 g persil haché","10 g coriandre fraîche hachée","1 concombre, pelé, épépiné et en cubes de 1 cm","3½ c.à.c. piment d'Urfa ou flocons de piment","Sel, poivre noir"],"steps":["Préchauffer le four à 230°C. Mélanger poivrons, tomates, oignons, piment, ail, 4 c.à.s. d'huile, ¼ c.à.c. sel et poivre. Étaler sur deux plaques et rôtir 30 min en remuant, jusqu'à légumes tendres et bien grillés.","Hacher grossièrement les légumes refroidis et transférer dans un saladier. Assaisonner de jus de citron, herbes, ½ c.à.c. sel et beaucoup de poivre.","Mélanger le concombre avec le reste d'huile, ¼ c.à.c. sel et poivre dans un autre saladier.","Étaler les légumes grillés dans un plat. Garnir de concombre et saupoudrer de piment."],"source":"Comfort - Ottolenghi"},{"title":"Panais confits grillés aux herbes et au vinaigre","subtitle":"Panais confits dans l'huile puis grillés, sauce aux herbes fraîches et piments marinés · Pour 4 à 6 · Préparation 20 min · Cuisson 1h20","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Légumes rôtis","tags":["végétarien","sans gluten"],"ingredients":["750 g panais moyens, épluchés et coupés en deux dans la longueur","11 gousses d'ail épluchées (10 entières + 1 écrasée)","45 cl huile d'olive","2 piments rouges en fins biseaux sans pépins","3 c.à.s. vinaigre de cidre","15 g coriandre fraîche hachée","10 g persil haché","1 c.à.c. poivre de la Jamaïque moulu","Sel marin en flocons, poivre noir"],"steps":["Préchauffer le four à 160°C. Mariner les piments dans le vinaigre et une pincée de sel.","Dans un plat de cuisson (30x20 cm), mettre panais, gousses d'ail entières, huile et 1 c.à.s. de sel en flocons. Couvrir de papier aluminium. Enfourner 1h. Retirer panais et ail du plat, réserver l'huile.","Faire chauffer une plaque en fonte bien graissée à feu vif. Griller les panais 2-3 min (en plusieurs tournées) jusqu'à marquage des deux côtés. Transférer dans un plat. Griller l'ail 1 min, ajouter aux panais.","Mixer herbes, ail écrasé, 6 cl d'huile de cuisson réservée, ¼ c.à.c. sel et poivre en hachis fin.","Ajouter herbes, piments marinés et poivre de la Jamaïque sur les panais. Remuer délicatement. Arroser de 2 c.à.s. d'huile réservée. Servir chaud ou à température ambiante."],"source":"Comfort - Ottolenghi"},{"title":"Carpaccio de bœuf au pesto de basilic","subtitle":"Fines tranches de filet de bœuf, pesto basilic-pignons, copeaux de parmesan et roquette · Pour 6 · Préparation 30 min · Cuisson 7 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande"],"ingredients":["600 g filet de bœuf","Jus de 2 citrons jaunes","1 filet huile d'olive","120 g copeaux de parmesan","30 g pignons de pin","60 g roquette","1 pincée fleur de sel","1 pincée poivre mignonnette","— Pesto —","2 gousses d'ail","1 botte basilic","8 g pignons de pin","10 g parmesan râpé","60 g huile d'olive","Sel fin, poivre mignonnette"],"steps":["Torréfier les pignons au four à 180°C pendant 7 min.","Pesto : éplucher l'ail, effeuiller le basilic. Mixer ail, basilic, pignons et parmesan en pâte lisse. Monter en versant l'huile d'olive en filet. Assaisonner.","Rouler le filet de bœuf dans du film alimentaire en serrant bien. Réserver 1h au réfrigérateur pour pouvoir le trancher en carpaccio.","Couper la viande en tranches très fines (en conservant le film). Retirer le film, dresser sur assiette. Assaisonner de jus de citron, huile d'olive, fleur de sel et poivre mignonnette.","Ajouter environ 90g de pesto, parsemer de copeaux de parmesan, pignons et feuilles de roquette."],"source":"Ma cuisine méditerranéenne - Mohamed Cheikh"},{"title":"Épaule d'agneau confite aux épices","subtitle":"Agneau désossé mariné à la harissa, ras el-hanout et curcuma, confit 12h avec chorba de légumes · Pour 6 · Préparation 2h · Cuisson 13h · Réfrigération 12h","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande"],"ingredients":["2 épaules d'agneau de 1,2 kg chacune","— Marinade —","30 g concentré de tomates, 40 g harissa, 30 g curcuma, 15 g gingembre en poudre, 20 g ras el-hanout, 20 g ail en poudre, 130 g huile d'olive, jus et écorces de 2 citrons jaunes, 6 branches thym, 30 g sel fin, 5 g poivre mignonnette","— Chorba —","2 oignons jaunes, 1 carotte, 1 tête ail, 2 courgettes, 2 navets, 3 tomates rondes, 30 g gingembre frais, 3 c.à.s. huile de pépins de raisin, 60 g ras el-hanout, 60 g coriandre en poudre, 30 g cumin en poudre, 100 g concentré de tomates, 2 bottes coriandre fraîche, sel, poivre","— Pickles oignon rouge —","1 oignon rouge, 300 g eau, 100 g vinaigre blanc, 30 g sucre, 3 g sel, 1 g poivre concassé","— Dressage —","120 g pois chiches cuits, pousses de coriandre"],"steps":["Marinade : prélever de fins copeaux d'écorce de citron. Fouetter concentré de tomates, harissa, épices et ail en poudre. Incorporer huile d'olive, jus et écorces de citron et thym. Saler et poivrer.","Dégraisser et désosser les épaules. Réserver les parures pour la chorba. Badigeonner la viande de marinade et laisser mariner une nuit au frais.","Chorba : éplucher et détailler les légumes en gros morceaux. Dans une cocotte, faire colorer les parures de viande dans l'huile. Ajouter légumes, épices, concentré de tomates et coriandre. Saler, poivrer. Couvrir d'eau et cuire 1h à feu doux. Filtrer.","Ajouter la chorba dans le plat de viande, couvrir de papier aluminium. Enfourner à 120°C pour 12 heures.","Pickles : émincer l'oignon en pétales. Porter à ébullition eau, vinaigre, sel, sucre et poivre. Verser sur l'oignon. Laisser refroidir.","Effilocher la viande cuite. Dresser dans un plat creux, disposer les pois chiches. Décorer de pickles d'oignon rouge et pousses de coriandre."],"source":"Ma cuisine méditerranéenne - Mohamed Cheikh"},{"title":"Pâtes à la crème d'aubergines fumées, sauce tahini","subtitle":"Aubergines grillées-fumées sur gril en fonte, sauce tomate-tahini et conchiglie al dente · Pour 4 · Préparation 20 min · Cuisson 1h","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien"],"ingredients":["5 aubergines (1,25 kg) : 2 en cubes, 3 entières","16,5 cl huile d'olive","1 oignon coupé en six","2 petites tomates en grappe","1 piment rouge","3 c.à.s. concentré de tomates","1 c.à.c. paprika","7 gousses d'ail écrasées","80 g tahini","1 c.à.s. jus de citron","300 g conchiglie rigate","10 g persil grossièrement haché","Sel, poivre noir"],"steps":["Assaisonner les cubes d'aubergine d'huile, sel et poivre. Enfourner à 220°C 30 min en remuant à mi-cuisson jusqu'à dorure.","Piquer les 3 aubergines entières. Griller sur un gril en fonte huilé très chaud 35 min en retournant plusieurs fois. Griller aussi oignons, tomates et piment 10 min. Peler les aubergines (environ 320 g de chair). Mélanger avec les autres légumes grillés.","Dans une casserole, cuire concentré de tomates, paprika et ¾ de l'ail dans 4 c.à.s. d'huile 5 min. Mixer avec les légumes grillés. C'est la sauce de base.","Tahini : fouetter tahini, reste de l'ail, jus de citron, 7 cl d'eau et sel.","Cuire les pâtes 8 min al dente. Réserver 27,5 cl d'eau de cuisson. Égoutter.","Ajouter l'eau de cuisson et la moitié des cubes d'aubergine dans la sauce. Réchauffer. Incorporer les pâtes et remuer 2 min.","Mélanger le reste des cubes d'aubergine avec le persil et le reste d'huile. Dresser les pâtes, arroser de sauce tahini et garnir d'aubergines. Servir avec le reste de sauce tahini."],"source":"Comfort - Ottolenghi"},{"title":"Pommes de terre rôties, aïoli et pignons sautés au beurre","subtitle":"Pommes de terre dorées au four, aïoli crémeux au yaourt et pignons caramélisés au paprika fumé · Pour 4 · Préparation 20 min · Cuisson 50 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien"],"ingredients":["750 g petites pommes de terre nouvelles, coupées en deux","2 c.à.s. huile d'olive","5 g persil haché","Sel, poivre noir","— Aïoli —","2 grosses gousses d'ail écrasées, 1 c.à.c. moutarde de Dijon, 1 gros œuf + 1 jaune, 10 cl huile d'olive, 10 cl huile de tournesol, 1 c.à.s. jus de citron, 75 g yaourt à la grecque","— Pignons sautés —","30 g beurre doux, 20 g pignons de pin, ¼ c.à.c. paprika fumé"],"steps":["Préchauffer le four à 220°C. Faire cuire les pommes de terre 6 min dans de l'eau salée froide portée à ébullition jusqu'à presque cuites. Égoutter, éponger. Assaisonner d'huile, sel et poivre. Enfourner 35 min jusqu'à bien dorées en remuant 1-2 fois. Incorporer le persil.","Aïoli : mixer ail, moutarde, œuf, jaune et sel 10 s. Incorporer les huiles en filet pour obtenir une émulsion souple. Ajouter jus de citron et yaourt. Réserver au frais.","Faire fondre le beurre à feu moyen, ajouter les pignons et dorer 3-4 min. Incorporer le paprika. Retirer du feu.","Répartir l'aïoli dans un plat peu profond. Ajouter les pommes de terre chaudes et garnir de pignons."],"source":"Comfort - Ottolenghi"},{"title":"Porridge d'avoine au beurre de soja et croustillant gingembre-ail","subtitle":"Porridge onctueux, beurre de soja umami, œuf mollet et miettes croustillantes de gingembre et ail · Pour 4 · Préparation 10 min · Cuisson 40 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien"],"ingredients":["12 oignons verts, coupés en deux dans la longueur","3 c.à.s. huile d'olive","80 g gingembre frais, finement râpé","12 gousses d'ail (~1 tête), écrasées","4 gros œufs","160 g flocons d'avoine à gros grains","2 c.à.s. sauce soja","50 g beurre doux, bien froid en cubes de 2 cm","1 c.à.c. flocons de piment","Sel, poivre noir"],"steps":["Mélanger les oignons avec 1 c.à.s. d'huile, sel et poivre. Faire sauter la moitié des oignons dans une grande poêle antiadhésive à feu vif 3 min en retournant plusieurs fois. Répéter. Laisser la poêle refroidir.","Essuyer la poêle et chauffer à feu moyen avec le reste d'huile. Faire revenir gingembre et ail 15 min en remuant jusqu'à très dorés et croustillants. Réserver les deux tiers dans un bol, laisser le reste dans la poêle.","Cuire les œufs 6 min dans l'eau bouillante. Égoutter et écaler. Réserver.","Ajouter dans la poêle l'avoine, 1 litre d'eau, 1 c.à.c. sel et poivre. Porter à légère ébullition puis cuire 4 min à feu moyen en remuant jusqu'à porridge crémeux.","Sauce soja beurré : porter sauce soja et poivre à ébullition. Baisser le feu, incorporer le beurre froid en cubes 2 à 3 par 2 à 3 en attendant la fonte avant d'en rajouter. Ne pas laisser bouillir.","Répartir le porridge dans 4 bols, arroser de sauce au beurre de soja et garnir d'oignons. Couper les œufs en deux, saler, poivrer, déposer sur le porridge. Finir avec les miettes de gingembre-ail et flocons de piment."],"source":"Comfort - Ottolenghi"},{"title":"Tiramisu à l'arabica","subtitle":"Tiramisu classique au café arabica serré, mascarpone-chantilly et cacao — à préparer 24h à l'avance · Pour 6 · Préparation 30 min · Réfrigération 24h","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":[],"ingredients":["110 g œufs entiers","90 g sucre","220 g mascarpone","235 g crème liquide entière","36 biscuits à la cuillère","20 cl café arabica serré","75 g cacao en poudre"],"steps":["Fouetter les œufs avec le sucre jusqu'à ce que le mélange blanchisse.","Mélanger le mascarpone avec la crème liquide et monter en chantilly. Incorporer délicatement les œufs blanchis.","Imbiber les biscuits de café tiède quelques secondes. Les ranger au fond d'un moule rectangulaire. Étaler une couche de crème. Renouveler pour obtenir deux couches de biscuits et deux couches de crème.","Saupoudrer d'une généreuse couche de cacao à la passette. Faire prendre au frais pendant 24 heures."],"source":"Ma cuisine méditerranéenne - Mohamed Cheikh"},{"title":"Bananes collantes au miso, citron vert et riz grillé","subtitle":"Bananes caramélisées au miso-beurre-anis étoilé, crème au citron vert et topping de riz grillé-sésame · Pour 4 · Préparation 20 min · Cuisson 25 min","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien"],"ingredients":["4 bananes moyennement mûres, pelées et coupées en deux dans la longueur","40 g beurre doux","70 g sucre roux","½ c.à.c. anis étoilé moulu","3 c.à.s. crème fraîche","1½ c.à.s. miso blanc","1 citron vert : 1 c.à.c. zeste râpé + 1½ c.à.c. jus","— Topping au riz grillé —","1 c.à.s. riz thaï gluant cru (ou riz au jasmin)","2 c.à.c. graines de sésame noir","½ c.à.c. anis étoilé moulu"],"steps":["Régler le four au maximum sur mode gril.","Topping : faire griller le riz 12-15 min à feu moyen dans une petite poêle en agitant. Broyer finement au moulin. Griller les graines de sésame 1 min. Mélanger avec l'anis étoilé. Réserver.","Dans une grande poêle en fonte allant au four, mélanger beurre, sucre, anis étoilé et la moitié de la crème fraîche. Chauffer à feu moyen en remuant pour faire fondre. Hors du feu, incorporer le miso au fouet.","Disposer les bananes face coupée vers le haut dans la poêle, napper du caramel. Enfourner 8 min jusqu'à bananes fondantes et légèrement dorées.","Mélanger le reste de crème fraîche avec le jus de citron vert. Verser sur les bananes. Saupoudrer de zeste et de 1 c.à.s. de topping. Servir dans la poêle avec le reste de topping à part."],"source":"Comfort - Ottolenghi"},{"title":"Mouhalabieh au sirop d'orange et miel brûlé","subtitle":"Panna cotta moyen-orientale à la fleur d'oranger, kataifi croustillant et sucre de pistache · Pour 6 · Préparation 10 min · Cuisson 45 min · Repos 3h minimum","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien"],"ingredients":["50 cl lait entier","20 cl crème double (ou crème fraîche d'Isigny)","50 g sucre en poudre","¼ c.à.c. sel en flocons","50 g farine de maïs","1 c.à.c. eau de fleur d'oranger","— Kataifi —","60 g kataifi (décongelés)","25 g beurre doux fondu","1 c.à.s. huile d'olive","30 g pistaches légèrement grillées","1 c.à.s. sucre en poudre","¼ c.à.c. sel en flocons","— Sirop d'orange au miel brûlé —","120 g miel liquide","2 oranges (1 pressée pour 6 cl de jus, 1 pelée en segments)"],"steps":["Prévoir 6 bols en verre ou verres à dessert. Mélanger dans une casserole le lait, la crème, le sucre et le sel. Porter à frémissement à feu moyen.","Dans un récipient, fouetter la farine de maïs avec 13 cl d'eau jusqu'à homogénéité. Quand le lait frémit, incorporer lentement en fouettant 2 min pour obtenir une consistance lisse et épaisse. Incorporer l'eau de fleur d'oranger. Verser rapidement dans une carafe pour répartir dans les bols. Couvrir de papier sulfurisé ou film. Laisser refroidir puis faire prendre au moins 3 h au réfrigérateur (ou toute une nuit).","Préchauffer le four à 180°C chaleur tournante. Mélanger kataifi, beurre et huile. Prendre ~10 g de nouilles et les enrouler autour de l'index pour former un nid. Déposer sur plaque. Faire 6 nids. Enfourner 12–15 min jusqu'à bien dorés.","Mixer pistaches, sucre et sel en poudre fine. Mélanger les nids refroidis avec les 2/3 du sucre de pistache.","Sirop : faire chauffer le miel à feu moyen-vif 8–9 min en remuant la casserole de temps en temps jusqu'à brun foncé. Retirer du feu, ajouter le jus d'orange. Laisser refroidir. Couper les segments en 3–4 morceaux et ajouter au sirop.","Au moment de servir, napper les mouhalabieh de sirop, garnir d'un nid de kataifi et d'une pincée de sucre de pistache. Servir froid."],"source":"Comfort - Ottolenghi"},{"title":"Toum pour tuer les vampires","subtitle":"Condiment libanais à l'ail cru émulsionné dans l'huile — puissant et crémeux · Pour 350 g · Préparation 20 min","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces du monde","tags":["végétarien"],"ingredients":["100 g gousses d'ail pelées (~3 têtes bien sèches)","30 cl huile de tournesol (250 g) — ou autre huile neutre","7,5 cl jus de citron","Sel"],"steps":["Couper les gousses d'ail en deux dans la longueur. Retirer les germes avec un petit couteau.","Mettre l'ail dans le bol d'un robot avec ¼ c.à.c. de sel et 2 c.à.s. d'huile. Mixer 3 min jusqu'à mélange très lisse et aéré, en faisant des pauses pour racler les parois.","Sans cesser de mixer, incorporer très lentement ~6 cl d'huile en filet (un cinquième du volume restant), puis 1 c.à.s. de jus de citron. Alterner huile et citron en terminant par l'huile. Procéder très lentement pour éviter que le toum ne «tourne». Obtenir un mélange blanc, souple et homogène.","Transvaser dans un bocal stérilisé. Se conserve 4 semaines au réfrigérateur. Le toum perd de son intensité au fur et à mesure qu'il repose — pour les âmes sensibles, préparez-le quelques jours à l'avance."],"source":"Comfort - Ottolenghi"},{"title":"Houmous crémeux à souhait","subtitle":"La méthode détaillée pour un houmous parfaitement onctueux · Pour 6 · Préparation 10 min · Cuisson 40 à 90 min · Trempage une nuit (si pois chiches secs)","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Tapenades & pesto","tags":["végétarien","sans gluten"],"ingredients":["— Option pois chiches secs —","200 g pois chiches secs, trempés toute une nuit dans beaucoup d'eau","⅛ c.à.c. bicarbonate de soude (pour le trempage)","— Option pois chiches en boîte —","2 boîtes pois chiches (800 g), égouttés (480 g)","— Pour le houmous —","⅛ c.à.c. bicarbonate de soude (si pois chiches secs)","1 pincée de cumin moulu","120–150 g tahini","1 gousse d'ail écrasée (ou plus selon goût)","1½ c.à.s. jus de citron (ou plus selon goût)","Quelques glaçons (25 g)","Sel","— Garnitures au choix —","Huile d'olive","Herbes hachées au choix","Noix grillées","Harissa à la rose (ou pâte de piment)"],"steps":["Conseils — 1. Pois chiches secs : les cuire jusqu'à très fondants. En boîte : les mijoter 15–20 min après les avoir pelés. 2. Les utiliser chauds — plus tendres et plus faciles à écraser. 3. Saler l'eau 15 min avant la fin avec une pincée de cumin. 4. Peler les pois chiches : essentiel pour la texture. 5. Ajouter des glaçons au moment de mixer : le choc thermique aère la préparation. 6. Ne pas mettre d'huile d'olive dans le houmous — le tahini suffit. Arroser généreusement une fois prêt. 7. Choisir le meilleur tahini : clair, à base de graines décortiquées, de préférence libanais ou palestinien.","Pois chiches secs : égoutter après trempage. Mettre dans une casserole avec le bicarbonate et de l'eau (4 cm au-dessus). Porter à ébullition à feu moyen-vif en écumant, puis baisser à feu moyen-doux, couvrir et laisser mijoter 30–50 min (vérifier la cuisson au bout de 20 min). Saler généreusement et ajouter le cumin 15 min avant la fin. Les pois chiches doivent être très fondants.","Peler les pois chiches secs : agiter à l'écumoire dans l'eau de cuisson pour que les peaux se détachent et remontent à la surface. Jeter les peaux (inutile de toutes les attraper). Passer à l'étape 5.","Pois chiches en boîte : étaler entre deux torchons et frotter vigoureusement quelques minutes sans écraser. Soulever le torchon — la friction aura décollé les peaux. Jeter les peaux.","Mettre les pois chiches en boîte pelés dans une casserole avec de l'eau à couvrir, 1 c.à.c. sel et une pincée de cumin. Laisser mijoter 15 min jusqu'à bien tendres.","Égoutter les pois chiches au-dessus d'un saladier en récupérant l'eau de cuisson. Mettre dans un robot avec 120 g de tahini, l'ail, le jus de citron, les glaçons, 2 c.à.s. d'eau de cuisson réservée et une bonne pincée de sel. Mixer pour obtenir un mélange homogène. Goûter et ajuster (tahini, ail, citron, sel, eau de cuisson). Chaque tahini étant différent, ne pas hésiter à en ajouter davantage. Mixer jusqu'à texture très lisse — au moins quelques minutes. Ne pas s'inquiéter si le houmous est un peu souple : il s'épaissira en reposant.","Étaler dans un plat peu profond et former un puits au centre. (Se conserve 2 jours au réfrigérateur dans un récipient hermétique.) Arroser d'un généreux filet d'huile d'olive. Personnaliser avec les garnitures choisies."],"source":"Comfort - Ottolenghi"},{"title":"Tofu brouillé et avocado toast au pain de seigle","subtitle":"Tofu émietté en sauce épicée curcuma-paprika, toast d'avocat et poivrons piquillo · Pour 2 · Préparation 25 min · Cuisson 15 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien","rapide"],"ingredients":["200 g tofu nature","1 gousse d'ail","1 oignon rouge","4 c.à.s. huile d'olive vierge bio","3 c.à.s. farine de blé","20 g levure nutritionnelle","1 c.à.c. paprika","1 c.à.c. curcuma","300 ml eau","2 c.à.s. crème de soja cuisine","1 c.à.c. moutarde de Dijon","1 c.à.c. herbes de Provence","Sel, poivre","1 avocat","2 petits poivrons rouges à l'huile (pimientos del piquillo)","1 c.à.s. jus de citron","2 à 4 tranches de pain complet de seigle","Persil frais (optionnel)","Graines de sésame noir (optionnel)"],"steps":["Émietter le tofu dans un bol avec la gousse d'ail hachée finement, 1 c.à.s. d'huile d'olive et une pincée de sel.","Dans une poêle, faire revenir l'oignon dans de l'huile d'olive environ 8 min. Ajouter le mélange de tofu assaisonné. Laisser chauffer environ 5 min.","Pendant ce temps, préparer la sauce : dans une casserole, mélanger à la cuillère en bois la farine, la levure, la moutarde, les épices et les herbes. Ajouter peu à peu l'eau et la crème de soja.","Battre le mélange pendant qu'il cuit à feu doux, jusqu'à ce que la sauce épaississe. Ajouter le jus de citron. Verser la sauce dans la poêle avec le tofu et mélanger.","Répartir la préparation chaude dans deux assiettes. Faire griller les tranches de pain et disposer dessus des tranches d'avocat et de fines lamelles de poivron rouge.","Saler et poivrer selon les goûts. Ajouter un peu de persil ciselé et de sésame noir si souhaité."],"source":"https://leculdepoule.co"},{"title":"Salade de courgettes confites et saumon","subtitle":"Courgettes fondantes confites à l'huile d'olive, saumon rôti, roquette et pignons · Pour 4 · Préparation 20 min · Cuisson 45 min · Repos 30 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Salades","tags":["poisson","sans gluten"],"ingredients":["30 g pignons de pin","— Échalotes marinées —","2 échalotes bananes, émincées (80 g)","8 cl jus de citron","1 c.à.c. sel","— Courgettes —","6 grosses courgettes, râpées grossièrement (environ 1 kg)","6 cl huile d'olive","Sel, poivre noir","— Saumon —","4 pavés de saumon de 130 g, avec la peau","1½ c.à.s. huile d'olive","80 g feuilles de roquette"],"steps":["Préchauffer le four à 180°C. Répartir les pignons sur une plaque et griller 10–12 min jusqu'à légère dorure. Réserver.","Échalotes marinées : déposer les échalotes et le jus de citron dans un bocal avec le sel. Fermer et agiter pour dissoudre le sel. Réserver.","Mettre les courgettes râpées dans un saladier avec 2 c.à.c. de sel, mélanger. Transférer dans une passoire au-dessus du saladier. Laisser reposer 30 min, puis presser fermement (elles doivent rendre environ 20 cl d'eau).","Faire chauffer l'huile à feu moyen dans une casserole. Ajouter les courgettes égouttées et cuire environ 5 min. Réduire à feu doux et laisser cuire encore 15 min en remuant régulièrement. Poivrer généreusement 5 min avant la fin. Obtenir une pâte fondante.","Monter le four à 200°C. Disposer le saumon sur une plaque tapissée de papier sulfurisé, côté peau en bas. Arroser d'huile, assaisonner de sel et poivre. Enfourner 8 min. Sortir et laisser reposer 15 min.","Disposer la roquette dans un plat. Déposer les ¾ des courgettes confites, puis émietter le saumon par-dessus. Répartir le reste des courgettes autour. Garnir d'échalotes marinées et de pignons grillés. Servir sans attendre."],"source":"Comfort - Ottolenghi"},{"title":"Tartare de courgettes, sauce à la mangue, au gingembre et à la menthe","subtitle":"Courgettes crues en petits cubes, sauce mangue-gingembre-citron, amandes effilées grillées","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Ceviche, carpaccio & tartare","tags":["végétarien","sans gluten"],"ingredients":["1 mangue pas trop mûre","1 morceau de gingembre frais de 2 cm","5 c.à.s. huile d'olive","Le jus de 1 citron","1 petit bouquet de menthe","2 courgettes émincées en petits cubes","50 g amandes effilées grillées","Sel, poivre"],"steps":["Mixer la chair de la mangue, le gingembre, l'huile et le jus de citron pour obtenir une sauce lisse.","Ajouter la menthe hachée finement. Saler et poivrer. Mélanger aux courgettes crues. Réserver au frais.","Au moment de servir, rectifier l'assaisonnement si nécessaire et saupoudrer d'amandes effilées grillées."],"source":"Les festins partagés de God save the cream"},{"title":"Salade de brocolis et courgettes rôties","subtitle":"Salade monochrome vert sur vert, courgettes rôties au four, brocoli blanchi et pistaches","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Légumes rôtis","tags":["végétarien","sans gluten"],"ingredients":["2 petites courgettes coupées en gros morceaux de 1 cm","1 c.à.s. bouillon de légumes déshydraté","2 c.à.s. huile d'olive","1 brocoli coupé en gros morceaux","30 g pistaches","Le zeste d'un citron (ou la peau d'un citron confit haché)","Sel, poivre"],"steps":["Mélanger les morceaux de courgettes dans un saladier avec le bouillon et l'huile d'olive. Étaler sur une plaque et cuire 5 min au four à 180°C.","Cuire les brocolis quelques secondes dans l'eau bouillante et les refroidir immédiatement dans un bain d'eau glacée.","Avant de servir, tout assembler dans un plat. Ajouter le zeste de citron. Rectifier l'assaisonnement. Parsemer de pistaches."],"source":"Les festins partagés de God save the cream"},{"title":"Œufs mimosa aux asperges et coulis vert","subtitle":"Asperges vapeur, œufs durs hachés, coulis vert aux sardines et pistaches grillées · Pour 4","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Salades","tags":["poisson"],"ingredients":["1 botte d'asperges vertes","2 œufs durs","1 gros bouquet de roquette","1 petite tasse de pistaches grillées grossièrement hachées","Huile d'olive, poivre du moulin","— Coulis vert —","1 boîte de sardines à l'huile, rincées","Le jus de 1,5 citron","1 filet d'huile d'olive","1 gousse d'ail écrasée","1 petit bouquet de ciboulette et persil plat","Quelques feuilles de consoude (ou épinards frais)","1 c.à.s. fromage frais type Philadelphia","Sel, poivre du moulin"],"steps":["Blanchir les asperges quelques minutes à la vapeur ou les faire sauter rapidement à la poêle avec un filet d'huile d'olive.","Hacher les œufs durs en tout petits morceaux.","Coulis : mixer tous les ingrédients du coulis et rectifier l'assaisonnement.","Dresser les asperges sur un lit de roquette, arroser de coulis vert, saupoudrer d'œufs durs hachés et de pistaches grillées. Ajouter quelques feuilles de roquette, un filet d'huile et un tour de moulin à poivre."],"source":"Les festins partagés de God save the cream"},{"title":"Fenouil rôti à la réglisse","subtitle":"Quartiers de fenouil rôtis à l'huile et bouillon, saupoudrés de poudre de réglisse","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Légumes rôtis","tags":["végétarien","sans gluten"],"ingredients":["4 petits fenouils coupés en quartiers","2 c.à.s. huile d'olive","2 c.à.s. bouillon de légumes déshydraté","Quelques pincées de réglisse en poudre (ou à défaut, quelques étoiles de badiane)"],"steps":["Nettoyer les fenouils, couper la base coriace et les branches. Couper en quartiers.","Mélanger avec l'huile d'olive et le bouillon. Étaler les quartiers dans un grand plat à gratin ou une plaque. Parsemer de poudre de réglisse.","Cuire à 180°C pendant 25 min. Servir chaud ou froid."],"source":"Les festins partagés de God save the cream"},{"title":"Houmous comme dans le sud de la France","subtitle":"Purée de pois chiches et fenouil au vermouth, garniture tomates-olives-poivron · Pour 6 · Préparation 20 min · Cuisson 40 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Légumes rôtis","tags":["végétarien"],"ingredients":["9 cl huile d'olive de bonne qualité","1 gros oignon, coupé en dés de 1 cm (200 g)","1 gros bulbe de fenouil, en cubes de 1 cm (275 g), frondes réservées","4 gousses d'ail, écrasées","2 c.à.c. graines de fenouil, légèrement grillées et grossièrement écrasées","4,5 cl vermouth sec (ou pastis)","700 g pois chiches en bocal, égouttés et rincés","4 cl jus de citron","10 g feuilles de basilic","— Garniture tomates, olives et poivron —","1 gros poivron rouge, coupé en deux et épépiné","3,5 cl huile d'olive","150 g tomates cerises, coupées en deux","1 petite gousse d'ail, écrasée","50 g olives dénoyautées (noires, à la niçoise de préférence), grossièrement hachées","1 c.à.c. vinaigre de vin rouge","Sel, poivre noir"],"steps":["Préchauffer le four à 240°C. Disposer les demi-poivrons sur une plaque, côté peau en haut. Arroser de 1 c.à.c. d'huile et rôtir 15 min. Transférer dans un bol, couvrir hermétiquement. Laisser refroidir, peler, détailler en fines lanières.","Déposer les tomates sur la même plaque avec l'ail, 1 c.à.s. d'huile, sel et poivre. Enfourner 5 min. Déposer dans le bol avec les poivrons. Ajouter les olives, le vinaigre et le reste d'huile.","Purée : chauffer 6 cl d'huile à feu doux dans une grande sauteuse. Ajouter oignon, fenouil et ½ c.à.c. de sel. Cuire 7 min jusqu'à ramollissement. Ajouter l'ail et 1½ c.à.c. de graines de fenouil, cuire encore 7–8 min jusqu'à fondants et légèrement colorés.","Verser le vermouth (il s'évapore rapidement). Ajouter les pois chiches et ¾ c.à.c. de sel. Cuire 2–3 min. Transférer dans le robot. Ajouter le jus de citron et 1 c.à.c. de poivre. Mixer en purée fine en incorporant 1 c.à.s. d'huile.","Transférer la purée dans un plat. Déposer la garniture par-dessus. Décorer avec basilic, frondes de fenouil et reste des graines de fenouil. Arroser du reste d'huile. Servir chaud ou à température ambiante."],"source":"Comfort - Ottolenghi"},{"title":"Curry de crevettes et asperges au curcuma frais","subtitle":"Pâte d'épices maison au curcuma frais, crevettes et asperges, relish concombre-gingembre · Pour 4 · Préparation 30 min · Cuisson 30 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Poisson","tags":["poisson","sans gluten"],"ingredients":["14,5 cl crème de coco","40 cl lait de coco","25 g sucre de palme haché (ou cassonade)","2 cl sauce de poisson","500 g asperges vertes, en tronçons de 3 cm (pointes séparées)","500 g crevettes crues, décortiquées","Riz thaï cuit à la vapeur, pour servir","— Relish concombre-gingembre —","12,5 cl vinaigre de riz (ou blanc), 80 g sucre, ½ concombre épépiné en fines tranches, 20 g gingembre en julienne, 1–2 piments rouges en lanières, 10 g coriandre (feuilles déchirées, tiges hachées), 1 citron vert en quartiers, sel","— Pâte d'épices —","5 g piments rouges séchés, 2 c.à.c. grains de poivre blanc grillés et moulus, 2 c.à.c. graines de coriandre grillées et moulues, 1–2 échalotes hachées (60 g), 4 gousses d'ail hachées, 20 g tiges de coriandre hachées, 10 g curcuma frais pelé haché, 1 c.à.s. crème de coco"],"steps":["Relish : porter à ébullition vinaigre, sucre, 6 cl d'eau et ½ c.à.c. sel. Laisser mijoter 1 min. Retirer du feu, laisser refroidir, puis ajouter concombre, gingembre, piment et tiges de coriandre. Réfrigérer.","Pâte d'épices : réhydrater les piments séchés dans l'eau bouillante quelques minutes. Mixer avec le reste des ingrédients de la pâte en purée lisse.","Verser la crème de coco dans une casserole et chauffer à feu moyen-vif. Dès que ça frémit, incorporer la pâte d'épices. Cuire 15–20 min en remuant souvent jusqu'à épaississement et séparation de la matière grasse.","Ajouter lait de coco, sucre, sauce de poisson et ½ c.à.c. sel. Mélanger et porter à ébullition. Ajouter les tiges d'asperges, cuire 4 min, puis les crevettes et les pointes d'asperges. Laisser mijoter encore 3–5 min (crevettes juste cuites).","Servir sans attendre avec du riz, la relish et des quartiers de citron vert. Ajouter les feuilles de coriandre sur la relish au dernier moment."],"source":"Comfort - Ottolenghi"},{"title":"Boulettes de poulet, pommes de terre et citron","subtitle":"Boulettes de poulet haché aux herbes pochées dans un bouillon aux pommes de terre, céleri et épices · Pour 4 · Préparation 30 min · Cuisson 45 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande"],"ingredients":["— Boulettes —","4 oignons verts grossièrement hachés (40 g)","15 g feuilles de menthe","15 g coriandre (feuilles et tiges)","2 gousses d'ail écrasées","500 g poulet haché","1 œuf battu","425 g pommes de terre farineuses (Bintje), pelées, finement râpées et pressées dans un torchon (environ 250 g)","1 c.à.c. cumin moulu","30 g chapelure fraîche ou panko","2 c.à.s. huile d'olive","Sel, poivre noir","— Sauce au yaourt —","150 g yaourt grec","10 g feuilles de menthe","10 g coriandre (feuilles et tiges)","Sel, poivre","— Bouillon —","3 c.à.s. huile d'olive + un peu pour servir","1 gros oignon émincé (200 g)","4–5 branches de céleri : tiges en morceaux de 2 cm (200 g) + feuilles grossièrement hachées (40 g)","2 citrons : 2 lanières de zeste + 6 cl de jus","550 g pommes de terre farineuses (Bintje), en morceaux de 3 cm (450 g)","8 gousses d'ail en tranches fines","2 c.à.c. curcuma moulu","1 c.à.s. cumin moulu","1½ c.à.c. cannelle moulue","50 cl bouillon de volaille (ou eau)","1 c.à.c. sucre en poudre","20 g coriandre (feuilles et tiges) grossièrement hachée"],"steps":["Boulettes : mixer oignons verts, menthe, coriandre et ail finement. Transférer dans un saladier, ajouter le reste des ingrédients sauf l'huile. Assaisonner de ½ c.à.c. sel et poivre. Mélanger. Façonner 16 boulettes d'environ 50 g. Réfrigérer 30 min.","Sauce au yaourt : mixer tous les ingrédients avec ½ c.à.c. sel et un peu de poivre jusqu'à texture lisse. Réserver au frais.","Faire chauffer 2 c.à.s. d'huile à feu moyen-vif dans une sauteuse. Faire revenir les boulettes 10 min sur toutes les faces. Retirer et réserver.","Bouillon : verser 3 c.à.s. d'huile dans la sauteuse. Ajouter oignon, tiges de céleri, zeste de citron, 1 c.à.c. sel et poivre. Faire revenir 7 min. Ajouter pommes de terre et ail, cuire encore 7 min. Ajouter les épices, remuer 1 min. Verser jus de citron, bouillon, sucre et feuilles de céleri. Porter à frémissement.","Plonger délicatement les boulettes dans le bouillon. Couvrir et laisser mijoter 25–30 min à feu doux jusqu'à boulettes cuites et liquide légèrement épaissi. Retirer du feu, incorporer la coriandre, laisser reposer 5 min.","Arroser d'huile, recouvrir d'un peu de sauce au yaourt. Servir avec le reste de sauce."],"source":"Les festins partagés de God save the cream"},{"title":"Boulettes de poulet aux abricots et aux noisettes","subtitle":"Boulettes généreuses au haché de poulet, feta, flocons d'avoine et abricots secs · Pour 4–6 · Préparation 10 min · Cuisson 20 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande"],"ingredients":["1 kg haché de poulet","100 g noisettes hachées","3 œufs","100 g feta coupée en petits morceaux","200 g flocons d'avoine","50 g abricots secs hachés","1 c.à.s. bouillon de légumes déshydraté","1 c.à.s. ail en poudre","Le zeste et le jus de ½ citron","1 c.à.s. sel","1 c.à.s. coriandre hachée"],"steps":["Préchauffer le four à 180°C.","Mélanger tous les ingrédients dans un saladier jusqu'à homogénéité.","Former 20 grosses boulettes. Les disposer dans un plat allant au four.","Cuire 20 minutes jusqu'à légère dorure. Servir aussitôt."],"source":"Les festins partagés de God save the cream"},{"title":"Poulet mariné aux épices, sauce aux cacahuètes","subtitle":"Cuisses de poulet marinées aux épices thaïes et sirop d'érable, rôties et servies avec sauce cacahuètes · Pour 4 · Préparation 15 min · Marinade 4h–24h · Cuisson 40 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande","sans gluten"],"ingredients":["8 cuisses de poulet avec la peau, légèrement entaillées (1 kg)","— Marinade —","2 c.à.s. coriandre moulue","1½ c.à.c. cumin moulu","1½ c.à.c. curcuma moulu","1 c.à.c. graines de fenouil finement écrasées","2 c.à.s. sirop d'érable","2 c.à.s. jus de citron vert","1 c.à.s. sambal oelek","1½ c.à.c. huile d'arachide","Sel","— Pour servir —","Sauce aux cacahuètes (voir recette)","1 citron vert en quartiers"],"steps":["Mélanger tous les ingrédients de la marinade avec 1½ c.à.c. de sel dans un grand sac alimentaire ou récipient. Ajouter le poulet, masser pour faire pénétrer les épices. Réserver au moins 4 h (et jusqu'à 24 h) au réfrigérateur.","Sortir le poulet du réfrigérateur 1 h avant la cuisson.","Préchauffer le four à 210°C. Déposer le poulet sur une plaque tapissée de papier sulfurisé, côté peau vers le haut. Rôtir 40 min en arrosant plusieurs fois de jus de cuisson jusqu'à bien doré.","Arroser d'un filet de sauce aux cacahuètes réchauffée. Servir avec le reste de sauce et les quartiers de citron vert."],"source":"Comfort - Ottolenghi"},{"title":"Poulet au fenouil et au citron","subtitle":"Blancs de poulet rôtis au zaatar, fenouil confit aux graines et citron, herbes fraîches · Pour 4 · Préparation 15 min · Cuisson 1h","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande","sans gluten"],"ingredients":["800 g blancs de poulet","Huile d'olive","1 c.à.s. bouillon de légumes déshydraté","800 g fenouil","½ c.à.s. graines de fenouil","½ c.à.s. graines de coriandre","5 citrons coupés en gros quartiers","50 ml jus de citron + le zeste (1 citron)","1 c.à.s. zaatar","Persil plat, menthe et coriandre hachées","Sel"],"steps":["Mélanger les blancs de poulet avec un peu d'huile d'olive et de bouillon. Saler. Cuire dans un plat au four à 180°C pendant 20 min. Laisser refroidir.","Couper les fenouils en quartiers. Les mélanger avec ½ c.à.s. de bouillon, de l'huile d'olive, les graines de fenouil et de coriandre. Ajouter les quartiers de citron. Cuire dans un plat au four à 180°C pendant 40 min. Réserver.","Couper les blancs de poulet refroidis en grosses lamelles.","Dans un saladier, mélanger le poulet et le fenouil avec le jus et le zeste de citron, le zaatar, un peu d'huile et toutes les herbes. Rectifier l'assaisonnement. Servir à température ambiante ou réchauffer quelques minutes au four."],"source":"Les festins partagés de God save the cream"},{"title":"Le poulet aux épices de Steph","subtitle":"Cuisses de poulet jamaïcaines marinées au piment et cassonade, rôties au four · Pour 4 · Marinade 6h–24h · Cuisson 45 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande","sans gluten"],"ingredients":["1 c.à.c. piment de la Jamaïque en grains","2 feuilles de laurier grossièrement déchirées","1½ c.à.c. piment en poudre","1½ c.à.c. paprika","½ c.à.c. cannelle moulue","½ c.à.c. mélange d'épices pour pain d'épices","25 g cassonade","1½ c.à.s. miel liquide","1–2 piments jalapeño verts, finement hachés","1–2 piments habanero rouges, finement hachés","1 petit oignon rouge en dés de 1 cm (100 g)","2 oignons verts finement hachés (30 g)","5 cl huile d'olive","1 kg cuisses de poulet","2 c.à.s. vinaigre de vin blanc","Sel"],"steps":["Poêler à sec le piment de la Jamaïque et le laurier 1–2 min jusqu'à ce que les feuilles se flétrissent. Réduire en poudre dans un mortier.","Déposer dans un saladier avec le reste des ingrédients sauf le poulet et le vinaigre. Ajouter 1 c.à.c. de sel, mélanger, puis ajouter les cuisses de poulet. Masser pour bien enrober. Laisser reposer au moins 6 h (ou toute une nuit) au réfrigérateur.","Sortir le poulet 30 min avant de cuire. Ajouter le vinaigre et mélanger.","Préchauffer le four à 200°C. Étaler les cuisses sur une plaque tapissée de papier sulfurisé, côté peau vers le haut. Enfourner 45 min jusqu'à croustillant et doré, en tournant la plaque à mi-cuisson. Laisser reposer 10 min avant de servir."],"source":"Comfort - Ottolenghi"},{"title":"Pain de viande au gingembre, amandes et parmesan","subtitle":"Pain de viande porc-veau à la polenta, raisins sultana et gingembre frais · Pour 6 · Préparation 20 min · Cuisson 1h","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande"],"ingredients":["1 oignon émincé finement","1 gousse d'ail écrasée","1 c.à.c. graines de coriandre écrasées","1 c.à.c. curry en poudre","100 ml coulis de tomate nature (passata)","15 g gingembre pelé et haché","75 g raisins sultana","30 g polenta non cuite","1 kg haché porc/veau non épicé","50 g amandes effilées toastées","60 g parmesan râpé","1 petite botte de coriandre hachée","1 c.à.c. bouillon de légumes déshydraté","15 ml sauce Worcestershire (ou sauce soja)","Sel, poivre noir"],"steps":["Dans une poêle, faire revenir l'oignon, ajouter l'ail, les graines de coriandre et le curry. Ajouter la passata, le gingembre, les raisins sultana et un peu d'eau. Laisser chauffer à feu doux — la sauce doit être bien liquide. À ébullition, ajouter la polenta en remuant. Couper le feu et laisser refroidir quelques minutes.","Ajouter tous les ingrédients restants à la sauce polenta. Rectifier avec bouillon, sauce Worcestershire, sel et poivre. Goûter (cuire une petite noix à la poêle pour tester).","Mettre la préparation dans un moule huilé. Enfourner 1 h minimum à 170°C. Vérifier la cuisson avec la pointe d'un couteau — aucun jus ne doit s'échapper. Servir chaud ou froid."],"source":"Les festins partagés de God save the cream"},{"title":"Pain de viande shawarma aux oignons caramélisés","subtitle":"Pain de viande agneau-boulgour-courgette aux épices shawarma, oignons caramélisés à la grenade · Pour 6 · Préparation 30 min · Cuisson 30 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande"],"ingredients":["— Pain de viande —","2 oignons râpés (265 g)","3 œufs légèrement battus","3 gousses d'ail écrasées","1 c.à.s. cumin moulu","1 c.à.s. paprika","1½ c.à.c. piment de la Jamaïque moulu","1¼ c.à.c. curcuma moulu","¼ c.à.c. piment de Cayenne","125 g boulgour","750 g agneau (ou bœuf) haché (20% MG)","1 grande courgette râpée (200 g)","20 g coriandre : 15 g finement hachée (feuilles et tiges) + 5 g de feuilles pour servir","20 g feuilles de menthe : 15 g finement hachée + 5 g pour servir","3 c.à.s. huile d'olive","Sel, poivre noir","— Oignons caramélisés —","3 c.à.s. huile d'olive","3 oignons émincés (480 g)","1 c.à.c. sucre en poudre","2 c.à.s. mélasse de grenade","½ c.à.c. cannelle moulue","½ c.à.c. piment de la Jamaïque moulu","— Yaourt à la grenade —","1 c.à.s. mélasse de grenade","300 g yaourt grec","2 c.à.s. graines de grenade pour servir (facultatif)"],"steps":["Mélanger oignons, œufs, ail, épices et boulgour. Réserver 1 h au réfrigérateur. Ajouter ensuite agneau, courgette, herbes, 2 c.à.s. d'huile, 1½ c.à.c. sel et poivre. Bien mélanger.","Oignons caramélisés : chauffer l'huile à feu moyen-doux. Cuire oignons, sucre, sel et poivre 15–20 min en remuant. Ajouter mélasse et épices, cuire encore 5 min.","Mélanger mélasse de grenade et yaourt dans un bol. Réserver.","Préchauffer le four à 200°C. Chauffer une sauteuse en fonte de 28 cm, verser le reste de l'huile. Ajouter la farce en pressant avec les doigts. Enfourner 20 min. Répartir les oignons caramélisés, remettre 10–12 min. Laisser reposer 15 min.","Garnir de menthe, coriandre et graines de grenade. Servir chaud ou à température ambiante avec le yaourt à la grenade."],"source":"Comfort - Ottolenghi"},{"title":"Tortang talong — aubergines grillées, œuf et agneau épicé","subtitle":"Omelette d'aubergines philippine garnie d'agneau épicé à la harissa · Pour 4 · Préparation 30 min · Cuisson 45 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande","sans gluten"],"ingredients":["4 aubergines","4,5 cl huile d'olive","1 grosse échalote en petits dés (70 g)","2 grosses gousses d'ail écrasées","1 c.à.c. cumin moulu","¾ c.à.c. piment de la Jamaïque moulu","¾ c.à.c. cannelle moulue","200 g agneau (ou bœuf/porc) haché (20% MG)","2 c.à.s. harissa à la rose","3 oignons verts émincés (20 g)","15 g feuilles de coriandre grossièrement hachées","15 g feuilles de menthe grossièrement hachées (+ un peu pour décorer)","4 œufs","Sel, poivre noir","— Sauce au tahin —","125 g yaourt nature","50 g tahin","1 gousse d'ail écrasée","2 c.à.c. jus de citron"],"steps":["Cuire les 4 aubergines entières dans un four à 200°C pendant au minimum 1 h. Elles doivent être rôties (peau quasiment brûlée) et très molles. Si vous avez un chalumeau, les passer au chalumeau à la sortie du four pour accentuer le goût fumé. Les couper en deux et prélever la chair. Laisser refroidir.","Étaler la chair dans un plat et aplatir légèrement à la fourchette sans déchirer. Laisser reposer 30 min pour qu'elle rende son eau de végétation. Éponger. Assaisonner des deux côtés.","Sauce au tahin : mélanger tous les ingrédients avec 2 c.à.s. d'eau, ½ c.à.c. sel et poivre.","Chauffer 1 c.à.s. d'huile dans une poêle de 23 cm à feu moyen. Faire revenir échalote, ail et épices 5 min. Augmenter à feu moyen-vif, ajouter l'agneau et la harissa. Cuire 7 min jusqu'à légère coloration. Ajouter les aubergines. Laisser refroidir. Incorporer oignons verts, coriandre et menthe.","Servir avec la sauce au tahin."],"source":"Comfort - Ottolenghi"},{"title":"Ragoût de butternut au tamarin et lait de coco","subtitle":"Courge butternut mijotée aux graines de moutarde, feuilles de curry et tamarin · Pour 4 · Préparation 20 min · Cuisson 1h15","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien","sans gluten"],"ingredients":["8 cl huile végétale (huile de coco vierge de préférence)","1 c.à.c. graines de moutarde noire","2 gros oignons en petits dés (400 g)","5 g feuilles de curry","6 gousses d'ail écrasées","1 piment jalapeño vert finement haché (20 g)","1 c.à.c. curcuma moulu","1 c.à.c. piment en poudre","1 c.à.c. paprika","1½ c.à.c. coriandre moulue","1 belle courge butternut pelée et coupée en morceaux de 4 cm (750 g)","12 cl concentré de tamarin thaï mélangé à 25 cl d'eau bouillante","15 cl lait de coco","25 g jaggery râpé (ou sucre muscovado)","5 g feuilles de coriandre hachées","Sel"],"steps":["Chauffer l'huile à feu moyen-vif dans une grande sauteuse. Ajouter les graines de moutarde. Quand elles éclatent, ajouter oignons et feuilles de curry. Cuire 20–25 min en remuant jusqu'à bien dorés.","Ajouter ail, piment et épices. Cuire encore 2 min en remuant jusqu'à ce que ça embaume.","Ajouter la courge, l'eau de tamarin et 1 c.à.c. de sel. Mélanger, couvrir et cuire environ 45 min à feu doux — les morceaux doivent être tendres mais entiers.","Incorporer lait de coco et jaggery. Cuire encore 5–10 min à découvert jusqu'à ce qu'une partie de la courge commence à s'écraser. Saupoudrer de coriandre et servir avec du pain plat, des naans ou du riz basmati."],"source":"Comfort - Ottolenghi"},{"title":"Pâtes au four aux tomates et aubergines","subtitle":"Aubergines rôties, tomates cerises, sauce tomate au beurre et basilic, gratinées au parmesan · Pour 4 · Préparation 15 min · Cuisson 1h15","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien"],"ingredients":["6 cl huile d'olive","2 aubergines coupées en quatre dans la longueur puis en deux (500 g)","350 g tomates cerises (moitié en tranches, moitié entières)","400 g tomates concassées en boîte","1 c.à.c. origan séché","20 g feuilles de basilic grossièrement déchiquetées + quelques feuilles entières","6 gousses d'ail émincées","1 piment rouge coupé en deux avec la tige","2 c.à.s. concentré de tomates","1 c.à.c. sucre en poudre","100 g beurre doux en cubes de 2 cm","250 g pâtes sèches (fusillone ou grosses pâtes courtes)","40 cl eau bouillante","10 g persil grossièrement haché","40 g parmesan finement râpé","Sel, poivre noir"],"steps":["Préchauffer le four à 220°C (chaleur tournante 200°C).","Verser l'huile dans une grande sauteuse allant au four. Ajouter les aubergines, 1 c.à.c. de sel et du poivre. Mélanger. Étaler en une seule couche, côté peau en bas. Rôtir 30 min au four jusqu'à bien dorées et accrochant par endroits.","Ajouter tous les autres ingrédients sauf le persil et le parmesan. Assaisonner de 3½ c.à.c. de sel et de poivre. Mélanger, couvrir et enfourner 30 min — les pâtes doivent être al dente et les tomates fondantes.","Mélanger puis remettre au four 10–15 min sans couvercle jusqu'à ce que la sauce adhère aux pâtes et accroche par endroits. Laisser reposer 10 min.","Garnir de persil, parmesan et feuilles de basilic entières. Servir sans attendre."],"source":"Comfort - Ottolenghi"},{"title":"Polenta gratinée aux courgettes et harissa verte","subtitle":"Polenta crémeuse au parmesan et taleggio, courgettes rôties et harissa verte maison · Pour 4 · Préparation 30 min · Cuisson 1h","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien","sans gluten"],"ingredients":["550 g courgettes en tronçons biseautés de 3–4 cm (500 g)","3 c.à.s. huile d'olive","1 citron : 8 fines lanières de zeste","45 cl bouillon de volaille (ou eau)","30 cl lait","1 gousse d'ail écrasée","150 g polenta à cuisson rapide","100 g parmesan râpé","75 g beurre doux","125 g taleggio (ou reblochon) grossièrement déchiré","5 g ciboulette en tronçons de 2–3 cm, pour servir","Sel, poivre noir","— Harissa verte —","2 poivrons verts (275 g)","3 oignons verts (40 g)","2 piments verts","3 gousses d'ail pelées","20 g persil grossièrement haché + un peu pour servir","20 g coriandre grossièrement hachée","½ c.à.c. graines de cumin grillées et grossièrement écrasées","1½ c.à.c. graines de coriandre grillées et grossièrement écrasées","1 citron : 1 c.à.c. zeste finement râpé + 1½ c.à.s. jus","1 c.à.c. sirop d'érable","9 cl huile d'olive","3½ c.à.c. sel"],"steps":["Préchauffer le four à 240°C (chaleur tournante 220°C).","Harissa verte : chauffer une poêle-gril à feu vif. Griller les poivrons 20 min en retournant souvent jusqu'à peau carbonisée. Couvrir et laisser finir à la vapeur. Griller les oignons verts (3 min), les piments verts (5 min) et l'ail (1–2 min). Peler les poivrons, ôter les graines, hacher grossièrement. Mixer avec tous les autres ingrédients de la harissa jusqu'à sauce homogène. Réserver.","Disposer les courgettes sur une plaque, avec l'huile, la moitié des lanières de citron, ½ c.à.c. de sel et du poivre. Enfourner 25 min en remuant plusieurs fois jusqu'à dorées et bien cuites. Sortir du four.","Polenta : mélanger bouillon, lait, ail et reste des lanières de citron dans une casserole. Chauffer à feu vif. Dès que ça frémit, verser la polenta en pluie en fouettant vivement. Baisser à feu doux, cuire 3 min en fouettant sans cesse jusqu'à épaississement tout en restant onctueuse. Hors du feu, incorporer le parmesan, le beurre, ¾ c.à.c. de sel et du poivre.","Transférer la polenta dans un plat rond peu profond allant au four (24 cm). Répartir le fromage à la surface. Enfourner 15 min jusqu'à doré et bouillonnant.","Mélanger les courgettes avec la moitié de la harissa. Répartir sur la polenta. Saupoudrer de persil haché et de ciboulette. Servir avec le reste de harissa."],"source":"Comfort - Ottolenghi"},{"title":"Ramen express aux champignons","subtitle":"Hachis de champignons bruns sautés, sauce aux oignons verts et soja, nouilles ramen · Pour 2 · Préparation 10 min · Cuisson 15 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien","rapide"],"ingredients":["300 g champignons bruns, sans les pieds, chapeaux essuyés et coupés en quatre ou cinq","1 c.à.s. huile d'arachide (ou tournesol)","2 c.à.s. vin de Shaoxing (ou saké)","2 nids de nouilles ramen instantanées (170 g)","2 petits morceaux d'algue nori, pour servir","— Sauce aux oignons verts —","6 oignons verts émincés (60 g)","1 gousse d'ail finement hachée","10 g gingembre pelé finement haché","1 c.à.c. shichimi togarashi (ou ½ c.à.c. flocons de piment)","5 cl huile d'arachide","2 c.à.s. sauce soja foncée","1 c.à.s. miel liquide","1 c.à.s. sauce de poisson","1 c.à.s. jus de citron vert"],"steps":["Sauce aux oignons verts : déposer oignons, ail, gingembre et shichimi dans un bol résistant à la chaleur. Chauffer l'huile à feu moyen jusqu'à formation de bulles (~2 min). Verser délicatement sur le mélange et remuer (attention aux projections). Laisser infuser 10 min. Ajouter sauce soja, miel, sauce de poisson et jus de citron. Réserver.","Pulser les champignons dans le robot en hachis fin (quelques morceaux plus gros acceptés).","Chauffer l'huile à feu moyen-vif dans une grande sauteuse. Faire revenir le hachis 12–15 min en remuant fréquemment jusqu'à brunissement et évaporation de l'eau. Ajouter le vin — il s'évapore aussitôt. Éteindre le feu.","Cuire les nouilles 2 min dans l'eau bouillante. Égoutter et déposer dans la sauteuse avec les champignons. Mélanger, incorporer la sauce aux oignons verts.","Répartir dans deux bols, émietter la nori dessus. Déguster sans attendre."],"source":"Comfort - Ottolenghi"},{"title":"Boulettes de viande au nuoc cham, concombre et menthe","subtitle":"Boulettes de porc haché au riz et herbes, frites et servies avec nuoc cham, laitue et concombre · Pour 4 · Préparation 20 min · Cuisson 10 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande","sans gluten"],"ingredients":["— Boulettes —","2 gousses d'ail écrasées","1 échalote finement hachée (50 g)","30 g coriandre (tiges finement hachées, feuilles réservées)","10 g feuilles de menthe finement hachées + quelques feuilles entières","1½ c.à.s. sauce de poisson","1 c.à.s. sucre en poudre","100 g restes de riz cuit","500 g porc haché","7,5 cl huile végétale pour la friture","Sel, poivre blanc moulu","— Nuoc cham —","2 gousses d'ail grossièrement hachées","1 petit piment rouge grossièrement haché","1 piment doux grossièrement haché","¼ c.à.c. flocons de sel de mer","2 c.à.s. sucre de palme râpé (ou sucre)","2 c.à.s. jus de citron vert","6 cl sauce de poisson","6 cl vinaigre de riz","— Pour servir —","1 petite laitue iceberg en feuilles","½ concombre (150 g) en fines tranches"],"steps":["Boulettes : déposer ail, échalote, coriandre, menthe, sauce de poisson et sucre dans un récipient. Ajouter ¼ c.à.c. sel et ¾ c.à.c. poivre. Mélanger. Quand le sucre est dissous, ajouter le riz et la viande. Façonner 24 boulettes de 30 g chacune. Aplatir légèrement. Réfrigérer jusqu'au moment de cuire.","Nuoc cham : piler ail, piments et sel au mortier jusqu'à pâte humide. Ajouter le reste des ingrédients, agiter vivement. Réfrigérer.","Dresser les feuilles de laitue sur un plat avec concombre et herbes à côté. Verser le nuoc cham dans des coupelles.","Chauffer la moitié de l'huile à feu moyen-vif dans une grande poêle. Faire frire la moitié des boulettes 4–5 min en les retournant à mi-cuisson jusqu'à cuites à cœur. Procéder de même avec le reste. Servir chaud ou à température ambiante."],"source":"Comfort - Ottolenghi"},{"title":"Gâteau aux pommes, mûres et gingembre","subtitle":"Gâteau fondant pommes-gingembre sur lit de mûres, crumble cannelle-amandes effilées · Pour 6–8 · Préparation 30 min · Cuisson 50 min","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien"],"ingredients":["180 g farine ordinaire","1½ c.à.c. levure chimique","¼ c.à.c. sel","4 petites pommes Granny Smith, pelées, évidées et en fines tranches (360 g)","35 g gingembre frais pelé finement râpé","1 citron : 1 c.à.c. zeste + 1½ c.à.c. jus","180 g beurre doux en dés, à température ambiante + 10 g pour le moule","130 g sucre en poudre","3 œufs + 1 blanc d'œuf","1 c.à.c. extrait de vanille","300 g mûres","Crème fraîche (ou crème anglaise), pour servir","— Crumble —","90 g farine ordinaire","80 g sucre demerara","1 c.à.c. gingembre moulu","1 c.à.c. cannelle moulue","60 g amandes effilées","¼ c.à.c. sel","75 g beurre doux fondu et légèrement refroidi"],"steps":["Crumble : mélanger farine, sucre, gingembre, cannelle, amandes et sel. Ajouter le beurre fondu, mélanger à la fourchette pour obtenir des miettes grossières. Réserver au réfrigérateur.","Préchauffer le four à 190°C (chaleur tournante 170°C). Beurrer un grand plat de cuisson rond d'environ 26 cm. Tamiser la farine, la levure et le sel dans un bol.","Mélang
