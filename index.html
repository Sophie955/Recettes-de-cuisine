 l'eau de cuisson des pâtes, le jus de citron et les tagliatelles égouttées. Saupoudrer de parmesan. Mélanger. Répartir dans 4 assiettes. Garnir de citron caramélisé et de noisettes concassées."],"sous_section":""},{"title":"Trois délices de la terre","subtitle":"Aubergines, pommes de terre et poivron au wok, sauce soja épaissie à la fécule — spécialité chinoise","chapter":"IV","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["400 g aubergines chinoises","2 petites pommes de terre","1 poivron vert","2 gousses ail","1 ciboule ou oignon nouveau","½ c.à.c. fécule de pomme de terre","2½ c.à.s. sauce soja claire","8 cl eau","3 c.à.s. huile végétale","1 c.à.c. sucre semoule","sel"],"steps":["Laver les aubergines et les couper en lamelles (sans les éplucher). Faire dégorger dans une grande passoire saupoudrées de sel pendant 1 heure. Presser avec les mains pour extraire le maximum de jus.","Éplucher les pommes de terre. Couper les pommes de terre et le poivron en lamelles de même taille. Rincer les pommes de terre. Peler et hacher l'ail. Hacher la ciboule.","Chauffer 1 c.à.s. d'huile dans un wok à feu moyen. Faire dorer les pommes de terre 5 min. Ajouter le poivron et cuire 2 min. Débarrasser sur une assiette.","Faire chauffer le reste d'huile et cuire les aubergines 20 min à feu moyen jusqu'à tendreté. Ajouter 1 c.à.s. de sauce soja, les pommes de terre, le poivron, l'ail et la ciboule. Mélanger. Verser le reste de sauce soja et le sucre. Cuire encore 3 min.","Diluer la fécule dans 8 cl d'eau. Augmenter le feu au maximum. Verser la fécule délayée et remuer vivement : la sauce épaissit en quelques secondes. Arrêter la cuisson et servir."],"sous_section":""},{"title":"Courge farcie au paneer","subtitle":"Butternut farcie d'une purée de courge, paneer maison et cumin, nappée de crème safranée","chapter":"IV","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["Paneer : 1 litre lait entier, 3 c.à.s. vinaigre blanc, 1 mousseline de coton","1 courge butternut","1 poignée graines de courge","1 petit oignon rouge","1 c.à.s. graines de cumin","1 dose safran en poudre ou filaments","20 cl crème liquide entière","sel"],"steps":["Préparer le paneer : faire bouillir le lait en surveillant. Couper le feu à l'ébullition et ajouter le vinaigre. Laisser cailler 10 min. Passer dans la mousseline en pressant pour égoutter au maximum. Donner la forme souhaitée et laisser reposer sous un poids 30 min. Placer au frais 30 min.","Préchauffer le four à 180°C. Couper la courge en deux, ôter les pépins et creuser la chair en laissant 1 cm de bords. Réserver la chair.","Cuire la chair de courge dans l'eau bouillante salée 6–7 min. Égoutter et écraser à la fourchette. Torréfier légèrement le cumin à sec. Chauffer la crème avec le safran sans faire bouillir.","Dans un saladier, mélanger la courge écrasée, l'oignon rouge haché, le paneer émietté et les graines de cumin. Saler. Garnir les 2 demi-courges.","Napper de crème safranée et saupoudrer de graines de courge. Enfourner 30 min dans la partie basse du four."],"sous_section":""},{"title":"Yakisoba aux légumes","subtitle":"Nouilles japonaises sautées au wok avec tofu, shiitaké, poireaux et carotte en julienne","chapter":"IV","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["600 g nouilles yakisoba fraîches","150 g tofu ferme","2 poireaux","1 carotte","12 shiitaké frais","3 cm gingembre frais","2 c.à.s. graines de sésame noir","5 c.à.s. sauce soja épaisse aux champignons","3 c.à.s. sauce soja","1 c.à.s. huile de tournesol"],"steps":["Cuire les nouilles dans l'eau bouillante 1 min. Passer sous l'eau froide et égoutter.","Égoutter le tofu et couper en bâtonnets. Laver les poireaux et peler la carotte. Tailler en julienne. Nettoyer les shiitaké (ôter le pied) et couper en lamelles. Peler et hacher le gingembre.","Dans un wok, chauffer l'huile et faire revenir le tofu, les juliennes de poireaux et carotte et le gingembre à feu vif en remuant 10 min. Ajouter les champignons avec 3 c.à.s. d'eau et cuire encore 5 min.","Ajouter les nouilles dans le wok et faire sauter 2 min. Incorporer les deux sauces soja en enrobant bien. Répartir dans les assiettes et saupoudrer de sésame noir. Servir aussitôt."],"sous_section":""},{"title":"Injera éthiopienne","subtitle":"Galettes de teff fermentées garnies de lentilles berbères aux épices","chapter":"IV","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["125 g farine de teff (ou sarrasin)","2 c.à.c. levure de boulanger","½ c.à.c. sucre semoule","½ c.à.c. sel","½ c.à.c. levure chimique","15 cl eau tiède","1 c.à.c. vinaigre de vin","Lentilles : 300 g lentilles, 1 oignon rouge, 2 gousses ail, 1 c.à.s. gingembre râpé, 1 piment séché, 2 clous girofle, 2 graines cardamome, 1 c.à.c. paprika, 75 cl bouillon légumes, 2 c.à.s. huile de coco","Garniture : ½ concombre, 1 poignée tomates cerises, feuilles de salade, ½ botte coriandre"],"steps":["Préparer les galettes : mélanger la farine de teff, la levure de boulanger et le sucre dans un saladier. Verser 10 cl d'eau tiède et mélanger au fouet. Couvrir et laisser reposer 1 heure.","Ajouter 5 cl d'eau tiède de plus, le sel, la levure chimique et le vinaigre.","Dans une poêle légèrement huilée, étaler une louche de pâte. Cuire jusqu'à ce que des bulles apparaissent. Couvrir et cuire 2 min à feu doux. Retirer le couvercle et poursuivre 1 min. Répéter avec le reste de pâte.","Lentilles berbères : émincer l'oignon. Hacher le piment séché. Faire revenir l'oignon dans l'huile de coco 5 min. Ajouter le piment, l'ail, le gingembre, les épices et les lentilles. Cuire 2 min. Verser le bouillon et laisser mijoter 30 min à feu doux. Saler et poivrer.","Garniture : tailler le concombre en dés, couper les tomates cerises, déchirer les feuilles de salade, ciseler la coriandre.","Servir les galettes injera garnies de lentilles berbères, tomates cerises, dés de concombre, salade et coriandre."],"sous_section":""},{"title":"Rösti aux légumes + sauce aux herbes","subtitle":"Galettes suisses de pommes de terre et légumes râpés, sauce aux herbes au fromage blanc","chapter":"IV","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["2 pommes de terre","1 carotte","1 panais","1 petite courgette","1 oignon rouge","2 œufs","2 c.à.s. farine","huile de cuisson, sel, poivre","120 g fromage blanc (sauce)","½ citron jus (sauce)","½ botte persil + quelques brins de cerfeuil (sauce)"],"steps":["Peler et râper pommes de terre, carotte et panais. Laver et râper la courgette. Émincer finement l'oignon. Battre les œufs dans un bol.","Déposer tous les légumes dans un saladier, ajouter la farine et les œufs battus. Saler, poivrer et mélanger délicatement.","Sauce aux herbes : mixer le persil et le cerfeuil. Mélanger dans un bol avec le fromage blanc et le jus de citron. Saler et poivrer.","Chauffer un fond d'huile dans une poêle. Déposer 2 c.à.s. de préparation et aplatir pour former une galette. Cuire 3–4 min de chaque côté.","Égoutter sur papier absorbant. Servir avec la sauce aux herbes."],"sous_section":""},{"title":"Tortilla de patata","subtitle":"L'omelette espagnole classique aux pommes de terre — tapas, sandwich ou repas complet","chapter":"IV","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["6 œufs","3 pommes de terre","4 brins persil plat","huile d'olive, sel, poivre du moulin"],"steps":["Éplucher les pommes de terre et les couper en fines lamelles. Ciseler le persil.","Verser un fond d'huile dans une poêle. Ajouter les lamelles de pommes de terre, saler et faire frire en les écrasant légèrement 8 à 10 min jusqu'à ce qu'elles soient cuites. Égoutter et garder le reste d'huile dans la poêle.","Battre les œufs dans un saladier, ajouter les pommes de terre et le persil ciselé. Saler, poivrer et mélanger.","Réchauffer l'huile dans la poêle, verser la préparation. Cuire à feu doux 5 min. Retourner l'omelette à l'aide d'une assiette. Cuire encore 3 min. Servir en parts."],"sous_section":""},{"title":"Tacos aux légumes rôtis","subtitle":"Tortillas de maïs garnies de légumes rôtis et de mimolette, sauce péruvienne en option","chapter":"IV","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["½ potimarron (ou 1 grosse patate douce)","160 g tomates cerise","1 poivron rouge","1 gros oignon","8 brins coriandre","4 brins origan","1 c.à.c. graines de cumin","2 c.à.c. graines de coriandre","1 c.à.c. piment en poudre","1 c.à.c. paprika","1 c.à.c. gingembre en poudre","200 g haricots rouges cuits (en conserve)","40 g mimolette râpée","4 tortillas au maïs","2 c.à.s. huile d'olive","sauce péruvienne (facultatif), sel, poivre"],"steps":["Préchauffer le four à 180 °C. Retirer les graines du potimarron et du poivron. Couper leur chair en dés. Éplucher l'oignon et le tailler en dés. Râper la mimolette. Dans un mortier, concasser les épices.","Dans un saladier, mélanger les légumes avec les épices concassées, les feuilles d'origan et l'huile d'olive. Saler et poivrer. Étaler sur une plaque recouverte de papier cuisson. Enfourner 15 minutes.","Couper les tomates cerise en quatre. Rincer et égoutter les haricots rouges. Ajouter aux légumes rôtis et mélanger.","Garnir chaque tortilla du mélange de légumes, couvrir de mimolette râpée. Disposer dans un plat à gratin et passer sous le gril du four pendant 3 minutes.","Garnir de coriandre et servir, éventuellement accompagné de sauce péruvienne."],"sous_section":""},{"title":"Gnocchis maison","subtitle":"Jamais meilleurs que faits maison — à servir avec une sauce tomate ou simplement du beurre fondu","chapter":"IV","chapter_name":"Plats principaux","tags":["végétarien","famille"],"ingredients":["900 g pommes de terre type bintje","300 g farine","1 œuf","semoule de blé dur","1 feuille de laurier","1 gousse ail","1 c.à.c. sel"],"steps":["Faire cuire les pommes de terre à la vapeur avec l'ail pelé et le laurier pendant 30 minutes. Les éplucher et les passer au presse-purée au-dessus de la farine disposée en puits sur le plan de travail.","Mélanger la farine avec la purée en ajoutant l'œuf et le sel. Amalgamer jusqu'à ce que la pâte soit homogène (ne pas trop travailler).","Prélever des morceaux de la taille d'une pêche et former des boudins de 2 cm de diamètre. Couper régulièrement tous les 3 cm environ.","À l'aide d'une fourchette retournée et avec le pouce, former les gnocchi un par un en faisant rouler le tronçon sur lui-même.","Fariner légèrement à la semoule et réserver sur torchon propre en évitant de les coller.","Plonger dans une casserole d'eau bouillante — ils sont cuits dès qu'ils remontent à la surface. Égoutter aussitôt et servir avec une sauce maison ou du beurre fondu, parmesan et poivre."],"sous_section":""},{"title":"Courgettes tikka masala","subtitle":"Curry crémeux aux courgettes et épices entières — aussi délicieux avec carottes ou chou-fleur","chapter":"IV","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["500 g courgettes vertes et jaunes","1 piment vert","1 petit oignon rouge","1 oignon blanc","1 citron vert","1 boîte tomates concassées (40 cl)","10 cl crème liquide entière","2 gousses ail (ou 1 c.à.s. pâte d'ail)","1 petit morceau gingembre (ou 1 c.à.s. pâte de gingembre)","1 c.à.c. coriandre en poudre","1 c.à.s. garam masala","4 gousses cardamome","2 clous de girofle","2 feuilles de laurier","2 petits piments rouges séchés (facultatif)","3 c.à.s. ghee ou huile végétale","4–5 brins coriandre fraîche","sel"],"steps":["Éplucher l'oignon blanc et l'émincer.","Dans une sauteuse, faire chauffer le ghee ou l'huile et ajouter les épices entières (piments, clous de girofle, cardamome, laurier), la pâte d'ail et de gingembre, l'oignon blanc émincé, le piment vert haché, le garam masala, la coriandre en poudre, 1 c.à.c. rase de sel et 1 petit verre d'eau. Laisser cuire quelques minutes en remuant.","Ajouter la tomate, mélanger et retirer les épices entières. Mixer la sauce. Ajouter les courgettes coupées en morceaux et l'oignon rouge en gros cubes. Couvrir et laisser cuire 15 minutes à feu moyen.","Ajouter la crème liquide et mélanger. Parsemer de coriandre fraîche, arroser de jus de citron vert et servir aussitôt."],"sous_section":""},{"title":"Burrito végétarien","subtitle":"Tortillas généreusement garnies de légumes croquants, haricots rouges et guacamole","chapter":"IV","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["1 poignée haricots verts","1 carotte","80 g chou rouge","1 tomate","1 oignon","1 gousse ail","8 brins coriandre","4 feuilles salade","80 g haricots rouges cuits (en conserve)","4 tortillas","8 cl guacamole","1 filet huile d'olive","sel, poivre du moulin"],"steps":["Équêter les haricots verts et les cuire 8 minutes à la vapeur.","Peler et râper la carotte. Émincer finement le chou rouge. Couper la tomate en lamelles. Peler et émincer finement l'oignon. Dégermer et hacher l'ail. Rincer et égoutter les haricots rouges.","Dans une poêle, faire revenir l'oignon 5 min avec l'huile. Ajouter l'ail et les haricots rouges. Saler, poivrer et poursuivre la cuisson 3 minutes.","Badigeonner les tortillas d'un peu d'eau, les déposer dans une poêle. Couvrir et faire chauffer 2 minutes à feu doux.","Au centre de chaque tortilla, déposer une feuille de salade, les haricots, les légumes, 2 brins de coriandre et du guacamole. Rouler en cylindre, envelopper dans du papier kraft ou film alimentaire et couper en deux avant de déguster."],"sous_section":""},{"title":"Curry thaï au tofu","subtitle":"Curry rouge crémeux au lait de coco, légumes croquants et riz gluant à la vapeur","chapter":"IV","chapter_name":"Plats principaux","tags":["sans gluten","végétarien"],"ingredients":["200 g riz thaï gluant (trempé 1 nuit)","160 g tofu ferme","1 oignon rouge","1 courgette","5 mini-maïs (ou 4 c.à.s. de maïs cuits)","1 poignée pois mange-tout","1 tige citronnelle","4 feuilles citronnier (ou zeste de citron vert)","quelques brins de basilic thaï","1 c.à.s. pâte de curry rouge","1 c.à.s. sucre semoule","60 cl lait de coco","1 c.à.s. sauce soja","1 c.à.c. huile de coco (ou tournesol)","1½ c.à.c. sel","jus de 1 citron vert"],"steps":["La veille, mettre le riz gluant à tremper dans un grand volume d'eau froide pour la nuit.","Le jour même, rincer et égoutter le riz. Le placer dans une gaze dans le panier d'un cuit-vapeur. Fermer complètement, couvrir et cuire 30 minutes à la vapeur. Laisser reposer 5 minutes.","Égoutter le tofu et le couper en cubes. Éplucher et émincer l'oignon. Couper la courgette en rondelles. Couper les mini-maïs en quatre et les pois mange-tout en deux. Écraser la tige de citronnelle.","Faire chauffer l'huile de coco dans un wok et faire revenir la pâte de curry 1 min à feu vif. Ajouter le tofu, l'oignon, les feuilles de citronnier, la citronnelle, le sucre et le sel. Faire sauter 2–3 minutes.","Verser le lait de coco et la sauce soja. Incorporer la courgette, les mini-maïs et les pois mange-tout. Porter à ébullition puis laisser mijoter 10 minutes à feu doux.","Retirer du feu, ajouter le basilic thaï. Assaisonner de jus de citron vert et servir accompagné du riz gluant."],"sous_section":""},{"title":"Chakchouka","subtitle":"Ratatouille du Maghreb avec poivrons grillés, tomates mijotées et œufs pochés à la coriandre · Pour 6 · Préparation 20 min · Cuisson 50 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"","tags":["végétarien","sans gluten"],"ingredients":["3 poivrons rouges","3 poivrons jaunes","½ piment vert","3 tomates rondes","1 oignon blanc","4 gousses d'ail","2 c.à.s. huile d'olive","3 g cumin en poudre","3 g coriandre en poudre","12 œufs frais","1 botte coriandre fraîche","1 pincée piment d'Espelette","Sel fin, poivre mignonnette"],"steps":["Préchauffer le four à 180°C. Enfourner les poivrons entiers 30 min. Laisser refroidir puis peler et épépiner. Détailler poivrons et piment en lanières.","Plonger les tomates 1 min dans l'eau bouillante puis dans un bain d'eau glacée. Peler et épépiner.","Émincer l'oignon, hacher l'ail, tailler les tomates en quartiers, ciseler la coriandre.","Faire chauffer l'huile dans une grande poêle. Faire suer oignons et ail avec cumin et coriandre. Ajouter poivrons, piment vert et tomates. Saler, poivrer, piment d'Espelette. Laisser mijoter 30 min.","Casser les œufs dans la chakchouka, prolonger la cuisson jusqu'à ce que les œufs soient pris. Hors du feu, ajouter la coriandre fraîche ciselée."]},{"title":"Patates douces rôties, sauce chimichurri","subtitle":"Patates douces rôties au four, nappées de yaourt de brebis et sauce chimichurri aux herbes","chapter":"IV","chapter_name":"Plats principaux","tags":["sans gluten","végétarien"],"ingredients":["4 patates douces","¼ grenade","4 brins origan","120 g yaourt de brebis","15 cl sauce chimichurri","huile d'olive, sel, poivre du moulin"],"steps":["Préchauffer le four à 180 °C. Couper les patates douces en deux dans la longueur et les déposer sur une plaque recouverte de papier cuisson. Former des croisillons sur la chair avec la pointe d'un couteau, puis badigeonner d'huile d'olive. Effeuillez les brins d'origan et les parsemer sur les patates douces. Saler, poivrer et enfourner pour 1 heure.","Prélever les graines de la grenade.","À la sortie du four, garnir les patates douces de yaourt de brebis et de sauce chimichurri. Décorer de graines de grenade et servir sans attendre."],"sous_section":""},{"title":"Omelette chinoise aux champignons noirs","subtitle":"Omelette moelleuse à la fécule, garnie d'une sauce umami aux champignons noirs et gingembre","chapter":"IV","chapter_name":"Plats principaux","tags":["végétarien"],"ingredients":["6 œufs","3 g champignons noirs séchés","2 ciboules ou oignons nouveaux","1 gousse ail","3 lamelles gingembre","2 c.à.c. fécule de pomme de terre","4 c.à.s. eau froide","4 c.à.s. huile végétale","2 c.à.s. sauce soja claire","1 c.à.s. pâte de soja fermenté au piment (ou miso + piment)","1 c.à.c. fécule de pomme de terre","4 c.à.s. eau","2 c.à.s. vinaigre de riz foncé","2 c.à.c. sucre semoule"],"steps":["Faire tremper les champignons séchés dans un bol d'eau tiède pendant 30 minutes. Égoutter et couper en petits morceaux.","Peler et hacher l'ail. Hacher le gingembre et les ciboules. Dans un bol, mélanger tous les ingrédients de la sauce.","Réaliser l'omelette : diluer la fécule avec l'eau dans un bol. Dans un saladier, battre les œufs puis verser la fécule délayée. Mélanger vivement.","Faire chauffer 3 c.à.s. d'huile dans un wok à feu vif et cuire les œufs battus en omelette. Débarrasser sur une assiette et réserver au chaud.","Faire chauffer le reste d'huile, faire revenir l'ail, le gingembre et les ciboules. Ajouter les champignons et cuire 1 minute. Verser la sauce bien mélangée et laisser épaissir en remuant doucement.","Garnir l'omelette avec la sauce aux champignons et servir."],"sous_section":""},{"title":"Soba aux algues wakamé","subtitle":"Nouilles au sarrasin fraîches et iodées, sauce sésame-soja — prêtes en 30 minutes","chapter":"IV","chapter_name":"Plats principaux","tags":["végétarien","rapide"],"ingredients":["350 g nouilles soba séchées (sarrasin)","1 oignon nouveau","½ concombre","6 radis roses","quelques brins de cerfeuil","2 c.à.s. algue wakamé séchée","1 c.à.s. graines de sésame","4 c.à.s. sauce soja","4 c.à.s. jus de citron","4 c.à.s. huile de sésame toasté"],"steps":["Faire cuire les nouilles soba dans un grand volume d'eau bouillante salée environ 5 minutes. Rincer à l'eau froide et égoutter. Déposer dans un saladier.","Réhydrater le wakamé séché dans un bol d'eau froide 10 minutes. Égoutter en pressant bien avec les mains.","Émincer finement l'oignon nouveau. Peler le concombre et le couper en fins bâtonnets. Couper les radis en fins bâtonnets. Ciseler le cerfeuil.","Préparer l'assaisonnement en émulsionnant l'huile de sésame avec la sauce soja et le jus de citron.","Dans le saladier, mélanger les soba, le wakamé, l'oignon nouveau, le concombre et le radis. Arroser de sauce, parsemer de graines de sésame et de cerfeuil."],"sous_section":""},{"title":"Confiture de poires (presque) sans sucre","subtitle":"Prête en 5 min, épaissie au chia, légère et parfumée au gingembre","chapter":"V","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien","rapide"],"ingredients":["600 g poires bien mûres","2 c.à.s. graines de chia","1–2 c.à.s. sirop d'agave","1 c.à.c. jus de citron","½ c.à.c. pulpe de gingembre frais","2 pincées extrait de vanille en poudre"],"steps":["Éplucher les poires, couper en morceaux. Cuire avec agave, citron, gingembre et vanille 5 min à feu moyen.","Mixer selon le résultat souhaité. Ajouter le chia, mélanger, verser dans un pot.","Laisser refroidir en mélangeant de temps en temps. Réfrigérer et consommer sous 5 jours."],"sous_section":""},{"title":"Clémentine curd sans œufs","subtitle":"Curd 100% végétal à la clémentine entière et à la purée d'amande","chapter":"V","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien","rapide"],"ingredients":["30 g graines de chia","2 grosses clémentines (ou 3 petites)","30 g purée d'amande blanche","1,5 c.à.s. sirop d'agave"],"steps":["Mélanger le chia avec 90 ml d'eau. Laisser prendre 15 min.","Peler les clémentines en retirant la pellicule blanche. Ouvrir les quartiers, ôter pépins et filaments.","Mixer longuement avec le gel de chia, la purée d'amande et le sirop d'agave. Réfrigérer."],"sous_section":""},{"title":"Cookies américains noisette et chocolat","subtitle":"Fondants dedans, croustillants dehors — sans œufs ni beurre, liés au chia","chapter":"V","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien"],"ingredients":["1 c.à.s. graines de chia (bombée)","100 g farine de riz complet","50 g farine de teff (ou sarrasin)","70 g sucre intégral","60 g purée de noisette","40 ml huile d'olive + lait d'amande","60 g chocolat noir (pépites)"],"steps":["Préchauffer à 200°C. Moudre le chia, mélanger avec 40 ml d'eau, laisser reposer 10 min.","Mélanger farines, sucre et sel. Ajouter purée de noisette, huile, lait d'amande et gel de chia. Incorporer le chocolat.","Former des galettes, disposer sur plaque sulfurisée. Cuire 12 min. Laisser tiédir avant de déguster."],"sous_section":""},{"title":"Framboises à la verveine","subtitle":"Framboises marinées dans un sirop léger à la vanille et à la verveine","chapter":"V","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien"],"ingredients":["500 g framboises","50 cl eau","100 g sucre roux","2 gousses de vanille fendues","1 bâton de cannelle","1 poignée feuilles de verveine","½ citron (jus)"],"steps":["Porter à ébullition l'eau, le sucre, la vanille et la cannelle. Arrêter après 5 min, jeter la verveine. Infuser 5 min. Laisser refroidir.","Réfrigérer 1 h. Retirer la vanille, la cannelle et la verveine. Filtrer le sirop.","Ajouter les framboises au sirop, remettre 1 h au réfrigérateur. Ajouter le jus de citron au service. Répartir dans des coupelles."],"sous_section":""},{"title":"Carpaccio de pommes au chèvre","subtitle":"Lamelles de pomme rouge, chèvre frais, pignons grillés et miel tiède","chapter":"V","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien"],"ingredients":["5 pommes rouges","2 fromages de chèvre frais","100 g pignons de pin","10 c.à.s. miel liquide","2 citrons (jus)"],"steps":["Couper les pommes en fines lamelles (avec la peau). Arroser de jus de citron pour éviter le noircissement.","Faire griller les pignons dans une poêle antiadhésive sans cesser de remuer. Couper le chèvre en tranches fines.","Dresser pommes et chèvre dans les assiettes. Chauffer le miel à feu doux et verser. Parsemer de pignons. Servir aussitôt."],"sous_section":""},{"title":"Variations autour du tapioca (mangue-coco, matcha, azuki)","subtitle":"Trois recettes : crème mangue-coco, boisson matcha-soja et dessert azuki","chapter":"V","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien"],"ingredients":["4 c.à.s. tapioca","60 cl lait de coco","1 sachet sucre vanillé","2 c.à.s. sucre semoule","½ mangue","noix de coco en poudre","3 c.à.s. tapioca","80 cl lait de soja","3 c.à.c. thé matcha dilué dans 1 c.à.s. lait de soja","4 c.à.s. sucre semoule","3 c.à.s. tapioca","60 cl lait de coco","4 c.à.s. anko (purée haricots azuki ou confiture châtaigne)","2 c.à.s. sucre semoule"],"steps":["Porter le lait de coco à ébullition avec le sucre semoule et le sucre vanillé. Ajouter le tapioca et cuire 10 minutes en remuant régulièrement. Répartir dans 4 verrines. Réfrigérer 1 heure.","Avant de servir, peler la mangue, la couper en dés. Garnir les crèmes de mangue et de noix de coco en poudre.","Portez à ébullition le lait de soja et le sucre. Ajouter le tapioca et cuire 10 min en remuant. Hors du feu, incorporer le matcha dilué.","Répartir dans 4 verres. Déguster chaud ou froid.","Procéder comme pour la boisson au matcha, en remplaçant le lait de soja par le lait de coco et le matcha dilué par l'anko."],"sous_section":""},{"title":"Tartelettes citron-matcha","subtitle":"Pâte sablée au matcha, crème au citron et meringue — à préparer en partie la veille","chapter":"V","chapter_name":"Desserts & douceurs","tags":["végétarien","famille"],"ingredients":["1 c.à.s. thé matcha","1 jaune d'œuf","125 g farine demi-complète T80","60 g beurre mou","50 g sucre semoule","1 pincée sel","3 œufs","jus de 2 citrons","1 c.à.s. fécule de maïs","80 g sucre semoule","1 c.à.c. thé matcha","2 blancs d'œufs","1 pincée levure chimique","60 g sucre glace"],"steps":["Préparer la pâte sablée : couper le beurre en petits dés. Dans un robot, mélanger farine, sucre, matcha et sel. Ajouter le beurre et mélanger à vitesse moyenne jusqu'à obtenir un mélange sableux. Incorporer le jaune d'œuf. Former une boule (ni collante ni trop sèche).","Préchauffer le four à 180 °C. Abaisser la pâte entre deux feuilles de papier cuisson. Foncer des moules à tartelettes. Retirer le papier, piquer la pâte. Enfourner 8–10 minutes.","Préparer la crème au citron : dans une casserole, mettre jus de citron, sucre, œufs et fécule. Fouetter pour obtenir un mélange mousseux. Chauffer à feu doux en remuant jusqu'à ce que le mélange épaississe. Étaler sur les fonds refroidis.","Meringue : mélanger sucre glace, matcha et levure. Fouetter les blancs d'œufs à vitesse lente. Quand ils blanchissent, ajouter la moitié du mélange sucre. Augmenter la vitesse et incorporer le reste. Arrêter quand les blancs sont en neige ferme.","À l'aide d'une poche à douille, garnir les tartelettes de meringue. Faire dorer au chalumeau ou sous le gril. Réserver au réfrigérateur au moins 1 heure avant de déguster."],"sous_section":""},{"title":"Smoothie de mangue au pomélo","subtitle":"Crème de mangue onctueuse, perles de sagou translucides et suprêmes de pomélo","chapter":"V","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien"],"ingredients":["1 grosse mangue","½ pomélo rose","35 g perles de sagou (tapioca)","5 cl lait de coco","zeste râpé de 1 citron vert","25 cl eau de source","50 g sucre semoule ou 60 g miel liquide"],"steps":["Peler la mangue et la couper en morceaux. Réserver 8 petits morceaux pour la déco. Dans un robot, mixer la mangue avec le sucre, le lait de coco et l'eau jusqu'à consistance lisse. Réserver.","Porter 1 litre d'eau à ébullition et cuire les perles de sagou 15 minutes. Laisser reposer 5 min dans l'eau bouillante — elles doivent être translucides. Rincer à l'eau froide.","Peler le pomélo à vif et prélever les suprêmes.","Ajouter les perles de sagou et la moitié des suprêmes dans la crème de mangue. Mélanger et répartir dans 4 coupelles.","Tailler les petits morceaux de mangue réservés en brunoise. Déposer le reste des suprêmes de pomélo, la brunoise de mangue et le zeste de citron vert. Réfrigérer 1 heure avant de déguster."],"sous_section":""},{"title":"Panna cotta à la vanille","subtitle":"Crème cuite légère sans œufs, à l'agar-agar — à accompagner d'un coulis de fruits de saison","chapter":"V","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien","famille"],"ingredients":["50 cl crème fleurette (sans additifs, non allégée)","1 gousse de vanille (ou ½ c.à.c. vanille en poudre)","1 c.à.c. rase agar-agar","50 g sucre blanc ou de canne"],"steps":["Verser la crème dans une casserole. Incorporer la gousse de vanille fendue et grattée (avec ses graines) et porter à ébullition à feu moyen en remuant régulièrement au fouet. Quand elle commence à chauffer, ajouter le sucre et remuer. À frémissement, verser l'agar-agar et fouetter jusqu'à ébullition. Éteindre et laisser refroidir quelques minutes en remuant.","Retirer la gousse de vanille et répartir la crème dans des verres ou des petits ramequins.","Laisser prendre à température ambiante puis placer au réfrigérateur au minimum 1 heure.","Pour le coulis : mixer des fruits bien mûrs avec du jus de citron et 1 c.à.s. de sucre. Passer au chinois pour enlever les graines."],"sous_section":""},{"title":"Sorbet à la mangue","subtitle":"Sorbet 2 ingrédients — mangue mixée et sirop de sucre — intense et rafraîchissant","chapter":"V","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien","famille"],"ingredients":["500 g mangue coupée en morceaux","1 citron vert (jus)","130 g sucre blond ou cassonade","130 ml eau minérale"],"steps":["Mixer la chair de mangue avec le jus de citron vert. Passer au chinois ou dans une passoire.","Dans une casserole, verser le sucre et l'eau. Porter à ébullition jusqu'à dissolution du sucre. Retirer du feu et verser le sirop sur la mangue.","Placer le mélange au frais pour qu'il refroidisse.","Verser dans la sorbetière et turbiner environ 50 minutes. Sans sorbetière, verser dans un bac ou un moule à cake chemisé et entreposer une nuit au congélateur."],"sous_section":""},{"title":"Dessert à la banane – Chè chuối","subtitle":"Bananes plantain pochées dans le lait de coco à la vanille, perles de tapioca et cacahuètes grillées","chapter":"V","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien"],"ingredients":["4 bananes plantain bien mûres","4 c.à.s. perles de tapioca","40 cl lait de coco","4 c.à.s. cacahuètes grillées salées","1 gousse de vanille","2 c.à.s. graines de sésame blanc","5 c.à.s. sucre de canne"],"steps":["La veille, faire tremper les perles de tapioca dans un bol d'eau froide.","Le jour même, égoutter les perles de tapioca et les plonger dans une grande casserole d'eau froide. Porter à ébullition en remuant, baisser le feu et cuire 10 minutes. Égoutter et les déposer dans un bol d'eau froide.","Peler les bananes et les couper en rondelles. Dans une casserole, faire bouillir le lait de coco avec 20 cl d'eau. Ajouter les bananes, le sucre et la gousse de vanille fendue et grattée. Cuire 10 minutes. Éteindre et laisser refroidir.","Égoutter les perles de tapioca et les mélanger aux bananes. Servir parsemé de graines de sésame et de cacahuètes grillées concassées."],"sous_section":""},{"title":"Glace tiramisu sans sorbetière","subtitle":"Crème mascarpone-chantilly à l'amaretto, biscuits spéculoos au café — sans sorbetière · Pour 8 · Préparation 15 min","chapter":"V","chapter_name":"Desserts & douceurs","tags":[],"ingredients":["250 g mascarpone","600 g crème fraîche liquide 30–35% MG, très froide","400 g lait concentré sucré","6–8 c.à.s. amaretto","125 g spéculoos","1–2 expressos très serrés et chauds"],"steps":["Battre le mascarpone au fouet électrique pour le détendre. Ajouter la crème très froide et battre jusqu'à obtenir une chantilly aérienne (pas trop ferme).","Ajouter le lait concentré et battre jusqu'à incorporation. Ajouter 5 c.à.s. d'amaretto, goûter : le goût de lait concentré doit disparaître. Continuer jusqu'à 6–8 c.à.s. selon l'amaretto.","Verser dans un moule (silicone idéalement) jusqu'aux 2/3 de hauteur.","Tremper très rapidement (pas les imbiber !) les spéculoos dans le café et les disposer uniformément sur la crème. Les biscuits ne doivent pas toucher les bords.","Recouvrir du reste de l'appareil, poser une 2e couche de biscuits trempés, puis niveler avec une spatule.","Protéger d'un film alimentaire et placer au congélateur.","1 heure avant de déguster, sortir du congélateur, démouler et placer au réfrigérateur. Décorer de chocolat en poudre ou de spéculoos écrasés."],"sous_section":""},{"title":"Tarte rhubarbe et fraises très simple","subtitle":"Galette rustique à la pâte sablée aux amandes, rhubarbe marinée et fraises fraîches · Pour 6 · Préparation 30 min · Cuisson 40 min","chapter":"V","chapter_name":"Desserts & douceurs","tags":["végétarien","famille"],"ingredients":["200 g farine","150 g beurre (température ambiante)","70 g sucre","1 pincée sel","1 œuf entier","30 g poudre d'amandes","3–5 tiges rhubarbe","1–2 poignées fraises","30 g poudre d'amandes (pour la garniture)","5–7 c.à.s. sucre blanc (pour mariner)","3–5 c.à.s. sucre de canne"],"steps":["La veille si possible : couper la rhubarbe en tronçons de 2–3 cm, mélanger avec 5–7 c.à.s. de sucre blanc et laisser reposer au frais. Égoutter avant utilisation (conserver le jus).","Pâte : battre le beurre, ajouter sucre et poudre d'amandes, puis l'œuf. Incorporer la farine jusqu'à consistance sableuse sans trop travailler. Envelopper et réfrigérer 20 min.","Étaler la pâte entre deux feuilles de papier sulfurisé. Retirer la feuille du dessus.","Verser 30 g de poudre d'amandes sur la pâte. Déposer les tronçons de rhubarbe. Rabattre les bords de la pâte sur la garniture à l'aide du papier sulfurisé. Saupoudrer de sucre de canne.","Enfourner à 180 °C (fonction pizza ou chaleur tournante) pendant 30 min.","Ajouter les ¾ des fraises coupées sur la tarte. Remettre au four 10 min jusqu'à ce que les bords soient bien dorés.","Avant de servir, décorer avec les fraises fraîches restantes. Optionnel : réduire le jus de rhubarbe en sirop et lustrer la tarte au pinceau."],"sous_section":""},{"title":"Mousse à la crème de marrons sans œuf","subtitle":"Mousse légère mascarpone-chantilly à la crème de marrons — en 10 minutes · Pour 5 à 6 · Préparation 10 min","chapter":"V","chapter_name":"Desserts & douceurs","tags":["végétarien","rapide"],"ingredients":["100 g crème fleurette (ou crème liquide 30% MG) très froide","100 g mascarpone","150 g crème de marrons","quelques meringues pour décorer"],"steps":["Verser le mascarpone dans un grand bol et le fouetter pour le détendre.","Ajouter la crème fraîche froide et monter en chantilly jusqu'à la consistance souhaitée (texture \"mousse à raser\").","Ajouter la crème de marrons. Mélanger délicatement à la spatule — 2 ou 3 coups de fouet suffisent, ne pas trop insister pour garder la texture.","Verser dans des verrines ou un plat de service (la poche à douille est très pratique). Décorer de meringues et/ou de cacao. Servir immédiatement ou réserver au frais."],"sous_section":""},{"title":"Salade de pamplemousse et verveine infusée","subtitle":"Quartiers de pamplemousse nappés d'une gelée légère à la verveine citronnée · Pour 4 · Préparation 20 min · Cuisson 2 min · Repos 6h minimum","chapter":"V","chapter_name":"Desserts & douceurs","tags":["végétarien"],"ingredients":["4 pamplemousses (1 par personne)","300 g eau","100 g sucre","1 feuille gélatine (2 g)","5–8 feuilles verveine citronnée (sèche ou fraîche)"],"steps":["Faire tremper la gélatine dans de l'eau froide. Porter l'eau et le sucre à ébullition dans une casserole.","Hors du feu, ajouter la verveine et infuser 5 minutes. Ne pas dépasser pour éviter l'amertume. Goûter et ajuster si nécessaire (ajouter de nouvelles feuilles et refaire bouillir).","Essorer la gélatine et l'incorporer à l'infusion chaude jusqu'à dissolution complète.","Peler les pamplemousses à vif (retirer la peau et la partie blanche amère). Prélever les quartiers et les disposer dans des verrines ou des assiettes creuses.","Verser la gelée de verveine sur les quartiers. Réfrigérer au moins 6 heures avant de déguster."],"sous_section":""},{"title":"Salade d'oranges au caramel léger épicé","subtitle":"Tranches d'oranges pelées à vif, nappées d'un caramel épicé à la cannelle ou cardamome · Pour 4 · Préparation 20 min · Cuisson 5 min","chapter":"V","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien","rapide"],"ingredients":["5–6 oranges","50 g sucre","1 c.à.s. épices au choix (pain d'épices, spéculoos, cannelle, cardamome…)","un peu d'eau chaude"],"steps":["Peler les oranges à vif en enlevant bien la peau et la partie blanche amère. Tailler en tranches et disposer dans un plat ou des coupes individuelles.","Faire un caramel à sec : verser ⅓ du sucre dans une grande casserole et chauffer. Quand il commence à blondir, ajouter le 2e tiers, puis le dernier.","Quand le caramel est blond-ambré (pas trop foncé pour éviter l'amertume), ajouter les épices puis de l'eau bouillante très lentement (attention aux projections). Mélanger.","Laisser refroidir la sauce (elle peut être tiède mais pas bouillante). La verser sur les oranges. Ajouter le jus récupéré lors de la découpe.","Réfrigérer quelques heures pour que les arômes se diffusent. Déguster bien frais."],"sous_section":""},{"title":"Les CCC – Cookies Coco Chocolat(s)","subtitle":"Biscuits moelleux à l'huile de coco, flocons d'avoine, pépites de chocolat blanc et noix de coco · Pour 6 · Préparation 10 min · Cuisson 15 min","chapter":"V","chapter_name":"Desserts & douceurs","tags":["végétarien","famille"],"ingredients":["80 g beurre demi-sel pommade","30 g huile de coco","80 g cassonade","50 g sucre en poudre","1 œuf","130 g farine","1 c.à.c. levure chimique","60 g flocons d'avoine","25 g noix de coco en copeaux non sucrés (ou râpée)","50 g pépites de chocolat blanc","100 g chocolat noir (optionnel)"],"steps":["Mélanger le beurre pommade, l'huile de coco, la cassonade et le sucre.","Ajouter l'œuf et mélanger jusqu'à homogénéité.","Incorporer la farine, la levure, la noix de coco et les flocons d'avoine en mélangeant à peine (juste assez pour homogénéiser). Ajouter les pépites de chocolat blanc.","Former des petits tas sur papier sulfurisé et les aplatir en disques avec le dos d'une cuiller.","Enfourner à 160 °C pendant 15 min environ. Les biscuits doivent être à peine dorés à la sortie du four.","Optionnel : une fois froids, faire fondre le chocolat noir et tremper la moitié de chaque cookie. Réserver sur grille jusqu'à refroidissement complet."],"sous_section":""},{"title":"Caramel au beurre salé de ma maman","subtitle":"La recette familiale infaillible — sucre cuit, crème chaude et beurre demi-sel · Pour 10 · Préparation 30 min · Cuisson 40 min","chapter":"V","chapter_name":"Desserts & douceurs","tags":["végétarien"],"ingredients":["160 g sucre en poudre","80 g beurre demi-sel","20 cl crème fraîche liquide","fleur de sel"],"steps":["Verser ⅓ du sucre dans une grande casserole. Chauffer à feu assez vif (induction) ou moyen-fort (gaz).","Quand le sucre commence à blondir sur les côtés, ajouter le 2e tiers. Même chose avec le dernier tiers.","Pendant la cuisson du caramel, faire chauffer la crème (micro-ondes ou casserole) jusqu'au bord de l'ébullition.","Quand le caramel est ambré (couleur au choix), ajouter la crème chaude LENTEMENT et avec précaution (risque de projection). Mélanger à la cuiller en bois.","Si le caramel cristallise, continuer à chauffer jusqu'à ce qu'il redevienne liquide.","Ajouter le beurre coupé en dés et mélanger. Ajuster la fleur de sel selon le goût.","Verser dans un bocal en verre propre et conserver au frais."],"sous_section":""},{"title":"Pavlova individuelle aux fraises","subtitle":"Meringues craquantes pochées à la douille, chantilly légère et fraises fraîches — 6 pavlova individuelles · Pour 6 · Préparation 30 min · Cuisson 1h30 à 2h","chapter":"V","chapter_name":"Desserts & douceurs","tags":["sans gluten","végétarien","famille"],"ingredients":["100 g blancs d'œufs précisément (≈ 4 œufs)","55 g sucre en poudre","55 g sucre glace","150 g crème fraîche liquide 30% MG min., très froide","optionnel : vanille en poudre, zestes de citron vert ou basilic","fraises, autant que vous voulez !"],"steps":["Battre les blancs à PETITE vitesse. Quand ils moussent et blanchissent, ajouter ½ du sucre en poudre et continuer à petite vitesse.","Quand le sucre est absorbé, ajouter l'autre moitié. Battre à vitesse moyenne 2–3 min.","Ajouter le sucre glace et battre à vitesse moyenne environ 10 min, puis à grande vitesse 1–2 min.","Sur une feuille de papier sulfurisé, tracer 6 cercles de 8 cm (emporte-pièce ou bouteille). Retourner le papier. Pocher la meringue en 2 tours au pourtour, 1 seul au centre.","Cuire à 110 °C pendant 1h30 à 2h. Éteindre le four et laisser les meringues à l'intérieur sans ouvrir, idéalement toute une nuit.","Optionnel : infuser la crème avec vanille, citron vert ou basilic, puis refroidir. Battre la crème froide en chantilly moelleuse (pas trop ferme).","Au moment de servir : pocher la chantilly sur les meringues. Déposer les fraises coupées en quartiers. Servir aussitôt."],"sous_section":""},{"title":"Ginger Beer – version allégée en sucre","subtitle":"Boisson pétillante maison au gingembre fermenté, légèrement citronnée · Pour 6 · Préparation 5 min · Fermentation 10 à 24h","chapter":"VI","chapter_name":"Boissons","tags":["famille","rapide"],"ingredients":["75 g gingembre frais","50 g sucre","½ jus de citron jaune (ou 1 jus de citron vert)","½ c.à.c. levure de boulanger sèche (2 g env.)","1 litre eau","1 bouteille en plastique"],"steps":["Éplucher le gingembre (ou bien laver s'il est bio) et l'émincer finement ou le râper.","Mettre dans la bouteille. Ajouter la levure, le sucre, le jus de citron puis 1 litre d'eau (utiliser un entonnoir). Fermer et secouer.","Faire fermenter à température ambiante en ouvrant de temps en temps pour dégazer. Environ 10 h à 30 °C, 24 h s'il fait plus frais. La ginger beer est prête quand elle est légèrement pétillante.","Filtrer dans une carafe à l'aide d'une petite passoire. Placer au réfrigérateur et consommer bien frais."],"sous_section":"Boissons"},{"title":"Jus de pastèque, menthe et basilic","subtitle":"Boisson ultra fraîche et colorée, parfaite pour l'été · Pour 6 · Préparation 10 min","chapter":"VI","chapter_name":"Boissons","tags":["végétarien","famille","rapide"],"ingredients":["750 g chair de pastèque sans peau ni pépins","1 litre eau","5 c.à.c. sucre en poudre (à ajuster)","15 feuilles basilic","15 feuilles menthe","glaçons à volonté"],"steps":["Mixer la chair de pastèque avec le sucre et environ ½ litre d'eau.","Verser dans une carafe en filtrant à travers une passoire pour éviter le dépôt. Compléter avec le reste de l'eau. Placer au frais.","Juste avant de servir, piler ou froisser les feuilles de basilic et de menthe pour libérer leurs arômes. Déposer dans les verres.","Verser le jus de pastèque et ajouter généreusement des glaçons."],"sous_section":"Boissons"},{"title":"Cocktail gingembre et épices sans alcool","subtitle":"Infusion citronnelle-kaffir-cannelle fraîche, servie avec beaucoup de glaçons · Pour 4 · Préparation 5 min · Cuisson 5 min","chapter":"VI","chapter_name":"Boissons","tags":["végétarien","rapide"],"ingredients":["2 cm gingembre frais","1 tige citronnelle","1 feuille de kaffir lime","½ c.à.c. cannelle","2 petits citrons verts (ou 1 gros)","2 c.à.s. sucre roux","½ litre eau"],"steps":["Faire bouillir l'eau. Écraser la citronnelle avec un couteau (pour libérer les arômes), retirer la couche extérieure et couper en gros tronçons. Éplucher et émincer finement le gingembre. Froisser la feuille de kaffir.","Hors du feu, faire infuser la citronnelle, le gingembre et le kaffir dans l'eau chaude. Ajouter la cannelle et le sucre, mélanger.","Laisser infuser au moins 10 minutes (ou quelques heures pour plus d'arômes). Passer à la passoire.","Presser les citrons verts dans une carafe. Ajouter l'infusion, goûter et rectifier (sucre ou citron). Servir avec beaucoup de glaçons !"],"sous_section":"Boissons"},{"title":"Chia fresca","subtitle":"La limonade traditionnelle mexicaine aux graines de chia","chapter":"VI","chapter_name":"Boissons","tags":["sans gluten","végétarien","rapide"],"ingredients":["10 g graines de chia","30 ml jus de citron (½ citron)","1 c.à.c. sirop d'agave","250 ml eau fraîche","2 glaçons"],"steps":["Faire tremper le chia dans 250 ml d'eau fraîche pendant 5 min en remuant régulièrement.","Ajouter le citron et l'agave. Agiter vivement. Attendre encore 10 min en remuant. Ajouter les glaçons et déguster."],"sous_section":"Boissons"},{"title":"Supergreen smoothie","subtitle":"Kiwi, épinards et eau de coco liés par le chia — onctueux et revitalisant","chapter":"VI","chapter_name":"Boissons","tags":["sans gluten","végétarien","rapide"],"ingredients":["1 c.à.s. graines de chia (rase)","200 ml eau de coco","2 kiwis bien mûrs","1 poignée pousses d'épinards","1–2 c.à.c. spiruline (facultatif)"],"steps":["Mélanger le chia avec 40 ml d'eau de coco, attendre 5 min.","Mixer longuement avec le reste de l'eau de coco, les kiwis, les épinards et la spiruline. Servir frais."],"sous_section":"Boissons"},{"title":"Pisco sour","subtitle":"Le cocktail national péruvien — pisco, citron vert et blanc d'œuf","chapter":"VI","chapter_name":"Boissons","tags":["sans gluten","rapide"],"ingredients":["7 cl pisco","5 cl jus de citron vert","3 cl sirop de sucre de canne","1 blanc d'œuf","4 glaçons","quelques gouttes angostura bitter"],"steps":["Verser tous les ingrédients dans un shaker. Shaker très fort pendant 1 minute.","Servir dans un verre préalablement refroidi. Ajouter 3–4 gouttes d'angostura bitter en finition."],"sous_section":"Boissons"},{"title":"Goma daré","subtitle":"Sauce sésame-soja crémeuse — pour brochettes, nouilles, fondues","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces japonaises","tags":["végétarien"],"ingredients":["120 g purée de sésame (tahin)","12 cl bouillon de légumes ou lait de soja","2 c.à.s. vinaigre de riz","4 c.à.s. sauce soja"],"steps":["Dans un bol, délayer la purée de sésame dans ¼ du bouillon.","Verser le reste du bouillon petit à petit en remuant sans cesse, comme pour monter une mayonnaise.","Ajouter la sauce soja et le vinaigre. Mélanger pour obtenir une sauce onctueuse.","Se conserve 2 semaines au réfrigérateur."]},{"title":"Sauce miso","subtitle":"Sauce miso-sésame-mirin — légère et umami","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces japonaises","tags":["végétarien"],"ingredients":["30 g miso","2 c.à.s. bouillon de légumes ou eau","1 c.à.s. mirin","1 c.à.s. purée de sésame (tahin)"],"steps":["Dans un bol, mélanger le miso avec le reste des ingrédients.","Filtrer le tout.","Se conserve 2 semaines au réfrigérateur."]},{"title":"Sauce ponzu","subtitle":"Sauce soja citronnée infusée au shiitaké et kombu","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces japonaises","tags":["végétarien"],"ingredients":["1 shiitaké séché","5 cm kombu séché","4 c.à.s. jus de citron","4 c.à.s. jus de mandarine","4 c.à.s. mirin","12 cl sauce soja"],"steps":["La veille : déposer le shiitaké et le kombu dans un bocal, recouvrir de sauce soja. Fermer et laisser infuser toute une nuit au réfrigérateur.","Le jour même : filtrer la sauce et ajouter le jus de citron, de mandarine et le mirin.","Se conserve 2 semaines au réfrigérateur."]},{"title":"Sauce yakitori","subtitle":"Sauce sucrée-salée caramélisée pour brochettes et grillades","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces japonaises","tags":["végétarien"],"ingredients":["12 cl saké","5 c.à.s. mirin (ou ½ c.à.c. bouillon légumes en poudre)","15 cl sauce soja","3 c.à.s. sucre semoule"],"steps":["Déposer tous les ingrédients dans une casserole.","Porter à ébullition en remuant pour dissoudre le sucre.","Laisser mijoter 15 min à feu doux pour obtenir une consistance sirupeuse.","Se conserve 1 semaine au réfrigérateur."]},{"title":"Sauce tonkatsu","subtitle":"Sauce sucrée-acidulée aux pommes pour panés et tempuras","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces japonaises","tags":["végétarien"],"ingredients":["4 c.à.s. compote de pommes","1 c.à.s. gingembre frais râpé","1 gousse d'ail râpée","4 c.à.s. mirin","4 c.à.s. concentré de tomates","1 c.à.s. vinaigre de riz","2 c.à.s. sauce soja","4 c.à.s. sucre semoule"],"steps":["Déposer tous les ingrédients dans une casserole.","Porter à ébullition en remuant pour dissoudre le sucre.","Laisser mijoter 5 min à feu doux jusqu'à consistance sirupeuse.","Se conserve 2 semaines au réfrigérateur."]},{"title":"Sauce teriyaki","subtitle":"La sauce japonaise incontournable, laquée et brillante","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces japonaises","tags":["végétarien"],"ingredients":["20 cl sauce soja","15 cl mirin","4 c.à.s. sucre semoule"],"steps":["Déposer tous les ingrédients dans une casserole.","Porter à ébullition puis baisser le feu.","Laisser réduire 5 min en remuant de temps en temps.","Se conserve 2 semaines au réfrigérateur."]},{"title":"Tsuyu (sauce tempura)","subtitle":"Bouillon dashi léger pour tremper les tempuras et les soba","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces japonaises","tags":["végétarien"],"ingredients":["1 shiitaké séché","5 cm kombu séché","6 c.à.s. mirin","6 c.à.s. sauce soja","20 cl eau"],"steps":["Verser l'eau dans une casserole, ajouter le reste des ingrédients.","Faire chauffer à feu moyen jusqu'à ébullition.","Arrêter le feu et laisser refroidir. Filtrer.","Se conserve 1 semaine au réfrigérateur."]},{"title":"Sauce ume","subtitle":"Sauce umeboshi acidulée et légèrement sucrée","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces japonaises","tags":["végétarien"],"ingredients":["2 c.à.s. purée d'umeboshi","2 c.à.s. saké","2 c.à.s. mirin"],"steps":["Dans un bol, mélanger l'ensemble des ingrédients.","Se conserve 3 semaines au réfrigérateur."]},{"title":"Sauce chinoise hoisin","subtitle":"Sauce sucrée-pimentée à la cacahuète, façon asiatique","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces du monde","tags":["végétarien"],"ingredients":["1 gousse d'ail râpée","1 c.à.s. miel","2 c.à.s. beurre de cacahuète","1 c.à.s. purée de piment","4 c.à.s. sauce soja","½ c.à.s. vinaigre de riz","½ c.à.s. huile de sésame toasté","1 pincée de poivre"],"steps":["Dans un bol, mélanger l'ensemble des ingrédients.","Se conserve environ 5 jours au réfrigérateur."]},{"title":"Sauce péruvienne","subtitle":"Sauce verte crémeuse à la coriandre et jalapeño","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces du monde","tags":["végétarien"],"ingredients":["4 oignons nouveaux","1 gousse d'ail","2 piments jalapeño verts","½ bouquet de coriandre","4 c.à.s. mayonnaise","Sel, poivre du moulin"],"steps":["Effeuiller la coriandre. Retirer les graines des piments.","Placer l'ensemble des ingrédients dans le bol d'un mixeur. Mixer jusqu'à obtenir une sauce homogène."]},{"title":"Tzatziki","subtitle":"Sauce grecque concombre-yaourt à l'aneth et à la menthe","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces du monde","tags":["végétarien"],"ingredients":["¼ concombre","1 gousse d'ail râpée","1 brin d'aneth","Quelques feuilles de menthe","250 g yaourt à la grecque","Jus de ½ citron","1 c.à.s. huile d'olive","Sel, poivre du moulin"],"steps":["Peler le concombre, retirer les pépins et râper.","Ciseler l'aneth et la menthe.","Dans un saladier, mélanger tous les ingrédients.","Laisser reposer 30 min au réfrigérateur."]},{"title":"Sauce au sésame","subtitle":"Sauce tahini-soja légèrement pimentée au gochujang","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces du monde","tags":["végétarien"],"ingredients":["5 c.à.s. tahini","1 c.à.s. pâte de piment fermenté gochujang (ou 1 c.à.c. purée de piment)","4 c.à.s. sauce soja","½ c.à.s. sucre semoule","4 c.à.s. eau chaude"],"steps":["Dans un bol, mélanger l'ensemble des ingrédients.","Se conserve environ 5 jours au réfrigérateur."]},{"title":"Guacamole","subtitle":"L'incontournable mexicain à l'avocat, citron vert et coriandre","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces du monde","tags":["végétarien"],"ingredients":["2 avocats","1 oignon nouveau","1 citron vert","1 gousse d'ail","1 tomate","Quelques brins de coriandre","Piment en poudre (facultatif)","Quelques gouttes de Tabasco","Sel, poivre du moulin"],"steps":["Émincer l'oignon nouveau.","Dans le bol d'un mixeur, mettre la chair des avocats avec tous les ingrédients sauf le piment. Mixer jusqu'à homogénéité.","Saupoudrer éventuellement de piment. Déguster sans tarder."]},{"title":"Sauce chimichurri","subtitle":"Sauce argentine aux herbes fraîches et piment rouge","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces du monde","tags":["végétarien"],"ingredients":["½ oignon","3 gousses d'ail râpées","½ bouquet de persil plat","8 brins de coriandre","1 petit piment rouge","3 c.à.s. vinaigre de vin rouge","15 cl huile","Sel, poivre du moulin"],"steps":["Éplucher l'oignon, retirer les graines du piment rouge, émincer très finement.","Ciseler le persil et la coriandre.","Dans un bol, mélanger tous les ingrédients.","Se conserve 3 jours au réfrigérateur."]},{"title":"Sauce à la tomate fraîche","subtitle":"Le b.a.-ba, la première sauce pour pâtes à apprendre","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces du monde","tags":["végétarien"],"ingredients":["4 tomates mûres (variétés anciennes ou roma)","1 gousse d'ail","Fleurs de fenouil, basilic frais (facultatif)","Huile d'olive","1 c.à.c. gros sel","1–2 tours de poivre noir de Sarawak"],"steps":["Retirer le cœur des tomates, tracer une croix. Plonger dans l'eau de cuisson des pâtes bouillante.","Faire chauffer 2 c.à.s. d'huile d'olive à feu moyen. Y déposer la gousse d'ail entière.","Égoutter, peler et écraser grossièrement les tomates. Verser dans la casserole avec le sel.","Couvrir et laisser mijoter à feu doux pendant la cuisson des pâtes.","Ajouter fenouil et basilic au moment de servir."]},{"title":"Sauce au citron pour pâtes","subtitle":"Sauce sicilienne au citron caramélisé et petits oignons frais","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces du monde","tags":["végétarien"],"ingredients":["2 citrons (côte amalfitaine ou Sicile de préférence)","3 petits oignons nouveaux","Quelques brins de persil plat","1 c.à.s. huile d'olive","Gros sel","1–2 tours de poivre de Sarawak"],"steps":["Prélever le zeste d'un citron. Couper en tranches fines puis en quatre. Presser l'autre citron.","Couper finement les petits oignons. Hacher le persil.","Faire revenir les oignons 2–3 min dans l'huile d'olive. Ajouter sel, poivre et pulpe de citron.","Quand les pâtes sont al dente, ajouter jus et zeste de citron dans la sauce. Servir aussitôt."]},{"title":"Caviar d'aubergine au zaatar","subtitle":"Dip d'aubergine rôtie au zaatar, citron et grenade","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Tapenades & pesto","tags":["végétarien"],"ingredients":["1 aubergine coupée en deux","1 gousse d'ail râpée","Zeste et jus de ½ citron","Quelques graines de grenade (facultatif)","2 c.à.s. huile d'olive","1 c.à.c. zaatar","Sel, poivre du moulin"],"steps":["Préchauffer le four à 180°C. Mélanger le zaatar et ½ c.à.s. d'huile. Badigeonner les demi-aubergines (côté peau dessus). Enfourner 20 min.","Récupérer la pulpe de l'aubergine. La déposer dans un bol avec le reste des ingrédients. Écraser à la fourchette.","Laisser reposer au frais au moins 1 heure. Décorer de graines de grenade avant de servir."]},{"title":"Pesto de basilic","subtitle":"Le pesto classique basilic-pignons-parmesan","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Tapenades & pesto","tags":["végétarien"],"ingredients":["1 bouquet de basilic","5 cl huile d'olive","1 gousse d'ail","15 g pignons de pin","50 g parmesan","Sel, poivre du moulin"],"steps":["Effeuiller le basilic.","Passer l'ensemble des ingrédients au mixeur.","Se conserve environ 3 jours au réfrigérateur."]},{"title":"Salsa mexicaine","subtitle":"Salsa fraîche tomates-jalapeño-coriandre","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Tapenades & pesto","tags":["végétarien"],"ingredients":["2 tomates","½ oignon rouge","½ piment jalapeño","1 gousse d'ail râpée","8 brins de coriandre","Jus de 1 citron vert","2 c.à.s. huile d'olive","Sel, poivre du moulin"],"steps":["Couper les tomates en petits dés. Émincer finement l'oignon rouge. Retirer les graines du piment et hacher la chair. Ciseler la coriandre.","Dans un bol, mélanger tous les ingrédients.","Laisser reposer au réfrigérateur au moins 1 heure avant de déguster."]},{"title":"Vinaigrette au citron","subtitle":"Vinaigrette légère moutarde-citron-ciboulette","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Vinaigrettes","tags":["végétarien"],"ingredients":["3 c.à.s. jus de citron","Quelques brins de ciboulette ciselés","½ c.à.s. moutarde","3 c.à.s. huile d'olive","Sel, poivre du moulin"],"steps":["Dans un bol, mélanger l'ensemble des ingrédients pour bien émulsionner."]},{"title":"Vinaigrette au soja","subtitle":"Vinaigrette asiatique soja-vinaigre de riz-sésame","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Vinaigrettes","tags":["végétarien"],"ingredients":["3 c.à.s. sauce soja","3 c.à.s. vinaigre de riz","3 c.à.s. huile de sésame toasté"],"steps":["Dans un bol, mélanger l'ensemble des ingrédients pour bien émulsionner."]},{"title":"Vinaigrette au miso","subtitle":"Vinaigrette umami miso-soja-sésame","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Vinaigrettes","tags":["végétarien"],"ingredients":["1 c.à.s. rase de miso","1 c.à.s. graines de sésame","2 c.à.s. sauce soja","2 c.à.s. vinaigre de riz","2 c.à.s. huile de sésame toasté","2 c.à.s. huile d'olive"],"steps":["Dans un bol, mélanger l'ensemble des ingrédients pour bien émulsionner."]},{"title":"Vinaigrette oméga-3","subtitle":"Vinaigrette santé aux graines de lin, colza et gomashio","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Vinaigrettes","tags":["végétarien"],"ingredients":["1 c.à.s. gomashio","½ c.à.s. graines de lin","1 c.à.s. huile de colza","2 c.à.s. huile d'olive","1 c.à.s. vinaigre balsamique"],"steps":["Dans un bol, mélanger l'ensemble des ingrédients pour bien émulsionner."]},{"title":"Vinaigrette sans huile aux agrumes","subtitle":"Vinaigrette légère au gel de chia et jus d'orange","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Vinaigrettes","tags":["végétarien"],"ingredients":["1 c.à.c. gel de chia","½ orange (jus)","1 c.à.c. jus de citron","½ c.à.c. sirop d'agave","Sel, poivre"],"steps":["Dans un bol, mélanger l'ensemble des ingrédients pour bien émulsionner."]},{"title":"Huile gingembre et baies roses","subtitle":"Huile parfumée au gingembre et baies roses — 3 jours d'infusion","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Huiles aromatisées","tags":["végétarien"],"ingredients":["1 cm gingembre frais","½ c.à.s. baies roses","15 cl huile de pépins de raisin","15 cl huile de sésame grillé"],"steps":["Concasser les baies roses. Peler le gingembre et couper en fines lamelles.","Verser les huiles dans un récipient, ajouter les baies roses et le gingembre. Couvrir.","Laisser mariner 3 jours minimum avant utilisation."]},{"title":"Huile à la vanille","subtitle":"Huile d'olive infusée à la gousse de vanille","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Huiles aromatisées","tags":["végétarien"],"ingredients":["1 gousse de vanille","30 cl huile d'olive"],"steps":["Fendre la gousse de vanille, prélever les graines.","Verser l'huile dans un récipient, ajouter les graines et la gousse. Couvrir.","Laisser mariner 3 jours minimum avant utilisation."]},{"title":"Huile ail et piment d'Espelette","subtitle":"Huile d'olive infusée à l'ail confit et piment d'Espelette","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Huiles aromatisées","tags":["végétarien"],"ingredients":["4 gousses d'ail pelées et dégermées","2 c.à.c. piment d'Espelette","30 cl huile d'olive"],"steps":["Verser l'huile dans un récipient. Ajouter les gousses d'ail et le piment d'Espelette. Couvrir.","Laisser mariner 3 jours minimum avant utilisation."]},{"title":"Huile citron et coriandre","subtitle":"Huile parfumée au citron et graines de coriandre concassées","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Huiles aromatisées","tags":["végétarien"],"ingredients":["1 citron non traité","½ c.à.s. graines de coriandre","10 cl huile de sésame grillé","20 cl huile d'olive"],"steps":["Concasser les graines de coriandre. Rincer le citron et couper en fines rondelles.","Verser les huiles dans un récipient. Ajouter le citron et la coriandre. Couvrir.","Laisser mariner 3 jours minimum. Ces huiles se conservent longtemps dans des bouteilles en verre à l'abri de la chaleur et de la lumière."]},{"title":"Huile d'ail confit","subtitle":"Ail entier confit au four à 120°C, infusé dans l'huile d'olive · Pour 20 portions · Préparation 10 min · Cuisson 40 min","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Huiles aromatisées","tags":["végétarien"],"ingredients":["1 tête d'ail","Huile d'olive","Grains de poivre (Sichuan ou baies roses)","Sel"],"steps":["Laver l'ail entier. Découper la tête à environ 1/5 du sommet.","Déposer sur une feuille d'aluminium. Saler et poivrer légèrement. Refermer hermétiquement.","Cuire à 120°C environ 40 min jusqu'à ce que les gousses soient tendres et légèrement caramélisées.","Laisser refroidir. Déposer dans un bocal propre. Ajouter des grains de poivre si souhaité.","Recouvrir d'huile d'olive. Fermer et infuser 2 semaines à l'abri de la lumière."]},{"title":"Chutney de mangue","subtitle":"Chutney indien classique à la mangue, épices et vinaigre","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Chutneys","tags":["végétarien"],"ingredients":["1 grosse mangue","1 gousse d'ail râpée","1 c.à.c. gingembre frais râpé","1 petit piment rouge","2 graines de cardamome","½ c.à.c. graines de coriandre","1 pincée de cumin","1 bâton de cannelle","100 g sucre semoule","10 cl vinaigre de vin"],"steps":["Torréfier la cardamome, la coriandre et le cumin à sec jusqu'à ce qu'ils dégagent leur parfum. Concasser au mortier.","Éplucher la mangue et couper en dés. Faire fondre le sucre dans le vinaigre.","Ajouter le reste des ingrédients et cuire à feu doux environ 20 min.","Transvaser dans un bocal. Se conserve 2 semaines au réfrigérateur."]},{"title":"Chutney à la menthe et au cumin","subtitle":"Chutney frais au yaourt grec, menthe et gingembre","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Chutneys","tags":["végétarien"],"ingredients":["1 belle botte de menthe","1 citron vert","1 yaourt à la grecque","2 cm gingembre frais","1 c.à.c. graines de cumin","⅓ c.à.c. sel"],"steps":["Mixer la moitié du yaourt avec les feuilles de menthe, le jus de citron vert, le gingembre et le sel.","Incorporer le reste du yaourt. Réserver 1 h au frais.","Faire griller les graines de cumin à sec jusqu'à légère coloration. Ajouter au moment de servir."]},{"title":"Chutney noix de coco et piment","subtitle":"Chutney indien noix de coco fraîche, piment et graines de moutarde","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Chutneys","tags":["végétarien"],"ingredients":["100 g noix de coco fraîchement râpée (ou déshydratée)","1 piment frais rouge ou vert","1 citron vert","1 c.à.c. graines de moutarde","1 c.à.c. graines de cumin","Huile végétale neutre","⅓ c.à.c. sel"],"steps":["Si noix de coco déshydratée, la tremper 1 h dans l'eau tiède.","Faire chauffer 2 c.à.s. d'huile, faire revenir le cumin et les graines de moutarde 5 min à feu vif. Réserver.","Dans le mixeur : noix de coco, 1 c.à.s. eau, jus de citron vert, moitié du piment et sel. Mixer finement.","Ajouter la première préparation (huile + épices). Mixer légèrement. Incorporer le reste du piment émincé."]},{"title":"Chutney coriandre et sésame","subtitle":"Chutney vert frais à la coriandre, piment et sésame","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Chutneys","tags":["végétarien"],"ingredients":["1 botte de coriandre","1 citron vert","1 piment vert","2 gousses d'ail","3 cm gingembre","1 c.à.s. graines de sésame blanc","3 c.à.s. huile végétale","1 c.à.c. sucre de canne","1 pincée de sel"],"steps":["Peler l'ail et dégermer. Peler le gingembre grossièrement. Épépiner le piment.","Mettre tous les ingrédients dans le mixeur : coriandre lavée, jus de citron vert, piment, ail, gingembre, sésame, sucre et sel. Mixer finement.","Garder au frais."]},{"title":"Chutney aux noix de cajou","subtitle":"Chutney onctueux cajou-yaourt, ultra simple et sans cuisson","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Chutneys","tags":["végétarien"],"ingredients":["150 g noix de cajou non salées et non grillées","1 yaourt à la grecque","½ c.à.c. sel"],"steps":["Mixer tous les ingrédients finement.","Conserver au frais. Servir avec quelques feuilles de coriandre."]},{"title":"Chutney à la tomate","subtitle":"Chutney indien à la tomate cuite, vinaigre balsamique et jaggery","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Chutneys","tags":["végétarien"],"ingredients":["6 tomates bien mûres","2 cm gingembre + 1 gousse d'ail (ou ½ c.à.c. pâtes ail-gingembre)","1 piment vert frais","100 g sucre non raffiné (jaggery ou muscovado)","10 cl vinaigre balsamique","Sel"],"steps":["Laver les tomates, retirer le pédoncule et couper en 8 morceaux.","Mixer grossièrement tous les ingrédients au robot.","Faire cuire 45 min à feu doux jusqu'à épaississement."]},{"title":"Kimchi","subtitle":"Chou fermenté coréen pimenté — se prépare 2 jours à l'avance","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Condiments","tags":["végétarien"],"ingredients":["½ chou chinois","3 gousses d'ail râpées","1 c.à.s. gingembre frais râpé","1 c.à.c. sucre semoule","3 c.à.s. purée de piment","2 c.à.s. sel"],"steps":["Émincer le chou. Mélanger avec le sel dans un saladier, couvrir d'eau et laisser macérer 12 h.","Égoutter, rincer et presser le chou pour enlever le maximum d'eau.","Mélanger avec le reste des ingrédients. Transvaser dans un bocal.","Laisser reposer 24 h puis réfrigérer une nuit avant de déguster. Se conserve 3 semaines."]},{"title":"Dukkah","subtitle":"Mélange égyptien amandes-noisettes-épices à saupoudrer","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Condiments","tags":["végétarien"],"ingredients":["3 c.à.s. amandes","3 c.à.s. noisettes","2 c.à.s. graines de sésame","1 c.à.c. graines de coriandre","½ c.à.c. graines de cumin","½ c.à.c. sel","1 pincée de poivre"],"steps":["Torréfier les amandes et noisettes à sec dans une poêle jusqu'à dorure.","Concasser les graines de coriandre et de cumin dans un mortier.","Mixer l'ensemble des ingrédients. Se conserve environ 3 semaines."]},{"title":"Tfaya","subtitle":"Oignons caramélisés aux raisins secs et épices marocaines","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Condiments","tags":["végétarien"],"ingredients":["5 oignons","1 bâton de cannelle","½ c.à.c. curcuma en poudre","½ c.à.c. gingembre en poudre","3 c.à.s. raisins secs","2 c.à.s. sucre semoule","1 filet d'huile d'olive","Sel, poivre du moulin"],"steps":["Émincer les oignons. Les faire revenir dans l'huile avec la cannelle, le curcuma, le gingembre, sel et poivre jusqu'à ce qu'ils soient bien fondants.","Ajouter les raisins secs et poursuivre la cuisson quelques minutes.","Saupoudrer de sucre et cuire encore 3 min sans cesser de remuer jusqu'à caramélisation.","Se conserve 2 semaines au réfrigérateur."]},{"title":"Zaatar","subtitle":"Mélange de thym séché, sumac et graines de sésame","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Condiments","tags":["végétarien"],"ingredients":["4 c.à.s. thym séché","1 c.à.s. sumac (ou ½ c.à.s. zeste de citron)","1 c.à.s. graines de sésame","1 pincée de sel"],"steps":["Mélanger l'ensemble des ingrédients.","Se conserve environ 3 mois."]},{"title":"Pâte d'ail","subtitle":"Base indispensable des currys indiens — 1 c.à.c. = 3 gousses d'ail","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Bases de cuisine","tags":["végétarien"],"ingredients":["250 g ail","4–5 c.à.s. huile végétale"],"steps":["Éplucher et dégermer les gousses d'ail.","Passer au mixeur avec l'huile végétale jusqu'à obtenir une pâte lisse.","Se conserve 3–4 semaines au frais dans un pot en verre. Recouvrir d'un filet d'huile végétale pour éviter l'oxydation."]},{"title":"Pâte de gingembre","subtitle":"Base indispensable des currys indiens — 1 c.à.c. = 3 cm de gingembre","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Bases de cuisine","tags":["végétarien"],"ingredients":["250 g gingembre frais bio","4–5 c.à.s. huile végétale"],"steps":["Éplucher le gingembre.","Passer au mixeur avec l'huile végétale jusqu'à obtenir une pâte lisse.","Se conserve 3–4 semaines au frais dans un pot en verre. Recouvrir d'un filet d'huile végétale pour éviter l'oxydation."]},{"title":"Pâte de curry","subtitle":"La base aromatique de nombreux plats indiens — riche aux noix de cajou","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Bases de cuisine","tags":["végétarien"],"ingredients":["4 oignons jaunes hachés","4 gousses d'ail (ou 1 c.à.s. pâte d'ail)","4 cm gingembre (ou 1 c.à.s. pâte de gingembre)","1 piment vert végétarien (facultatif)","20 g noix de cajou non grillées et non salées","3 c.à.s. concentré de tomate","Épices entières : 3 gousses de cardamome, 2 clous de girofle, 2 feuilles de laurier","Épices en poudre : 1 c.à.c. garam masala, 1 c.à.s. cumin, 1 c.à.s. coriandre, ½ c.à.c. curcuma","Huile végétale, sel"],"steps":["Tremper les noix de cajou dans 25 cl d'eau pendant 1 h, puis mixer finement pour obtenir une crème.","Faire frire les épices entières dans 4 c.à.s. d'huile végétale 5 min à feu vif.","Ajouter les oignons hachés et le piment. Cuire en remuant 10 min jusqu'à translucidité.","Ajouter l'ail, le gingembre, les épices en poudre et 1 c.à.c. de sel. Mouiller avec 15 cl d'eau.","Une fois le liquide évaporé, ajouter le concentré de tomate et la crème de cajou. Réduire 10 min à feu moyen. Se conserve 1–10 jours au frais ou se congèle."]},{"title":"Sauce crudités moutarde-estragon","subtitle":"Chantilly de crème à la moutarde à l'estragon — prête en 5 minutes · Pour 6 · Préparation 5 min","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Bases de cuisine","tags":["végétarien"],"ingredients":["150 g crème liquide min. 30% MG, très froide","15 g moutarde aromatisée (estragon, piment d'Espelette…)","Sel"],"steps":["Verser la crème dans un grand bol, ajouter la moutarde et un peu de sel.","Monter en chantilly jusqu'à la consistance souhaitée (moelleuse de préférence).","Peut se préparer à l'avance, couvrir et réfrigérer."]},{"title":"Lèche de tigre","subtitle":"La marinade fondatrice de tous les ceviches péruviens","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Bases de cuisine","tags":["végétarien"],"ingredients":["Jus de 10 citrons verts","1 filet de poisson (ou 1 c.à.c. fumet de poisson)","1 gousse d'ail","2 cm gingembre","Purée de piments rocoto ou aji limo (piments péruviens)","½ c.à.c. poivre noir moulu","Sel fin"],"steps":["Verser le jus des citrons verts dans un récipient. Ajouter l'ail et le gingembre épluchés et finement coupés.","Ajouter sel, poivre et une pointe de purée de piments.","Facultatif : filtrer avec un chinois pour un jus plus limpide.","Ajouter le poisson coupé en cubes (ou le fumet). Laisser mariner environ 30 min."]},{"title":"Achards aux graines de moutarde","subtitle":"Condiment indien de légumes croquants au curcuma et graines de moutarde","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Achards & salades indiennes","tags":["végétarien"],"ingredients":["½ chou blanc de taille moyenne","3 carottes","250 g haricots verts","2 c.à.c. graines de moutarde brune et jaune","½ c.à.c. curcuma","2 c.à.s. vinaigre de vin","2 c.à.s. huile de tournesol","Sel"],"steps":["Éplucher les carottes. Émincer finement le chou et les carottes. Blanchir 2–3 min dans l'eau bouillante salée avec les haricots verts. Bien égoutter.","Diluer le curcuma dans 5 cl d'eau chaude. Dans une grande sauteuse, chauffer 2 c.à.s. d'huile et faire sauter les graines de moutarde quelques minutes.","Ajouter les légumes croquants et le curcuma dilué. Laisser le liquide s'évaporer de moitié. Laisser refroidir et servir.","Se conserve jusqu'à 1 mois au frais dans un bocal hermétique."]},{"title":"Kachumber salad","subtitle":"Salade indienne croquante au citron et coriandre fraîche","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Achards & salades indiennes","tags":["végétarien"],"ingredients":["1 petit oignon rouge","2 tomates fermes et bien mûres","1 petit concombre","6–7 radis","1 petit piment vert végétarien","½ botte de coriandre","Jus de 1 citron jaune","Huile d'olive","Sel, poivre"],"steps":["Éplucher le concombre et l'oignon rouge. Retirer les pédoncules des tomates, radis et piment (retirer les graines si trop fort). Hacher tous les légumes en petits cubes d'environ 1 cm.","Faire une vinaigrette : émulsionner le jus de citron, 3 c.à.s. d'huile d'olive, sel et poivre.","Mélanger les légumes avec la sauce et la coriandre ciselée. Servir bien frais."]},{"title":"Tomates séchées marinées","subtitle":"Tomates séchées confites à l'huile d'olive avec ail et câpres","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["250 g pétales de tomates séchées nature","4 gousses d'ail","2 c.à.s. câpres","Graines de fenouil","Quelques branches de thym","Vinaigre blanc","Huile d'olive"],"steps":["Recouvrir les tomates dans une casserole d'un mélange moitié eau, moitié vinaigre blanc. Porter à ébullition 5 min, égoutter et sécher.","Remplir le bocal en couches (tomates, ail, câpres, fenouil, thym). Couvrir d'huile sans bulles d'air.","Fermer hermétiquement. Laisser reposer quelques semaines à l'abri de la lumière."]},{"title":"Courgettes marinées","subtitle":"Rondelles de courgettes blanchies au vinaigre, marinées à l'huile","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["2 courgettes longues en rondelles de 0,5 cm","4 gousses d'ail","Feuilles de basilic ou de menthe","Graines de fenouil","Baies de poivre","Vinaigre blanc","Huile d'olive","Sel"],"steps":["Blanchir les rondelles 3–4 min dans un mélange moitié eau, moitié vinaigre blanc. Égoutter et sécher plusieurs heures sur un torchon.","Remplir le bocal par couches avec les aromates. Terminer en recouvrant d'huile d'olive.","Fermer hermétiquement. Réserver à l'abri de la lumière quelques semaines."]},{"title":"Aubergines marinées","subtitle":"Aubergines blanchies puis marinées à l'huile et aux aromates","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["2 aubergines en rondelles","4 gousses d'ail","1 petit piment doux","Feuilles de basilic ou de menthe","Vinaigre blanc","Huile d'olive","Sel"],"steps":["Saupoudrer les aubergines de sel et laisser dégorger 12 heures dans une passoire.","Blanchir 5 min dans un mélange eau/vinaigre blanc comme pour les tomates. Égoutter et sécher.","Remplir le bocal par couches avec l'ail, le piment et les aromates, en finissant par l'huile."]},{"title":"Oignons rouges marinés","subtitle":"Oignons rouges de Tropea cuits au vinaigre et marinés à l'huile","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["4 oignons rouges de Tropea","2 feuilles de laurier","Baies de poivre noir","Vinaigre blanc","Huile d'olive","2 c.à.c. sucre","1 c.à.c. sel"],"steps":["Peler et couper les oignons en rondelles grossières. Déposer dans une casserole, couvrir de vinaigre. Ajouter laurier, sel et sucre.","Porter à ébullition, couvrir et cuire 15 min à petits bouillons. Égoutter et sécher 2 heures sur un torchon.","Remplir le bocal par couches. Fermer hermétiquement. Laisser reposer quelques semaines."]},{"title":"Radis et haricots verts marinés","subtitle":"Légumes croquants macérés 24h dans un vinaigre aux baies roses","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["5 radis roses","10 haricots verts","20 cl vinaigre de cidre","5 cl eau","½ c.à.c. baies roses","1 c.à.s. sucre semoule","½ c.à.c. sel"],"steps":["Éliminer le bout des radis et les couper en quatre. Équeuter les haricots et les couper en deux.","Préparer le mélange au vinaigre en portant à ébullition tous les ingrédients dans une casserole.","Mettre les légumes dans un bocal, recouvrir du mélange chaud, fermer hermétiquement.","Laisser macérer 24 h au réfrigérateur. Se conserve 3 semaines."]},{"title":"Carotte et chou rouge marinés","subtitle":"Carotte râpée et chou rouge au vinaigre et graines de fenouil","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["1 petite carotte","100 g chou rouge","½ c.à.c. graines de fenouil","25 cl mélange au vinaigre (voir Radis et haricots verts)"],"steps":["Éplucher la carotte et la râper. Émincer le chou rouge.","Procéder comme pour les radis et haricots verts (mélange au vinaigre, bocal, macération 24 h)."]},{"title":"Navet, oignon rouge et aneth marinés","subtitle":"Navet et oignon rouge marinés au vinaigre et poivre du Sichuan","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Légumes marinés","tags":["végétarien"],"ingredients":["100 g navet long blanc","1 petit oignon rouge","4 brins d'aneth","½ c.à.c. poivre du Sichuan","25 cl mélange au vinaigre (voir Radis et haricots verts)"],"steps":["Émincer le navet et l'oignon. Ciseler l'aneth.","Procéder comme pour les radis et haricots verts (mélange au vinaigre, bocal, macération 24 h)."]},{"title":"Pitas maison","subtitle":"Pains pita légers, aérés et bien gonflés — parfaits pour être farcis ou trempés · Pour 6 pitas · Préparation 5 min · Cuisson 40 min · Repos 1h20 minimum","chapter":"I","chapter_name":"Quiches, tartes & petites bouchées","sous_section":"","tags":["végétarien","famille"],"ingredients":["24 cl d'eau tiède","2 c.à.c. levure sèche instantanée","2 c.à.c. sucre en poudre","300 g farine ordinaire + un peu pour saupoudrer","50 g farine complète","1 c.à.c. sel","1 c.à.s. huile d'olive + un peu pour graisser"],"steps":["Mettre l'eau dans un bol, saupoudrer la levure et le sucre. Laisser reposer 5–6 min pour former une mousse.","Verser les farines et le sel dans le bol d'un robot muni d'un crochet. Faire tourner à vitesse douce pour mélanger. Ajouter l'huile d'olive et le mélange à la levure, pétrir à vitesse moyenne-élevée pendant 7 min. La pâte doit être lisse, élastique et un peu collante.","Transférer la pâte dans un saladier huilé, couvrir d'un torchon humide et laisser lever 1–2 h dans un endroit chaud jusqu'à doubler de volume. (On peut aussi laisser lever toute une nuit au réfrigérateur.)","Sur un plan fariné, former 6 pâtons de 100 g. Rouler en boules, couvrir d'un torchon humide et laisser reposer 20 min.","Préchauffer le four à 240°C. Placer une grande plaque dans le four pour la faire chauffer.","Découper 2 morceaux de papier sulfurisé de la taille de la plaque, saupoudrer de farine. Déposer 2 boules de pâte bien espacées sur un morceau de papier. Au rouleau légèrement fariné, former des disques d'environ 12 cm. Ne pas trop travailler la pâte, sinon les pitas ne gonfleront pas.","Transférer délicatement sur la plaque chaude. Cuire 4–5 min jusqu'à légère dorure et gonflement. Couvrir d'un torchon humide pour garder au chaud (réutiliser le papier). Répéter jusqu'à 6 pitas. Garder couverts jusqu'au moment de servir."]},{"title":"Cev
