er les pommes, le gingembre et le jus de citron dans un récipient. Laisser reposer pendant la préparation de la pâte.","Fouetter beurre, sucre et zeste de citron 3 min à vitesse moyenne-élevée jusqu'à crémeux et aéré. Mélanger œufs, blanc et vanille, verser en 4–5 fois en fouettant (la pâte peut sembler légèrement caillée, c'est normal). Réduire la vitesse au minimum et incorporer les ingrédients secs tamisés jusqu'à homogénéité.","Réserver 100 g du mélange pommes-mûres. Incorporer le reste à la pâte. Verser dans le plat, lisser la surface. Recouvrir avec les fruits réservés et le crumble (résultat irrégulier, quelques fruits visibles).","Enfourner 45–50 min. Vérifier la cuisson avec une brochette — elle doit ressortir propre. Laisser refroidir environ 30 min. Servir tiède avec de la crème fraîche ou de la crème anglaise."],"source":"Comfort - Ottolenghi"},{"title":"Mousse au chocolat et caramel à l'orange","subtitle":"Mousse chocolat noir aérienne, caramel à l'orange, noisettes grillées et crème aigre · Pour 8 · Préparation 30 min · Repos 3h","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien"],"ingredients":["360 g chocolat noir (~64% cacao) grossièrement haché","6 œufs, jaunes et blancs séparés","60 g sucre en poudre","46 cl crème liquide","100 g crème aigre","50 g noisettes blanchies grillées et grossièrement hachées","Flocons de sel de mer","— Caramel à l'orange (facultatif) —","100 g sucre en poudre","2–3 grosses oranges : 12,5 cl de jus + 4 zestes en julienne pour la garniture"],"steps":["Faire fondre le chocolat au bain-marie dans un bol résistant à la chaleur au-dessus d'une casserole d'eau frémissante (le fond du bol ne doit pas toucher l'eau). Remuer de temps en temps, retirer du bain-marie et laisser tiédir.","Fouetter les jaunes d'œufs environ 1 min jusqu'à ce qu'ils pâlissent. Incorporer délicatement le chocolat fondu. Fouetter les blancs au robot 2 min à vitesse moyenne-élevée jusqu'à formation d'une mousse. Incorporer progressivement le sucre en fouettant 2–3 min jusqu'à pics fermes et brillants. Incorporer en 3 fois au mélange chocolaté en conservant un effet marbré.","Fouetter 36 cl de crème liquide 3 min à vitesse moyenne jusqu'à pics souples. Incorporer délicatement à la préparation avec ½ c.à.c. de flocons de sel. Verser dans un saladier de service ou dans 8 verres. Réfrigérer au moins 3 h (jusqu'à 3 jours).","Caramel à l'orange (facultatif) : étaler la moitié du sucre au fond d'une petite casserole à feu moyen-vif. Remuer pour faire fondre, ajouter le reste du sucre, cuire 3 min jusqu'à caramel ambré. Hors du feu, incorporer le jus d'orange (attention aux projections). Remettre sur le feu et remuer pour dissoudre. Incorporer ½ c.à.c. de flocons de sel. Laisser refroidir.","Fouetter le reste de crème liquide (10 cl) avec la crème aigre environ 1 min jusqu'à épaississement.","Environ 15 min avant de servir, sortir la mousse du réfrigérateur. Garnir de crème battue, arroser d'un filet de caramel et saupoudrer de noisettes grillées et de zestes d'orange en julienne."],"source":"Comfort - Ottolenghi"},{"title":"Pommes de terre croustillantes au romarin et au zaatar","subtitle":"Pommes de terre précuites à l'eau, enrobées de farine de riz et rôties à 240°C · Pour 6–8 · Préparation 20 min · Cuisson 1h15","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien","sans gluten"],"ingredients":["2,5 kg pommes de terre à chair farineuse (Désirée), pelées et en morceaux de 4–5 cm","2 c.à.s. sel de table","3 brins de romarin (1 entier + 2 finement hachés)","15 cl huile de tournesol","2 c.à.s. farine de riz non glutineuse","1 c.à.c. flocons de sel de mer","2 c.à.s. zaatar"],"steps":["Placer les pommes de terre dans une casserole, couvrir d'eau froide. Ajouter le sel et le brin de romarin entier. Porter à ébullition à feu vif. Baisser à feu moyen-vif et cuire 10–15 min jusqu'à tendres. Égoutter (jeter le romarin), remettre dans la casserole bien sèche. Laisser reposer 15 min minimum.","Préchauffer le four à 240°C (chaleur tournante 220°C).","Verser l'huile dans une plaque à rôtir et chauffer 10 min au four. Mélanger délicatement les pommes de terre avec la farine de riz pour bien les enrober. Déposer délicatement dans l'huile chaude (attention aux éclaboussures). Étaler à la spatule et enfourner 50 min en retournant à mi-cuisson jusqu'à bien dorées et croustillantes.","Ajouter le romarin haché, mélanger et remettre 3 min au four. Assaisonner de flocons de sel et zaatar. Mélanger une dernière fois et transférer dans un plat. Déguster sans attendre."],"source":"Comfort - Ottolenghi"},{"title":"Poulet au citron kaffir et gingembre","subtitle":"Blancs de poulet marinés dans une huile aromatisée citronnelle-kaffir-gingembre · Pour 4 · Préparation 15 min · Marinade 10 min · Cuisson 20 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande","sans gluten"],"ingredients":["4 blancs de poulet","10 cl huile d'olive","1 c.à.s. gingembre haché","1 bâton de citronnelle haché","6 feuilles de citron kaffir (en vente dans les épiceries asiatiques)","1 c.à.c. sucre","1 c.à.c. sel","1 petit bouquet de menthe et de coriandre hachées","1 petit piment rouge (facultatif)"],"steps":["Rassembler l'huile d'olive, le gingembre, la citronnelle et les feuilles de citron kaffir dans une casserole. Chauffer doucement et laisser cuire à petits bouillons 10 minutes afin que tous les parfums infusent. Diluer le sucre et le sel dans un peu d'eau chaude et ajouter à l'huile aromatisée. Laisser refroidir. Réserver au frais.","Cuire les blancs de poulet au four à 180°C pendant 20 minutes (en fonction de la taille) avec un peu de sel et de l'huile d'olive. Laisser refroidir. Couper le poulet en grosses lamelles et ajouter la sauce. Laisser mariner quelques heures avant de servir froid ou chaud. Terminer avec les herbes et éventuellement un petit piment rouge émincé."],"source":"Les festins partagés de God save the cream"},{"title":"Notre babaganoush d'aubergines fumées","subtitle":"Chair d'aubergines fumées au four, tahini, sambal et zeste de citron, garnie de grenade et persil","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Tapenades & pesto","tags":["végétarien","sans gluten"],"ingredients":["5 aubergines","2 c.à.s. tahini","Sel","½ c.à.c. sambal (ou autre pâte pimentée)","3 c.à.s. huile d'olive","Le zeste de 2 citrons","1 gousse d'ail écrasée","1 grenade","1 petite botte de persil plat haché"],"steps":["Faire cuire les aubergines entières dans un four à 200°C pendant au minimum 1 h. Elles doivent être rôties (peau quasiment brûlée) et très molles. Si vous avez un chalumeau, les passer au chalumeau à la sortie du four pour accentuer le goût fumé. Les couper en deux et prélever la chair.","Dans un saladier, mélanger la chair des aubergines avec le tahini, le sel, le sambal, l'huile d'olive, le zeste des citrons et la gousse d'ail écrasée. Mixer le tout et rectifier l'assaisonnement.","Servir avec des graines de grenade fraîche et du persil plat haché."],"source":"Comfort - Ottolenghi"},{"title":"Pissaladière","subtitle":"Tarte niçoise à la pâte moelleuse, oignons confits, anchois et olives","chapter":"I","chapter_name":"Quiches, tartes & petites bouchées","sous_section":"","tags":[],"ingredients":["— Pâte —","300 g de farine blanche","15 cl de lait entier","30 g de levure fraîche de boulanger","15 cl d'huile d'olive","1 pincée de sel","— Garniture —","1,5 kg d'oignons","20 filets d'anchois à l'huile","40 g d'olives noires de Nice dénoyautées (ou olives tagnasches)","2 gousses d'ail","1 feuille de laurier","1 branche de thym","Huile d'olive","Sel"],"steps":["Réaliser la pâte : dans une casserole, à feu doux, tiédir le lait. Hors du feu, ajouter la levure et laisser reposer le doigt sans se brûler. Dans un saladier, mélanger la farine et le sel, puis former un puits au centre. Verser le mélange lait-levure et l'huile d'olive. Pétrir avec les doigts, sans trop la travailler, pour obtenir une boule homogène.","Huiler un moule de 32 cm de diamètre, placer la boule au milieu et l'étaler avec les doigts et la paume des mains. La repousser de l'intérieur vers l'extérieur en faisant un mouvement de vague avec la main, jusqu'à atteindre le rebord du moule. L'aplatir légèrement (sans l'écraser). Couvrir avec un torchon et placer le moule dans un endroit chaud, à l'abri du soleil. Laisser monter la pâte au moins 1 heure, elle doit doubler de volume.","Préchauffer le four à 200 °C.","Éplucher et émincer finement les oignons. Dans une cocotte, faire chauffer 2 cuillerées à soupe d'huile d'olive à feu moyen et faire fondre les oignons avec le laurier, le thym et les gousses d'ail entières pelées. Quand les oignons sont assouplis, ajouter la moitié des filets d'anchois et remuer. Les oignons doivent être bien compotés, mais pas trop colorés. Si les oignons ne sont pas très juteux, ajouter 1 ou 2 cuillerées à soupe d'eau pour ne pas qu'ils accrochent. Saler.","Retirer les gousses d'ail, la branche de thym et la feuille de laurier et recouvrir la pâte de compotée d'oignons. Enfourner pour 45 minutes environ.","À la sortie du four, laisser tiédir, démouler, puis disposer dessus les olives dénoyautées, l'autre moitié des filets d'anchois en soleil et arroser d'un filet d'une bonne huile d'olive. Déguster tiède."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Mafé","subtitle":"Poulet mijoté à la sauce arachide, originaire d'Afrique de l'Ouest","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande"],"ingredients":["3 belles cuisses de poulet","3 c.à.s. de pâte d'arachide au naturel (sans sel, sans matière grasse ajoutée)","2 oignons jaunes","2 gousses d'ail","3–4 cm de gingembre frais","150 g de pulpe de tomate en conserve (ou de sauce tomate au naturel)","1 piment oiseau frais (ou 2 c.à.c. de paillettes de piment oiseau)","1 cube de bouillon de volaille bio","2 branches de thym","1 feuille de laurier","Huile végétale","Sel, poivre du moulin"],"steps":["À l'aide d'un couteau, séparer les hauts de cuisse des pilons. Dans une cocotte, chauffer un filet d'huile à feu vif et faire colorer les morceaux de poulet quelques minutes sur toutes les faces. Les débarrasser dans un plat en laissant les sucs de viande dans la cocotte.","Éplucher les oignons, les gousses d'ail et le gingembre. Dégermer les gousses d'ail. Émincer les oignons, les gousses d'ail et le gingembre. Les faire revenir avec les sucs de poulet pendant 10 minutes, jusqu'à ce qu'ils soient bien fondus et tout juste colorés. Émietter le bouillon cube. Ajouter la pulpe de tomate et le piment. Mélanger et laisser dessécher pendant 5 bonnes minutes. Le mélange doit être à la limite d'accrocher au fond de la cocotte.","Remettre les morceaux de poulet dans la cocotte. Ajouter la pâte d'arachide. Saler, poivrer. Bien mélanger pour délayer la pâte d'arachide dans le poulet. Verser de l'eau pour tout juste recouvrir le poulet. La pâte de curry va perdre son humidité et faire bouillir le gras. Ajouter un peu de lait de coco pour dégraisser la pâte de curry et faire bouillir 1 minute. Des perles d'huile verte doivent apparaître à la surface, ajouter les dés de poulet et le lait de coco à ébullition. Laisser bouillir pendant 2 minutes. Ajouter les feuilles de combava et le nouc-mâm, le sucre et les pousses de bambou. Laisser cuire 10 à 15 minutes, jusqu'à ce que les aubergines soient fondantes.","Servir avec du riz blanc."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Ratatouille","subtitle":"La compote d'été provençale aux légumes séparément cuits ensemble","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien"],"ingredients":["4 grosses tomates bien mûres","3 courgettes","2 aubergines","1 poivron rouge","1 poivron vert","2 oignons","2 gousses d'ail","10 feuilles de basilic","1 branche de nepita (ou de thym, sarriette, origan ou marjolaine)","10 cl d'huile d'olive","Sel, poivre du moulin"],"steps":["Inciser la base des tomates, puis les plonger 30 secondes dans de l'eau bouillante. Les passer sous l'eau froide, les peler, puis les concasser à l'aide d'un grand couteau. Couper séparément les aubergines, les courgettes et les poivrons en dés de 1,5 cm. Éplucher et émincer finement les oignons. Ciseler le basilic.","Dans une grande poêle, sur feu moyen, verser un filet d'huile d'olive et faire revenir les dés d'aubergine 10 à 15 minutes en remuant régulièrement. Ils doivent être souples et légèrement colorés. Les mettre dans une cocotte.","Dans la poêle, cuire les dés de courgette de la même manière pendant 10 minutes. Les verser dans la cocotte.","Ensuite, cuire les dés de poivron et les lamelles d'oignon ensemble dans la poêle pendant 10 minutes. Les mettre dans la cocotte.","Dans la cocotte, ajouter les tomates, l'ail et la nepita. Saler, couvrir et cuire encore 40 minutes à feu doux en remuant régulièrement. Retirer le couvercle et cuire encore 10 minutes à feu doux en remuant pour ne pas qu'elle attache, ajouter un fond de verre d'eau. Ajouter le basilic 10 minutes avant la fin de la cuisson. Si les légumes sont trop mouillés, prolonger la cuisson. La ratatouille doit être bien compotée, avec des reflets cuivrés. Goûter, rectifier l'assaisonnement, poivrer.","Servir avec des grillades, un poisson au four ou un poulet rôti."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Gratin dauphinois aux cèpes","subtitle":"Le gratin crémeux à la forestière, pommes de terre et cèpes fondants","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien"],"ingredients":["1 kg de pommes de terre à chair ferme","400 g de cèpes","80 cl de crème liquide","1 gousse d'ail","40 g de beurre","Quelques brins de persil","Noix de muscade à râper","Sel, poivre du moulin"],"steps":["Nettoyer les cèpes sans les laver à l'aide d'un couteau bien aiguisé et en grattant leur pied avec un couteau bien aiguisé. Les émincer et la couper en tranches de 5 mm d'épaisseur. Hacher le persil, peler la gousse d'ail et la couper en deux.","Dans une cocotte, à feu moyen, faire revenir les cèpes dans une généreuse noix de beurre en remuant pendant 10 minutes environ. Il ne doit plus rester d'eau au fond de la casserole. Saler, poivrer, réserver.","Éplucher, laver et essuyer les pommes de terre. Les couper en fines rondelles de 2–3 mm d'épaisseur. Dans un saladier, les assaisonner d'une pincée de sel, quelques tours de moulin à poivre, une bonne râpée de noix de muscade et bien mélanger.","Préchauffer le four à 180 °C. Beurrer un plat à gratin à bords hauts, frotter la ½ gousse d'ail restante sur tous les bords.","Mettre une couche de pommes de terre (un tiers environ), répartir la moitié des cèpes, puis un autre tiers de pommes de terre, le reste des cèpes et le reste des pommes de terre. Verser la crème et parsemer de noisettes de beurre.","Enfourner pour 1 heure à 1 h 15. Servir."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Soupe thaï au poulet et lait de coco","subtitle":"La soupe parfumée à la citronnelle, galanga et combava","chapter":"III","chapter_name":"Soupes & veloutés","sous_section":"","tags":["viande"],"ingredients":["600 g de blancs de poulet (ou de cuisses de poulet désossées)","60 cl de lait de coco*","1,5 l de bouillon de poulet","100 g de champignons de Paris","100 g de pousses de bambou en conserve (ou de mini épis de maïs)","2 échalotes","1 rhizome de galanga (environ 50 g)","5 tiges de citronnelle","10 feuilles de combava (aussi appelé lime kaffir)","Le jus de 2–3 citrons verts","1 petite botte de coriandre fraîche","7 c.à.s. de sucre de palme ou de canne complet ou cassonade","1 c.à.c. de sel","* La meilleure marque de lait de coco est incontestablement Aroy-D"],"steps":["Dans une grande casserole, verser le bouillon et le sel, et porter à ébullition à feu moyen.","Tailler le poulet en cubes de 2 cm. Éplucher et couper les échalotes en tout petits dés (1 mm) et la citronnelle en biseau. Couper le galanga en gros morceaux. Dans un mortier, piler énergiquement les échalotes, le galanga, la citronnelle et les feuilles de combava pour casser les fibres et libérer les arômes de chaque ingrédient. À défaut de mortier, placer les ingrédients dans un torchon et les écraser à l'aide d'un rouleau à pâtisserie, ou les mixer grossièrement dans un blender.","Ajouter ce mélange au bouillon et laisser infuser 5 minutes, toujours à feu moyen. Ajouter le nouc-mâm, le sucre et le jus de 2 citrons verts, pour avoir un parfait équilibre entre le sucre et l'acidité. Ajuster éventuellement avec le jus du 3e citron vert pour plus de fraîcheur. Prolonger la cuisson 2 minutes en remuant.","Ciseler finement les piments en laissant quelques graines, couper les champignons en quatre ou en six, selon leur grosseur. Égoutter les pousses de bambou et les couper en lamelles. Incorporer le tout à la soupe. Ajouter le poulet et cuire encore 5 à 10 minutes jusqu'à ce que la chair soit bien cuite.","Hacher grossièrement la coriandre et l'ajouter au dernier moment, juste avant de servir. Accompagner cette soupe de riz gluant."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Curry vert au poulet","subtitle":"Le curry vert thaï à la pâte maison, aubergines et lait de coco","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande"],"ingredients":["6 blancs de poulet","2 boîtes de 40 cl de lait de coco*","200 g de petites aubergines rondes ou un conserve (ou de mini épis de maïs)","100 g de pousses de bambou","1 petite botte de basilic thaï","5 feuilles de combava","2 c.à.s. de sucre de palme ou de canne","5 c.à.s. d'huile végétale","— Pâte de curry vert —","2 tiges de citronnelle","5 gousses d'ail","1 petite échalote","5 piments oiseaux verts","1 petite botte de coriandre","Le zeste de 1 combava râpé","20 grains de poivre blanc","1 c.à.s. de graines de coriandre","1 c.à.s. de cumin moulu","½ c.à.c. de racine de coriandre (facultatif)","* La meilleure marque de lait de coco est Aroy-D"],"steps":["Préparer la pâte de curry : retirer la base dure et la première feuille des tiges de citronnelle et les tailler grossièrement. Éplucher et dégermer les gousses d'ail. Éplucher et tailler grossièrement l'échalote. Équeuter les piments et les tailler grossièrement. Écraser (de préférence au pilon dans un mortier, mais on peut utiliser un blender) tous ces ingrédients, tiges comprises, la coriandre fraîche (avec les tiges) et la pâte de couleur verdâtre.","Détailler les blancs de poulet en dés de 2 cm de côté. Couper les aubergines rondes en quatre.","Dans un wok ou une cocotte en fonte, chauffer l'huile végétale à feu moyen d'une spatule. La pâte de curry va perdre son humidité et faire bouillir le gras. Ajouter un peu de lait de coco pour dégraisser la pâte de curry et faire bouillir 1 minute. Des perles d'huile verte doivent apparaître à la surface, ajouter les dés de poulet et le lait de coco à ébullition. Laisser bouillir pendant 2 minutes. Ajouter les feuilles de combava et le nouc-mâm, le sucre et les pousses de bambou. Ajouter les quartiers d'aubergine. Laisser cuire 10 à 15 minutes, jusqu'à ce que les aubergines soient fondantes.","Servir avec du riz blanc thaï ou du riz gluant et des feuilles de basilic thaï grossièrement hachées."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Aubergines au miso","subtitle":"Le nasu dengaku japonais – aubergines fondantes glacées au miso et saké","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Légumes rôtis","tags":["végétarien"],"ingredients":["5 aubergines moyennes","150 g de miso rouge, blanc ou moitié-moitié","5 c.à.s. de sucre soja","5 c.à.s. de sucre cassonade","1 c.à.s. de jus de citron","Quelques brins de ciboulette","Huile d'olive"],"steps":["Préchauffer le four à 180 °C.","Dans une casserole, faire fondre le miso, le mirin, la sauce soja et la cassonade. Bien mélanger à l'aide d'un fouet. Retirer du feu et ajouter un trait de jus de citron. Mélanger et laisser refroidir.","Laver les aubergines et retirer les pédoncules. Les couper en deux dans le sens de la longueur. Entailler la chair avec la pointe d'un couteau en formant un quadrillage. Dans une poêle, chauffer un généreux filet d'huile d'olive à feu moyen. Placer les aubergines côté chair dans l'huile et les laisser colorer 5 minutes environ.","Disposer les aubergines côté peau sur une plaque de cuisson recouverte d'un papier sulfurisé. À l'aide d'un pinceau, badigeonner généreusement la chair de laquage au miso, en prenant soin de le faire pénétrer dans les entailles. Les enfourner pour 25 à 35 minutes (selon la taille des aubergines) en surveillant la cuisson : les aubergines doivent être confites et caramélisées. Si elles commencent à noircir, les couvrir d'un papier d'aluminium pour finir la cuisson.","Débarrasser les aubergines dans un plat de service. Les parsemer de ciboulette ciselée. Servir."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Salade d'aubergines rôties à la salsa","subtitle":"Aubergines et piments rôtis, mozzarella, salsa d'anchois et coriandre","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Salades","tags":["végétarien"],"ingredients":["2 aubergines","300 g de tomates cerises","1 mozzarella de 125 g","2 piments verts doux","5 cl d'huile d'olive","Quelques feuilles de basilic","1 bonne pincée de sel","Poivre du moulin","— Salsa —","5 brins de coriandre","5 brins de basilic","2 gousses d'ail","5 filets d'anchois","Le jus de ½ citron","4 c.à.s. d'huile d'olive"],"steps":["Préchauffer le four à 210 °C.","Couper les aubergines en gros cubes de 2 cm de côté. Retirer les pépins des piments doux et les couper en rondelles. Les déposer sur la plaque. Ajouter 200 g de tomates cerises. Verser l'huile d'olive sur les légumes, saler et donner quelques tours de moulin à poivre. Enfourner pour 50 minutes, jusqu'à ce que les aubergines soient bien dorées, en remuant à mi-cuisson. Réserver et laisser tiédir.","Préparer la salsa : dans un blender, ou à défaut au pilon, déposer la coriandre, le basilic (garder quelques feuilles pour le service), les filets d'anchois, les gousses d'ail pelées, le jus de citron et l'huile d'olive. Bien écraser au pilon (ou mixer). Mélanger au moment de servir.","Disposer les légumes rôtis dans un plat de service. Ajouter le reste des tomates cerises coupées en deux. Garnir de mozzarella effilochée à la main. Napper de salsa et parsemer de quelques feuilles de basilic frais.","Cette salade se mange aussi bien tiède que froide."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Taboulé","subtitle":"L'authentique taboulé du Liban, tout en herbes fraîches et boulgour","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Salades","tags":["végétarien"],"ingredients":["3 belles bottes de persil plat bio","3 brins de menthe","60 g de boulgour fin","1 grosse tomate mûre","2 oignons nouveaux ou cébettes","Le jus de 1 citron","5 c.à.s. d'huile d'olive","Sel"],"steps":["Laver le persil et la menthe, bien les essorer. À l'aide d'un grand couteau (surtout pas au robot, qui chaufferait les herbes), hacher grossièrement le persil, du haut de la botte jusqu'aux tiges, en retirant les plus épaisses. Ajouter les feuilles de menthe et hacher de nouveau le tout, assez finement pour que ce soit agréable en bouche, mais pas trop pour garder de la mâche. Débarrasser les herbes dans un grand saladier.","Tailler la tomate en petits dés et les mêler au boulgour, qui va absorber les jus et gonfler. Laisser reposer au minimum 30 minutes. Les transvaser dans le saladier avec les herbes.","Ciseler finement les oignons nouveaux et les ajouter au taboulé.","Garder le tout au frais jusqu'au moment de servir. Au dernier moment, incorporer le jus de citron et l'huile d'olive. Ajuster l'assaisonnement si nécessaire en ajoutant éventuellement un peu de sel, un trait de jus de citron et un peu d'huile d'olive. Le taboulé doit être bien assaisonné mais ne doit pas nager dans le jus. Servir aussitôt."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Baba ganoush","subtitle":"Aubergines grillées au barbecue, tahin et yaourt – le dip libanais fumé","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Légumes rôtis","tags":["végétarien"],"ingredients":["4 aubergines","2 c.à.s. de tahin","1 c.à.c. de yaourt grec","Le jus de ½ citron","1 pincée de cumin moulu","1 gousse d'ail","Quelques feuilles de coriandre","Huile d'olive","Sel, poivre du moulin"],"steps":["Faire griller les aubergines entières, avec la queue et la peau, sur la grille du barbecue (ou dans un four préchauffé à 200 °C) pendant au moins 50 minutes en les retournant régulièrement. La peau doit être presque carbonisée. Pour peler les aubergines, les disposer encore chaudes dans un saladier, couvrir d'une assiette, laisser reposer 15 minutes et la peau se retire facilement. Placer la chair dans une passoire. Laisser égoutter 30 bonnes minutes pour la débarrasser de l'eau de végétation.","Pendant ce temps, dans un bol, mélanger le tahin, le jus de citron, 2 bonnes pincées de sel et du poivre. Ajouter la pincée de cumin.","À l'aide d'un couteau à grande lame, hacher grossièrement la chair d'aubergine sur une planche à découper. La verser dans un saladier. Ajouter la gousse d'ail épluché et finement haché et l'assaisonnement à base de tahin. Mélanger.","Débarrasser le baba ganoush dans un bol ou une assiette creuse de service. Verser un filet d'huile d'olive et parsemer éventuellement quelques feuilles de coriandre ciselée."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Salade Formentera","subtitle":"Salade de pâtes aux tomates séchées, tapenade, pignons et basilic","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Salades","tags":["végétarien"],"ingredients":["500 g de fusilli","250 g de tomates cerises","60 g de pignons de pin","100 g de parmesan","90 g de tapenade noire","90 g de caviar de tomates séchées à l'huile (ou de tomates séchées finement hachées)","2 oignons nouveaux avec leur tige (ou 1 oignon rouge)","1 gousse d'ail","3 branches de basilic","6 c.à.s. d'huile d'olive","3 c.à.s. de vinaigre de cidre","Sel, poivre du moulin"],"steps":["Dans une grande casserole d'eau bouillante salée, faire cuire les pâtes selon le temps de cuisson inscrit sur le paquet. Quand elles sont cuites, les verser dans une large passoire et les passer immédiatement sous l'eau fraîche pour les refroidir. Il faut les égoutter avec soin.","Tailler les tomates cerises en quatre, puis les ciseler finement. À l'aide d'un économe, tailler le parmesan en copeaux.","Dans une poêle, à feu doux et sans matière grasse, faire griller les pignons pendant quelques minutes, pour les colorer légèrement. Les réserver.","Dans un grand saladier, mélanger la tapenade et le caviar de tomates séchées. Ajouter les tomates fraîches, les oignons, l'ail, le basilic, le parmesan et les pignons. Pour l'assaisonnement, ajouter 3 belles pincées de sel fin, quelques tours de moulin à poivre, l'huile d'olive et le vinaigre de cidre. Ajouter les pâtes et mélanger longuement jusqu'à ce que les pâtes soient bien « pommades » de sauce. Goûter et rectifier éventuellement l'assaisonnement. Servir."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Zhoug","subtitle":"La sauce pesto yéménite piquante à la coriandre et aux épices","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Sauces du monde","tags":["végétarien","rapide"],"ingredients":["1 petite botte de persil plat","1 petite botte de coriandre","2 piments verts","1 gousse d'ail","4 clous de girofle","1 belle pincée de graines de cardamome verte","½ c.à.c. de cumin moulu","1 pincée de sucre","4 c.à.s. d'huile d'olive"],"steps":["Dans un mortier, piler les clous de girofle, les graines de coriandre et les capsules de cardamome. Ciseler grossièrement le persil et la coriandre, tiges comprises. Couper les piments en gros morceaux. Peler et hacher la gousse d'ail. Dans le bol d'un petit mixeur, mettre les clous et les épices écrasées, les herbes ciselées, l'ail, le cumin, le sel, le sucre et 2 cuillerées à soupe d'huile d'olive. Mixer, puis ajouter 2 cuillerées à soupe d'huile d'olive et mixer à nouveau jusqu'à obtenir une pâte grossière et pas trop lisse. Ne pas hésiter à ajouter de l'huile d'olive si la pâte est trop compacte.","Le zhoug se conserve jusqu'à 3 semaines dans un bocal au réfrigérateur."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Cervelle de canut","subtitle":"Le fromage frais lyonnais aux herbes fraîches, la spécialité des canuts","chapter":"VII","chapter_name":"Sauces & bases","sous_section":"Condiments","tags":["végétarien"],"ingredients":["1 pot de 300 g de faisselle de vache ou de chèvre","1 échalote","2 oignons nouveaux","½ botte de ciboulette","½ botte de persil","½ botte de cerfeuil","½ botte d'estragon","2 c.à.s. de vinaigre de vin rouge","Sel, poivre du moulin"],"steps":["Égoutter la faisselle dans son panier, au minimum 3 heures, elle ne doit pas être trop liquide. La placer dans un saladier.","Éplucher et émincer très finement l'échalote et les oignons nouveaux. Les hacher finement. Rincer, sécher et effeuiller les herbes fraîches. Les hacher finement. Mettre le tout avec la faisselle.","Ajouter le vinaigre, saler et poivrer. Mélanger vigoureusement à l'aide d'une spatule jusqu'à obtenir une texture légèrement mousseuse.","Servir avec des pommes de terre nouvelles à la vapeur ou sur une tranche de pain grillé."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Financiers","subtitle":"Les financiers classiques à la poudre d'amandes complètes et beurre noisette","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien"],"ingredients":["180 g de beurre doux","100 g de poudre d'amandes complètes","220 g de sucre","100 g de farine","180 g de blancs d'œufs (environ 6 œufs)","½ gousse de vanille"],"steps":["Préchauffer le four à 160 °C.","Réaliser un beurre noisette : dans une casserole, faire fondre le beurre à feu très doux, jusqu'à ce qu'il dégage une odeur de noisette et en prenne la couleur.","Dans un saladier, verser la poudre d'amandes, la farine et le sucre. Fendre la ½ gousse de vanille à l'aide d'un couteau et la gratter pour en extraire les graines. Mélanger à l'aide d'un fouet. Ajouter les blancs d'œufs et bien mélanger. Verser le beurre noisette en filtrant les impuretés à l'aide d'une petite passoire. Bien mélanger à l'aide du fouet.","Transférer la pâte dans une poche à douille. Cette quantité de pâte permet de remplir 2 plaques en silicone comportant chacune 8 empreintes de 8 × 3 × 1,5 cm. Remplir chaque empreinte (non graissée) à ras bord. Enfourner pour 25 à 30 minutes en surveillant la cuisson. Les financiers doivent être bien gonflés et bien dorés.","Laisser tiédir, puis démouler sur une grille pour faire circuler l'air : c'est là que la croûte devient croustillante ! Déguster."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Moelleux à l'abricot","subtitle":"Le gâteau fondant aux abricots et poudre d'amandes, beurré à souhait","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien"],"ingredients":["1 kg d'abricots pas trop mûrs, dénoyautés","330 g de sucre","130 g de farine","100 g de poudre d'amandes","230 g de beurre doux","1 sachet de levure chimique","4 œufs","Beurre demi-sel + sucre roux pour le moule","Sucre glace"],"steps":["Préchauffer le four à 180 °C.","Dans un saladier, mélanger grossièrement, à l'aide d'une maryse ou d'une cuillère en bois, le beurre coupé en petits cubes, la farine, la poudre d'amandes, le sucre, la levure et les œufs. Ne surtout pas trop travailler la pâte. On obtient un mélange compact, mais pas homogène, avec des morceaux de beurre encore apparents.","Tapisser un plat à gratin aux bords assez hauts de papier sulfurisé. Badigeonner généreusement le papier de beurre demi-sel, verser du sucre roux et le répartir sur tout le papier sulfurisé. Enfourner pour 45 minutes.","Laisser refroidir et saupoudrer de sucre glace avant de servir.","Mon truc à moi : l'été, en Corse, quand le figuier sauvage à côté de chez moi donne de merveilleux petits fruits noirs, je mélange tous les ingrédients de la pâte, je la verse dans le plat et je plante les figues entières (1 kg) dedans. Cette version est divine !"],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Cake au citron","subtitle":"Le cake fondant et imbibé de jus de citron, à la mie serrée et juteuse","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien"],"ingredients":["3–4 citrons bio selon leur teneur en jus (de préférence de terroir, type de Menton)","150 g de beurre bien mou","150 g de sucre semoule","4 œufs","180 g de farine","½ sachet de levure chimique","100 g de sucre glace","Beurre + farine pour le moule"],"steps":["Préchauffer le four à 170 °C.","Dans un saladier, mélanger le beurre avec le sucre à l'aide d'un fouet. Ajouter les œufs un à un, en mélangeant entre chaque ajout. Ajouter la farine, la levure et le zeste râpé d'un citron et demi. Bien mélanger.","Beurrer un moule à cake et le fariner. Verser la pâte dans le moule.","Enfourner pour 50 à 55 minutes. Vérifier la cuisson à l'aide de la lame d'un couteau : elle doit ressortir propre.","Pendant ce temps, presser les citrons et mélanger le jus avec le sucre glace.","Sortir le cake du four et l'arroser, alors qu'il est encore chaud, du mélange jus et sucre glace : en prenant soin de bien l'arroser sur la partie bombée au centre, plus épaisse. Laisser le cake s'imbiber du jus. Le démouler quand tout le jus a été absorbé. Déguster."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Invisible aux pommes","subtitle":"Le gâteau viral aux tranches de pommes fines et à la texture de flan","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien"],"ingredients":["1,2 kg de mélange de pommes sucrées (golden) et acidulées (Pink Lady, Juliet)","1 gousse de vanille","50 g de farine","20 g de sucre","1 sachet de levure chimique","1 pincée de sel","3 œufs","10 cl de lait","20 g de beurre fondu","Sucre glace"],"steps":["Préchauffer le four à 200 °C.","Dans un saladier, verser la farine, la levure, le sucre et le sel. Fendre la gousse de vanille dans le sens de la longueur, gratter les graines avec la pointe d'un couteau et les ajouter dans le saladier. Bien mélanger. Puis incorporer le lait et le beurre fondu et mélanger. Ajouter les œufs et les mélanger.","Éplucher les pommes et les couper en fines tranches de 1 à 2 mm. Remplir un moule à cake des tranches de pomme en les disposant les unes sur les autres.","Répartir équitablement la pâte dans le moule : elle va couler entre les tranches de pomme et se faufiler dans les espaces. Enfourner pour 40 minutes.","Laisser tiédir. Démouler et saupoudrer de sucre glace juste avant de servir."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Cookies very chunky","subtitle":"Les cookies XXL croustillants dehors, cœur coulant, au chocolat noir","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien"],"ingredients":["340 g de farine","215 g de chocolat noir","160 g de beurre pommade","100 g de sucre semoule","100 g de cassonade","1 œuf","1 jaune d'œuf","3 g de levure chimique","2 g de fleur de sel + un peu pour la cuisson"],"steps":["Préchauffer le four à 200 °C.","Dans le bol du batteur muni de la feuille, mettre le sucre semoule, la cassonade et le beurre. Mélanger à vitesse moyenne pendant environ 4 minutes, jusqu'à ce que le mélange soit homogène, en veillant à arrêter le batteur au moins une fois pour racler la paroi du bol avant de mélanger de nouveau. Ajouter l'œuf et le jaune, puis mélanger jusqu'à ce que la pâte soit homogène. Ajouter la farine, la fleur de sel et la levure chimique, puis bien mélanger jusqu'à ce que la pâte soit homogène.","Concasser le chocolat et l'incorporer à la pâte.","Diviser la pâte en portions d'environ 95 g. Les recouvrir d'un film alimentaire et les placer au moins 12 heures au réfrigérateur ou 3 heures au congélateur.","Disposer les cookies sur une plaque de cuisson recouverte de papier sulfurisé. Saupoudrer légèrement chaque cookie de fleur de sel. Enfourner pour 17 minutes. Déguster chaud, tiède ou froid."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Tendre tarte à l'abricot","subtitle":"Tarte sablée aux abricots pochés et beurre de romarin, recette de Michel Guérard","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien"],"ingredients":["1 kg d'abricots de Provence (la variété bergeron est idéale)","— Sirop de pochage —","2 l d'eau","200 g de sucre","100 g de jus de citron","— Pâte sablée —","350 g de farine","80 g de sucre","8 g de sel","180 g de beurre","2 jaunes d'œufs","— Beurre de romarin —","100 g de beurre","1 branche de romarin","— Finitions —","1 jaune d'œuf","Sucre blanc ou cassonade","15 g d'amandes effilées","1 citron non traité"],"steps":["Couper les abricots en deux et retirer les noyaux.","Préparer le sirop : verser l'eau, le sucre et le jus de citron dans une casserole. Mélanger. Porter le tout à feu très doux. Des que le sirop commence à frémir, y plonger les oreillons d'abricot et les pocher à feu très doux. Le sirop ne doit pas bouillir. Une fois cuits, les oreillons d'abricot seront remontés à la surface : retirer du feu et les réserver dans leur sirop jusqu'à leur utilisation.","Réaliser la pâte : dans un saladier, mélanger avec les mains la farine, le sucre, le sel et le beurre coupé en morceaux. Ajouter les jaunes d'œufs et le beurre coupé en morceaux. Pétrir jusqu'à obtenir une texture sablée. Ajouter l'œuf et le beurre coupé en morceaux. Pétrir jusqu'à ce que la pâte s'amalgame. Former une boule. Si la pâte est trop chaude et que la pâte est difficile à travailler, la laisser reposer au réfrigérateur.","Préparer le beurre de romarin : dans une casserole, faire fondre le beurre avec le romarin. Quand le beurre est fondu, retirer du feu et laisser infuser pendant 10 minutes. À ce besoin, si le beurre est trop brûlant et mousseux (à la partie blanche et mousseuse) à l'aide d'une cuillère. Réserver.","Préchauffer le four à 180 °C.","Sur un papier sulfurisé, étaler la pâte en un disque de 27 à 30 cm de diamètre et 7 mm d'épaisseur à l'aide d'un rouleau à pâtisserie. Il est normal que la pâte soit fragile. Déplacer le disque sur une plaque de cuisson. Dorer le disque au jaune d'œuf battu et enfourner pour 20 minutes de cuisson à blanc. Sortir la pâte du four, bien égoutter les abricots et les disposer sur la pâte. Saupoudrer de quelques pincées de sucre et parsemer d'amandes effilées. Enfourner pour 30 minutes.","À la sortie du four, écraser légèrement les abricots sur la tarte à l'aide d'une spatule ou d'une fourchette, puis ajouter le zeste du beurre de romarin et râper le zeste du citron sur le dessus. Servir tiède."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Lemon posset","subtitle":"La crème anglaise au citron sans gélatine, mi-chemin entre panna cotta et flan","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien","sans gluten"],"ingredients":["2 citrons bio","40 cl de crème liquide entière","80 g de sucre","8 petites meringues ou 4 shortbreads (ou biscuits secs type sablés bretons, canistrelli…)"],"steps":["Râper le zeste des 2 citrons, puis les presser pour obtenir 7 cl de jus.","Dans une casserole, porter la crème et le sucre à légère ébullition tout en mélangeant pendant 2 minutes pour dissoudre le sucre. Baisser légèrement le feu et verser le jus de citron en filet en continuant de mélanger. Laisser épaissir la crème sur feu doux pendant quelques minutes en mélangeant avec une cuillère en bois. Pour savoir si la crème est prête, faire une ligne avec le doigt sur le dos de la cuillère : la trace ne doit pas se refermer.","Verser la crème dans 4 petits bols ou ramequins, laisser refroidir. Puis laisser prendre au frais pendant 3 à 4 heures.","Au moment de servir, parsemer de meringue ou de shortbreads émiettés et ajouter les zestes de citron."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Gâteau au chocolat","subtitle":"Le gâteau ultra fondant sans farine, cœur coulant et croûte craquante","chapter":"V","chapter_name":"Desserts & douceurs","sous_section":"","tags":["végétarien"],"ingredients":["250 g de chocolat pâtissier (60 ou 70 % de cacao)","250 g de beurre demi-sel à température ambiante","250 g de sucre","70 g de farine","4 œufs","Beurre + farine pour le moule"],"steps":["Préchauffer le four à 200 °C.","Faire fondre le chocolat au bain-marie ou au micro-ondes. Incorporer le beurre coupé en morceaux et bien mélanger à l'aide d'un fouet pour obtenir une texture lisse. Débarrasser dans un saladier. Ajouter le sucre les blancs en neige, mais en plus le résultat est carrément addictif, avec une texture moelleuse proche du coulant.","Casser les œufs dans un bol et les battre énergiquement pour éviter les grumeaux. Ajouter la farine et mélanger. Les ajouter à l'appareil chocolaté et bien mélanger.","Beurrer et fariner un moule à manqué de 24 cm de diamètre. Verser la pâte à gâteau.","Baisser le thermostat à 150 °C. Enfourner pour 30 minutes. À la sortie du four, laisser refroidir 10 minutes et démouler. Le gâteau a une légère croûte et un cœur fondant et crémeux à souhait."],"source":"Recettes et Récits - François-Régis Gaudry"},{"title":"Saumon au zaatar et au tahini","subtitle":"Filets de saumon enrobés de zaatar et sumac, sauce tahini crémeuse sur épinards · Pour 4 · Préparation 5 min · Cuisson 20 min","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Poisson","tags":["poisson","sans gluten","rapide"],"ingredients":["4 filets de saumon avec peau, sans arêtes (600 g au total)","2 c.à.s. zaatar","2 c.à.c. sumac + ½ c.à.c. pour servir","6 cl d'huile d'olive","250 g de jeunes feuilles d'épinards","90 g de tahini","3 gousses d'ail, écrasées","3½ c.à.s. de jus de citron","1½ c.à.s. de feuilles de coriandre, hachées","Sel et poivre noir"],"steps":["Préchauffez le four à 220 °C (chaleur tournante).","Séchez les filets de saumon et saupoudrez-les de sel et de poivre. Dans un bol, mélangez le zaatar et les 2 c.à.c. de sumac. Placez le saumon côté peau sur votre plan de travail, puis étalez ce mélange sur les pavés en couche épaisse.","Faites chauffer à feu moyen-vif 1 c.à.s. d'huile dans une grande sauteuse allant au four. Faites-y saisir les épinards 2-3 min avec une pincée de sel et de poivre, jusqu'à ce qu'ils soient juste flétris.","Déposez le saumon dans la sauteuse côté peau en bas, et arrosez-le de 2 c.à.s. d'huile. Enfournez pour 5 min.","Pendant ce temps, fouettez dans un bol le tahini, l'ail, 2½ c.à.s. de jus de citron, une bonne pincée de sel et 10 cl d'eau pour obtenir une sauce lisse et assez liquide.","Sortez le poisson du four et versez la sauce au tahini tout autour (mais pas dessus). Enfournez de nouveau pour 5 min, jusqu'à ce que le poisson soit cuit et la sauce bouillonnante. Arrosez avec le reste du jus de citron et de l'huile, puis ajoutez la coriandre et la ½ c.à.c. de sumac restante."],"source":"Comfort - Ottolenghi"},{"title":"Tomates, oignons et poivrons rôtis à la feta et aux pignons de pin","subtitle":"Légumes rôtis et confits, feta gratinée, pignons à la harissa · Pour 4 · Préparation 30 min · Cuisson 1h15","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Légumes rôtis","tags":["végétarien","sans gluten"],"ingredients":["7,5 cl d'huile d'olive","4 oignons rouges, coupés en 8 quartiers (480 g)","2 piments jalapeños verts, en rondelles de 1 cm","2 poivrons rouges (300 g), sans graines, en morceaux de 3-4 cm","1 tête d'ail entière, coupée en deux dans la hauteur","1,5 kg de tomates allongées, pelées et coupées en gros morceaux","20 g de coriandre fraîche, grossièrement hachée + 1 c.à.s. ciselée pour servir","1 c.à.s. de graines de coriandre","120 g de tomates cerises (datterini si possible)","120 g de feta grecque, émiettée grossièrement","25 g de pignons de pin","1 c.à.s. de harissa à la rose","Sel"],"steps":["Préchauffez le four à 240 °C.","Dans un grand plat de cuisson (environ 34 × 26 cm), mélangez 2 c.à.s. d'huile, les oignons, les piments jalapeños, les poivrons et l'ail. Enfournez pour 25 min en remuant 2 ou 3 fois, jusqu'à ce que les légumes soient fondants et bien carbonisés.","Sortez les demi-têtes d'ail. Récupérez les gousses et remettez-les dans le plat ; jetez les peaux. Ajoutez les tomates, la coriandre (feuilles et graines) et 1¾ c.à.c. de sel. Écrasez légèrement les légumes à la cuillère. Remettez au four pour 30-35 min, en remuant 2 ou 3 fois, jusqu'à ce que les tomates se défassent et le jus ait épaissi.","Sortez le plat et réglez le four en mode gril. Ajoutez les tomates cerises et la feta, arrosez avec 1 c.à.s. d'huile. Faites gratiner 10 min jusqu'à ce que la feta commence à dorer.","Pendant ce temps, faites dorer les pignons de pin 3 min à feu moyen-vif dans le reste d'huile. Incorporez la harissa, puis retirez du feu.","Servez garni de pignons à la harissa et de coriandre ciselée. Idéal avec des pains pitas chauds, des pâtes ou du riz."],"source":"Comfort - Ottolenghi"},{"title":"Riz de fête à l'agneau et au poulet, yaourt à l'ail","subtitle":"Riz épicé cuit dans un bouillon de poulet maison, garni d'agneau haché et de chair de volaille · Pour 8 · Préparation 15 min · Cuisson 2h20","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Viande","tags":["viande","sans gluten","festif"],"ingredients":["— Poulet —","1 poulet entier (1,4 kg)","2 bâtons de cannelle","1 oignon, coupé en six (150 g)","1 tête d'ail entière, coupée en deux dans la hauteur","1 c.à.c. de cumin moulu","1 c.à.c. de cannelle moulue","2 c.à.s. d'huile d'olive","1½ c.à.s. de jus de citron","5 g de persil, grossièrement haché","Sel et poivre noir","— Riz —","2 c.à.s. d'huile d'olive","40 g de beurre doux","1 oignon, haché menu (150 g)","300 g d'agneau haché","3 gousses d'ail, hachées menu","1½ c.à.c. de cannelle moulue","1 c.à.c. de poivre de la Jamaïque moulu","400 g de riz basmati, lavé, trempé au moins 1 h dans l'eau froide, puis égoutté","— Sauce au yaourt à l'ail —","300 g de yaourt grec","1 gousse d'ail, écrasée","¾ c.à.c. de sel"],"steps":["Mettez le poulet dans un grand faitout avec les bâtons de cannelle, l'oignon, l'ail, 2 l d'eau et 2 c.à.c. de sel. Portez à ébullition, puis baissez à feu moyen-doux, couvrez et laissez mijoter 1h10. Retirez le poulet et laissez refroidir. Récupérez la chair ; jetez la peau, les os et les cartilages. Mélangez la chair avec le cumin et la cannelle moulus, réservez. Filtrez le bouillon et prélevez 85 cl que vous gardez au chaud.","Préparez le riz : faites chauffer à feu moyen-vif l'huile et la moitié du beurre dans une grande casserole. Faites revenir l'oignon 7 min en remuant, jusqu'à ce qu'il soit doré. Ajoutez l'agneau, l'ail et les épices ; laissez cuire 2 min en remuant, jusqu'à ce que la viande ne soit plus rose. Ajoutez le riz, 70 cl de bouillon chaud, 1¾ c.à.c. de sel et une bonne dose de poivre. Portez à ébullition, réduisez au minimum, couvrez et laissez cuire 15 min. Retirez du feu et laissez reposer 15 min à couvert.","Préparez la sauce au yaourt : fouettez le yaourt, l'ail, ¾ c.à.c. de sel et 15 cl de bouillon chaud restant.","Faites chauffer 2 c.à.s. d'huile à feu moyen-vif dans une grande sauteuse. Réchauffez les morceaux de poulet 5 min. Ajoutez le jus de citron et le persil, réservez.","Servez le riz dans un grand plat, garni du poulet et accompagné de la sauce au yaourt à l'ail."],"source":"Comfort - Ottolenghi"},{"title":"Crème d'artichauts, citron et menthe fraîche","subtitle":"Purée froide de fonds d'artichauts, suprêmes de citron et menthe ciselée · Pour 6 · Préparation 20 min · Cuisson 45 min · Réfrigération 2h","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Légumes rôtis","tags":["végétarien","sans gluten","végétalien"],"ingredients":["1 oignon blanc","2 gousses d'ail","500 g de fonds d'artichauts surgelés","20 g d'huile d'olive","25 g de beurre doux","1 pincée de sel fin","1 pincée de poivre mignonnette","— Dressage —","6 feuilles de menthe","1 citron jaune","1 filet d'huile d'olive"],"steps":["Émincer l'oignon blanc, hacher l'ail. Couper les fonds d'artichauts en gros morceaux. Dans une casserole, faire chauffer l'huile d'olive et le beurre. Y faire revenir l'ail et l'oignon sans coloration. Ajouter les fonds d'artichauts et poursuivre la cuisson pendant 3 minutes.","Assaisonner de sel et de poivre mignonnette. Verser de l'eau à hauteur, laisser cuire à couvert pendant 40 minutes. Lorsque les fonds d'artichauts sont tendres, les égoutter et les mixer jusqu'à obtention d'une purée lisse.","Étaler la purée d'artichauts sur une plaque, attendre qu'elle soit tiède puis la filmer au contact et la réserver au frais jusqu'à ce qu'elle ait totalement refroidi.","Ciseler les feuilles de menthe. Zester le citron, couper ses extrémités puis le peler à vif. Extraire les suprêmes avec une lame souple.","Sortir la purée du réfrigérateur, la transvaser dans un plat creux. Disposer harmonieusement les suprêmes de citron sur la purée, parsemer de zeste, arroser d'un filet d'huile d'olive puis ajouter les feuilles de menthe ciselées. Servir avec des tranches de pain grillées frottées d'ail."],"source":"Ma cuisine méditerranéenne - Mohamed Cheikh"},{"title":"Carottes fanes rôties au cumin","subtitle":"Carottes colorées au beurre, amandes effilées, mayonnaise à l'orange et curcuma · Pour 6 · Préparation 1h · Cuisson 40-45 min","chapter":"II","chapter_name":"Salades, ceviche & légumes rôtis","sous_section":"Légumes rôtis","tags":["végétarien","sans gluten"],"ingredients":["2 bottes de carottes fanes (4 par personne)","12 g de graines de cumin","25 g de beurre","30 g d'amandes effilées","2 oranges","1 pincée de fleur de sel","— Mayonnaise à l'orange —","1 l de jus d'orange","1 jaune d'œuf","15 g de moutarde","5 g de vinaigre de Xérès","100 g d'huile de pépins de raisin","150 g de yaourt à la grecque","1 g de curcuma","3 g de cumin en poudre","Sel fin, poivre du moulin","— Dressage —","Quelques fanes"],"steps":["Éplucher les carottes, réserver quelques fanes pour la décoration.","Préparer un récipient d'eau avec des glaçons. Porter à ébullition un grand volume d'eau salée. Y faire cuire les carottes pendant 25 minutes avec la moitié des graines de cumin, puis les plonger dans l'eau glacée. Égoutter et réserver au réfrigérateur.","Dans une poêle, faire chauffer le beurre jusqu'à ce qu'il mousse. Y faire colorer les carottes 5 à 10 minutes, saler et poivrer, ajouter le reste des graines de cumin préalablement écrasées. Réserver.","Verser le jus d'orange dans une casserole et le faire réduire à feu doux jusqu'à épaississement.","Préparer une mayonnaise en mélangeant le jaune d'œuf, la moutarde, le vinaigre de Xérès et le sel. Fouetter en versant l'huile peu à peu pour épaissir la préparation, poivrer. Dans un autre bol, mélanger le yaourt à la grecque avec 150 g de cette mayonnaise. Assaisonner avec le curcuma et le cumin en poudre puis incorporer le jus d'orange réduit. Mélanger au fouet. Réserver au réfrigérateur.","Préchauffer le four à 160 °C (th. 5-6). Faire torréfier les amandes effilées au four pendant 10 minutes, laisser refroidir.","Préparer les suprêmes : couper les deux extrémités des oranges. Les peler à vif en suivant les courbes du fruit. Glisser la lame du couteau le long de chaque membrane et extraire les suprêmes.","Répartir les carottes dans un plat, ajouter les suprêmes d'orange, parsemer d'amandes torréfiées, saler à la fleur de sel, poivrer. Couper les sommités des fanes réservées et en décorer le plat. Servir avec la mayonnaise à l'orange."],"source":"Ma cuisine méditerranéenne - Mohamed Cheikh"},{"title":"Choux-fleurs frits au ras el-hanout, tzatziki","subtitle":"Fleurettes frites croustillantes, vinaigrette au ras el-hanout, tzatziki maison et huile de menthe · Pour 6 · Préparation 1h30 · Cuisson 25 min · Repos 1h","chapter":"IV","chapter_name":"Plats principaux","sous_section":"Végétarien","tags":["végétarien"],"ingredients":["2 choux-fleurs","3 l de lait","Huile de friture","— Tzatziki —","2 concombres","1 gousse d'ail","9 g de menthe","170 g de yaourt à la grecque","15 g d'huile d'olive","Le jus de ½ citron jaune","3 pincées de sel, 1 pincée de poivre mignonnette","— Vinaigrette au ras el-hanout —","15 g de ras el-hanout","30 g de jus de citron jaune","120 g d'huile de pépins de raisin","5 g de sel fin","— Huile de menthe —","250 g de menthe","500 g d'huile de pépins de raisin","4 gouttes d'huile essentielle de menthe poivrée","— Dressage —","60 g de pistaches torréfiées","2 barquettes de pousses de coriandre"],"steps":["Détailler les choux-fleurs en petits bouquets, les laver soigneusement. Préparer un récipient d'eau glacée. Disposer les bouquets dans une casserole, verser le lait puis ajouter 3 litres d'eau, bien saler. Faire cuire à feu vif pendant 10 minutes puis égoutter et plonger dans l'eau glacée pour stopper la cuisson.","Préparer le tzatziki : râper les concombres le plus finement possible. Ajouter 3 pincées de sel et laisser dégorger pendant 1 heure dans une passoire. Essorer en pressant dans un torchon. Hacher l'ail, ciseler finement la menthe. Disposer le concombre râpé dans un saladier, ajouter le yaourt à la grecque, l'huile d'olive, le jus de citron, l'ail et la menthe. Mélanger. Poivrer, assaisonner et réserver au réfrigérateur.","Préparer la vinaigrette au ras el-hanout : dissoudre le sel et le ras el-hanout dans le jus de citron puis incorporer l'huile en filet.","Préparer l'huile de menthe : verser de l'eau dans un récipient et y ajouter des glaçons. Effeuiller la menthe. Plonger les feuilles dans une casserole d'eau bouillante salée pendant 5 minutes puis rafraîchir dans l'eau glacée. Les égoutter puis les mixer avec l'huile de pépins de raisin. Poser un torchon sur un chinois étamine, filtrer l'huile en la laissant s'écouler goutte à goutte. Incorporer ensuite l'huile essentielle de menthe poivrée.","Préchauffer le four à 180 °C (th. 6). Étaler les pistaches sur une plaque et les torréfier au four pendant 10 minutes.","Faire frire le chou-fleur dans un bain d'huile à 180 °C jusqu'à coloration. L'égoutter puis l'assaisonner de vinaigrette au ras el-hanout.","Disposer 80 g de tzatziki dans 6 assiettes creuses, ajouter au-dessus 80 g de chou-fleur frit, répartir les pistaches torréfiées puis verser un filet d'huile de menthe. Terminer en parsemant le tout de pousses de coriandre."],"source":"Ma cuisine méditerranéenne - Mohamed Cheikh"}];

let searchQuery = '';
let activeFilter = 'all';
let activeSource = '';

const searchInput = document.getElementById('search-input');
const clearBtn = document.getElementById('clear-btn');

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim().toLowerCase();
  clearBtn.style.display = searchQuery ? 'block' : 'none';
  render();
});
clearBtn.addEventListener('click', () => {
  searchInput.value = ''; searchQuery = ''; clearBtn.style.display = 'none';
  searchInput.focus(); render();
});

let activeChapter = '';

// Filtres tag — toggle on/off au clic
document.querySelectorAll('.pill[data-filter]').forEach(pill => {
  pill.addEventListener('click', () => {
    const filter = pill.dataset.filter;
    if (activeFilter === filter) {
      // Décliquer : désactiver le filtre
      pill.classList.remove('active');
      activeFilter = 'all';
    } else {
      // Activer ce filtre, désactiver les autres
      document.querySelectorAll('.pill[data-filter]').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      activeFilter = filter;
    }
    render();
  });
});

// Dropdown chapitre
function toggleDropdown() {
  const menu = document.getElementById('ch-menu');
  const btn = document.getElementById('chapter-btn');
  menu.classList.toggle('open');
  btn.classList.toggle('active');
}

function toggleRegimeDropdown() {
  const menu = document.getElementById('regime-menu');
  const btn = document.getElementById('regime-btn');
  menu.classList.toggle('open');
  btn.classList.toggle('active');
  const arrow = document.getElementById('regime-arrow');
  if (arrow) arrow.style.transform = menu.classList.contains('open') ? 'rotate(180deg)' : '';
}

function toggleSourceDropdown() {
  const menu = document.getElementById('source-menu');
  const btn = document.getElementById('source-btn');
  menu.classList.toggle('open');
  btn.classList.toggle('active');
  const arrow = document.getElementById('source-arrow');

  document.getElementById('ch-menu').classList.remove('open');

}

function selectSource(source, label) {
  activeSource = source;
  const btn = document.getElementById('source-btn');
  const menu = document.getElementById('source-menu');
  let shortLabel = 'Source';
  if (source) { shortLabel = (SOURCE_LABELS[source] || source).split('—')[0].trim(); if (shortLabel.length > 18) shortLabel = shortLabel.substring(0,17) + '…'; }
  btn.innerHTML = shortLabel + ' <span class="ch-arrow" id="source-arrow">▾</span>';
  btn.classList.toggle('active', !!source);
  menu.classList.remove('open');
  const arrow = document.getElementById('source-arrow');
  if (arrow) arrow.style.transform = '';
  document.querySelectorAll('#source-menu .ch-option').forEach(o => o.classList.remove('selected'));
  const sel = document.querySelector('#source-menu .ch-option[data-source="' + source + '"]');
  if (sel) sel.classList.add('selected');
  render();
}

function selectChapter(chapter, label) {
  activeChapter = chapter;
  const btn = document.getElementById('chapter-btn');
  const menu = document.getElementById('ch-menu');
  // Mettre à jour le texte du bouton
  btn.innerHTML = (chapter ? label : 'Chapitre') + ' <span class="ch-arrow">▾</span>';

  document.querySelectorAll('.ch-option').forEach(o => o.classList.remove('selected'));
  const sel = document.querySelector(`.ch-option[data-chapter="${chapter.replace(/&/g,'&amp;')}"]`);

document.querySelectorAll('#ch-menu .ch-option').forEach(opt => {

  const SOURCE_LABELS = {

    'https://leculdepoule.co': 'Le cul de poule',
    'lacerisesurlemaillot.fr': 'La cerise sur le maillot',
  };
function filterRecipes() {
  return RECIPES.filter(r => {
    if (activeChapter && r.chapter_name !== activeChapter) return false;
    if (activeFilter === 'végétarien' && !r.tags.includes('végétarien')) return false;
    if (activeFilter === 'poisson' && !r.tags.includes('poisson')) return false;
    if (activeFilter === 'viande' && !r.tags.includes('viande')) return false;
    if (activeFilter === 'sans gluten' && !r.tags.includes('sans gluten')) return false;
    if (activeFilter === 'rapide' && !r.tags.includes('rapide')) return false;
    if (activeFilter !== 'all' && !['végétarien','poisson','viande','sans gluten','rapide'].includes(activeFilter)) return false;
    if (activeSource && r.source !== activeSource) return false;
    if (searchQuery) {
      const words = searchQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
      return words.every(w => {
        const inTitle    = (r.title + ' ' + (r.subtitle||'')).toLowerCase().includes(w);
        const inIngr     = r.ingredients.filter(i => i.toLowerCase().includes(w)).length;
        const inSteps    = r.steps.filter(s => s.toLowerCase().includes(w)).length;
        // Mot trouvé dans le titre/sous-titre → match direct
        if (inTitle) return true;
        // Mot trouvé dans les ingrédients : au moins 2 occurrences, ou 1 occurrence dans un ingrédient principal (pas optionnel)
        if (inIngr >= 2) return true;
        if (inIngr === 1) {
          const mainIngr = r.ingredients.filter(i => !i.toLowerCase().includes('optionnel') && !i.toLowerCase().includes('facultatif') && !i.toLowerCase().includes('à défaut') && !i.toLowerCase().includes('ou '));
          if (mainIngr.some(i => i.toLowerCase().includes(w))) return true;
        }
        // Mot trouvé dans les étapes : au moins 2 occurrences
        if (inSteps >= 2) return true;
        return false;
      });
    }
    return true;
  });
}

// ── Distance de Levenshtein (max 2) ────────────────────────────
function levenshtein(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 99;
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}

// ── Score de pertinence d'un mot dans un texte ─────────────────
function wordMatchScore(word, haystackTokens) {
  const stemW = stem(word);
  const len = word.length;
  // 1. Correspondance exacte
  if (haystackTokens.some(t => t === word)) return 3;
  // 2. Correspondance après stemming
  if (haystackTokens.some(t => stem(t) === stemW)) return 2;
  // 3. Levenshtein — tolérance selon longueur du mot
  const maxDist = len <= 4 ? 0 : len <= 7 ? 1 : 2;
  if (maxDist > 0 && haystackTokens.some(t => levenshtein(word, t) <= maxDist)) return 1;
  // 4. Correspondance partielle (le mot contient un token ou vice versa)
  if (len >= 4 && haystackTokens.some(t => t.length >= 4 && (t.includes(word) || word.includes(t)))) return 1;
  return 0;
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlight(text) {
  if (!searchQuery) return esc(text);
  let r = esc(text);
  searchQuery.split(/\s+/).filter(Boolean).forEach(w => {
    r = r.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi'), '<mark>$1</mark>');
  });
  return r;
}

function render() {

  const groups = {};

  container.innerHTML = sortedChapters.map(chapter => {

    if (hasSousSections) {

      });
      const uniqueSS = [...new Set(ssOrder)];

              <div class="card-tags">${tags}</div>

      }).join('');
      return `<div class="chapter-group">
        <div class="chapter-title"><span class="chapter-num">Ch. ${num}</span>${chapter}</div>
        ${cards}
      </div>`;
    }
    
    const cards = chRecipes.map(r => {
      const idx = RECIPES.indexOf(r);
      const hasContent = r.ingredients && r.ingredients.length > 0;
      const tags = r.tags.map(t => `<span class="tag ${t.replace(/\s/g,'-')}">${t}</span>`).join('');
      return `
        <div class="recipe-card${hasContent ? '' : ' no-content'}" onclick="openModal(${idx})">
          <div class="card-tags">${tags}</div>
          <div class="card-title">${highlight(r.title)}</div>

function openModal(idx) {
  const r = RECIPES[idx];
  const num = CHAPTER_NUMS[r.chapter_name] || '';
  const hasContent = r.ingredients && r.ingredients.length > 0;

  document.getElementById('modal-chapter').textContent = r.sous_section ? `Ch. ${num} · ${r.chapter_name} · ${r.sous_section}` : `Chapitre ${num} · ${r.chapter_name}`;
  document.getElementById('modal-title').textContent = r.title;
  document.getElementById('modal-subtitle').textContent = r.subtitle || '';
  document.getElementById('modal-tags').innerHTML = r.tags.map(t => `<span class="tag ${t.replace(/\s/g,'-')}">${t}</span>`).join('');
  const srcEl = document.getElementById('modal-source');
  if (r.source) {
    const label = SOURCE_LABELS[r.source] || r.source;
    srcEl.innerHTML = '📖 ' + label;
    srcEl.style.display = 'block';
  } else { srcEl.innerHTML = ''; srcEl.style.display = 'none'; }

  const body = document.getElementById('modal-body');
  if (!hasContent) {
    body.innerHTML = `<div class="modal-missing">📄 Le contenu de cette recette n'a pas encore été importé.<br>Tu peux l'ajouter en partageant le PDF correspondant !</div>`;
  } else {
    const ingHtml = r.ingredients.filter(i => i && i.length > 1).map(i => {
      const trimmed = i.trim();
      if (trimmed.startsWith('—') || trimmed.startsWith('–')) {
        const label = trimmed.replace(/^[—–]\s*/, '').replace(/\s*[—–]$/, '');
        return `<li class="ing-section">${esc(label)}</li>`;
      }
      return `<li>${esc(trimmed)}</li>`;
    }).join('');
    let stepCounter = 0;
    const stepsHtml = r.steps.filter(s => s && s.length > 5).map(s => {
      const trimmed = s.trim();
      if (trimmed.startsWith('Conseils')) {
        const content = trimmed.replace(/^Conseils\s*[—–]\s*/, '');
        return `<div class="step-conseils"><div class="step-conseils-label">Conseils</div>${esc(content)}</div>`;
      }
      stepCounter++;
      return `<li><span class="step-num">${stepCounter}</span><span>${esc(trimmed)}</span></li>`;
    }).join('');
    body.innerHTML = `
      <div class="modal-section-title">Ingrédients</div>
      <ul class="ingredients-list">${ingHtml}</ul>
      <div class="modal-section-title">Préparation</div>
      <ol class="steps-list">${stepsHtml}</ol>`;
  }

  // Partage — lien vers le livre
  const siteUrl = 'https://sophie955.github.io/Recettes-de-cuisine/';
  const shareText = '🍽️ ' + r.title + '\n\nRetrouve cette recette dans mon livre de cuisine en ligne :\n' + siteUrl;
  const emailBody = 'Bonjour,\n\nJe voulais te partager cette recette : ' + r.title + '\n\nRetrouve-la dans mon livre de cuisine en ligne :\n' + siteUrl + '\n\nBonne cuisine !';

  const waLink = document.getElementById('share-whatsapp');
  if (waLink) waLink.href = 'https://wa.me/?text=' + encodeURIComponent(shareText);

  const emailLink = document.getElementById('share-email');
  if (emailLink) emailLink.href = 'mailto:?subject=' + encodeURIComponent('Recette : ' + r.title) + '&body=' + encodeURIComponent(emailBody);

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function closeModalOnOverlay(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// header-count removed
render();
